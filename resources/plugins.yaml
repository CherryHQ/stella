plugins:
  - id: tool/mise
    kind: tool
    name: mise
    display_name: mise
    description: "Inject mise usage guidance into the system prompt and provide the mise binary."
    enabled: true
    prompt: "Use mise to install tools and manage environment variables."

  - id: tool/tap-web
    kind: tool
    name: tap-web
    display_name: Tap Web
    description: "Web browsing skill powered by the tap CLI — fetch pages, run browser automation, and capture network traffic."
    enabled: true
    prompt: "Always use tap for web access. Run `tap --help` to learn the common scenarios, and prefer `tap site` scripts (`tap site list`) over raw fetching: `exa/search` for web search, `twitter/fxembed-*` for Twitter/X, plus dedicated scripts for Reddit, YouTube, GitHub, Zhihu, Weibo, etc. Fall back to `tap fetch <url>` for clean readable content, and use `tap browser` (lightpanda first) only when JS rendering or auth is required. Read the `tap-web` skill for details."
    binaries:
      - name: tap
        tool: github:vaayne/tap
        version: "0.4.8"
      - name: lightpanda
        tool: github:lightpanda-io/browser
        version: "nightly"

  - id: tool/x
    kind: tool
    name: x
    display_name: X (Twitter)
    description: "X API integration with OAuth 2.0-backed session auth."
    enabled: true
    oauth_provider: x
    session_env:
      - env_var: X_ACCESS_TOKEN
        source: oauth.access_token

  - id: tool/gh
    kind: tool
    name: gh
    display_name: GitHub CLI
    description: "GitHub CLI integration with OAuth-backed session auth."
    enabled: true
    binaries:
      - name: gh
        tool: github:cli/cli
        version: "2.92.0"
    oauth_provider: github
    session_env:
      - env_var: GH_TOKEN
        source: oauth.access_token

  - id: tool/lark-cli
    kind: tool
    name: lark-cli
    display_name: Lark CLI
    description: "Lark CLI integration with OAuth-backed auth, bundled skills, session env, and prompt guidance."
    enabled: true
    prompt: "Always use lark-cli for Feishu/Lark operations (messages, docs, sheets, calendar, tasks, wiki, etc.). For authorization issues, run `stella oauth connect feishu` to (re)authorize — NEVER use `lark-cli auth`."
    binaries:
      - name: lark-cli
        tool: github:larksuite/cli
        version: "1.0.35"
    oauth_provider: feishu
    session_env:
      - env_var: LARKSUITE_CLI_USER_ACCESS_TOKEN
        source: oauth.access_token
      - env_var: LARKSUITE_CLI_APP_ID
        source: oauth.client_id
      - env_var: LARKSUITE_CLI_BRAND
        source: oauth.brand

  - id: tool/fd
    kind: tool
    name: fd
    display_name: fd
    description: "Fast file finder used by the Glob tool."
    enabled: true
    binaries:
      - name: fd
        tool: github:sharkdp/fd
        version: "10.4.2"

  - id: tool/rg
    kind: tool
    name: rg
    display_name: ripgrep
    description: "Fast text search used by the Grep tool."
    enabled: true
    binaries:
      - name: rg
        tool: github:BurntSushi/ripgrep
        version: "15.1.0"

  - id: hook/rtk
    kind: hook
    name: rtk
    display_name: RTK
    description: "Rewrite bash commands through the rtk binary."
    enabled: true
    binaries:
      - name: rtk
        tool: github:rtk-ai/rtk
        version: "0.40.0"

  - id: tool/kreuzberg
    kind: tool
    name: kreuzberg
    display_name: Kreuzberg
    description: "Extract text, metadata, images, and structured information from PDFs, Office documents, images, and 97+ formats."
    enabled: true
    binaries:
      - name: kreuzberg
        tool: github:kreuzberg-dev/kreuzberg
        version: 4.9.8
        asset_pattern: "kreuzberg-cli-*.tar.gz"

  - id: tool/uv
    kind: tool
    name: uv
    display_name: uv
    description: "An extremely fast Python package manager and resolver written in Rust."
    enabled: true
    binaries:
      - name: uv
        tool: uv
        version: "0.11.15"

  - id: tool/bun
    kind: tool
    name: bun
    display_name: Bun
    description: "An incredibly fast JavaScript runtime, bundler, test runner, and package manager."
    enabled: true
    binaries:
      - name: bun
        tool: bun
        version: "1.3.14"
