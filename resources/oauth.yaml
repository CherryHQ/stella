oauth_providers:
  - id: github
    icon: simpleicons:github
    client_id: 178c6fc778ccc68e1d6a
    scopes:
      - repo
      - workflow
      - gist
      - user
      - read:org
    vault_key: GH_OAUTH
    flows:
      - type: device_code
        device_auth_url: https://github.com/login/device/code
        token_url: https://github.com/login/oauth/access_token
  - id: lark
    icon: asset:feishu
    vault_key: LARK_CLI_OAUTH
    flows:
      - type: device_code
        device_auth_url: https://accounts.larksuite.com/oauth/v1/device_authorization
        token_url: https://open.larksuite.com/open-apis/authen/v2/oauth/token
        auth_style: in_params
      - type: authorization_code
        auth_url: https://open.larksuite.com/open-apis/authen/v1/authorize
        token_url: https://open.larksuite.com/open-apis/authen/v2/oauth/token
        auth_style: in_params
    # Recommended scopes for the bundled lark-cli tool: its full capability
    # surface, so every documented command works after one authorization. This
    # is a floor, not a ceiling — trim it in the admin scope editor when a
    # deployment needs less, and users can still add scopes incrementally.
    scopes:
      - offline_access
