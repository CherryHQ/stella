oauth_providers:
  - id: github
    icon: simpleicons:github
    client_id: 178c6fc778ccc68e1d6a
    scopes:
      - repo
      - workflow
      - gist
      - user
      - read:org
    vault_key: GH_OAUTH
    flows:
      - type: device_code
        device_auth_url: https://github.com/login/device/code
        token_url: https://github.com/login/oauth/access_token
  - id: x
    icon: simpleicons:x
    scopes:
      - tweet.read
      - tweet.write
      - tweet.moderate.write
      - users.read
      - users.email
      - follows.read
      - follows.write
      - offline.access
      - space.read
      - mute.read
      - mute.write
      - like.read
      - like.write
      - list.read
      - list.write
      - block.read
      - block.write
      - bookmark.read
      - bookmark.write
      - dm.read
      - dm.write
      - media.write
    vault_key: X_OAUTH
    flows:
      - type: authorization_code
        auth_url: https://x.com/i/oauth2/authorize
        token_url: https://api.x.com/2/oauth2/token
        auth_style: in_header
        pkce: true
