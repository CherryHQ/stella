plugins:
  - id: tool/mise
    kind: tool
    name: mise
    display_name: mise
    description: "Inject mise usage guidance into the system prompt and provide the mise binary."
    enabled: true
    category: system
    essential: true
    prompt: "Use mise to install tools and manage environment variables. Install personal defaults with `mise use --global --pin <tool>@<version>` and project requirements with `mise use --pin <tool>@<version>`; never modify Stella's system config."

  - id: tool/lightpanda
    kind: tool
    name: lightpanda
    display_name: Lightpanda
    description: "Headless browser CLI for JavaScript-rendered pages and the site-scripts skill."
    enabled: true
    prompt: "Lightpanda is a headless browser CLI on PATH. Keep using `web_search` to find sources and `web_fetch` to read a document at a URL. When the task names a site and wants its records (a tweet or timeline, a repo's stats, a front page, a ranking or search on that site), use the site-scripts skill instead of `web_fetch` or hand scraping. When `web_fetch` returns an empty or JavaScript-only page and no script covers the site, use `lightpanda fetch --dump markdown <url>`. It has no login session and no Chrome-level anti-bot fingerprint; report a site that blocks it after one failure instead of retrying with another browser."
    binaries:
      - name: lightpanda
        tool: github:lightpanda-io/browser
        version: "nightly"

  - id: tool/x
    kind: tool
    name: x
    display_name: X (Twitter)
    description: "X API integration with OAuth 2.0-backed session auth."
    enabled: true
    oauth_provider: x
    session_env:
      - env_var: X_ACCESS_TOKEN
        source: oauth.access_token

  - id: tool/gh
    kind: tool
    name: gh
    display_name: GitHub CLI
    description: "GitHub CLI integration with OAuth-backed session auth."
    enabled: true
    binaries:
      - name: gh
        tool: github:cli/cli
    oauth_provider: github
    session_env:
      - env_var: GH_TOKEN
        source: oauth.access_token

  - id: tool/lark-cli
    kind: tool
    name: lark-cli
    display_name: Lark CLI
    description: "Lark CLI with managed OAuth and bundled workspace automation skills."
    enabled: true
    prompt: "Always use lark-cli for Feishu/Lark operations. If an API error reports missing user scopes, call oauth list and select the provider whose required_by includes Lark CLI, then call oauth connect for that provider with only the missing scopes; send the returned authorization link to the user, then retry after authorization. If the error says the application lacks a scope, surface its console_url to the administrator instead. Never run lark-cli config init or auth login inside Stella."
    binaries:
      - name: lark-cli
        tool: github:larksuite/cli
        version: "1.0.87"
    oauth_provider: feishu
    session_env:
      - env_var: LARKSUITE_CLI_USER_ACCESS_TOKEN
        source: oauth.access_token
      - env_var: LARKSUITE_CLI_APP_ID
        source: oauth.client_id
      - env_var: LARKSUITE_CLI_BRAND
        source: oauth.brand

  - id: tool/fd
    kind: tool
    name: fd
    display_name: fd
    description: "Fast file finder used by the Glob tool."
    enabled: true
    category: system
    essential: true
    binaries:
      - name: fd
        tool: github:sharkdp/fd

  - id: tool/rg
    kind: tool
    name: rg
    display_name: ripgrep
    description: "Fast text search used by the Grep tool."
    enabled: true
    category: system
    essential: true
    binaries:
      - name: rg
        tool: github:BurntSushi/ripgrep

  - id: tool/uv
    kind: tool
    name: uv
    display_name: uv
    description: "An extremely fast Python package manager and resolver written in Rust."
    enabled: true
    category: system
    binaries:
      - name: uv
        tool: uv

  - id: tool/bun
    kind: tool
    name: bun
    display_name: Bun
    description: "An incredibly fast JavaScript runtime, bundler, test runner, and package manager."
    enabled: true
    category: system
    binaries:
      - name: bun
        tool: bun
