version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - staticcheck
    - unconvert
    - unused
    - gocritic
    - modernize

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

issues:
  exclude-dirs:
    - bin
    - vendor
  exclude-files:
    - ".*_templ\\.go$"
