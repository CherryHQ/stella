version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  go: "1.25"
  # Lint the system suite too; its build tag hides test/system from
  # untagged builds, and lint must see the same files the suite compiles.
  build-tags:
    - system

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: strict
    paths:
      - ^bin/
      - ^vendor/
      - .*_templ\.go$
      - .*gen.go

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/CherryHQ/stella
  exclusions:
    generated: strict
    paths:
      - ^bin/
      - ^vendor/
      - .*_templ\.go$
      - .*gen.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - file
    - linter
