# Local development observability stack.
#
# grafana/otel-lgtm — Grafana's all-in-one OTel backend (Collector + Grafana +
# Loki + Tempo + Mimir) in one container. Brought up automatically by
# `mise run dev:docker` / `dev:api:docker`, which export OTLP to localhost:4318.
# Grafana UI: http://localhost:3000 (Explore → Tempo / Loki).
#
# Dev only — for running stellad itself in a container see ./docker-compose.yml.

services:
  otel-lgtm:
    image: grafana/otel-lgtm
    container_name: otel-lgtm
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3000:3000" # Grafana UI
