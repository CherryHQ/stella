<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Group chat dataflow</title
  ><style>
    body {
      font: 16px system-ui;
      max-width: 760px;
      margin: 4rem auto;
      line-height: 1.6;
    }
    code {
      background: #eee;
      padding: 0.15rem 0.3rem;
    }
  </style>
  <body>
    <h1>Optimistic group collaboration</h1>
    <p>
      <code>ingest</code> → canonical event + outbox → member wakes → newest-wake claim + triage →
      buffered turn → atomic accept or HOLD → canonical event stream.
    </p>
    <p>
      Every message wakes members except its author. Server acceptance enforces freshness and caps.
    </p>
  </body>
