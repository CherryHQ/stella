<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Automations Full Page Session UX</title>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <style>
    :root{--bg:#f6f3ec;--panel:#fffefa;--ink:#1d1a15;--muted:#746d61;--line:#ddd5c7;--soft:#f0ebe2;--blue:#245bd6;--blueSoft:#e8efff;--green:#07835a;--greenSoft:#e5f6ee;--amber:#a86600;--amberSoft:#fff1d2;--red:#c22d36;--redSoft:#ffe8eb;--shadow:0 24px 80px rgba(31,27,20,.1);--r:24px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#fff 0,var(--bg) 34rem);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.page{max-width:1540px;margin:0 auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.brand{display:flex;align-items:baseline;gap:14px}.brand h1{margin:0;font-family:Georgia,serif;font-size:30px;font-style:italic;letter-spacing:-.045em}.brand span{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.tabs{display:flex;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:999px;padding:4px}.tab{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;font-weight:750;cursor:pointer}.tab.active{background:var(--ink);color:white}.switcher{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.choice{border:1px solid var(--line);background:white;color:var(--muted);border-radius:999px;padding:8px 12px;cursor:pointer}.choice.active{background:var(--blueSoft);border-color:#b8c9ff;color:var(--blue)}.shell{display:grid;grid-template-columns:360px minmax(420px,1fr) 460px;gap:16px;align-items:start}.panel{background:rgba(255,254,250,.88);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line)}.panelTitle{font-weight:850}.panelSub{color:var(--muted);font-size:12px;margin-top:2px}.panelBody{padding:14px}.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:white;border-radius:18px;padding:12px;margin-bottom:10px}.row.active{border-color:#9db7ff;background:#f7f9ff}.grow{flex:1;min-width:0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:3px}.tag{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800;white-space:nowrap}.green{color:var(--green);background:var(--greenSoft)}.amber{color:var(--amber);background:var(--amberSoft)}.red{color:var(--red);background:var(--redSoft)}.blue{color:var(--blue);background:var(--blueSoft)}.outline{color:var(--muted);background:white;border:1px solid var(--line)}.laneGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lane{border:1px solid var(--line);background:rgba(255,255,255,.58);border-radius:20px;padding:12px;min-height:240px}.lane h3{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.scheduleTable{width:100%;border-collapse:separate;border-spacing:0 9px}.scheduleTable td{background:white;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px}.scheduleTable td:first-child{border-left:1px solid var(--line);border-radius:16px 0 0 16px}.scheduleTable td:last-child{border-right:1px solid var(--line);border-radius:0 16px 16px 0}.logItem{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:white;border-radius:18px;padding:12px;margin-bottom:10px}.detail{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.detailHero{padding:18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffefa,#faf7ef)}.detailKicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:850}.detailTitle{font-family:Georgia,serif;font-size:31px;font-style:italic;letter-spacing:-.045em;margin:6px 0 10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.summary{color:var(--muted);line-height:1.5;margin:13px 0 0}.conversation{margin:14px;border:1px solid var(--line);border-radius:22px;background:white;overflow:hidden}.convHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border-bottom:1px solid var(--line);background:#fffdf8}.convTitle{font-weight:850}.messages{display:grid;gap:10px;padding:14px}.msg{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.avatar{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-size:12px;font-weight:850}.bubble{border:1px solid var(--line);border-radius:16px;padding:10px 12px;line-height:1.45;font-size:14px}.tool .bubble{background:#f8f6f0;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.event .bubble{background:var(--blueSoft);border-color:#c8d6ff;color:#24447e}.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding:12px;background:#fbfaf6}.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:white}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 14px 14px}.fact{border:1px solid var(--line);border-radius:16px;background:white;padding:11px}.fact small{display:block;color:var(--muted);margin-bottom:4px}.activity{padding:14px}.activity .eventRow{position:relative;border:1px solid var(--line);background:white;border-radius:16px;padding:11px;margin:0 0 10px 18px}.activity .eventRow:before{content:"";position:absolute;left:-18px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--blue)}.inboxMain{display:grid;grid-template-columns:minmax(360px,540px) minmax(0,1fr);gap:16px}.thread{border:1px solid var(--line);background:white;border-radius:22px;padding:14px;margin-bottom:12px}.fullConversation{grid-column:1/-1}.wideDetail{grid-column:2/4}.hide{display:none}@media(max-width:1180px){.shell,.inboxMain{grid-template-columns:1fr}.detail{position:static;max-height:none}.wideDetail{grid-column:auto}.laneGrid{grid-template-columns:1fr}.logItem{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}}
    </style>
  </head>
  <body>
    <main class="page" x-data="mock()">
      <header class="top">
        <div class="brand">
          <h1>Automations</h1><span x-text="subtitle"></span>
        </div>
        <div class="actions">
          <div class="tabs">
            <button class="tab active">Now</button>
            <button class="tab">Scheduler</button>
            <button class="tab">Log</button>
          </div>
          <button class="btn">New work</button>
          <button class="btn primary">New schedule</button>
        </div>
      </header>

      <div class="switcher">
        <template x-for="o in options" :key="o.id"><button
            class="choice"
            :class="selected===o.id&&'active'"
            @click="selected=o.id"
            x-text="o.label"
          >
          </button></template>
      </div>

      <section class="shell" x-show="selected==='conversation-first'">
        <NowPanel></NowPanel><LogPanel></LogPanel><ConversationDetail></ConversationDetail>
      </section>

      <section class="shell" x-show="selected==='unified-run'">
        <NowPanel></NowPanel><LogPanel></LogPanel><RunDetail></RunDetail>
      </section>

      <section class="shell" x-show="selected==='source-conversation'">
        <NowPanel></NowPanel><SchedulerPanel></SchedulerPanel><SourceDetail></SourceDetail>
      </section>

      <section class="shell" x-show="selected==='activity-stream'">
        <NowPanel></NowPanel><LogPanel></LogPanel><ActivityDetail></ActivityDetail>
      </section>

      <section class="inboxMain" x-show="selected==='inbox-thread'">
        <div class="panel">
          <div class="panelHead">
            <div>
              <div class="panelTitle">Automation inbox</div>
              <div class="panelSub">Every task/run is a thread</div>
            </div>
            <button class="btn primary">New work</button>
          </div>
          <div class="panelBody"><ThreadList></ThreadList></div>
        </div>
        <div class="panel">
          <div class="panelHead">
            <div>
              <div class="panelTitle">Open thread</div>
              <div class="panelSub">Reply without leaving the page</div>
            </div><span class="tag green">success</span>
          </div><ConversationBlock></ConversationBlock>
        </div>
      </section>
    </main>

    <template id="now"><aside class="panel">
        <div class="panelHead">
          <div>
            <div class="panelTitle">Now</div>
            <div class="panelSub">Things Stella is doing or waiting on</div>
          </div>
        </div>
        <div class="panelBody">
          <div class="laneGrid">
            <div class="lane">
              <h3>Needs you</h3>
              <div class="row">
                <span class="tag amber">review</span><div class="grow">
                  <div class="name">Weekly report draft</div>
                  <div class="meta">Approve before sending</div>
                </div>
              </div>
            </div>
            <div class="lane">
              <h3>Running</h3>
              <div class="row">
                <span class="tag amber">running</span><div class="grow">
                  <div class="name">Analyze support inbox</div>
                  <div class="meta">Started 8m ago</div>
                </div>
              </div>
            </div>
            <div class="lane">
              <h3>Queued</h3>
              <div class="row">
                <span class="tag outline">pending</span><div class="grow">
                  <div class="name">Prepare changelog</div>
                  <div class="meta">Waiting for worker</div>
                </div>
              </div>
            </div>
            <div class="lane">
              <h3>Failures</h3>
              <div class="row">
                <span class="tag red">failed</span><div class="grow">
                  <div class="name">DB health check</div>
                  <div class="meta">Timeout</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside></template>
    <template id="scheduler"><section class="panel">
        <div class="panelHead">
          <div>
            <div class="panelTitle">Scheduler</div>
            <div class="panelSub">Things Stella starts later or repeats</div>
          </div>
        </div>
        <div class="panelBody">
          <table class="scheduleTable">
            <tr>
              <td>
                <strong>recally-rss</strong><div class="meta">
                  Poll RSS and save articles
                </div>
              </td>
              <td><span class="tag outline">every 6h</span></td>
              <td><span class="tag green">enabled</span></td>
            </tr>
            <tr>
              <td>
                <strong>Weekly report</strong><div class="meta">
                  Draft and ask approval
                </div>
              </td>
              <td><span class="tag outline">Mon 9am</span></td>
              <td><span class="tag green">enabled</span></td>
            </tr>
            <tr>
              <td>
                <strong>DB health check</strong><div class="meta">
                  Check app database
                </div>
              </td>
              <td><span class="tag outline">every 15m</span></td>
              <td><span class="tag red">last failed</span></td>
            </tr>
          </table>
        </div>
      </section></template>
    <template id="log"><section class="panel">
        <div class="panelHead">
          <div>
            <div class="panelTitle">Log</div>
            <div class="panelSub">What ran, when, and result</div>
          </div>
        </div>
        <div class="panelBody">
          <div class="logItem">
            <span class="meta">12h ago</span><div>
              <div class="name">recally-rss</div>
              <div class="meta">Scheduler run · conversation available</div>
            </div><span class="tag green">success</span>
          </div>
          <div class="logItem">
            <span class="meta">13h ago</span><div>
              <div class="name">Weekly report draft</div>
              <div class="meta">Task run · waiting review</div>
            </div><span class="tag amber">review</span>
          </div>
          <div class="logItem">
            <span class="meta">15h ago</span><div>
              <div class="name">DB health check</div>
              <div class="meta">Scheduler run · timeout</div>
            </div><span class="tag red">failed</span>
          </div>
        </div>
      </section></template>
    <template id="threadlist"><div class="thread">
        <div class="row active">
          <span class="tag amber">review</span><div class="grow">
            <div class="name">Weekly report draft</div>
            <div class="meta">Stella needs approval</div>
          </div>
        </div>
      </div><div class="thread">
        <div class="row active">
          <span class="tag green">success</span><div class="grow">
            <div class="name">recally-rss</div>
            <div class="meta">Saved 2 articles</div>
          </div>
        </div>
      </div><div class="thread">
        <div class="row">
          <span class="tag red">failed</span><div class="grow">
            <div class="name">DB health check</div>
            <div class="meta">Connection timeout</div>
          </div>
        </div>
      </div></template>
    <template id="conv"><div class="conversation">
        <div class="convHead">
          <div>
            <div class="convTitle">Conversation</div>
            <div class="meta">Same surface for task and scheduler run</div>
          </div>
          <button class="btn">Full view</button>
        </div>
        <div class="messages">
          <div class="msg event">
            <div class="avatar">↳</div>
            <div class="bubble">Started by Scheduler: recally-rss.</div>
          </div>
          <div class="msg">
            <div class="avatar">S</div>
            <div class="bubble">
              I found 3 pending RSS entries and started processing them.
            </div>
          </div>
          <div class="msg tool">
            <div class="avatar">T</div>
            <div class="bubble">recally feed poll --limit 20 --json</div>
          </div>
          <div class="msg">
            <div class="avatar">S</div>
            <div class="bubble">
              Saved 2 articles. One duplicate was skipped.
            </div>
          </div>
        </div>
        <div class="composer">
          <input
            placeholder="Ask Stella about this run…"
          ><button class="btn primary">Continue</button>
        </div>
      </div></template>
    <template id="conversation-detail"><aside class="panel detail">
        <div class="detailHero">
          <div class="detailKicker">Selected run</div>
          <div class="detailTitle">recally-rss</div>
          <div class="chips">
            <span class="tag green">success</span><span class="tag outline"
            >Scheduler run</span><span class="tag outline">12h ago · 26s</span>
          </div>
          <p class="summary">
            The detail panel is mostly the conversation. Metadata is only
            context.
          </p>
        </div><ConversationBlock></ConversationBlock>
      </aside></template>
    <template id="run-detail"><aside class="panel detail">
        <div class="detailHero">
          <div class="detailKicker">Run detail</div>
          <div class="detailTitle">Run: recally-rss</div>
          <div class="chips">
            <span class="tag green">success</span><span class="tag outline"
            >source: scheduler</span>
          </div>
        </div>
        <div class="facts">
          <div class="fact"><small>Status</small><strong>Success</strong></div>
          <div class="fact"><small>Started</small><strong>12h ago</strong></div>
          <div class="fact"><small>Duration</small><strong>26s</strong></div>
        </div><ConversationBlock></ConversationBlock>
      </aside></template>
    <template id="source-detail"><aside class="panel detail">
        <div class="detailHero">
          <div class="detailKicker">Why this ran</div>
          <div class="detailTitle">Started by Scheduler</div>
          <p class="summary">
            Rule: <strong>recally-rss</strong> runs every 6h. This run opened a
            Stella conversation to process RSS entries.
          </p>
          <div class="chips">
            <button class="btn">Edit schedule</button>
            <button class="btn primary">Run now</button>
          </div>
        </div><ConversationBlock></ConversationBlock>
      </aside></template>
    <template id="activity-detail"><aside class="panel detail">
        <div class="detailHero">
          <div class="detailKicker">Activity</div>
          <div class="detailTitle">What happened</div>
          <div class="chips">
            <span class="tag green">success</span><span class="tag outline"
            >messages + events</span>
          </div>
        </div>
        <div class="activity">
          <div class="eventRow">
            <strong>Scheduler started recally-rss</strong><div class="meta">
              12h ago
            </div>
          </div>
          <div class="eventRow">
            <strong>Stella found 3 entries</strong><div class="meta">
              conversation message
            </div>
          </div>
          <div class="eventRow">
            <strong>Tool ran: recally feed poll</strong><div class="meta">
              tool call
            </div>
          </div>
          <div class="eventRow">
            <strong>Saved 2 articles</strong><div class="meta">
              task progress
            </div>
          </div>
        </div><ConversationBlock></ConversationBlock>
      </aside></template>
    <script>
    function mock(){return{selected:'conversation-first',options:[{id:'conversation-first',label:'1 Conversation-first full page'},{id:'unified-run',label:'2 Unified Run detail'},{id:'source-conversation',label:'3 Source + Conversation'},{id:'activity-stream',label:'4 Activity stream'},{id:'inbox-thread',label:'5 Inbox thread'}],get subtitle(){return{ 'conversation-first':'Conversation is the primary detail, not a link out','unified-run':'Task run and scheduler run share one detail model','source-conversation':'Explain why it exists, then show the conversation','activity-stream':'Messages and events are one readable timeline','inbox-thread':'Everything is a thread you can reply to'}[this.selected]}}}
function expand(){const ids={NowPanel:'now',SchedulerPanel:'scheduler',LogPanel:'log',ThreadList:'threadlist',ConversationBlock:'conv',ConversationDetail:'conversation-detail',RunDetail:'run-detail',SourceDetail:'source-detail',ActivityDetail:'activity-detail'};let changed=true;while(changed){changed=false;Object.entries(ids).forEach(([tag,id])=>{document.querySelectorAll(tag).forEach(el=>{el.outerHTML=document.getElementById(id).innerHTML;changed=true})})}}
expand();
    </script>
  </body>
</html>
