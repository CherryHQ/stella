package: server
generate:
  std-http-server: true
  models: true
output: api/server/gen.go
output-options:
  skip-prune: true
# Keep generated server handlers using the shared model package instead of
# redeclaring schemas in api/server/gen.go.
#
# These keys must match the $ref strings as they appear from each spec file:
# - ./components.yaml is used by refs in api/spec/openapi.yaml
# - ../../components.yaml is used by refs in api/spec/domain/<domain>/paths.yaml
import-mapping:
  ./components.yaml: github.com/CherryHQ/stella/api/types
  ../../components.yaml: github.com/CherryHQ/stella/api/types
