package: client
generate:
  client: true
  models: true
output: api/client/gen.go
output-options:
  skip-prune: true
# Keep generated client methods using the shared model package instead of
# redeclaring schemas in api/client/gen.go.
#
# These keys must match the $ref strings as they appear from each spec file:
# - ./components.yaml is used by refs in api/spec/openapi.yaml
# - ../../components.yaml is used by refs in api/spec/domain/<domain>/paths.yaml
import-mapping:
  ./components.yaml: github.com/vaayne/anna/api/types
  ../../components.yaml: github.com/vaayne/anna/api/types
