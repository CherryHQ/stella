openapi: 3.0.3
info:
  title: anna scheduler API
  description: |
    Sub-spec for the scheduler job management feature. Part of the full anna
    API defined in api/openapi.yaml.

    The anna server is the only process that reads or writes the scheduler
    database. CLI, web UI, and third-party clients all talk HTTP.

    Source of truth for the generated Go client
    (`pkg/scheduler/client/client_gen.go`).

    Note: all responses are wrapped in `{"data": ...}` by the anna server.
    Use `DecodeData` from the hand-written `client.go` to unwrap.
  version: "1"
servers:
  - url: http://127.0.0.1:25678
    description: local anna server (default port)
security:
  - BearerAuth: []
tags:
  - name: jobs
paths:
  /api/scheduler/jobs:
    get:
      tags: [jobs]
      summary: List scheduler jobs
      operationId: listSchedulerJobs
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [jobs]
      summary: Create a scheduler job
      operationId: createSchedulerJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/scheduler/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [jobs]
      summary: Update a scheduler job (partial — missing fields are merged from existing)
      operationId: updateSchedulerJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [jobs]
      summary: Delete a scheduler job
      operationId: deleteSchedulerJob
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: ANNA_TOKEN bearer token

  responses:
    Unauthorized:
      description: missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: insufficient permissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Job:
      type: object
      required: [id, name, message, session_mode, enabled]
      properties:
        id:           { type: string }
        owner_kind:   { type: string, description: "Ownership class: 'user' or 'plugin'" }
        plugin_id:    { type: string }
        job_key:      { type: string }
        runtime_name: { type: string }
        name:         { type: string }
        description:  { type: string }
        cron:         { type: string, description: "Cron expression (mutually exclusive with every/at)" }
        every:        { type: string, description: "Go duration string, e.g. '30m' (mutually exclusive with cron/at)" }
        at:           { type: string, description: "RFC3339 one-time timestamp (mutually exclusive with cron/every)" }
        message:      { type: string, description: "Prompt/instruction to run on schedule" }
        payload:
          type: object
          additionalProperties: {}
          description: "Arbitrary structured data for plugin-owned jobs"
        session_mode: { type: string, description: "Session behaviour: 'reuse' or 'new'" }
        enabled:      { type: boolean }
        agent_id:     { type: string }
        user_id:      { type: integer, format: int64 }
        created_at:   { type: string }
        updated_at:   { type: string }
        last_run_at:  { type: string }
        last_error:   { type: string }

    JobList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }

    JobInput:
      type: object
      description: "Fields for creating or updating a job. For create: name, message, and exactly one of cron/every/at are required."
      properties:
        name:         { type: string }
        description:  { type: string }
        cron:         { type: string }
        every:        { type: string }
        at:           { type: string }
        message:      { type: string }
        session_mode: { type: string }
        enabled:      { type: boolean }
        agent_id:     { type: string }
        user_id:      { type: integer, format: int64, description: "Admin-only: set 0 for system jobs" }

    DeleteResult:
      type: object
      required: [status]
      properties:
        status: { type: string }
