paths:
  /api/scheduler/jobs:
    get:
      tags: [jobs]
      summary: List scheduler jobs
      operationId: listSchedulerJobs
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../spec/components.yaml#/components/schemas/JobList" }
        "401": { $ref: "../../spec/components.yaml#/components/responses/Unauthorized" }
    post:
      tags: [jobs]
      summary: Create a scheduler job
      operationId: createSchedulerJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../spec/components.yaml#/components/schemas/JobInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "../../spec/components.yaml#/components/schemas/Job" }
        "400": { $ref: "../../spec/components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../spec/components.yaml#/components/responses/Unauthorized" }

  /api/scheduler/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [jobs]
      summary: Update a scheduler job (partial — missing fields are merged from existing)
      operationId: updateSchedulerJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../spec/components.yaml#/components/schemas/JobInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../spec/components.yaml#/components/schemas/Job" }
        "400": { $ref: "../../spec/components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../spec/components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../spec/components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../spec/components.yaml#/components/responses/NotFound" }
    delete:
      tags: [jobs]
      summary: Delete a scheduler job
      operationId: deleteSchedulerJob
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema: { $ref: "../../spec/components.yaml#/components/schemas/DeleteResult" }
        "401": { $ref: "../../spec/components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../spec/components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../spec/components.yaml#/components/responses/NotFound" }
