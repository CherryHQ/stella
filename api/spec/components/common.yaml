openapi: 3.0.3
info:
  title: Common Components
  version: "1"
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal access token or OAuth access token created in the Web UI

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: integer
              description: mirrors the HTTP status code
            message:
              type: string
              description: human-readable, actionable description
            status:
              type: string
              description: canonical status name (e.g. NOT_FOUND, INVALID_ARGUMENT)
            details:
              type: object
              additionalProperties: true
              description: optional machine-readable error details; keys use snake_case

  responses:
    Unauthorized:
      description: missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: insufficient permissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: request conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: service is not configured or temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
