      enum: [unread, read, archived]
    SourceType:
      type: string
      enum: [web, twitter, youtube, github, rss, pdf]
    FeedEntryStatus:
      type: string
      enum: [pending, saved, skipped, error]
    Article:
      type: object
      required: [
        id,
        url,
        canonical_url,
        source_type,
        title,
        status,
        starred,
        file_path,
        saved_at,
        created_at,
        updated_at,
