          type: string
        agent_id:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        canonical_url:
          type: string
        source_type:
          $ref: "#/components/schemas/SourceType"
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        starred:
          type: boolean
        file_path:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        saved_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
