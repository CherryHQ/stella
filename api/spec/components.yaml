openapi: 3.0.3
info:
  title: stella API Components
  version: "1"
  description: Assembled from api/spec/components/common.yaml + api/spec/domain/*/schemas.yaml — DO NOT EDIT
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: STELLA_TOKEN bearer token (generated via vault)
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: integer
              description: mirrors the HTTP status code
            message:
              type: string
              description: human-readable, actionable description
            status:
              type: string
              description: canonical status name (e.g. NOT_FOUND, INVALID_ARGUMENT)
            details:
              type: object
              additionalProperties: true
              description: optional machine-readable error details; keys use snake_case
    SandboxNetworkConfig:
      type: object
      properties:
        mode:
          type: string
        allowlist:
          type: array
          items:
            type: string
    SandboxConfig:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/SandboxNetworkConfig"
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        model_strong:
          type: string
        model_fast:
          type: string
        system_prompt:
          type: string
        soul:
          type: string
        workspace:
          type: string
        sandbox:
          $ref: "#/components/schemas/SandboxConfig"
        scope:
          type: string
        creator_id:
          type: string
        enabled:
          type: boolean
    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    CreateAgentRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        model_strong:
          type: string
        model_fast:
          type: string
        system_prompt:
          type: string
        soul:
          type: string
        workspace:
          type: string
        sandbox:
          $ref: "#/components/schemas/SandboxConfig"
        scope:
          type: string
        creator_id:
          type: string
        enabled:
          type: boolean
        template_id:
          type: string
    AgentUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
    AgentUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AgentUser"
    AssignAgentUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
    Skill:
      type: object
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [project, user, agent, system]
        user_id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        disable_model_invocation:
          type: boolean
        files:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SkillList:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
    CreateSkillRequest:
      type: object
      required: [name, scope]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [user, agent]
        description:
          type: string
        status:
          type: string
        disable_model_invocation:
          type: boolean
        files:
          type: object
          additionalProperties:
            type: string
    UpdateSkillRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        disable_model_invocation:
          type: boolean
          nullable: true
        files:
          type: object
          additionalProperties:
            type: string
    InstallSkillRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
        scope:
          type: string
          enum: [user, agent]
    SkillFileResponse:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    MeResponse:
      type: object
      required: [id, username, role, is_admin]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
        is_admin:
          type: boolean
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        has_credentials:
          type: boolean
    AuthSession:
      type: object
      required: [id, expires_at, created_at]
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    AuthSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AuthSession"
    LocalLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LocalRegisterRequest:
      type: object
      required: [name, email, password, confirm_password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password
    LocalAuthRedirect:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          description: URL the browser should navigate to after local authentication.
    OIDCProvider:
      type: object
      required: [name, login_url]
      properties:
        name:
          type: string
          description: Human-readable provider name (e.g. "Zitadel")
        login_url:
          type: string
          description: URL to redirect the browser to for login
        register_url:
          type: string
          description: URL to redirect the browser to for registration (local provider only)
    OIDCProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OIDCProvider"
    BuiltinResource:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        hash:
          type: string
    BuiltinResourceDetail:
      type: object
      required: [kind, id, name, content]
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        hash:
          type: string
        content:
          type: string
    BuiltinResourceList:
      type: object
