    SaveArticleRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        canonical_url:
          type: string
        source_type:
          $ref: "#/components/schemas/SourceType"
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        content:
          type: string
          description: "Markdown body. If empty and the article exists, only metadata is updated; if empty and the article is new, the request fails 400."
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        agent_id:
          type: string
          nullable: true
    UpdateArticleRequest:
      type: object
      description: "Only provided fields are updated."
      properties:
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        starred:
          type: boolean
        file_path:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        content:
          type: string
          description: "If set, rewrites the markdown file body."
