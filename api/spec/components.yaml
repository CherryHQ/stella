            draft,
            planning,
            running,
            blocked,
            reviewing,
            done,
            failed,
            cancelled,
          ]
        priority:
          type: string
          enum: [routine, urgent]
        review_policy:
          type: string
          enum: [none, auto, agent, human]
        active_review_id:
          type: string
        context:
          type: object
          additionalProperties: {}
        output:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time
    GoalList:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.
    CreateGoalRequest:
      type: object
      required: [title]
      properties:
