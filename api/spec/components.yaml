openapi: 3.0.3
info:
  title: stella API Components
  version: "1"
  description: Assembled from api/spec/components/common.yaml + api/spec/domain/*/schemas.yaml — DO NOT EDIT
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: STELLA_TOKEN bearer token (generated via vault)
  responses:
    Unauthorized:
      description: missing or invalid bearer token
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
    Forbidden:
      description: insufficient permissions
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
    NotFound:
      description: resource not found
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
    Conflict:
      description: request conflicts with current state
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
  schemas:
    SandboxNetworkConfig:
      type: object
      properties:
        mode:
          type: string
        allowlist:
          type: array
          items:
            type: string
    SandboxConfig:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/SandboxNetworkConfig"
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        model_strong:
          type: string
        model_fast:
          type: string
        system_prompt:
          type: string
        soul:
          type: string
        workspace:
          type: string
        sandbox:
          $ref: "#/components/schemas/SandboxConfig"
        scope:
          type: string
        creator_id:
          type: string
        enabled:
          type: boolean
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    CreateAgentRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        model_strong:
          type: string
        model_fast:
          type: string
        system_prompt:
          type: string
        soul:
          type: string
        workspace:
          type: string
        sandbox:
          $ref: "#/components/schemas/SandboxConfig"
        scope:
          type: string
        creator_id:
          type: string
        enabled:
          type: boolean
        template_id:
          type: string
    AgentUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
    AgentUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentUser"
    AssignAgentUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
    Skill:
      type: object
      properties:
        id:
          type: string
        scope:
          type: string
        user_id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        disable_model_invocation:
          type: boolean
        files:
          type: array
          items:
            type: string
        created_at:
          type: string
        updated_at:
          type: string
    SkillList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
    InstallSkillRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
    UpdateSkillRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        disable_model_invocation:
          type: boolean
          nullable: true
        files:
          type: object
          additionalProperties:
            type: string
    SkillUploadResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    DuplicateSkillResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    MeResponse:
      type: object
      required: [id, username, role, is_admin]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
        is_admin:
          type: boolean
    BuiltinResource:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        hash:
          type: string
    BuiltinResourceDetail:
      type: object
      required: [kind, id, name, content]
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        hash:
          type: string
        content:
          type: string
    Channel:
      type: object
      required: [id, type, enabled, config]
      properties:
        id:
          type: string
        type:
          type: string
        agent_id:
          type: string
        enabled:
          type: boolean
        config:
          type: string
          description: "JSON string of the channel config"
    ChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    PublicChannel:
      type: object
      required: [id, type, label, enabled]
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        agent_id:
          type: string
        agent_name:
          type: string
        enabled:
          type: boolean
    PublicChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicChannel"
    ChannelWriteRequest:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          nullable: true
        agent_id:
          type: string
          nullable: true
        config:
          type: string
          description: "JSON string of the channel config"
    WeixinQRCode:
      type: object
      properties:
        qrcode:
          type: string
        qrcode_img_content:
          type: string
    WeixinQRStatus:
      type: object
      properties:
        status:
          type: string
        bot_token:
          type: string
        ilink_bot_id:
          type: string
        ilink_user_id:
          type: string
        baseurl:
          type: string
    CachedModel:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string
    PluginView:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
        display_name:
          type: string
        description:
          type: string
        managed:
          type: boolean
        admin_visible:
          type: boolean
        has_config:
          type: boolean
        has_status:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        persisted:
          type: boolean
        persisted_id:
          type: string
    TogglePluginRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    UpdatePluginConfigRequest:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true
    ManifestPlugin:
      type: object
      additionalProperties: true
    ManifestOAuthProvider:
      type: object
      properties:
        id:
          type: string
        scopes:
          type: array
          items:
            type: string
        vault_key:
          type: string
        client_id:
          type: string
    ManifestPluginsResponse:
      type: object
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/ManifestPlugin"
        oauth_providers:
          type: array
          items:
            $ref: "#/components/schemas/ManifestOAuthProvider"
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
    GenerateLinkCodeRequest:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
    LinkCodeResponse:
      type: object
      required: [code, platform]
      properties:
        code:
          type: string
        platform:
          type: string
    SetSoulRequest:
      type: object
      required: [soul]
      properties:
        soul:
          type: string
    VaultEntry:
      type: object
      required: [name, created_at, updated_at]
      properties:
        name:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    SetVaultEntryRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
    VaultEntryValue:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    OAuthProviderStatus:
      type: object
      required: [provider, available, configured, connected]
      properties:
        provider:
          type: string
        available:
          type: boolean
        configured:
          type: boolean
        connected:
          type: boolean
        username:
          type: string
        unavailable:
          type: string
    OAuthProviderConfig:
      type: object
      required: [provider_id, client_id, client_secret]
      properties:
        provider_id:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        redirect_url:
          type: string
    OAuthProviderConfigInput:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        redirect_url:
          type: string
    OAuthFlowStatus:
      type: object
      required: [provider, flow_id, verification_uri, expires_at, state]
      properties:
        provider:
          type: string
        flow_id:
          type: string
        verification_uri:
          type: string
        user_code:
          type: string
        expires_at:
          type: string
        state:
          type: string
    OAuthConnectedResponse:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        username:
          type: string
    ProviderModelCost:
      type: object
      properties:
        input:
          type: number
          format: double
        output:
          type: number
          format: double
        cacheRead:
          type: number
          format: double
        cacheWrite:
          type: number
          format: double
    ProviderModel:
      type: object
      required: [enabled]
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        reasoning:
          type: boolean
        input:
          type: array
          items:
            type: string
        output:
          type: array
          items:
            type: string
        contextWindow:
          type: integer
        maxTokens:
          type: integer
        cost:
          $ref: "#/components/schemas/ProviderModelCost"
    Provider:
      type: object
      required: [id, type, name, enabled, api_key, base_url]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        api_key:
          type: string
        base_url:
          type: string
        models:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProviderModel"
    ProviderModelItem:
      type: object
      required: [id, source, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        config:
          $ref: "#/components/schemas/ProviderModel"
    ProviderType:
      type: object
      required: [id, name, default_url]
      properties:
        id:
          type: string
        name:
          type: string
        default_url:
          type: string
    FetchModelsRequest:
      type: object
      properties:
        api_key:
          type: string
        base_url:
          type: string
    # ── Shared ─────────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    # ── Recally ────────────────────────────────────────────────────────────────
    ArticleStatus:
      type: string
      enum: [unread, read, archived]
    SourceType:
      type: string
      enum: [web, twitter, youtube, github, rss, pdf]
    FeedEntryStatus:
      type: string
      enum: [pending, saved, skipped, error]
    Article:
      type: object
      required: [
        id,
        url,
        canonical_url,
        source_type,
        title,
        status,
        starred,
        file_path,
        saved_at,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
        agent_id:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        canonical_url:
          type: string
        source_type:
          $ref: "#/components/schemas/SourceType"
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        starred:
          type: boolean
        file_path:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        saved_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        content:
          type: string
          description: "Article body in markdown. Returned only when ?include=content is set."
          nullable: true
    ArticleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
    SaveArticleRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        canonical_url:
          type: string
        source_type:
          $ref: "#/components/schemas/SourceType"
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        content:
          type: string
          description: "Markdown body. If empty and the article exists, only metadata is updated; if empty and the article is new, the request fails 400."
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        agent_id:
          type: string
          nullable: true
    UpdateArticleRequest:
      type: object
      description: "Only provided fields are updated."
      properties:
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        starred:
          type: boolean
        file_path:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        content:
          type: string
          description: "If set, rewrites the markdown file body."
    Feed:
      type: object
      required: [
        id,
        url,
        title,
        check_interval,
        enabled,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
        agent_id:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        check_interval:
          type: string
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        last_etag:
          type: string
        last_modified:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FeedList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Feed"
    CreateFeedRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
          description: "Optional override; server fetches feed metadata if omitted"
        agent_id:
          type: string
          nullable: true
    UpdateFeedRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        check_interval:
          type: string
        enabled:
          type: boolean
    FeedEntry:
      type: object
      required: [id, feed_id, guid, url, title, status, attempts, discovered_at]
      properties:
        id:
          type: string
        feed_id:
          type: string
        guid:
          type: string
        url:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/FeedEntryStatus"
        article_id:
          type: string
          nullable: true
        attempts:
          type: integer
        error_msg:
          type: string
        discovered_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
    FeedEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedEntry"
    UpdateFeedEntryRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/FeedEntryStatus"
        article_id:
          type: string
          nullable: true
        error_msg:
          type: string
    FeedPollResult:
      type: object
      required: [feed, new_entries]
      properties:
        feed:
          $ref: "#/components/schemas/Feed"
        new_entries:
          type: array
          items:
            $ref: "#/components/schemas/FeedEntry"
        error:
          type: string
          nullable: true
          description: "Set if the upstream RSS fetch failed but the feed exists"
    TagCount:
      type: object
      required: [tag, count]
      properties:
        tag:
          type: string
        count:
          type: integer
          format: int64
    Digest:
      type: object
      required:
        - date
        - saved_yesterday
        - saved_yesterday_count
        - unread_count
        - read_count
        - archived_count
        - starred_count
        - worth_revisiting
        - worth_revisiting_count
        - top_tags
        - total_articles
      properties:
        date:
          type: string
          format: date-time
        saved_yesterday:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        saved_yesterday_count:
          type: integer
        unread_count:
          type: integer
          format: int64
        read_count:
          type: integer
          format: int64
        archived_count:
          type: integer
          format: int64
        starred_count:
          type: integer
          format: int64
        worth_revisiting:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        worth_revisiting_count:
          type: integer
        top_tags:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
        total_articles:
          type: integer
          format: int64
    SaveDigestRequest:
      type: object
      required: [narrative]
      properties:
        narrative:
          type: string
        date:
          type: string
          description: "YYYY-MM-DD; defaults to today if omitted"
    StoredDigestSummary:
      type: object
      required: [
        id,
        date,
        narrative,
        saved_yesterday_count,
        worth_revisiting_count,
        total_articles,
        created_at,
      ]
      properties:
        id:
          type: string
        date:
          type: string
        narrative:
          type: string
        saved_yesterday_count:
          type: integer
          format: int64
        worth_revisiting_count:
          type: integer
          format: int64
        total_articles:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    StoredDigestSummaryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoredDigestSummary"
        total:
          type: integer
          format: int64
    StoredDigest:
      type: object
      required: [
        id,
        date,
        narrative,
        saved_yesterday,
        saved_yesterday_count,
        unread_count,
        read_count,
        archived_count,
        starred_count,
        worth_revisiting,
        worth_revisiting_count,
        top_tags,
        total_articles,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
        date:
          type: string
        narrative:
          type: string
        saved_yesterday:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        saved_yesterday_count:
          type: integer
          format: int64
        unread_count:
          type: integer
          format: int64
        read_count:
          type: integer
          format: int64
        archived_count:
          type: integer
          format: int64
        starred_count:
          type: integer
          format: int64
        worth_revisiting:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        worth_revisiting_count:
          type: integer
          format: int64
        top_tags:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
        total_articles:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Job:
      type: object
      required: [id, name, message, session_mode, enabled]
      properties:
        id:
          type: string
        owner_kind:
          type: string
          description: "Ownership class: 'user' or 'plugin'"
        plugin_id:
          type: string
        job_key:
          type: string
        runtime_name:
          type: string
        name:
          type: string
        description:
          type: string
        cron:
          type: string
          description: "Cron expression (mutually exclusive with every/at)"
        every:
          type: string
          description: "Go duration string, e.g. '30m' (mutually exclusive with cron/at)"
        at:
          type: string
          description: "RFC3339 one-time timestamp (mutually exclusive with cron/every)"
        message:
          type: string
          description: "Prompt/instruction to run on schedule"
        payload:
          type: object
          additionalProperties: {}
          description: "Arbitrary structured data for plugin-owned jobs"
        session_mode:
          type: string
          description: "Session behaviour: 'reuse' or 'new'"
        enabled:
          type: boolean
        agent_id:
          type: string
        user_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_run_at:
