paths:
  /api/inbox:
    get:
      tags: [inbox]
      summary: List attention items for the current user
      operationId: listInbox
      parameters:
        - name: agent_id
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/InboxList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
