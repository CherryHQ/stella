openapi: 3.0.3
info:
  title: Recally Components
  version: "1"
paths: {}
components:
  schemas:
    # ── Recally ────────────────────────────────────────────────────────────────
    ArticleStatus:
      type: string
      enum: [unread, read, archived]

    SourceType:
      type: string
      enum: [web, twitter, youtube, github, rss, pdf]

    FeedEntryStatus:
      type: string
      enum: [pending, saved, skipped, error]

    FeedKind:
      type: string
      description: "Extraction-dispatch hint. 'rss' uses the built-in poller; other kinds (twitter, website) are extracted by the recally skill."
      enum: [rss, twitter, website]

    Article:
      type: object
      required: [
        id,
        url,
        canonical_url,
        source_type,
        title,
        status,
        starred,
        file_path,
        saved_at,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        agent_id: { type: string, nullable: true }
        url: { type: string, format: uri }
        canonical_url: { type: string }
        source_type: { $ref: "#/components/schemas/SourceType" }
        title: { type: string }
        author: { type: string }
        summary: { type: string }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        starred: { type: boolean }
        file_path: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        saved_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        content:
          type: string
          description: "Article body in markdown. Returned only when ?include=content is set."
          nullable: true

    ArticleList:
      type: object
      required: [articles]
      properties:
        articles: {
          type: array,
          items: { $ref: "#/components/schemas/Article" },
        }
        next_page_token: { type: string, nullable: true }

    SaveArticleRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        canonical_url: { type: string }
        source_type: { $ref: "#/components/schemas/SourceType" }
        title: { type: string }
        author: { type: string }
        summary: { type: string }
        tags: { type: array, items: { type: string } }
        content:
          type: string
          description: "Markdown body. If empty and the article exists, only metadata is updated; if empty and the article is new, the request fails 400."
        metadata:
          type: object
          additionalProperties: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        agent_id: { type: string, nullable: true }

    UpdateArticleRequest:
      type: object
      description: "Only provided fields are updated."
      properties:
        title: { type: string }
        author: { type: string }
        summary: { type: string }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        starred: { type: boolean }
        file_path: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        content:
          type: string
          description: "If set, rewrites the markdown file body."

    Feed:
      type: object
      required: [
        id,
        url,
        kind,
        title,
        check_interval,
        enabled,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        agent_id: { type: string, nullable: true }
        url: { type: string, format: uri }
        kind: { $ref: "#/components/schemas/FeedKind" }
        metadata:
          type: object
          additionalProperties: { type: string }
        title: { type: string }
        description: { type: string }
        check_interval: { type: string }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_etag: { type: string }
        last_modified: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FeedList:
      type: object
      required: [feeds]
      properties:
        feeds: { type: array, items: { $ref: "#/components/schemas/Feed" } }
        next_page_token: { type: string, nullable: true }

    CreateFeedRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        kind:
          allOf: [{ $ref: "#/components/schemas/FeedKind" }]
          description: "Escape hatch to force the feed kind. Omit to let the server sniff it from the URL (x.com/twitter.com → twitter, otherwise rss)."
        title: {
          type: string,
          description: "Optional override; server fetches feed metadata if omitted (rss only)",
        }
        agent_id: { type: string, nullable: true }

    UpdateFeedRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        check_interval: { type: string }
        enabled: { type: boolean }

    FeedEntry:
      type: object
      required: [id, feed_id, guid, url, title, status, attempts, discovered_at]
      properties:
        id: { type: string }
        feed_id: { type: string }
        guid: { type: string }
        url: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/FeedEntryStatus" }
        article_id: { type: string, nullable: true }
        attempts: { type: integer }
        error_msg: { type: string }
        discovered_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }

    FeedEntryList:
      type: object
      required: [entries]
      properties:
        entries: {
          type: array,
          items: { $ref: "#/components/schemas/FeedEntry" },
        }
        next_page_token: { type: string, nullable: true }

    UpdateFeedEntryRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/FeedEntryStatus" }
        article_id:
          {
            type: string,
            nullable: true,
            description: "The saved article this entry became; required when status=saved.",
          }
        error_msg: { type: string }

    CreateFeedEntryRequest:
      type: object
      required: [guid]
      properties:
        guid: {
          type: string,
          description: "Stable per-source item id; the dedup key (unique per feed)",
        }
        url: { type: string }
        title: { type: string }

    CreateFeedEntryResult:
      type: object
      required: [created]
      properties:
        created: {
          type: boolean,
          description: "true if a new entry was inserted; false if the guid already existed (dup)",
        }
        entry:
          allOf: [{ $ref: "#/components/schemas/FeedEntry" }]
          nullable: true
          description: "The inserted entry; null on dup (ON CONFLICT DO NOTHING returns no row)"

    FeedPollResult:
      type: object
      required: [feed, new_entries]
      properties:
        feed: { $ref: "#/components/schemas/Feed" }
        new_entries: {
          type: array,
          items: { $ref: "#/components/schemas/FeedEntry" },
        }
        error: {
          type: string,
          nullable: true,
          description: "Set if the upstream RSS fetch failed but the feed exists",
        }

    TagCount:
      type: object
      required: [tag, count]
      properties:
        tag: { type: string }
        count: { type: integer, format: int64 }

    Digest:
      type: object
      required:
        - date
        - saved_yesterday
        - saved_yesterday_count
        - unread_count
        - read_count
        - archived_count
        - starred_count
        - worth_revisiting
        - worth_revisiting_count
        - top_tags
        - total_articles
      properties:
        date: { type: string, format: date-time }
        saved_yesterday: {
          type: array,
          items: { $ref: "#/components/schemas/Article" },
        }
        saved_yesterday_count: { type: integer }
        unread_count: { type: integer, format: int64 }
        read_count: { type: integer, format: int64 }
        archived_count: { type: integer, format: int64 }
        starred_count: { type: integer, format: int64 }
        worth_revisiting: {
          type: array,
          items: { $ref: "#/components/schemas/Article" },
        }
        worth_revisiting_count: { type: integer }
        top_tags: {
          type: array,
          items: { $ref: "#/components/schemas/TagCount" },
        }
        total_articles: { type: integer, format: int64 }

    SaveDigestRequest:
      type: object
      required: [narrative]
      properties:
        narrative: { type: string }
        date:
          type: string
          description: "YYYY-MM-DD; defaults to today if omitted"

    StoredDigestSummary:
      type: object
      required:
        [
          id,
          date,
          narrative,
          saved_yesterday_count,
          worth_revisiting_count,
          total_articles,
          created_at,
        ]
      properties:
        id: { type: string }
        date: { type: string }
        narrative: { type: string }
        saved_yesterday_count: { type: integer, format: int64 }
        worth_revisiting_count: { type: integer, format: int64 }
        total_articles: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    StoredDigestSummaryList:
      type: object
      required: [digests, total_size]
      properties:
        digests:
          type: array
          items: { $ref: "#/components/schemas/StoredDigestSummary" }
        total_size: { type: integer, format: int64 }
        next_page_token: { type: string, nullable: true }

    StoredDigest:
      type: object
      required:
        [
          id,
          date,
          narrative,
          saved_yesterday,
          saved_yesterday_count,
          unread_count,
          read_count,
          archived_count,
          starred_count,
          worth_revisiting,
          worth_revisiting_count,
          top_tags,
          total_articles,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        date: { type: string }
        narrative: { type: string }
        saved_yesterday:
          type: array
          items: { $ref: "#/components/schemas/Article" }
        saved_yesterday_count: { type: integer, format: int64 }
        unread_count: { type: integer, format: int64 }
        read_count: { type: integer, format: int64 }
        archived_count: { type: integer, format: int64 }
        starred_count: { type: integer, format: int64 }
        worth_revisiting:
          type: array
          items: { $ref: "#/components/schemas/Article" }
        worth_revisiting_count: { type: integer, format: int64 }
        top_tags:
          type: array
          items: { $ref: "#/components/schemas/TagCount" }
        total_articles: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
