paths:
  /api/recally/articles:
    get:
      tags: [articles]
      summary: List or search articles
      operationId: listArticles
      x-agent-tool: { tool: "recally", action: "list_articles" }
      parameters:
        - {
            name: q,
            in: query,
            description: "Free-text search across title, summary, tags, author",
            schema: { type: string },
          }
        - {
            name: status,
            in: query,
            schema: {
              $ref: "../../components.yaml#/components/schemas/ArticleStatus",
            },
          }
        - {
            name: source_type,
            in: query,
            schema: {
              $ref: "../../components.yaml#/components/schemas/SourceType",
            },
          }
        - { name: starred, in: query, schema: { type: boolean } }
        - {
            name: canonical_url,
            in: query,
            description: "Lookup by exact canonical URL",
            schema: { type: string },
          }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ArticleList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [articles]
      summary: Save an article (upsert by canonical URL)
      operationId: saveArticle
      x-agent-tool: { tool: "recally", action: "save", batch: "articles" }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SaveArticleRequest",
            }
      responses:
        "200":
          description: existing article was updated (canonical URL already present)
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Article",
              }
        "201":
          description: new article was created
          headers:
            Location: {
              schema: { type: string },
              description: "Path to the new article resource",
            }
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Article",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/recally/articles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [articles]
      summary: Get an article
      operationId: getArticle
      x-agent-tool: {
        tool: "recally",
        action: "get_article",
        fixed: { include: "content" },
      }
      parameters:
        - {
            name: include,
            in: query,
            description: "Comma-separated extras (only `content` supported)",
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Article",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [articles]
      summary: Update article fields (partial)
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateArticleRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Article",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [articles]
      summary: Delete an article (DB row + markdown file)
      operationId: deleteArticle
      responses:
        "204": { description: deleted }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/recally/feeds:
    get:
      tags: [feeds]
      summary: List subscribed feeds
      operationId: listFeeds
      x-agent-tool: { tool: "recally", action: "feed_list" }
      parameters:
        - {
            name: url,
            in: query,
            description: "Lookup by exact feed URL",
            schema: { type: string, format: uri },
          }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeedList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [feeds]
      summary: Subscribe to a new feed (server fetches metadata)
      operationId: createFeed
      x-agent-tool: { tool: "recally", action: "feed_add" }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateFeedRequest",
            }
      responses:
        "201":
          description: created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/Feed" }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "409":
          description: already subscribed
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/recally/feeds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [feeds]
      summary: Get a feed
      operationId: getFeed
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/Feed" }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [feeds]
      summary: Update feed fields (partial)
      operationId: updateFeed
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateFeedRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/Feed" }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [feeds]
      summary: Unsubscribe from a feed (cascade deletes entries)
      operationId: deleteFeed
      x-agent-tool: { tool: "recally", action: "feed_remove" }
      responses:
        "204": { description: deleted }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/recally/feeds/{id}/poll:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [feeds]
      summary: Poll a feed (server fetches RSS, creates pending entries)
      operationId: pollFeed
      x-agent-tool: { tool: "recally", action: "feed_poll", optional: [id] }
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeedPollResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/recally/feeds/{feedId}/entries:
    parameters:
      - { name: feedId, in: path, required: true, schema: { type: string } }
    get:
      tags: [feed-entries]
      summary: List entries for a feed
      operationId: listFeedEntries
      x-agent-tool: {
        tool: "recally",
        action: "entry_list",
        restrict: { status: [pending] },
      }
      parameters:
        - {
            name: status,
            in: query,
            description: "Filter by entry status. Currently only 'pending' is supported; other values return 400. Pending results include retryable error entries (attempts < 3).",
            schema: {
              $ref: "../../components.yaml#/components/schemas/FeedEntryStatus",
            },
          }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeedEntryList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [feed-entries]
      summary: Add an entry by guid (source-agnostic; dedups via ON CONFLICT)
      description: "Skill-driven extraction pushes discovered items here. Idempotent on (feed_id, guid): a returned created=false means the item already existed."
      operationId: createFeedEntry
      x-agent-tool: { tool: "recally", action: "entry_add" }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateFeedEntryRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CreateFeedEntryResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/recally/feeds/{feedId}/entries/{id}:
    parameters:
      - { name: feedId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [feed-entries]
      summary: Update an entry (status transition)
      operationId: updateFeedEntry
      x-agent-tool: { tool: "recally", action: "entry_update" }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateFeedEntryRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeedEntry",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/recally/digests/today:
    get:
      tags: [digest]
      summary: Get the current user's reading digest for today
      operationId: getDigest
      x-agent-tool: { tool: "recally", action: "digest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Digest",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/recally/digests:
    get:
      tags: [digest]
      summary: List stored digests (most recent first)
      operationId: listStoredDigests
      parameters:
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - {
            name: page_token,
            in: query,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/StoredDigestSummaryList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [digest]
      summary: Save a digest snapshot with narrative
      operationId: saveDigest
      x-agent-tool: { tool: "recally", action: "digest_save" }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SaveDigestRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/StoredDigest",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/recally/digests/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string } }
    get:
      tags: [digest]
      summary: Get a stored digest by date (YYYY-MM-DD)
      operationId: getStoredDigest
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/StoredDigest",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
