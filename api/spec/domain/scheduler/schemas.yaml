openapi: 3.0.3
info:
  title: Scheduler Components
  version: "1"
paths: {}
components:
  schemas:
    Job:
      type: object
      required: [id, name, message, session_mode, enabled]
      properties:
        id: { type: string }
        owner_kind: {
          type: string,
          description: "Ownership class: 'user' or 'plugin'",
        }
        plugin_id: { type: string }
        job_key: { type: string }
        runtime_name: { type: string }
        template_key: {
          type: string,
          description: "Read-only. When set, this job is a subscription instance for the named template.",
        }
        name: { type: string }
        description: { type: string }
        cron: {
          type: string,
          description: "Cron expression (mutually exclusive with every/at)",
        }
        every: {
          type: string,
          description: "Go duration string, e.g. '30m' (mutually exclusive with cron/at)",
        }
        at: {
          type: string,
          description: "RFC3339 one-time timestamp (mutually exclusive with cron/every)",
        }
        message: {
          type: string,
          description: "Prompt/instruction to run on schedule; empty for workflow jobs",
        }
        dispatch_kind:
          type: string
          enum: [chat, workflow]
          description: "Dispatch target. Defaults to chat. Workflow jobs instantiate workflow_id from payload."
        payload:
          type: object
          additionalProperties: {}
          description: "Structured dispatch payload. Workflow jobs carry workflow_id, inputs, and allow_replan."
        session_mode: {
          type: string,
          description: "Session behaviour: 'reuse' or 'new'",
        }
        enabled: { type: boolean }
        agent_id: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }

    JobList:
      type: object
      required: [jobs]
      properties:
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }

    JobInput:
      type: object
      description: "Fields for creating or updating a job. For create: either template_key (subscription) or name+message with exactly one of cron/every/at are required."
      properties:
        template_key: {
          type: string,
          description: "Optional. When set, create a subscription instance for this template. name/message are filled from the template; schedule fields may override defaults.",
        }
        name: { type: string }
        description: { type: string }
        cron: { type: string }
        every: { type: string }
        at: { type: string }
        message: { type: string }
        dispatch_kind:
          type: string
          enum: [chat, workflow]
        workflow_id:
          type: string
          description: "Exact workflow version row to instantiate when dispatch_kind is workflow."
        inputs:
          type: object
          additionalProperties:
            type: string
          description: "Workflow input values."
        allow_replan:
          type: boolean
          description: "Allow scheduling a partially frozen workflow."
        session_mode: { type: string }
        enabled: { type: boolean }
        agent_id: { type: string }
        user_id: {
          type: string,
          description: "Admin-only: set empty for system jobs",
        }
        idempotency_key: {
          type: string,
          description: "Optional key; repeated creates by the same user with the same key return the existing job.",
        }

    JobRun:
      type: object
      required: [id, job_id, session_id, status, started_at]
      properties:
        id: { type: string }
        job_id: { type: string }
        session_id: { type: string }
        session_agent_id:
          type: string
          description: Agent that owns the run's session; may differ from the URL agent for system jobs.
        user_id: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
        root_goal_id:
          type: string
          description: Root goal created by a workflow dispatch.
        output:
          type: string
          description: Final assistant text produced by the run (truncated to 4000 chars).
        duration: { type: string }

    JobRunList:
      type: object
      required: [runs]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/JobRun" } }
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.

    TriggerJobResult:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string }

    DeleteResult:
      type: object
      required: [status]
      properties:
        status: { type: string }

    JobTemplate:
      type: object
      required: [key, name, description, default_schedule, session_mode]
      properties:
        key: {
          type: string,
          description: "Stable identifier used as job_key on subscription rows.",
        }
        name: { type: string }
        description: { type: string }
        default_schedule: {
          type: string,
          description: "Default schedule expression (cron or every duration).",
        }
        session_mode: {
          type: string,
          description: "Default session behaviour: 'reuse' or 'new'.",
        }
        subscribed_job_id: {
          type: string,
          nullable: true,
          description: "ID of the current user's active subscription instance, or null if not subscribed.",
        }
        subscribed_agent_id: {
          type: string,
          nullable: true,
          description: "Agent that owns the current user's subscription job; set when subscribed_job_id is set.",
        }

    JobTemplateList:
      type: object
      required: [job_templates]
      properties:
        job_templates:
          type: array
          items: { $ref: "#/components/schemas/JobTemplate" }
