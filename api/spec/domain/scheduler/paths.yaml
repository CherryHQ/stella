paths:
  /api/scheduler/job-templates:
    get:
      tags: [jobs]
      summary: List available job templates with subscription status for the current user
      operationId: listJobTemplates
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/JobTemplateList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/agents/{agentId}/scheduler/jobs:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      summary: List scheduler jobs
      operationId: listSchedulerJobs
      x-agent-tool: { tool: "scheduler", resource: "job", action: "list" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/JobList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [jobs]
      summary: Create a scheduler job
      operationId: createSchedulerJob
      x-agent-tool: { tool: "scheduler", resource: "job", action: "create" }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/JobInput",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/Job" }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{agentId}/scheduler/jobs/{jobId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      summary: Get a scheduler job
      operationId: getSchedulerJob
      x-agent-tool: { tool: "scheduler", resource: "job", action: "get" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/Job" }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [jobs]
      summary: Update a scheduler job (partial — missing fields are merged from existing)
      operationId: updateSchedulerJob
      x-agent-tool:
        - { tool: "scheduler", resource: "job", action: "update" }
        # body: false keeps pause/resume to the job id: the one body field they
        # set is fixed, and the rest belong to update.
        - {
            tool: "scheduler",
            resource: "job",
            action: "pause",
            fixed: { enabled: false },
            body: false,
          }
        - {
            tool: "scheduler",
            resource: "job",
            action: "resume",
            fixed: { enabled: true },
            body: false,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/JobInput",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/Job" }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [jobs]
      summary: Delete a scheduler job
      operationId: deleteSchedulerJob
      x-agent-tool: { tool: "scheduler", resource: "job", action: "delete" }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/scheduler/jobs/{jobId}/run:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: jobId, in: path, required: true, schema: { type: string } }
    post:
      tags: [jobs]
      summary: Trigger a scheduler job immediately
      operationId: triggerSchedulerJob
      responses:
        "202":
          description: triggered
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/TriggerJobResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/agents/{agentId}/scheduler/jobs/{jobId}/runs:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      summary: List scheduler job runs
      operationId: listSchedulerJobRuns
      parameters:
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/JobRunList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
