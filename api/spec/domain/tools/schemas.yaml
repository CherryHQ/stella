openapi: 3.0.3
info:
  title: Tools Components
  version: "1"
paths: {}
components:
  schemas:
    Tool:
      type: object
      required: [name, description, category]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema:
          type: object
          additionalProperties: true
        category: { type: string }

    ToolList:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: "#/components/schemas/Tool" }
        next_page_token: { type: string, nullable: true }
