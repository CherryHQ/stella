openapi: 3.0.3
info:
  title: Agents Components
  version: "1"
paths: {}
components:
  schemas:
    SandboxNetworkConfig:
      type: object
      properties:
        mode: { type: string }
        allowlist: { type: array, items: { type: string } }

    SandboxConfig:
      type: object
      properties:
        network: { $ref: "#/components/schemas/SandboxNetworkConfig" }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        model_strong: { type: string }
        model_fast: { type: string }
        system_prompt: { type: string }
        soul: { type: string }
        workspace: { type: string }
        sandbox: { $ref: "#/components/schemas/SandboxConfig" }
        scope: { type: string }
        creator_id: { type: string }
        enabled: { type: boolean }

    AgentList:
      type: object
      required: [agents]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }

    CreateAgentRequest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        model_strong: { type: string }
        model_fast: { type: string }
        system_prompt: { type: string }
        soul: { type: string }
        workspace: { type: string }
        sandbox: { $ref: "#/components/schemas/SandboxConfig" }
        scope: { type: string }
        creator_id: { type: string }
        enabled: { type: boolean }
        template_id: { type: string }

    AgentUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }

    AgentUserList:
      type: object
      required: [users]
      properties:
        users: {
          type: array,
          items: { $ref: "#/components/schemas/AgentUser" },
        }

    AssignAgentUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }

    Skill:
      type: object
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [project, user, agent, system]
        user_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        disable_model_invocation: { type: boolean }
        files: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillList:
      type: object
      required: [skills]
      properties:
        skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }

    CreateSkillRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope:
          type: string
          enum: [user, agent]
        description: { type: string }
        status: { type: string }
        disable_model_invocation: { type: boolean }
        files:
          type: object
          additionalProperties: { type: string }

    UpdateSkillRequest:
      type: object
      properties:
        description: { type: string, nullable: true }
        status: { type: string, nullable: true }
        disable_model_invocation: { type: boolean, nullable: true }
        files:
          type: object
          additionalProperties: { type: string }

    InstallSkillRequest:
      type: object
      required: [source]
      properties:
        source: { type: string }
        scope:
          type: string
          enum: [user, agent]

    SkillFileResponse:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
