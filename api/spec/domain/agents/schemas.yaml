openapi: 3.0.3
info:
  title: Agents Components
  version: "1"
paths: {}
components:
  schemas:
    SandboxNetworkConfig:
      type: object
      properties:
        mode: { type: string }
        allowlist: { type: array, items: { type: string } }

    SandboxConfig:
      type: object
      properties:
        network: { $ref: "#/components/schemas/SandboxNetworkConfig" }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        model_thinking: { type: string }
        model_strong: { type: string }
        model_strong_thinking: { type: string }
        model_fast: { type: string }
        model_fast_thinking: { type: string }
        system_prompt: { type: string }
        soul: { type: string }
        workspace: { type: string }
        sandbox: { $ref: "#/components/schemas/SandboxConfig" }
        scope: { type: string }
        creator_id: { type: string }
        enabled: { type: boolean }
        last_active: { type: string, format: date-time, nullable: true }

    AgentList:
      type: object
      required: [agents]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }

    CreateAgentRequest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        model_thinking: { type: string }
        model_strong: { type: string }
        model_strong_thinking: { type: string }
        model_fast: { type: string }
        model_fast_thinking: { type: string }
        system_prompt: { type: string }
        soul: { type: string }
        workspace: { type: string }
        sandbox: { $ref: "#/components/schemas/SandboxConfig" }
        scope: { type: string }
        creator_id: { type: string }
        enabled: { type: boolean }
        template_id: { type: string }

    AgentUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }

    AgentUserList:
      type: object
      required: [users]
      properties:
        users: {
          type: array,
          items: { $ref: "#/components/schemas/AgentUser" },
        }

    AssignAgentUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }

    AgentTool:
      type: object
      required: [name, description, source, enabled, origin]
      properties:
        name: { type: string }
        description: { type: string }
        source: { type: string }
        enabled: { type: boolean }
        origin: { type: string }
        input_schema:
          type: object
          additionalProperties: true
          description: >-
            JSON Schema for the tool's arguments. Present for core and builtin
            tools; omitted for plugin and MCP tools whose schema is not resolved
            by this endpoint.

    AgentToolList:
      type: object
      required: [tools]
      properties:
        tools: {
          type: array,
          items: { $ref: "#/components/schemas/AgentTool" },
        }

    UpdateAgentToolRequest:
      type: object
      properties:
        enabled: { type: boolean }
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
          default: user_agent

    Skill:
      type: object
      required: [lifecycle_version, created_by]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [project, user, user_agent, system, system_agent]
        user_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        disable_model_invocation: { type: boolean }
        files: { type: array, items: { type: string } }
        source: { type: string }
        version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        lifecycle_version: { type: integer, format: int64 }
        created_by: { type: string, enum: [manual, reflect] }

    SkillScopeCounts:
      type: object
      required: [all, system, agent, user, project]
      properties:
        all: { type: integer }
        system: { type: integer }
        agent: { type: integer }
        user: { type: integer }
        project: { type: integer }

    SkillList:
      type: object
      required: [skills, total_size, scope_counts]
      properties:
        skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }
        total_size: { type: integer }
        scope_counts: { $ref: "#/components/schemas/SkillScopeCounts" }
        next_page_token: { type: string, nullable: true }

    CreateSkillRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system_agent]
        description: { type: string }
        status: { type: string }
        disable_model_invocation: { type: boolean }
        files:
          type: object
          additionalProperties: { type: string }

    UpdateSkillRequest:
      type: object
      properties:
        description: { type: string, nullable: true }
        status: { type: string, nullable: true }
        disable_model_invocation: { type: boolean, nullable: true }
        # Overwrites only the "version" key in the skill's metadata; source and
        # install timestamps are preserved by a read-modify-write on the server.
        version: { type: string, nullable: true }
        convert_to_manual: { type: boolean }
        files:
          type: object
          additionalProperties: { type: string }

    InstallSkillRequest:
      type: object
      required: [source]
      properties:
        source: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system_agent]

    SkillFileResponse:
      type: object
      properties:
        path: { type: string }
        content: { type: string }

    SkillUpgradeResult:
      type: object
      properties:
        updated: { type: boolean }
        version: { type: string }
        previous_version: { type: string }
