paths:
  /api/agents:
    get:
      tags: [agents]
      summary: List agents (any authenticated user; non-admin sees accessible only)
      operationId: listAgents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [agents]
      summary: Create an agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateAgentRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Get an agent
      operationId: getAgent
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [agents]
      summary: Update an agent
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../components.yaml#/components/schemas/Agent" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete an agent
      operationId: deleteAgent
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/users:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List users assigned to an agent (admin only)
      operationId: listAgentUsers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentUserList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [agents]
      summary: Assign a user to an agent (admin only)
      operationId: assignAgentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AssignAgentUserRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentUser",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/users/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string },
        }
    delete:
      tags: [agents]
      summary: Remove a user from an agent (admin only)
      operationId: removeAgentUser
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List skills visible to the current user in an agent context
      operationId: listAgentSkills
      parameters:
        - {
            name: session_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/{scope}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: scope,
          in: path,
          required: true,
          schema: { type: string, enum: [agent, user] },
        }
    post:
      tags: [agents]
      summary: Create a skill in an agent or current-user scope
      operationId: createAgentScopedSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateSkillRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillUploadResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{scope}/install:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: scope,
          in: path,
          required: true,
          schema: { type: string, enum: [agent, user] },
        }
    post:
      tags: [agents]
      summary: Install a skill in an agent or current-user scope
      operationId: installAgentScopedSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/InstallSkillRequest",
            }
      responses:
        "201":
          description: installed
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillUploadResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{scope}/upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: scope,
          in: path,
          required: true,
          schema: { type: string, enum: [agent, user] },
        }
    post:
      tags: [agents]
      summary: Upload a skill zip in an agent or current-user scope
      operationId: uploadAgentScopedSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillUploadResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{scope}/{skillId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: scope,
          in: path,
          required: true,
          schema: { type: string, enum: [system, agent, user, project] },
        }
      - { name: skillId, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Get a skill in an agent context
      operationId: getAgentScopedSkill
      parameters:
        - {
            name: session_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [agents]
      summary: Update a skill in an agent or current-user scope
      operationId: updateAgentScopedSkill
      parameters:
        - {
            name: session_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateSkillRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete a skill in an agent or current-user scope
      operationId: deleteAgentScopedSkill
      parameters:
        - {
            name: session_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{scope}/{skillId}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: scope,
          in: path,
          required: true,
          schema: { type: string, enum: [system, agent, user, project] },
        }
      - { name: skillId, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Get a skill file in an agent context
      operationId: getAgentScopedSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - {
            name: session_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillFileResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete a skill file in an agent or current-user scope
      operationId: deleteAgentScopedSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - {
            name: session_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
