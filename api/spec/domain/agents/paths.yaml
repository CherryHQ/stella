paths:
  /api/agents:
    get:
      tags: [agents]
      summary: List the caller's own agents
      description: >-
        The agents the caller can use, plus the ones they created whatever state
        those are in. An admin gets the same personal fleet by default; set
        include_all to ask for the deployment-wide view instead.
      operationId: listAgents
      x-agent-tool:
        tool: "agent"
        action: "list"
        omit: [include_all]
        add:
          limit:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
            description: Maximum agents to return; results say when more exist.
      parameters:
        - name: include_all
          in: query
          required: false
          description: >-
            Return every agent in the deployment, disabled ones included.
            Ignored for a non-admin caller.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [agents]
      summary: Create an agent
      operationId: createAgent
      x-agent-tool: {
        tool: "agent",
        action: "create",
        omit: [
          workspace,
          sandbox,
          creator_id,
          provider_credentials,
          template_id,
        ],
        require: [name],
      }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateAgentRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Get an agent
      operationId: getAgent
      x-agent-tool: { tool: "agent", action: "get" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [agents]
      summary: Update an agent
      operationId: updateAgent
      x-agent-tool: {
        tool: "agent",
        action: "update",
        omit: [workspace, sandbox, creator_id, can_manage, last_active],
        add: {
          expected_version: {
            type: string,
            description: Opaque version returned by agent_get.,
          },
        },
        require: [expected_version],
      }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../components.yaml#/components/schemas/Agent" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete an agent
      operationId: deleteAgent
      x-agent-tool: {
        tool: "agent",
        action: "delete",
        add: {
          expected_version: {
            type: string,
            description: Opaque version returned by agent_get.,
          },
        },
        require: [expected_version],
      }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/agents/{id}/users:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List users assigned to an agent (admin only)
      operationId: listAgentUsers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentUserList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [agents]
      summary: Assign a user to an agent (admin only)
      operationId: assignAgentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AssignAgentUserRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentUser",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/users/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string },
        }
    delete:
      tags: [agents]
      summary: Remove a user from an agent (admin only)
      operationId: removeAgentUser
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/provider-credentials:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List write-only Provider credential metadata for an agent
      operationId: listAgentProviderCredentials
      parameters:
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500 },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/AgentProviderCredentialList"
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/agents/{id}/provider-credentials/{providerId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: providerId,
          in: path,
          required: true,
          schema: { type: string, minLength: 1, maxLength: 255 },
        }
    get:
      tags: [agents]
      summary: Get Provider credential metadata for an agent
      operationId: getAgentProviderCredential
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/AgentProviderCredential"
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [agents]
      summary: Set or rotate an agent Provider API key override
      operationId: updateAgentProviderCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../components.yaml#/components/schemas/UpdateAgentProviderCredentialRequest"
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/AgentProviderCredential"
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [agents]
      summary: Delete an agent Provider API key override
      operationId: deleteAgentProviderCredential
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/agents/{id}/tools:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List profile tool controls and Stella policy catalog
      operationId: listAgentTools
      x-agent-tool: {
        tool: "agent_tool",
        action: "list",
        rename: { id: target_agent_id },
      }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentToolList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/tools/{toolName}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: toolName, in: path, required: true, schema: { type: string } }
    patch:
      tags: [agents]
      summary: Update a runnable tool override
      operationId: updateAgentTool
      x-agent-tool:
        - {
            tool: "agent_tool",
            action: "update",
            rename: { id: target_agent_id, toolName: tool_name },
            omit: [scope],
            add: {
              expected_version: {
                type: string,
                description: Opaque version returned by agent_tool_list.,
              },
            },
            require: [enabled, expected_version],
          }
        - {
            tool: "agent_tool",
            action: "delete",
            rename: { id: target_agent_id, toolName: tool_name },
            omit: [enabled, scope],
            add: {
              expected_version: {
                type: string,
                description: Opaque version returned by agent_tool_list.,
              },
            },
            require: [expected_version],
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateAgentToolRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTool",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  # ── Agent skills ──────────────────────────────────────────────────────────
  /api/agents/{id}/skills:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [skills]
      summary: List skills visible to the current user in an agent context
      operationId: listAgentSkills
      parameters:
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent, builtin],
          }
        - name: scope_group
          in: query
          required: false
          schema: { type: string, enum: [system, agent, user, project] }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [skills]
      summary: Create a skill in an agent or current-user scope
      operationId: createAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateSkillRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/install:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [skills]
      summary: Install a skill from a remote source
      operationId: installAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/InstallSkillRequest",
            }
      responses:
        "201":
          description: installed
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [skills]
      summary: Upload a skill zip
      operationId: uploadAgentSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, scope]
              properties:
                file:
                  type: string
                  format: binary
                scope:
                  type: string
                  enum: [user, user_agent, system_agent]
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/{skillId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: skillId,
          in: path,
          required: true,
          schema: { type: string },
          description: "Stable database ID or active skill name",
        }
    get:
      tags: [skills]
      summary: Get a skill by name (optionally scoped)
      operationId: getAgentSkill
      parameters:
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent, builtin],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [skills]
      summary: Update a skill
      operationId: updateAgentSkill
      parameters:
        - name: scope
          in: query
          required: true
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateSkillRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
    delete:
      tags: [skills]
      summary: Delete a skill
      operationId: deleteAgentSkill
      parameters:
        - name: scope
          in: query
          required: true
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
        - name: expected_digest
          in: query
          required: false
          description: Required when deleting a Home-backed Skill; omitted for project Skills.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{skillId}/upgrade:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: skillId,
          in: path,
          required: true,
          schema: { type: string },
          description: "Skill name",
        }
    post:
      tags: [skills]
      summary: Re-fetch a skill from its install source and update it if newer
      operationId: upgradeAgentSkill
      parameters:
        # Plain string, not the shared scope enum: an extra identical inline enum
        # perturbs oapi-codegen's enum-name deduping and flips unrelated generated
        # constants (e.g. vault scope) between prefixed/bare, breaking the CLI build.
        # The scope is validated server-side by resolveSkill regardless.
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - name: expected_digest
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillUpgradeResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{skillId}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: skillId,
          in: path,
          required: true,
          schema: { type: string },
          description: "Skill name",
        }
    get:
      tags: [skills]
      summary: Get a skill file by path
      operationId: getAgentSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent, builtin],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillFileResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

    delete:
      tags: [skills]
      summary: Delete a skill file
      operationId: deleteAgentSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - name: scope
          in: query
          required: true
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
        - name: expected_digest
          in: query
          required: false
          description: Required when deleting from a Home-backed Skill; omitted for project Skills.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{skillRef}/activation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: skillRef,
          in: path,
          required: true,
          schema: { type: string },
          description: Exact logical AgentSkillPolicy ref.,
        }
    patch:
      tags: [skills]
      summary: Enable or disable one policy-addressable Agent Skill
      operationId: updateAgentSkillActivation
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateAgentSkillActivationRequest",
            }
      responses:
        "200":
          description: committed activation
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentSkillActivation",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
