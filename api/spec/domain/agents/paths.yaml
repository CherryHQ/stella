paths:
  /api/agents:
    get:
      tags: [agents]
      summary: List agents visible to the current user
      operationId: listAgents
      parameters:
        - {
            name: include_all,
            in: query,
            required: false,
            schema: { type: boolean, default: false },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [agents]
      summary: Create an agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateAgentRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Get an agent
      operationId: getAgent
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [agents]
      summary: Update an agent
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../components.yaml#/components/schemas/Agent" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete an agent
      operationId: deleteAgent
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/users:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List users assigned to an agent (admin only)
      operationId: listAgentUsers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentUserList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [agents]
      summary: Assign a user to an agent (admin only)
      operationId: assignAgentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AssignAgentUserRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentUser",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/users/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string },
        }
    delete:
      tags: [agents]
      summary: Remove a user from an agent (admin only)
      operationId: removeAgentUser
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/tools:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List tools visible to an agent
      operationId: listAgentTools
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentToolList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/tools/{toolName}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: toolName, in: path, required: true, schema: { type: string } }
    patch:
      tags: [agents]
      summary: Update a user-agent tool override
      operationId: updateAgentTool
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateAgentToolRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTool",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  # ── Agent skills ──────────────────────────────────────────────────────────
  /api/agents/{id}/skills:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [skills]
      summary: List skills visible to the current user in an agent context
      operationId: listAgentSkills
      parameters:
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: scope_group
          in: query
          required: false
          schema: { type: string, enum: [system, agent, user, project] }
        - name: created_by
          in: query
          required: false
          schema: { type: string, enum: [manual, reflect] }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [skills]
      summary: Create a skill in an agent or current-user scope
      operationId: createAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateSkillRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/install:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [skills]
      summary: Install a skill from a remote source
      operationId: installAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/InstallSkillRequest",
            }
      responses:
        "201":
          description: installed
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [skills]
      summary: Upload a skill zip
      operationId: uploadAgentSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                scope:
                  type: string
                  enum: [user, user_agent, system_agent]
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/{skillId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: skillId,
          in: path,
          required: true,
          schema: { type: string },
          description: "Stable database ID or active skill name",
        }
    get:
      tags: [skills]
      summary: Get a skill by name (optionally scoped)
      operationId: getAgentSkill
      parameters:
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [skills]
      summary: Update a skill
      operationId: updateAgentSkill
      parameters:
        - name: scope
          in: query
          required: true
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateSkillRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
    delete:
      tags: [skills]
      summary: Delete a skill
      operationId: deleteAgentSkill
      parameters:
        - name: scope
          in: query
          required: true
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{skillId}/upgrade:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: skillId,
          in: path,
          required: true,
          schema: { type: string },
          description: "Skill name",
        }
    post:
      tags: [skills]
      summary: Re-fetch a skill from its install source and update it if newer
      operationId: upgradeAgentSkill
      parameters:
        # Plain string, not the shared scope enum: an extra identical inline enum
        # perturbs oapi-codegen's enum-name deduping and flips unrelated generated
        # constants (e.g. vault scope) between prefixed/bare, breaking the CLI build.
        # The scope is validated server-side by resolveSkill regardless.
        - name: scope
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillUpgradeResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{skillId}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: skillId,
          in: path,
          required: true,
          schema: { type: string },
          description: "Skill name",
        }
    get:
      tags: [skills]
      summary: Get a skill file by path
      operationId: getAgentSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillFileResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [skills]
      summary: Delete a skill file
      operationId: deleteAgentSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - name: scope
          in: query
          required: true
          schema: {
            type: string,
            enum: [project, user, user_agent, system, system_agent],
          }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
