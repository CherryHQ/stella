paths:
  /api/agents:
    get:
      tags: [agents]
      summary: List agents (any authenticated user; non-admin sees accessible only)
      operationId: listAgents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [agents]
      summary: Create an agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateAgentRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Get an agent
      operationId: getAgent
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    put:
      tags: [agents]
      summary: Update an agent
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../components.yaml#/components/schemas/Agent" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Agent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete an agent
      operationId: deleteAgent
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DeleteResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/users:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List users assigned to an agent (admin only)
      operationId: listAgentUsers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentUserList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [agents]
      summary: Assign a user to an agent (admin only)
      operationId: assignAgentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AssignAgentUserRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DeleteResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/users/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: integer, format: int64 },
        }
    delete:
      tags: [agents]
      summary: Remove a user from an agent (admin only)
      operationId: removeAgentUser
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DeleteResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: List skills for an agent (creator or admin)
      operationId: listAgentSkills
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/install:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      summary: Install a skill to an agent from a remote source (admin only)
      operationId: installAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/InstallSkillRequest",
            }
      responses:
        "201":
          description: installed
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillUploadResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      summary: Upload a skill zip to an agent (admin only)
      operationId: uploadAgentSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillUploadResult",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/agents/{id}/skills/from-builtin/{skillId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: skillId, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      summary: Duplicate a builtin skill to an agent (admin only)
      operationId: duplicateBuiltinSkillToAgent
      responses:
        "201":
          description: duplicated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DuplicateSkillResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{skillId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: skillId, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Get an agent skill (creator or admin)
      operationId: getAgentSkill
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    put:
      tags: [agents]
      summary: Update an agent skill (creator or admin)
      operationId: updateAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateSkillRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete an agent skill (creator or admin)
      operationId: deleteAgentSkill
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DeleteResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{id}/skills/{skillId}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: skillId, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Download a skill file (creator or admin)
      operationId: getAgentSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Delete a skill file (creator or admin)
      operationId: deleteAgentSkillFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DeleteResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
