openapi: 3.0.3
info:
  title: ClawHub Components
  version: "1"
paths: {}
components:
  schemas:
    ClawhubSkill:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        version: { type: string }
        downloads: { type: integer }
        installs: { type: integer }
        updated_at: { type: string, format: date-time }
        author_handle: { type: string }
        author_image: { type: string }

    ClawhubSkillList:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/ClawhubSkill" }
        next_page_token:
          type: string
          nullable: true
