paths:
  /api/models:
    get:
      tags: [models]
      summary: List enabled models from provider config and cache
      operationId: listModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {
                  $ref: "../../components.yaml#/components/schemas/CachedModel",
                }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
