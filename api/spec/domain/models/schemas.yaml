openapi: 3.0.3
info:
  title: Models Components
  version: "1"
paths: {}
components:
  schemas:
    CachedModel:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        provider_name: { type: string }
        model: { type: string }

    CachedModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/CachedModel" }
        next_page_token: { type: string, nullable: true }
