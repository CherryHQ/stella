paths:
  /api/users/{id}/default-agent:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: Canonical user ID,
          or `me` for the current user.,
        }
    patch:
      tags: [users]
      summary: Update the default agent for a user (admin or current user)
      operationId: updateUserDefaultAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateDefaultAgentRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUser",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users/{id}/notify-identity:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: Canonical user ID,
          or `me` for the current user.,
        }
    patch:
      tags: [users]
      summary: Update the notify identity for a user (admin or current user)
      operationId: updateUserNotifyIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateNotifyIdentityRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUser",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users/{id}/memories:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: Canonical user ID,
          or `me` for the current user.,
        }
    get:
      tags: [users]
      summary: List memories for a user (admin or current user)
      operationId: listUserMemories
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/UserMemoryList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users/{id}/memories/{agentId}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: Canonical user ID,
          or `me` for the current user.,
        }
      - { name: agentId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [users]
      summary: Set memory for a user and agent (admin or current user)
      operationId: setUserMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SetMemoryRequest",
            }
      responses:
        "200":
          description: saved
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/UserMemory",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Delete memory for a user and agent (admin or current user)
      operationId: deleteUserMemory
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users:
    get:
      tags: [users]
      summary: List users (admin only)
      operationId: listAuthUsers
      parameters:
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUserList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/users/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
        }
    get:
      tags: [users]
      summary: Get a user by ID (admin or current user)
      operationId: getAuthUser
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUser",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users/{id}/role:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
        }
    patch:
      tags: [users]
      summary: Update the role of a user (admin only)
      operationId: updateAuthUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateRoleRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUser",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/users/{id}/agents:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
        }
    get:
      tags: [users]
      summary: List agents assigned to a user (admin only)
      operationId: listAuthUserAgents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUserAgentList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    patch:
      tags: [users]
      summary: Update agents assigned to a user (admin only)
      operationId: updateAuthUserAgents
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateAgentsRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUserAgentList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/users/{id}/identities/login:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [users]
      summary: List OIDC login identities for a user (admin only)
      operationId: listAuthUserLoginIdentities
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/LoginIdentityList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [users]
      summary: Link an OIDC login identity to a user (admin only)
      operationId: linkAuthUserLoginIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/LinkLoginIdentityRequest",
            }
      responses:
        "200":
          description: linked
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/LoginIdentity",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/users/{id}/identities/channel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [users]
      summary: List channel identities for a user (admin only)
      operationId: listAuthUserChannelIdentities
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ChannelIdentityList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users/{id}/identities/{identityId}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
        }
      - {
          name: identityId,
          in: path,
          required: true,
          schema: { type: string },
        }
    delete:
      tags: [users]
      summary: Delete an identity linked to a user (admin only)
      operationId: deleteAuthUserIdentity
      responses:
        "204":
          description: deleted
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users/{id}/active:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
        }
    patch:
      tags: [users]
      summary: Update the active status of a user (admin only)
      operationId: updateAuthUserActive
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateActiveRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthUser",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
