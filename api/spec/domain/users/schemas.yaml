openapi: 3.0.3
info:
  title: Users Components
  version: "1"
paths: {}
components:
  schemas:
    Identity:
      type: object
      required: [id, user_id, platform, external_id, name, linked_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        platform: { type: string }
        external_id: { type: string }
        name: { type: string }
        linked_at: { type: string, format: date-time }

    AuthUser:
      type: object
      required: [
        id,
        username,
        role,
        is_active,
        identities,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string }
        is_active: { type: boolean }
        identities:
          type: array
          items: { $ref: "#/components/schemas/Identity" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuthUser" }

    UserMemory:
      type: object
      additionalProperties: {}

    UpdateDefaultAgentRequest:
      type: object
      required: [default_agent_id]
      properties:
        default_agent_id: { type: string }

    UpdateNotifyIdentityRequest:
      type: object
      properties:
        notify_identity_id:
          type: string
          nullable: true

    SetMemoryRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string }

    UpdateAgentsRequest:
      type: object
      required: [agent_ids]
      properties:
        agent_ids:
          type: array
          items: { type: string }

    UpdateActiveRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }

    LoginIdentity:
      type: object
      required: [
        id,
        user_id,
        provider,
        provider_subject,
        email,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        user_id: { type: string }
        provider: { type: string }
        provider_subject: { type: string }
        email: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChannelIdentity:
      type: object
      required: [
        id,
        user_id,
        platform,
        external_id,
        name,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        user_id: { type: string }
        platform: { type: string }
        external_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LinkLoginIdentityRequest:
      type: object
      required: [provider, provider_subject, email]
      properties:
        provider: { type: string }
        provider_subject: { type: string }
        email: { type: string }
        name: { type: string }
