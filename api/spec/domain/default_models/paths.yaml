paths:
  /api/default-models:
    get:
      tags: [default_models]
      summary: Get deployment default models (admin only)
      operationId: getDefaultModels
      x-agent-tool: { tool: "settings_default_model", action: "get" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DefaultModels",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    put:
      tags: [default_models]
      summary: Update deployment default models (admin only)
      operationId: updateDefaultModels
      x-agent-tool: {
        tool: "settings_default_model",
        action: "update",
        add: {
          expected_version: {
            type: string,
            description: Opaque version returned by settings_default_model_get.,
          },
        },
        require: [expected_version],
      }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/DefaultModelsUpdate",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/DefaultModels",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
