paths:
  /api/goals:
    get:
      tags: [goals]
      summary: List goals
      description: >-
        Lists root goals (goals) by default. `?parent={id}` lists a
        composite's direct children; `?root={id}` lists a whole tree.
      operationId: listGoals
      x-agent-tool: { tool: "goal", action: "list" }
      parameters:
        - name: agent_id
          in: query
          required: false
          description: Scope the root list to one managing agent.
          schema: { type: string }
        - name: terminal
          in: query
          required: false
          description: >-
            Split active vs history: false returns non-terminal roots, true
            returns terminal ones (lifecycle=done).
            Omit for both.
          schema: { type: boolean }
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on title/intent.
          schema: { type: string }
        - name: parent
          in: query
          required: false
          description: List the direct children of this composite instead of roots.
          schema: { type: string }
        - name: root
          in: query
          required: false
          description: List every goal in this tree (the root_id family).
          schema: { type: string }
        - name: lifecycle
          in: query
          required: false
          schema: { type: string }
        - name: project_id
          in: query
          required: false
          schema: { type: string }
        - name: workflow_id
          in: query
          required: false
          description: Return root goals instantiated from this workflow version.
          schema: { type: string }
        - name: archived
          in: query
          required: false
          description: When true returns only archived goals (the history/restore view).
          schema: { type: boolean }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/GoalList",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
    post:
      tags: [goals]
      summary: Create a goal (root goal)
      operationId: createGoal
      # kind and activate are dead in the tool: the handler always creates a
      # composite and never reads activate, so the model must not see them.
      x-agent-tool: { tool: "goal", action: "create", omit: [kind, activate] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CreateGoalRequest",
              }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/health:
    get:
      tags: [goals]
      summary: Get goal execution health metrics
      operationId: getGoalHealth
      parameters:
        - name: since
          in: query
          required: true
          description: Include goals created at or after this RFC3339 timestamp.
          schema: { type: string, format: date-time }
        - name: user_id
          in: query
          required: false
          description: Admin-only filter for one user; non-admin callers are scoped to themselves.
          schema: { type: string }
        - name: agent_id
          in: query
          required: false
          description: Filter to one managing agent.
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/GoalHealthReport",
                }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "403":
          { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/goals/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: Get a goal
      operationId: getGoal
      x-agent-tool: { tool: "goal", action: "get" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [goals]
      summary: Update a goal's metadata
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/UpdateGoalRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [goals]
      summary: Archive a goal
      description: Audit-safe delete; hides terminal/draft goals from default lists without removing history.
      operationId: deleteGoal
      responses:
        "204": { description: archived }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Activate a goal (plan gate; draft -> pending)
      operationId: activateGoal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Cancel a goal (cascades to the non-terminal subtree)
      operationId: cancelGoal
      x-agent-tool: { tool: "goal", action: "cancel" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CancelRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/abandon:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Abandon a budget-exhausted goal (human give-up)
      operationId: abandonGoal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/AbandonRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/reattempt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Reattempt a blocked goal (raise budget / resume)
      operationId: reattemptGoal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/unarchive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Restore an archived goal to default lists
      operationId: unarchiveGoal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/readiness:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: Get a goal's computed dispatchability view
      operationId: getGoalReadiness
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Readiness" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/goals/{id}/children:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: List a composite's direct children
      operationId: listGoalChildren
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/GoalList",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/goals/{id}/attempts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: List a goal's attempts (newest first)
      operationId: listAttempts
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/AttemptList",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/goals/{id}/attempts/{attemptId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: Get one attempt
      operationId: getAttempt
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Attempt" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/goals/{id}/acceptance-events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: List a goal's acceptance ledger (the audit trail, in fold order)
      operationId: listAcceptanceEvents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/AcceptanceEventList",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/goals/{id}/timeline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: List a goal's timeline events
      operationId: listGoalTimeline
      parameters:
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/GoalTimeline",
                }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [goals]
      summary: Append a human message to the goal timeline
      operationId: createGoalTimelineEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/GoalTimelineMessageRequest",
              }
      responses:
        "201":
          description: recorded
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/GoalTimelineEvent",
                }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/verdict:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Submit a human verdict against a contract item (re-folds acceptance)
      operationId: submitVerdict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/VerdictRequest",
              }
      responses:
        "201":
          description: recorded
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/AcceptanceEvent",
                }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/edges:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: List a goal's upstream dependency edges
      operationId: listEdges
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/EdgeList" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [goals]
      summary: Add an upstream dependency edge (cycle-checked)
      operationId: addEdge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/AddEdgeRequest",
              }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Edge" }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/edges/{upstreamId}/waive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: upstreamId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Waive a hard edge so downstream readiness can proceed
      operationId: waiveEdge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              { $ref: "../../components.yaml#/components/schemas/WaiveRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Edge" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/plan/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Approve a composite's proposed plan (blocked(needs_plan_approval))
      description: >
        Materializes the composite's proposed plan into child goals and resumes
        the tree. Valid only when the composite is blocked(needs_plan_approval).
      operationId: approvePlan
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}/plan/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Reject a composite's proposed plan (returns it to draft for re-planning)
      description: >
        Clears the proposed plan and returns the composite to draft so the
        dispatcher re-decomposes it. Valid only when the composite is
        blocked(needs_plan_approval) and not yet materialized.
      operationId: rejectPlan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/DecisionRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }
