paths:
  /api/goals:
    get:
      tags: [goals]
      summary: List goals
      operationId: listGoals
      parameters:
        - {
            name: agent_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - { name: status, in: query, required: false, schema: { type: string } }
        - {
            name: project_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - name: archived
          in: query
          required: false
          description: When true returns only archived goals (the history/restore view) instead of the default active set.
          schema: { type: boolean }
        - name: terminal
          in: query
          required: false
          description: When false returns only non-terminal (active) goals; when true only terminal (done/failed/cancelled) goals. Omit for any. Ignored when archived=true.
          schema: { type: boolean }
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against goal title and description.
          schema: { type: string }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/GoalList" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
    post:
      tags: [goals]
      summary: Create a goal
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CreateGoalRequest",
              }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }

  /api/goals/{goalId}:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: Get a goal
      operationId: getGoal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [goals]
      summary: Archive a goal
      description: Audit-safe delete; hides terminal/draft goals from default lists without removing history.
      operationId: deleteGoal
      responses:
        "204": { description: archived }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/unarchive:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Restore an archived goal (and its archived children) to default lists
      operationId: unarchiveGoal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/activate:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Activate a planned goal (planned → running, promotes draft children to ready; direct goals are already activated on create)
      operationId: activateGoal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/complete:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Mark a goal achieved
      operationId: completeGoal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CompleteGoalRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/cancel:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Cancel a goal (cascades to non-terminal children)
      operationId: cancelGoal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CancelGoalRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/tasks:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: List tasks owned by a goal
      operationId: listGoalTasks
      parameters:
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/TaskList" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/goals/{goalId}/reviews:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: List reviews for a goal
      operationId: listGoalReviews
      parameters:
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/ReviewList" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/goals/{goalId}/reviews/{reviewId}/approve:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Approve a goal review
      operationId: approveGoalReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/ReviewDecisionRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/reviews/{reviewId}/reject:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Reject a goal review
      operationId: rejectGoalReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/ReviewDecisionRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/reviews/{reviewId}/request-changes:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Request changes on a goal review (collapses to failed; documented gap)
      operationId: requestChangesGoalReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/ReviewDecisionRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/reviews/{reviewId}/escalate:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Escalate an agent goal review to human
      operationId: escalateGoalReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/EscalateReviewRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
      summary: Get a goal's plan
      operationId: getGoalPlan
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/GoalPlan" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    put:
      tags: [goals]
      summary: Create or replace a goal's pending plan edit
      operationId: putGoalPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/PutGoalPlanRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/GoalPlan" }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan/accept:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Accept a goal's pending plan (review_policy=none)
      operationId: acceptGoalPlan
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/GoalPlan" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan/submit-review:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Submit a goal's pending plan edit for human review
      operationId: submitGoalPlanReview
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan/materialize:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Materialize an accepted/approved plan into the goal's task graph
      operationId: materializeGoalPlan
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Goal" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan/start:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Open (or create) the goal's dedicated planning session
      description: >-
        Returns the session a goal is planned in, creating and binding one on the
        first call and returning the same session thereafter — so the UI can open
        a chat to author or refine the plan, continuing where it left off.
      operationId: startGoalPlanning
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/GoalPlanningSession",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan/reviews/{reviewId}/approve:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Approve a goal plan review
      operationId: approveGoalPlanReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/ReviewDecisionRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan/reviews/{reviewId}/reject:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Reject a goal plan review (discards the pending edit)
      operationId: rejectGoalPlanReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/ReviewDecisionRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{goalId}/plan/reviews/{reviewId}/request-changes:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [goals]
      summary: Request changes on a goal plan review (keeps the pending edit)
      operationId: requestChangesGoalPlanReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/ReviewDecisionRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Review" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }
