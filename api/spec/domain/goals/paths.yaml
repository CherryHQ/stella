        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [goals]
      summary: Update a goal's metadata
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/UpdateGoalRequest",
