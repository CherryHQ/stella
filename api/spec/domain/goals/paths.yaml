paths:
  /api/goals:
    get:
      tags: [goals]
      summary: List goals
      description: >-
        Lists root goals (goals) by default. `?parent={id}` lists a
        composite's direct children; `?root={id}` lists a whole tree.
      operationId: listGoals
      parameters:
        - name: agent_id
          in: query
          required: false
          description: Scope the root list to one managing agent.
          schema: { type: string }
        - name: terminal
          in: query
          required: false
          description: >-
            Split active vs history: false returns non-terminal roots, true
            returns terminal ones (accepted/rejected_final/abandoned/cancelled).
            Omit for both.
          schema: { type: boolean }
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on title/intent.
          schema: { type: string }
        - name: parent
          in: query
          required: false
          description: List the direct children of this composite instead of roots.
          schema: { type: string }
        - name: root
          in: query
          required: false
          description: List every goal in this tree (the root_id family).
          schema: { type: string }
        - name: lifecycle
          in: query
          required: false
          schema: { type: string }
        - name: project_id
          in: query
          required: false
          schema: { type: string }
        - name: archived
          in: query
          required: false
          description: When true returns only archived goals (the history/restore view).
          schema: { type: boolean }
        - {
            name: page_size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/GoalList",
                }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
    post:
      tags: [goals]
      summary: Create a goal (root goal)
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CreateGoalRequest",
              }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                {
                  $ref: "../../components.yaml#/components/schemas/Goal",
                }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/goals/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [goals]
