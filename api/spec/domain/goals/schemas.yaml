openapi: 3.0.3
info:
  title: Agent Goals Components
  version: "1"
paths: {}
components:
  schemas:
    # ── Core resource ────────────────────────────────────────────────────────
    Goal:
      type: object
      description: >-
        One node in the recursive goal tree. A root (parent_id null) is a
        top-level goal; a child is a sub-goal created by decomposition.
        Completion is DERIVED: acceptance_state is a cached projection over the
        append-only acceptance-event ledger, never an asserted flag.
      required:
        [
          id,
          user_id,
          agent_id,
          root_id,
          depth,
          position,
          title,
          kind,
          priority,
          required,
          lifecycle,
          done_reason,
          acceptance_state,
          needs_attention,
          budget_bonus,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        user_id: { type: string }
        agent_id:
          type: string
          description: Owner/manager agent context.
        project_id:
          type: string
          nullable: true
          description: Optional project/workspace context.
        parent_id:
          type: string
          nullable: true
          description: Parent composite id; null for a root (goal).
        root_id:
          type: string
          description: The tree's root id (= id for a root).
        depth: { type: integer }
        position: { type: integer }
        title: { type: string }
        intent:
          type: string
          description: What "done" means — the goal's acceptance target in prose.
        kind:
          type: string
          enum: [leaf, composite]
          description: A leaf is executed by a worker; a composite is decomposed into children.
        priority:
          type: string
          enum: [routine, urgent]
        required:
          type: boolean
          description: Whether this child gates its parent's acceptance.
        acceptance_contract:
          allOf: [{ $ref: "#/components/schemas/AcceptanceContract" }]
          nullable: true
          description: Composite policy tree gating acceptance; empty/absent ⇒ trivial auto-accept.
        convergence_policy:
          allOf: [{ $ref: "#/components/schemas/ConvergencePolicy" }]
          nullable: true
        review_policy:
          type: string
          enum: [none, human]
        lifecycle:
          type: string
          enum: [draft, pending, active, blocked, done]
        done_reason:
          type: string
          enum: ["", accepted, failed, cancelled]
          description: Set only when lifecycle=done.
        block_reason:
          type: string
          enum:
            [
              "",
              budget_exhausted,
              needs_plan_approval,
              planning_invalid,
              needs_verdict,
              env_unavailable,
              contract_conflict,
            ]
          description: Meaningful only when lifecycle=blocked.
        needs_attention:
          type: boolean
          description:
            Whether the goal is parked on a block only a human action can clear
            (verdict, plan approval, budget raise, contract edit, environment
            fix). Computed server-side from the canonical predicate; clients
            must not re-derive it from lifecycle/block_reason.
        flaky_count:
          type: integer
          description: Flaky infrastructure retries spent outside business budget.
        acceptance_state:
          type: string
          enum: [pending, passed, failed]
          description: Cached projection of the acceptance fold.
        accepted_output:
          type: object
          additionalProperties: {}
          nullable: true
          description: Frozen output, set when done_reason=accepted.
        acceptance_seq: { type: integer }
        active_attempt_id:
          type: string
          nullable: true
          description: The in-flight attempt; cleared while a human verdict is pending.
        attempt_count: { type: integer }
        budget_bonus:
          type: integer
          description: Human-granted extra convergence attempts beyond max_attempts.
        plan:
          type: object
          additionalProperties: {}
          description: >
            A composite's proposed decomposition (DecompositionContent: children +
            edges). Empty for a leaf or an unplanned composite. While
            blocked(needs_plan_approval) this holds the plan awaiting a human decision.
        planned_at:
          type: string
          format: date-time
          nullable: true
          description: Set once the composite's plan is materialized into children (the plan gate).
        context:
          type: object
          additionalProperties: {}
        dispatch_hint:
          type: object
          additionalProperties: {}
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the goal is hidden from default lists.
        workflow_id:
          type: string
          nullable: true
          description: Workflow version row that instantiated this root goal.
        workflow_version:
          type: integer
          nullable: true
          description: Workflow version copied onto this run's root goal.

    GoalList:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.
        total:
          type: integer
          description: Total goals matching the filter, ignoring pagination.

    CreateGoalRequest:
      type: object
      required: [title, agent_id]
      properties:
        title: { type: string }
        intent:
          type: string
          description: What "done" means for this goal.
        agent_id: { type: string }
        project_id:
          type: string
          description: Optional project/workspace context. Must belong to the caller and agent.
        kind:
          type: string
          enum: [leaf, composite]
          description: >-
            'leaf' (default) is a directly-executed goal; 'composite' is decomposed
            into children (the plan is materialized) before it can activate.
        priority:
          type: string
          enum: [routine, urgent]
        review_policy:
          type: string
          enum: [none, human]
        acceptance_contract:
          allOf: [{ $ref: "#/components/schemas/AcceptanceContract" }]
          description: Optional acceptance gate; omit for trivial auto-accept.
        convergence_policy:
          allOf: [{ $ref: "#/components/schemas/ConvergencePolicy" }]
        activate:
          type: boolean
          description: >-
            When true the new goal is activated immediately after create
            (direct run). Only a leaf with a satisfied plan gate can activate; a
            composite must be planned first, so 'activate' is ignored for it.

    UpdateGoalRequest:
      type: object
      description: Partial metadata edit; omitted fields are left unchanged.
      properties:
        title: { type: string }
        intent: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        review_policy:
          type: string
          enum: [none, human]
        acceptance_contract: { $ref: "#/components/schemas/AcceptanceContract" }
        convergence_policy: { $ref: "#/components/schemas/ConvergencePolicy" }

    CancelRequest:
      type: object
      properties:
        reason: { type: string }

    AbandonRequest:
      type: object
      description: Human give-up on a budget-exhausted block.
      properties:
        reason: { type: string }

    # ── Acceptance contract (policy tree) ────────────────────────────────────
    AcceptanceContract:
      type: object
      description: >-
        The composite policy tree of deterministic + judgment items that gates
        acceptance. An empty contract (no items) is the trivial auto-accept.
      properties:
        policy:
          type: string
          enum: [deterministic_then_judgment, all, any]
        items:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceItem" }

    AcceptanceItem:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [deterministic, judgment]
        required:
          type: boolean
          description: A non-required item is advisory and does not gate acceptance.
        command:
          type: string
          description: Deterministic check command (run in the sandbox).
        expect_exit:
          type: integer
          description: Expected exit code for a deterministic check (default 0).
        authority:
          type: string
          enum: [agent, human]
          description: Who renders a judgment verdict.
        rubric:
          type: string
          description: Agent reviewer prompt.
        prompt:
          type: string
          description: Human verdict prompt.

    ConvergencePolicy:
      type: object
      description: Bounds the rework loop and recursion depth.
      properties:
        max_attempts:
          type: integer
          description: Rework budget; exhaustion ⇒ blocked(budget_exhausted). Default 3.
        escalation:
          type: string
          enum: [block, abandon]
        max_depth:
          type: integer
          description: Recursion ceiling. Default 4.
        planner_repair_max:
          type: integer
          description: Structural planning repair turns in the same session. Default 2.
        max_concurrent:
          type: integer
          description: Per-root breadth-of-fanout cap. Default 8.

    # ── Attempts (per-attempt execution episodes) ────────────────────────────
    Attempt:
      type: object
      required:
        [
          id,
          goal_id,
          purpose,
          attempt_no,
          status,
          session_id,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        goal_id: { type: string }
        user_id: { type: string }
        agent_id: { type: string, nullable: true }
        executor_agent_id: { type: string, nullable: true }
        session_id: { type: string }
        purpose:
          type: string
          enum: [execution, decomposition, review]
        attempt_no: { type: integer }
        status:
          type: string
          enum: [queued, running, submitted, interrupted, failed, cancelled]
        input_context:
          type: object
          additionalProperties: {}
        evidence:
          type: object
          additionalProperties: {}
        output:
          type: object
          additionalProperties: {}
        gaps:
          type: object
          additionalProperties: {}
        error: { type: string }
        failure_class:
          type: string
          enum: ["", model, environment, contract, flaky]
          description: Responsibility class for failed or interrupted attempts.
        repair_rounds:
          type: integer
          description: Structural decomposition repair turns spent inside this attempt.
        worker_id: { type: string }
        heartbeat_at: { type: string, format: date-time, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AttemptList:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items: { $ref: "#/components/schemas/Attempt" }

    GoalHealthCountBucket:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer, format: int64 }

    GoalHealthRatioBucket:
      type: object
      required: [key, count, ratio]
      properties:
        key: { type: string }
        count: { type: integer, format: int64 }
        ratio: { type: number, format: double }

    GoalHealthAttemptPurpose:
      type: object
      required: [
        purpose,
        total,
        succeeded,
        success_rate,
        average_retries,
        max_retries,
      ]
      properties:
        purpose:
          type: string
          enum: [decomposition, execution, review]
        total: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        success_rate: { type: number, format: double }
        average_retries: { type: number, format: double }
        max_retries: { type: integer, format: int64 }

    GoalHealthAcceptanceEvents:
      type: object
      required: [total, passed, failed, pass_rate]
      properties:
        total: { type: integer, format: int64 }
        passed: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        pass_rate: { type: number, format: double }

    GoalHealthDecompositionQuality:
      type: object
      required:
        [
          first_round_total,
          first_round_succeeded,
          first_round_success_rate,
          average_repair_rounds,
          redecomposition_counts,
        ]
      properties:
        first_round_total: { type: integer, format: int64 }
        first_round_succeeded: { type: integer, format: int64 }
        first_round_success_rate: { type: number, format: double }
        average_repair_rounds: { type: number, format: double }
        redecomposition_counts:
          type: array
          items: { $ref: "#/components/schemas/GoalHealthCountBucket" }

    GoalHealthBudgetAttribution:
      type: object
      required: [
        model_budget_attempts,
        class_counts,
        flaky_dominant_blocked_goals,
      ]
      properties:
        model_budget_attempts:
          type: integer
          format: int64
          description: Execution failures charged to business budget (failure_class=model).
        class_counts:
          type: array
          items: { $ref: "#/components/schemas/GoalHealthRatioBucket" }
        flaky_dominant_blocked_goals:
          type: integer
          format: int64
          description: Blocked goals where flaky execution failures are at least half of non-model failures.

    GoalHealthAttemptLatency:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [decomposition, execution, review]
        p50_ms: { type: number, format: double, nullable: true }
        p95_ms: { type: number, format: double, nullable: true }

    GoalHealthLatency:
      type: object
      required: [attempts, goal_e2e]
      properties:
        attempts:
          type: array
          items: { $ref: "#/components/schemas/GoalHealthAttemptLatency" }
        goal_e2e:
          type: object
          required: [p50_ms, p95_ms]
          properties:
            p50_ms: { type: number, format: double, nullable: true }
            p95_ms: { type: number, format: double, nullable: true }

    GoalHealthReport:
      type: object
      required:
        [
          since_at,
          until_at,
          total_goals,
          lifecycle_counts,
          blocked_reason_counts,
          attempt_purposes,
          failure_class_counts,
          acceptance_events,
          decomposition_quality,
          budget_attribution,
          latency,
        ]
      properties:
        since_at: { type: string, format: date-time }
        until_at: { type: string, format: date-time }
        user_id: { type: string, nullable: true }
        agent_id: { type: string, nullable: true }
        total_goals: { type: integer, format: int64 }
        lifecycle_counts:
          type: array
          items: { $ref: "#/components/schemas/GoalHealthCountBucket" }
        blocked_reason_counts:
          type: array
          items: { $ref: "#/components/schemas/GoalHealthCountBucket" }
        attempt_purposes:
          type: array
          items: { $ref: "#/components/schemas/GoalHealthAttemptPurpose" }
        failure_class_counts:
          type: array
          items: { $ref: "#/components/schemas/GoalHealthCountBucket" }
        acceptance_events: {
          $ref: "#/components/schemas/GoalHealthAcceptanceEvents",
        }
        decomposition_quality: {
          $ref: "#/components/schemas/GoalHealthDecompositionQuality",
        }
        budget_attribution: {
          $ref: "#/components/schemas/GoalHealthBudgetAttribution",
        }
        latency: { $ref: "#/components/schemas/GoalHealthLatency" }

    # ── Acceptance events (the append-only ledger) ───────────────────────────
    AcceptanceEvent:
      type: object
      required:
        [
          id,
          goal_id,
          seq,
          item_id,
          item_kind,
          result,
          authority,
          created_at,
        ]
      properties:
        id: { type: string }
        goal_id: { type: string }
        attempt_id: { type: string, nullable: true }
        seq: { type: integer }
        item_id: { type: string }
        item_kind:
          type: string
          enum: [deterministic, judgment]
        result:
          type: string
          enum: [pass, fail]
        command: { type: string }
        exit_code: { type: integer, nullable: true }
        cache_key: { type: string }
        authority:
          type: string
          enum: [system, agent, human]
        reviewer_user_id: { type: string, nullable: true }
        reviewer_attempt_id: { type: string, nullable: true }
        rationale: { type: string }
        scope: { type: string }
        scope_hash: { type: string }
        detail: { type: string }
        created_at: { type: string, format: date-time }

    AcceptanceEventList:
      type: object
      required: [acceptance_events]
      properties:
        acceptance_events:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceEvent" }

    GoalTimelineEvent:
      type: object
      required: [id, goal_id, event_type, payload, created_at]
      properties:
        id: { type: string }
        goal_id: { type: string }
        attempt_id: { type: string, nullable: true }
        event_type:
          type: string
          enum:
            [
              plan_submitted,
              attempt_started,
              attempt_finished,
              acceptance_recorded,
              lifecycle_changed,
              human_message,
            ]
        payload:
          type: object
          additionalProperties: {}
        created_at: { type: string, format: date-time }

    GoalTimeline:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/GoalTimelineEvent" }
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.

    GoalTimelineMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Human instruction appended to the goal timeline.

    VerdictRequest:
      type: object
      description: A human judgment-as-evidence verdict against a contract item; re-folds acceptance.
      required: [item_id, result]
      properties:
        item_id: { type: string }
        result:
          type: string
          enum: [pass, fail]
        rationale: { type: string }
        scope: { type: string }
        scope_hash:
          type: string
          description: The accepted-output/artifact hash the verdict covers (staleness anchor).

    # ── Edges (sibling dependencies) ─────────────────────────────────────────
    Edge:
      type: object
      required: [goal_id, upstream_id, edge_kind, on_failure, created_at]
      properties:
        goal_id: { type: string }
        upstream_id: { type: string }
        edge_kind:
          type: string
          enum: [hard, soft]
        on_failure:
          type: string
          enum: [block, fail, ignore]
        waived_at: { type: string, format: date-time, nullable: true }
        waived_by_user: { type: string, nullable: true }
        waiver_reason: { type: string }
        created_at: { type: string, format: date-time }

    EdgeList:
      type: object
      required: [edges]
      properties:
        edges:
          type: array
          items: { $ref: "#/components/schemas/Edge" }

    AddEdgeRequest:
      type: object
      required: [upstream_id]
      properties:
        upstream_id: { type: string }
        kind:
          type: string
          enum: [hard, soft]
          description: Default 'hard'.
        on_failure:
          type: string
          enum: [block, fail, ignore]
          description: Default 'block'.

    WaiveRequest:
      type: object
      properties:
        reason: { type: string }

    # ── Decomposition plan (a composite's proposed children + edges) ──────────
    DecompositionContent:
      type: object
      description: A composite's proposed children + sibling edges (its plan).
      required: [children]
      properties:
        children:
          type: array
          items: { $ref: "#/components/schemas/ProposedChild" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/ProposedEdge" }

    ProposedChild:
      type: object
      required: [key, title]
      properties:
        key:
          type: string
          description: Stable id within the plan; the materialize idempotency anchor.
        title: { type: string }
        intent: { type: string }
        kind:
          type: string
          enum: [leaf, composite]
        required: { type: boolean }
        acceptance_contract: { $ref: "#/components/schemas/AcceptanceContract" }
        convergence_policy: { $ref: "#/components/schemas/ConvergencePolicy" }
        review_policy:
          type: string
          enum: [none, human]

    ProposedEdge:
      type: object
      required: [downstream_key, upstream_key]
      properties:
        downstream_key: { type: string }
        upstream_key: { type: string }
        kind:
          type: string
          enum: [hard, soft]
        on_failure:
          type: string
          enum: [block, fail, ignore]

    # ── Agent-facing goal_control tool inputs ────────────────────────────────
    GoalControlExecuteInput:
      type: object
      properties:
        action:
          type: string
          enum: [submit, fail]
          description: Which terminal action to take.
        summary:
          type: string
          description: "submit: handoff summary describing what you produced (required for child goals)."
        artifacts:
          type: array
          description: "submit: hash-addressed artifact refs (diffs/files/stdout)."
        output:
          type: object
          description: "submit: structured result the acceptance contract evaluates."
        notes:
          type: object
          description: "submit: free-form evidence notes."
        reason:
          type: string
          description: "fail: error message."
        blocked_by:
          type: string
          enum: ["", env_unavailable, contract_conflict]
          description: "fail: optional structured blocker when the contract is impossible or the environment is unavailable."
      required: [action]

    GoalControlDecomposeInput:
      type: object
      properties:
        action:
          type: string
          enum: [decompose, fail]
          description: Which terminal action to take.
        summary:
          type: string
          description: "decompose: one-line description of the plan."
        decomposition:
          allOf: [{ $ref: "#/components/schemas/DecompositionContent" }]
          description: "decompose: the proposed plan as children + sibling edges."
        reason:
          type: string
          description: "fail: error message."
        blocked_by:
          type: string
          enum: ["", env_unavailable, contract_conflict]
          description: "fail: optional structured blocker when the contract is impossible or the environment is unavailable."
      required: [action]

    GoalControlReviewInput:
      type: object
      properties:
        action:
          type: string
          enum: [verdict, fail]
          description: Which terminal action to take.
        summary:
          type: string
          description: "verdict: one-line summary of the review."
        verdicts:
          type: array
          description: "verdict: one entry per required item being reviewed."
          items: { $ref: "#/components/schemas/GoalControlReviewVerdict" }
        reason:
          type: string
          description: "fail: why the output cannot be judged."
        blocked_by:
          type: string
          enum: ["", env_unavailable, contract_conflict]
          description: "fail: optional structured blocker when the contract is impossible or the environment is unavailable."
      required: [action]

    GoalControlReviewVerdict:
      type: object
      properties:
        item_id:
          type: string
          description: The acceptance item id this verdict answers.
        pass:
          type: boolean
          description: true if the output satisfies the item.
        rationale:
          type: string
          description: Why it passes or fails; a fail rationale feeds the next attempt.
      required: [item_id, pass]

    DecisionRequest:
      type: object
      description: A plan decision (reject) note.
      properties:
        reason: { type: string }

    # ── Readiness (computed dispatchability view) ────────────────────────────
    Readiness:
      type: object
      required: [state, dispatchable]
      properties:
        state:
          type: string
          enum:
            [
              dispatchable,
              waiting_deps,
              blocked,
              active,
              terminal,
              draft,
              composite,
              unknown,
            ]
        dispatchable: { type: boolean }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/ReadinessReason" }

    ReadinessReason:
      type: object
      properties:
        type: { type: string }
        upstream_id: { type: string }
        detail: { type: string }
