openapi: 3.0.3
info:
  title: Agent Goals Components
  version: "1"
paths: {}
components:
  schemas:
    Goal:
      type: object
      required:
        [
          id,
          user_id,
          agent_id,
          title,
          status,
          priority,
          review_policy,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        user_id: { type: string }
        agent_id:
          type: string
          description: Owner/manager agent context.
        project_id:
          type: string
          description: Optional project/workspace context.
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum:
            [
              draft,
              planning,
              planned,
              running,
              blocked,
              reviewing,
              done,
              failed,
              cancelled,
            ]
        priority:
          type: string
          enum: [routine, urgent]
        review_policy:
          type: string
          enum: [none, auto, agent, human]
        active_review_id: { type: string }
        context:
          type: object
          additionalProperties: {}
        output:
          type: object
          additionalProperties: {}
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          description: Set when the goal is hidden from default lists.

    CompleteGoalRequest:
      type: object
      properties:
        output:
          type: object
          additionalProperties: {}
          description: Final goal output/summary recorded when manually marking achieved.

    GoalList:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.
        total:
          type: integer
          description: Total goals matching the filter, ignoring pagination. Drives numbered pages and count badges.

    CreateGoalRequest:
      type: object
      required: [title, agent_id]
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }
        project_id:
          type: string
          description: Optional project/workspace context. Must belong to the caller and agent.
        review_policy:
          type: string
          enum: [none]
          description: >-
            Only 'none' is supported in this build. Goal-level review
            (auto/agent/human) requires the synthesizer/goal-review runtime,
            which is not yet wired.
        plan_mode:
          type: string
          enum: [direct, deferred]
          description: >-
            How the goal's plan is seeded. 'direct' (default) auto-creates,
            accepts, and materializes a single-task plan so the goal is ready to
            activate. 'deferred' leaves the goal in 'draft' with no plan for
            explicit structured planning via the plan endpoints.
        context:
          type: object
          additionalProperties: {}

    CancelGoalRequest:
      type: object
      properties:
        reason: { type: string }

    PlanItem:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        role:
          type: string
          enum: [direct, design, impl, verify]
          description: Item kind. Omit/`direct` for a single-task direct plan.
        deps:
          type: array
          items: { type: string }
          description: IDs of items this item depends on (a DAG over item ids).
        criteria:
          type: array
          items: { type: string }
          description: Acceptance criteria recorded against the materialized task.

    PlanContent:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanItem" }

    GoalPlan:
      type: object
      required: [
        id,
        goal_id,
        status,
        review_policy,
        content,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        goal_id: { type: string }
        status:
          type: string
          enum: [draft, in_review, accepted, approved]
        review_policy:
          type: string
          enum: [none, human]
        content:
          allOf: [{ $ref: "#/components/schemas/PlanContent" }]
          description: Last materialized plan content.
        pending_content:
          allOf: [{ $ref: "#/components/schemas/PlanContent" }]
          nullable: true
          description: In-flight edit awaiting accept/review + materialize; null when none.
        approved_review_id: { type: string }
        accepted_at: { type: string, format: date-time }
        materialized_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PutGoalPlanRequest:
      type: object
      required: [content]
      properties:
        content: { $ref: "#/components/schemas/PlanContent" }
        review_policy:
          type: string
          enum: [none, human]
          description: >-
            How the staged plan is accepted. 'none' (default) accepts directly;
            'human' requires submit-review + approve before materialize.
