openapi: 3.0.3
info:
  title: Invites Components
  version: "1"
paths: {}
components:
  schemas:
    Invite:
      type: object
      required:
        [
          id,
          org_id,
          role,
          status,
          max_uses,
          use_count,
          invited_by,
          expires_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        org_id: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [pending, accepted, revoked] }
        max_uses: { type: integer }
        use_count: { type: integer }
        invited_by: { type: string }
        accepted_by: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invite" }

    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        email: { type: string }
        role: { type: string, enum: [admin, user] }
        max_uses: { type: integer, default: 1, minimum: 1 }
        ttl_hours: { type: integer, default: 168, minimum: 1 }

    CreateInviteResponse:
      type: object
      required: [invite, invite_url]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        invite_url: { type: string }

    InviteInfo:
      type: object
      required: [invite, org_name]
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        org_name: { type: string }
