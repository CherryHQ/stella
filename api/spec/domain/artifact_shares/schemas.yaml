openapi: 3.0.3
info:
  title: Artifact Share Components
  version: "1"
paths: {}
components:
  schemas:
    ArtifactShare:
      type: object
      required: [id, url, title, session_id, path, media_type, created_at]
      properties:
        id: { type: string }
        url: { type: string }
        title: { type: string }
        session_id: { type: string }
        path: { type: string }
        media_type: { type: string }
        expires_at: { type: string, nullable: true }
        created_at: { type: string }

    CreateArtifactShareRequest:
      type: object
      required: [session_id, path]
      properties:
        session_id: { type: string }
        path: { type: string }
        expires_in:
          type: string
          enum: [1h, 1d, 7d, never]
          default: 7d

    PublicArtifactShare:
      type: object
      required: [title, media_type, created_at, content_url]
      properties:
        title: { type: string }
        media_type: { type: string }
        expires_at: { type: string, nullable: true }
        created_at: { type: string }
        content_url: { type: string }
