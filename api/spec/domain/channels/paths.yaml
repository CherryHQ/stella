paths:
  /api/channels/public:
    get:
      tags: [channels]
      summary: List public channels (any authenticated user)
      operationId: listPublicChannels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PublicChannelList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/channels:
    get:
      tags: [channels]
      summary: List visible channels (personal webhooks for all users; deployment channels for admins)
      operationId: listChannels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ChannelList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [channels]
      summary: Create a personal webhook or an admin-managed deployment channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ChannelWriteRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Channel",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/channels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [channels]
      summary: Get an owned webhook or an admin-managed deployment channel
      operationId: getChannel
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Channel",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [channels]
      summary: Update an owned webhook or an admin-managed deployment channel
      operationId: updateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ChannelWriteRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Channel",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [channels]
      summary: Delete an owned webhook or an admin-managed deployment channel
      operationId: deleteChannel
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/channels/{channelId}/webhook-endpoint:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string } }
    get:
      tags: [channels]
      summary: Get the caller-owned channel's webhook capability endpoint
      operationId: getWebhookEndpoint
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WebhookEndpoint",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [channels]
      summary: Activate the caller-owned channel's webhook capability endpoint
      operationId: createWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateWebhookEndpointRequest",
            }
      responses:
        "201":
          description: created; the response includes the one-time url
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WebhookEndpoint",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
    delete:
      tags: [channels]
      summary: Revoke the caller-owned channel's webhook capability endpoint
      operationId: deleteWebhookEndpoint
      responses:
        "204":
          description: revoked
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/channels/{channelId}/webhook-endpoint/rotate:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string } }
    post:
      tags: [channels]
      summary: Rotate the caller-owned channel's webhook capability
      operationId: rotateWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/RotateWebhookEndpointRequest",
            }
      responses:
        "200":
          description: rotated; the response includes the new one-time url
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WebhookEndpoint",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/channels/feishu/register/init:
    post:
      tags: [channels]
      summary: Initialize Feishu PersonalAgent registration (admin only)
      operationId: initFeishuRegistration
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/FeishuRegistrationInitRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeishuRegistrationInit",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from Feishu registration API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/feishu/register/begin:
    post:
      tags: [channels]
      summary: Begin Feishu PersonalAgent registration (admin only)
      operationId: beginFeishuRegistration
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/FeishuRegistrationBeginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeishuRegistrationBegin",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from Feishu registration API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/feishu/register/poll:
    post:
      tags: [channels]
      summary: Poll Feishu PersonalAgent registration and create a channel (admin only)
      operationId: pollFeishuRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/FeishuRegistrationPollRequest",
            }
      responses:
        "200":
          description: pending or created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeishuRegistrationPoll",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from Feishu registration API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/register/qr:
    post:
      tags: [channels]
      summary: Begin WeChat iLink bot registration (admin only)
      operationId: beginWeixinRegistration
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinRegistrationBegin",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/register/poll:
    post:
      tags: [channels]
      summary: Poll WeChat iLink bot registration and create a channel (admin only)
      operationId: pollWeixinRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WeixinRegistrationPollRequest",
            }
      responses:
        "200":
          description: pending or created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinRegistrationPoll",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/qr:
    post:
      tags: [weixin]
      summary: Start WeChat QR login flow (any authenticated user)
      operationId: startWeixinQR
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinQRCode",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/qr/status:
    get:
      tags: [weixin]
      summary: Poll WeChat QR login status (any authenticated user)
      operationId: pollWeixinQRStatus
      parameters:
        - {
            name: qrcode,
            in: query,
            required: true,
            schema: { type: string },
            description: "QR code token from startWeixinQR",
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinQRStatus",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }
