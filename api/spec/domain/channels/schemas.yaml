openapi: 3.0.3
info:
  title: Channels Components
  version: "1"
paths: {}
components:
  schemas:
    Channel:
      type: object
      required: [id, name, type, enabled, config]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        agent_id: { type: string }
        enabled: { type: boolean }
        config:
          type: string
          description: "JSON string of the channel config"

    ChannelList:
      type: object
      required: [channels]
      properties:
        channels: {
          type: array,
          items: { $ref: "#/components/schemas/Channel" },
        }

    PublicChannel:
      type: object
      required: [id, type, label, enabled]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        enabled: { type: boolean }

    PublicChannelList:
      type: object
      required: [channels]
      properties:
        channels: {
          type: array,
          items: { $ref: "#/components/schemas/PublicChannel" },
        }

    ChannelWriteRequest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, nullable: true }
        agent_id: { type: string, nullable: true }
        enabled: { type: boolean, nullable: true }
        config: {
          type: string,
          description: "JSON string of the channel config",
        }

    FeishuRegistrationInitRequest:
      type: object
      properties:
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu

    FeishuRegistrationInit:
      type: object
      required: [supported_auth_methods]
      properties:
        supported_auth_methods:
          type: array
          items: { type: string }

    FeishuRegistrationBeginRequest:
      type: object
      properties:
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu

    FeishuRegistrationBegin:
      type: object
      required: [
        device_code,
        verification_uri_complete,
        qr_url,
        interval,
        expires_in,
      ]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string }
        verification_uri_complete: { type: string }
        qr_url: { type: string }
        interval: { type: integer }
        expires_in: { type: integer }

    FeishuRegistrationPollRequest:
      type: object
      required: [device_code, channel_id, agent_id]
      properties:
        device_code: { type: string }
        channel_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu
        enabled:
          type: boolean
          default: true
        config:
          type: object
          additionalProperties: true

    FeishuRegistrationPoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, slow_down, created]
        interval: { type: integer }
        tenant_brand: { type: string }
        channel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Channel"

    WeixinRegistrationBegin:
      type: object
      required: [qrcode, qr_image_url, poll_interval]
      properties:
        qrcode: { type: string }
        qr_image_url: { type: string }
        poll_interval: { type: integer }

    WeixinRegistrationPollRequest:
      type: object
      required: [qrcode, agent_id]
      properties:
        qrcode: { type: string }
        channel_id:
          type: string
          default: weixin
          description: Weixin is singleton-only; omit or set to "weixin".
        agent_id: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: true

    WeixinRegistrationPoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: >-
            Registration status. "created" is synthesized by Stella once
            credentials are saved; all other values are passed through verbatim
            from the iLink scan status (e.g. wait, scaned, expired) and are not
            an exhaustive set.
        poll_interval: { type: integer }
        channel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Channel"

    WeixinQRCode:
      type: object
      properties:
        qrcode: { type: string }
        qrcode_img_content: { type: string }

    WeixinQRStatus:
      type: object
      properties:
        status: { type: string }
        bot_token: { type: string }
        ilink_bot_id: { type: string }
        ilink_user_id: { type: string }
        baseurl: { type: string }
