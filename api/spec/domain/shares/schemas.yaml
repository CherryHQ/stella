openapi: 3.0.3
info:
  title: Share Components
  version: "1"
paths: {}
components:
  schemas:
    Share:
      type: object
      required: [id, url, title, media_type, created_at]
      properties:
        id: { type: string }
        url: { type: string }
        title: { type: string }
        media_type: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateShareRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [artifact, article]
        agent_id: { type: string }
        session_id: { type: string }
        path:
          type: string
          description: >-
            Artifact path. Relative paths use scope; $HOME selects agent work
            files, $STELLA_ASSETS_DIR shared user assets, and $STELLA_USER_DIR
            shared user files for compatibility.
        scope:
          $ref: "#/components/schemas/WorkspaceScope"
        article_id: { type: string }
        expires_in:
          type: string
          enum: [1h, 1d, 7d, never]
          default: 7d

    ShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: "#/components/schemas/Share" }
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.
