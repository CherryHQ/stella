openapi: 3.0.3
info:
  title: Plugins Components
  version: "1"
paths: {}
components:
  schemas:
    NativePlugin:
      type: object
      additionalProperties: false
      required: [id, is_enabled]
      properties:
        id: { type: string }
        is_enabled: { type: boolean }
    NativePluginList:
      type: object
      required: [native_plugins, next_page_token]
      properties:
        native_plugins:
          type: array
          items: { $ref: "#/components/schemas/NativePlugin" }
        next_page_token: { type: string, nullable: true }
    NativeAgentDeny:
      type: object
      additionalProperties: false
      required: [native_id, agent_id, is_denied]
      properties:
        native_id: { type: string }
        agent_id: { type: string }
        is_denied: { type: boolean }
    NativeAgentDenyList:
      type: object
      required: [denials, next_page_token]
      properties:
        denials:
          type: array
          items: { $ref: "#/components/schemas/NativeAgentDeny" }
        next_page_token: { type: string, nullable: true }
    CreateNativeAgentDenyRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id: { type: string }
    UpdateNativePluginRequest:
      type: object
      additionalProperties: false
      required: [is_enabled]
      properties:
        is_enabled: { type: boolean }
    PluginDefinition:
      type: object
      additionalProperties: false
      required: [
        id,
        display_name,
        is_builtin,
        is_default_enabled,
        spec,
        resource_summary,
        lifecycle_status,
        lifecycle_reason,
        revision,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        display_name: { type: string }
        is_builtin: { type: boolean, readOnly: true }
        is_default_enabled: { type: boolean, readOnly: true }
        spec:
          type: object
          additionalProperties: true
          description: Safe package metadata. Private endpoints and credentials are omitted.
        resource_summary:
          $ref: "#/components/schemas/PluginResourceSummary"
        lifecycle_status:
          type: string
          enum: [installed, in_use, cleanup_pending]
          readOnly: true
          description: >
            Safe projection of package lifecycle. Retired definitions remain
            visible while an active runtime owner may still use their ID or
            content digest.
        lifecycle_reason:
          type: string
          enum: [active, runtime_owner, awaiting_cleanup, ownership_unconfirmed]
          readOnly: true
          description: >
            Bounded explanation for lifecycle_status. Ownership uncertainty is
            reported without exposing runtime errors or owner identities.
        revision: { type: integer, format: int64, readOnly: true }
        retired_at: {
          type: string,
          format: date-time,
          nullable: true,
          readOnly: true,
        }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    PluginList:
      type: object
      required: [plugins, next_page_token]
      properties:
        plugins: {
          type: array,
          items: { $ref: "#/components/schemas/PluginDefinition" },
        }
        next_page_token: { type: string, nullable: true }
    PluginConfig:
      type: object
      additionalProperties: false
      required: [
        id,
        plugin_id,
        scope,
        is_enabled,
        resource_summary,
        revision,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string, format: uuid }
        plugin_id: { type: string }
        scope: { type: string, enum: [system, system_agent, user, user_agent] }
        user_id: { type: string, format: uuid, readOnly: true }
        agent_id: { type: string }
        is_enabled: { type: boolean, nullable: true }
        resource_summary:
          $ref: "#/components/schemas/PluginResourceSummary"
        revision: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    PluginResourceSummary:
      type: object
      additionalProperties: false
      required: [
        binaries,
        skills,
        session_env,
        mcp_servers,
        oauth_provider_configured,
      ]
      properties:
        binaries:
          type: array
          items: { $ref: "#/components/schemas/PluginCLIBackendBinarySummary" }
        skills:
          type: array
          items: { $ref: "#/components/schemas/PluginCLIBackendSkillSummary" }
        session_env:
          type: array
          items: {
            $ref: "#/components/schemas/PluginCLIBackendSessionEnvSummary",
          }
        oauth_provider_configured: { type: boolean }
        mcp_servers:
          type: array
          items: { $ref: "#/components/schemas/PluginMCPServerSummary" }
    PluginCLIBackendBinarySummary:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    PluginCLIBackendSkillSummary:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
    PluginCLIBackendSessionEnvSummary:
      type: object
      additionalProperties: false
      required: [env_var, source, required]
      properties:
        env_var: { type: string }
        source: { type: string }
        required: { type: boolean }
    PluginMCPServerSummary:
      type: object
      additionalProperties: false
      required: [
        server_key,
        endpoint_configured,
        bearer_configured,
        oauth_client_id_configured,
        oauth_client_secret_configured,
      ]
      properties:
        server_key: { type: string }
        child_id: { type: string, format: uuid, readOnly: true }
        parent_config_id: { type: string, format: uuid, readOnly: true }
        parent_revision: { type: integer, format: int64, readOnly: true }
        transport: { type: string, enum: [streamable_http, sse] }
        auth_type: { type: string, enum: [none, bearer, oauth] }
        credential_mode: { type: string, enum: [shared, per_user] }
        endpoint_configured: { type: boolean }
        bearer_configured: { type: boolean }
        oauth_client_id_configured: { type: boolean }
        oauth_client_secret_configured: { type: boolean }
    PluginConfigList:
      type: object
      required: [configs, next_page_token]
      properties:
        configs: {
          type: array,
          items: { $ref: "#/components/schemas/PluginConfig" },
        }
        next_page_token: { type: string, nullable: true }
    PluginEffective:
      type: object
      additionalProperties: false
      required: [
        plugin_id,
        config_id,
        source_scope,
        is_effectively_enabled,
        availability_reason,
        readiness,
      ]
      properties:
        plugin_id: { type: string }
        config_id: { type: string, nullable: true }
        source_scope: { type: string, nullable: true }
        is_effectively_enabled: { type: boolean }
        availability_reason: { type: string }
        readiness: { type: string, enum: [unknown, ready, unavailable] }
    PluginConfigInput:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: { type: string, enum: [system, system_agent, user, user_agent] }
        agent_id: { type: string }
        is_enabled: { type: boolean, nullable: true }
        config: { type: object, nullable: true, additionalProperties: true }
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true
          description: Write-only credential material.
    CreatePluginConfigRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: { type: string, enum: [system, system_agent, user, user_agent] }
        agent_id: { type: string }
        is_enabled: { type: boolean, nullable: true }
        config: { type: object, nullable: true, additionalProperties: true }
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true
          description: Write-only credential material.
    CreatePluginRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [
        display_name,
        name,
        definition_spec,
        initial_config,
      ]
      properties:
        display_name: { type: string }
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^(?!.*(?:--|\\.\\.))[a-z0-9](?:[a-z0-9.-]{0,62}[a-z0-9])?$"
          description: >-
            Canonical immutable plugin ID. It uses lowercase letters, digits,
            dots, and hyphens, starts and ends with a letter or digit, and
            cannot contain consecutive dots or hyphens.
        definition_spec: { type: object, additionalProperties: true }
        initial_config: { $ref: "#/components/schemas/PluginConfigInput" }
    CreatePluginResponse:
      type: object
      additionalProperties: false
      required: [plugin, config]
      properties:
        plugin: { $ref: "#/components/schemas/PluginDefinition" }
        config: { $ref: "#/components/schemas/PluginConfig" }
    ImportPluginRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [source_path, initial_config]
      properties:
        source_path:
          type: string
          minLength: 1
          description: Server-local path to an Agent Plugin package directory.
        initial_config: { $ref: "#/components/schemas/PluginConfigInput" }
    UpdatePluginPackageRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [source_path, expected_revision, expected_package_digest]
      properties:
        source_path:
          type: string
          minLength: 1
          description: Server-local path to the complete replacement package directory.
        expected_revision: { type: integer, format: int64, minimum: 1 }
        expected_package_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest returned by the update preview. The server rejects a changed directory.
    PreviewPluginPackageRequest:
      description: Request for a bounded, read-only package update preview.
      type: object
      additionalProperties: false
      required: [source_path, expected_revision]
      properties:
        source_path:
          type: string
          minLength: 1
          description: Server-local path to the candidate package directory.
        expected_revision: { type: integer, format: int64, minimum: 1 }
    PluginOAuthPreviewChange:
      type: object
      additionalProperties: false
      required: [
        provider,
        added_scopes,
        removed_scopes,
        added_bindings,
        removed_bindings,
      ]
      properties:
        provider: { type: string }
        added_scopes: { type: array, items: { type: string } }
        removed_scopes: { type: array, items: { type: string } }
        added_bindings: { type: array, items: { type: string } }
        removed_bindings: { type: array, items: { type: string } }
    PreviewPluginPackageResponse:
      type: object
      additionalProperties: false
      required: [
        plugin_id,
        current_revision,
        candidate_digest,
        candidate_version,
        oauth_changes,
        binary_names,
        skill_names,
        incompatible_scopes,
      ]
      properties:
        plugin_id: { type: string }
        current_revision: { type: integer, format: int64 }
        candidate_digest: { type: string }
        candidate_version: { type: string }
        oauth_changes:
          type: array
          items: { $ref: "#/components/schemas/PluginOAuthPreviewChange" }
        binary_names: { type: array, items: { type: string } }
        skill_names: { type: array, items: { type: string } }
        incompatible_scopes: { type: array, items: { type: string } }
    UpdatePluginRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        display_name: { type: string }
        description: { type: string, nullable: true }
    UpdatePluginConfigRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        is_enabled: { type: boolean, nullable: true }
        config: { type: object, nullable: true, additionalProperties: true }
        reset_fields: { type: array, items: { type: string } }
        binary_versions:
          type: object
          writeOnly: true
          additionalProperties: { type: string, minLength: 1 }
          description: Write-only CLI binary version edits keyed by definition resource name.
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true
          description: Write-only credential material.
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
    CliToolRegistryItem:
      type: object
      properties:
        name: { type: string }
        backends: { type: array, items: { type: string } }
    CliToolRegistryResponse:
      type: object
      required: [tools]
      properties:
        tools: {
          type: array,
          items: { $ref: "#/components/schemas/CliToolRegistryItem" },
        }
    CliToolLatestResponse:
      type: object
      required: [version]
      properties:
        version: { type: string }
