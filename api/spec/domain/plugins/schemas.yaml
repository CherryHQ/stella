openapi: 3.0.3
info:
  title: Plugins Components
  version: "1"
paths: {}
components:
  schemas:
    PluginView:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
        display_name: { type: string }
        description: { type: string }
        managed: { type: boolean }
        admin_visible: { type: boolean }
        has_config: { type: boolean }
        has_status: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        persisted: { type: boolean }
        persisted_id: { type: string }

    TogglePluginRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    UpdatePluginConfigRequest:
      type: object
      properties:
        config: { type: object, additionalProperties: true }

    ManifestBinary:
      type: object
      additionalProperties: false
      required: [name, tool]
      properties:
        name:
          type: string
          description: Binary name installed into Stella's bin directory.
        tool:
          type: string
          description: mise tool key, such as github:cli/cli or npm:serve.
        version:
          type: string
          description: Version to install. Defaults to latest when omitted.
        options:
          type: object
          additionalProperties: true
          description: mise backend options.

    ManifestSkill:
      type: object
      deprecated: true
      description: >
        Reserved manifest declaration. Stella currently stores and returns skill
        entries but does not install or register them at runtime.
      additionalProperties: false
      required: [repo, name]
      properties:
        repo: { type: string }
        name: { type: string }

    ManifestSessionEnv:
      type: object
      additionalProperties: false
      required: [env_var, source]
      properties:
        env_var: { type: string }
        source:
          type: string
          description: Value source, such as static or oauth.access_token.
        value: { type: string }
        required: { type: boolean }

    ManifestPluginDefinition:
      type: object
      additionalProperties: false
      required: [name, display_name, description]
      properties:
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        category:
          type: string
          description: Optional settings UI grouping hint.
        prompt: { type: string }
        binaries:
          type: array
          items: { $ref: "#/components/schemas/ManifestBinary" }
        skills:
          type: array
          deprecated: true
          description: >
            Reserved declarations. They are stored and returned but are not
            currently installed or registered at runtime.
          items: { $ref: "#/components/schemas/ManifestSkill" }
        session_env:
          type: array
          items: { $ref: "#/components/schemas/ManifestSessionEnv" }
        oauth_provider: { type: string }

    ManifestPlugin:
      type: object
      additionalProperties: false
      required: [id, kind, name, display_name, description, enabled]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        category:
          type: string
          description: Optional settings UI grouping hint.
        essential:
          type: boolean
          description: Server policy indicating that the plugin cannot be disabled.
        release_managed:
          type: boolean
          readOnly: true
          description: Whether Stella owns the plugin's definition and enablement for the release.
        prompt: { type: string }
        binaries:
          type: array
          items: { $ref: "#/components/schemas/ManifestBinary" }
        skills:
          type: array
          deprecated: true
          description: >
            Reserved declarations. They are stored and returned but are not
            currently installed or registered at runtime.
          items: { $ref: "#/components/schemas/ManifestSkill" }
        session_env:
          type: array
          items: { $ref: "#/components/schemas/ManifestSessionEnv" }
        oauth_provider: { type: string }
        builtin:
          type: boolean
          readOnly: true
          description: Whether the plugin definition ships with the server.
        overridden_fields:
          type: array
          readOnly: true
          description: Definition fields owned by the stored override.
          items:
            $ref: "#/components/schemas/ManifestPluginDefinitionField"

    ManifestPluginInput:
      type: object
      description: >
        Submitted builtin plugin view. Only the definition fields named by the
        sibling `fields` array are stored; all other values are context for
        validation and remain unowned.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Ignored; the URL identifies the plugin.
        kind:
          type: string
          description: Must match the kind in the URL when supplied.
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        enabled:
          type: boolean
          description: Used for admin-added plugins and ignored for builtins.
        category:
          type: string
          description: Optional settings UI grouping hint.
        essential:
          type: boolean
          description: Server-owned for builtins.
        prompt: { type: string }
        binaries:
          type: array
          items: { $ref: "#/components/schemas/ManifestBinary" }
        skills:
          type: array
          deprecated: true
          description: >
            Reserved declarations. They are stored and returned but are not
            currently installed or registered at runtime.
          items: { $ref: "#/components/schemas/ManifestSkill" }
        session_env:
          type: array
          items: { $ref: "#/components/schemas/ManifestSessionEnv" }
        oauth_provider: { type: string }

    ManifestPluginDefinitionField:
      type: string
      description: >
        Editable definition field. `skills` is reserved: its value can be stored
        and returned but is not currently installed or registered at runtime.
      enum:
        - name
        - display_name
        - description
        - category
        - prompt
        - binaries
        - skills
        - session_env
        - oauth_provider

    SaveBuiltinManifestPluginDefinitionRequest:
      type: object
      additionalProperties: false
      required: [plugin, fields]
      properties:
        plugin: { $ref: "#/components/schemas/ManifestPluginInput" }
        fields:
          type: array
          description: Definition fields this request takes ownership of.
          items: { $ref: "#/components/schemas/ManifestPluginDefinitionField" }

    ManifestPluginReplacement:
      type: object
      description: >
        Complete replacement value for an admin-added plugin. Empty strings and
        arrays explicitly clear optional definition fields.
      additionalProperties: false
      required:
        - kind
        - name
        - display_name
        - description
        - enabled
        - category
        - essential
        - prompt
        - binaries
        - skills
        - session_env
        - oauth_provider
      properties:
        id:
          type: string
          description: Ignored; the URL identifies the plugin.
        kind: { type: string }
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        category: { type: string }
        essential: { type: boolean }
        prompt: { type: string }
        binaries:
          type: array
          items: { $ref: "#/components/schemas/ManifestBinary" }
        skills:
          type: array
          deprecated: true
          description: >
            Reserved declarations. They are stored and returned but are not
            currently installed or registered at runtime.
          items: { $ref: "#/components/schemas/ManifestSkill" }
        session_env:
          type: array
          items: { $ref: "#/components/schemas/ManifestSessionEnv" }
        oauth_provider: { type: string }

    ReplaceCustomManifestPluginDefinitionRequest:
      type: object
      description: >
        Full replacement for an admin-added plugin.
      additionalProperties: false
      required: [plugin]
      properties:
        plugin: { $ref: "#/components/schemas/ManifestPluginReplacement" }

    SaveManifestPluginDefinitionRequest:
      oneOf:
        - $ref: "#/components/schemas/SaveBuiltinManifestPluginDefinitionRequest"
        - $ref: "#/components/schemas/ReplaceCustomManifestPluginDefinitionRequest"

    ManifestOAuthProvider:
      type: object
      properties:
        id: { type: string }
        scopes:
          type: array
          items: { type: string }
        vault_key: { type: string }
        client_id: { type: string }

    ManifestPluginsResponse:
      type: object
      required: [plugins, oauth_providers]
      properties:
        plugins:
          type: array
          items: { $ref: "#/components/schemas/ManifestPlugin" }
        oauth_providers:
          type: array
          items: { $ref: "#/components/schemas/ManifestOAuthProvider" }

    PluginViewList:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items: { $ref: "#/components/schemas/PluginView" }

    CliToolRegistryItem:
      type: object
      properties:
        name: { type: string }
        backends:
          type: array
          items: { type: string }

    CliToolRegistryResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: "#/components/schemas/CliToolRegistryItem" }

    CliToolLatestResponse:
      type: object
      required: [version]
      properties:
        version: { type: string }
