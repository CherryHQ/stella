openapi: 3.0.3
info:
  title: Plugins Components
  version: "1"
paths: {}
components:
  schemas:
    NativePlugin:
      type: object
      additionalProperties: false
      required: [id, is_enabled]
      properties:
        id: { type: string }
        is_enabled: { type: boolean }
    NativePluginList:
      type: object
      required: [native_plugins, next_page_token]
      properties:
        native_plugins:
          type: array
          items: { $ref: "#/components/schemas/NativePlugin" }
        next_page_token: { type: string, nullable: true }
    NativeAgentDeny:
      type: object
      additionalProperties: false
      required: [native_id, agent_id, is_denied]
      properties:
        native_id: { type: string }
        agent_id: { type: string }
        is_denied: { type: boolean }
    NativeAgentDenyList:
      type: object
      required: [denials, next_page_token]
      properties:
        denials:
          type: array
          items: { $ref: "#/components/schemas/NativeAgentDeny" }
        next_page_token: { type: string, nullable: true }
    CreateNativeAgentDenyRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id: { type: string }
    UpdateNativePluginRequest:
      type: object
      additionalProperties: false
      required: [is_enabled]
      properties:
        is_enabled: { type: boolean }
    PluginResource:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - display_name
        - version
        - description
        - scope
        - content_digest
        - settings_digest
        - is_enabled
        - is_forbidden
        - is_read_only
        - is_overridden
        - diagnostics
        - files
        - resource_summary
      properties:
        id:
          type: string
          readOnly: true
          description: Stable identifier of this visible plugin resource.
        name:
          type: string
          description: Plugin package name within its owning scope.
        display_name:
          type: string
          description: Human-readable plugin name.
        version:
          type: string
          description: Plugin package version.
        description:
          type: string
          description: Safe plugin description.
        scope:
          type: string
          enum: [system, system_agent, user, user_agent]
          description: Scope that owns this raw plugin declaration.
        user_id:
          type: string
          format: uuid
          readOnly: true
          description: User that owns a user-scoped resource.
        agent_id:
          type: string
          readOnly: true
          description: Agent that owns an agent-scoped resource.
        content_digest:
          type: string
          readOnly: true
          description: Digest of the complete plugin declaration files.
        settings_digest:
          type: string
          readOnly: true
          description: Digest used to protect enablement changes.
        is_enabled:
          type: boolean
          description: Whether this raw declaration is enabled at its scope.
        is_forbidden:
          type: boolean
          readOnly: true
          description: Whether policy forbids this resource from activation.
        is_read_only:
          type: boolean
          readOnly: true
          description: Whether this resource cannot be edited at its scope.
        is_overridden:
          type: boolean
          readOnly: true
          description: Whether a more specific visible resource declaration overrides this resource.
        diagnostics:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/PluginDiagnostic" }
          description: Safe validation diagnostics for this raw declaration.
        files:
          type: array
          readOnly: true
          maxItems: 1000
          items: { $ref: "#/components/schemas/ResourceFileInfo" }
          description: Bounded metadata for files in this plugin declaration.
        resource_summary:
          $ref: "#/components/schemas/PluginResourceSummary"
    PluginDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [info, warning, error]
          description: Diagnostic severity.
        code:
          type: string
          description: Stable diagnostic code.
        path:
          type: string
          description: Optional declaration path associated with the diagnostic.
        message:
          type: string
          description: Safe diagnostic message.
    ResourceFileInfo:
      type: object
      additionalProperties: false
      required: [path, size, is_executable]
      properties:
        path:
          type: string
          description: Relative path inside the plugin declaration.
        size:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: File size in bytes.
        is_executable:
          type: boolean
          description: Whether the file has executable permission.
    PluginFileInput:
      type: object
      additionalProperties: false
      required: [content_base64]
      properties:
        content_base64:
          type: string
          format: byte
          description: Base64-encoded file content.
        is_executable:
          type: boolean
          default: false
          description: Whether the stored file should be executable.
    ResourceFileContent:
      type: object
      additionalProperties: false
      required: [path, content_base64, is_executable, resource_digest]
      properties:
        path:
          type: string
          description: Relative path inside the plugin declaration.
        content_base64:
          type: string
          format: byte
          description: Base64-encoded file content.
        is_executable:
          type: boolean
          description: Whether the file has executable permission.
        resource_digest:
          type: string
          readOnly: true
          description: Digest of the complete resource after this read.
    PluginList:
      type: object
      required: [plugins, next_page_token]
      properties:
        plugins:
          type: array
          items: { $ref: "#/components/schemas/PluginResource" }
        next_page_token:
          type: string
          nullable: true
    CreatePluginRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [name, scope, files]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^(?!.*(?:--|\.\.))[a-z0-9](?:[a-z0-9.-]{0,62}[a-z0-9])?$'
          description: Plugin package name to create.
        scope:
          type: string
          enum: [system, system_agent, user, user_agent]
          description: Scope that owns the new raw declaration.
        agent_id:
          type: string
          description: Target Agent for an agent-scoped declaration.
        files:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/PluginFileInput"
          description: Relative declaration paths and their base64-encoded contents.
    ImportPluginRequest:
      description: Import is admin-only; source_path is server-local and remains subject to the existing import restrictions.
      type: object
      additionalProperties: false
      required: [source_path, scope]
      properties:
        source_path:
          type: string
          minLength: 1
          description: Server-local path to an Agent Plugin package directory.
        scope:
          type: string
          enum: [system, system_agent, user, user_agent]
          description: Scope that owns the imported raw declaration.
        agent_id:
          type: string
          description: Target Agent for an agent-scoped import.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional target package name; defaults to the source package name.
    CopyPluginRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          type: string
          enum: [system, system_agent, user, user_agent]
          description: Scope that owns the copied raw declaration.
        agent_id:
          type: string
          description: Target Agent for an agent-scoped copy.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional target package name; defaults to the source name.
    UpdatePluginRequest:
      type: object
      additionalProperties: false
      required: [is_enabled, expected_settings_digest]
      properties:
        is_enabled:
          type: boolean
          description: Whether to enable or disable this raw declaration.
        expected_settings_digest:
          type: string
          description: Exact settings digest read before this update; empty when settings.json is absent.
    UpdatePluginFileRequest:
      description: JSON request body is limited to 1 MiB; larger requests return HTTP 400.
      type: object
      additionalProperties: false
      required: [path, content_base64, expected_digest]
      properties:
        path:
          type: string
          minLength: 1
          description: Relative path inside the plugin declaration.
        content_base64:
          type: string
          format: byte
          description: Base64-encoded replacement file content.
        is_executable:
          type: boolean
          description: Whether the replacement file should be executable.
        expected_digest:
          type: string
          minLength: 1
          description: Exact current content digest required for the update.
    PluginResourceSummary:
      type: object
      additionalProperties: false
      required: [
        binaries,
        skills,
        session_env,
        mcp_servers,
        oauth_provider_configured,
      ]
      properties:
        binaries:
          type: array
          items: { $ref: "#/components/schemas/PluginCLIBackendBinarySummary" }
        skills:
          type: array
          items: { $ref: "#/components/schemas/PluginCLIBackendSkillSummary" }
        session_env:
          type: array
          items: {
            $ref: "#/components/schemas/PluginCLIBackendSessionEnvSummary",
          }
        oauth_provider_configured: { type: boolean }
        mcp_servers:
          type: array
          items: { $ref: "#/components/schemas/PluginMCPServerSummary" }
    PluginCLIBackendBinarySummary:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    PluginCLIBackendSkillSummary:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
    PluginCLIBackendSessionEnvSummary:
      type: object
      additionalProperties: false
      required: [env_var, source, required]
      properties:
        env_var: { type: string }
        source: { type: string }
        required: { type: boolean }
    PluginMCPServerSummary:
      type: object
      additionalProperties: false
      required: [
        server_key,
        endpoint_configured,
        bearer_configured,
        oauth_client_id_configured,
        oauth_client_secret_configured,
      ]
      properties:
        server_key: { type: string }
        child_id: { type: string, format: uuid, readOnly: true }
        parent_config_id: { type: string, format: uuid, readOnly: true }
        parent_revision: { type: integer, format: int64, readOnly: true }
        transport: { type: string, enum: [streamable_http, sse] }
        auth_type: { type: string, enum: [none, bearer, oauth] }
        credential_mode: { type: string, enum: [shared, per_user] }
        endpoint_configured: { type: boolean }
        bearer_configured: { type: boolean }
        oauth_client_id_configured: { type: boolean }
        oauth_client_secret_configured: { type: boolean }
    CliToolRegistryItem:
      type: object
      properties:
        name: { type: string }
        backends: { type: array, items: { type: string } }
    CliToolRegistryResponse:
      type: object
      required: [tools]
      properties:
        tools: {
          type: array,
          items: { $ref: "#/components/schemas/CliToolRegistryItem" },
        }
    CliToolLatestResponse:
      type: object
      required: [version]
      properties:
        version: { type: string }
