paths:
  /api/plugins:
    get:
      tags: [plugins]
      summary: List all plugins (admin only)
      operationId: listPlugins
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginViewList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      tags: [plugins]
      summary: Toggle plugin enabled state (admin only)
      operationId: togglePlugin
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/TogglePluginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}/status:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get plugin status (admin only)
      operationId: getPluginStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}/config:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get plugin config (admin only)
      operationId: getPluginConfig
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    patch:
      tags: [plugins]
      summary: Update plugin config (admin only)
      operationId: updatePluginConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdatePluginConfigRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}/config-schema:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get plugin config schema (admin only)
      operationId: getPluginConfigSchema
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/manifest-plugins:
    get:
      tags: [plugins]
      summary: List manifest plugins (admin only)
      operationId: listManifestPlugins
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/ManifestPluginsResponse"
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    patch:
      tags: [plugins]
      summary: Save manifest plugins (admin only)
      operationId: saveManifestPlugins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plugins:
                  type: array
                  items: {
                    $ref: "../../components.yaml#/components/schemas/ManifestPlugin",
                  }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/ManifestPluginsResponse"
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/manifest-plugins/{kind}/{name}:
    delete:
      tags: [plugins]
      summary: Remove a custom manifest plugin (admin only)
      description: >
        Removes a plugin an admin added. Builtin plugins ship with the server and
        cannot be removed — disable them instead.
      operationId: deleteManifestPlugin
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/manifest-plugins/{kind}/{name}/reset:
    post:
      tags: [plugins]
      summary: Reset a builtin plugin to its shipped definition (admin only)
      description: >
        Drops the stored customization of a builtin plugin so its definition
        follows the running server again. The enable switch is a separate
        decision and is left alone. A plugin an admin added has no shipped
        definition to return to and is refused — delete it instead.
      operationId: resetManifestPlugin
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/ManifestPluginsResponse"
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/manifest-plugins/sync:
    post:
      tags: [plugins]
      summary: Sync manifest plugins (admin only)
      operationId: syncManifestPlugins
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/cli-tools/registry:
    get:
      tags: [plugins]
      summary: Search the mise tool registry (admin only)
      operationId: searchCliToolRegistry
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolRegistryResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/cli-tools/latest:
    get:
      tags: [plugins]
      summary: Resolve the latest version for a mise tool (admin only)
      operationId: getCliToolLatest
      parameters:
        - name: tool
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolLatestResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
