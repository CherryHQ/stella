paths:
  /api/plugins:
    get:
      tags: [plugins]
      summary: List all plugins (admin only)
      operationId: listPlugins
      x-agent-tool: { tool: "settings_plugin", action: "list" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginViewList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      tags: [plugins]
      summary: Toggle plugin enabled state (admin only)
      operationId: togglePlugin
      x-agent-tool:
        - {
            tool: "settings_plugin",
            action: "enable",
            fixed: { enabled: true },
          }
        - {
            tool: "settings_plugin",
            action: "disable",
            fixed: { enabled: false },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/TogglePluginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}/status:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get plugin status (admin only)
      operationId: getPluginStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}/config:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get plugin config (admin only)
      operationId: getPluginConfig
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    patch:
      tags: [plugins]
      summary: Update plugin config (admin only)
      operationId: updatePluginConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdatePluginConfigRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/plugins/{kind}/{name}/config-schema:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get plugin config schema (admin only)
      operationId: getPluginConfigSchema
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/manifest-plugins:
    get:
      tags: [plugins]
      summary: List manifest plugins (admin only)
      operationId: listManifestPlugins
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/ManifestPluginsResponse"
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
  /api/manifest-plugins/{kind}/{name}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [plugins]
      summary: Update one manifest plugin's definition (admin only)
      description: >
        Updates the definition of the addressed plugin. For a builtin, `fields`
        names the definition fields this request takes ownership of: those keys
        are stored at the submitted values, every other field of the plugin keeps
        whatever ownership it already had, and unowned fields keep following the
        definition the server ships. `kind` and `essential` belong to the server
        and cannot be owned. `enabled` is ignored for a builtin — the enable
        switch has its own operation. A plugin an admin added has no shipped
        definition underneath it, so the body is the whole plugin, `fields` does
        not apply, `enabled` travels with it, and empty values explicitly clear
        optional definition fields.
      operationId: saveManifestPluginDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../components.yaml#/components/schemas/SaveManifestPluginDefinitionRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/ManifestPluginsResponse"
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    delete:
      tags: [plugins]
      summary: Remove a custom manifest plugin (admin only)
      description: >
        Removes a plugin an admin added. Builtin plugins ship with the server and
        cannot be removed — disable them instead.
      operationId: deleteManifestPlugin
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/manifest-plugins/{kind}/{name}/enabled:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [plugins]
      summary: Enable or disable one manifest plugin (admin only)
      description: >
        Turns the addressed plugin on or off without touching its definition.
        Essential builtin plugins back core tools and cannot be disabled.
      operationId: setManifestPluginEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/ManifestPluginsResponse"
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/manifest-plugins/{kind}/{name}/reset:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [plugins]
      summary: Reset a builtin plugin to its shipped definition (admin only)
      description: >
        Hands a builtin's definition back to the running server: one field when
        `field` names one, the whole definition otherwise. The enable switch is a
        separate decision and is left alone. A plugin an admin added has no
        shipped definition to return to and is refused — delete it instead.
      operationId: resetManifestPlugin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  type: string
                  description: >
                    Definition field to hand back, e.g. "binaries". Omit to reset
                    the whole definition.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "../../components.yaml#/components/schemas/ManifestPluginsResponse"
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/manifest-plugins/sync:
    post:
      tags: [plugins]
      summary: Sync manifest plugins (admin only)
      operationId: syncManifestPlugins
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/cli-tools/registry:
    get:
      tags: [plugins]
      summary: Search the mise tool registry (admin only)
      operationId: searchCliToolRegistry
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolRegistryResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/cli-tools/latest:
    get:
      tags: [plugins]
      summary: Resolve the latest version for a mise tool (admin only)
      operationId: getCliToolLatest
      parameters:
        - name: tool
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolLatestResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
