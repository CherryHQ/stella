paths:
  /api/native-plugins:
    get:
      tags: [plugins]
      summary: List native plugins
      operationId: listNativePlugins
      parameters:
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/NativePluginList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "500": {
          $ref: "../../components.yaml#/components/responses/InternalServerError",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/native-plugins/{kind}/{name}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get a native plugin global switch
      operationId: getNativePlugin
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/NativePlugin",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "500": {
          $ref: "../../components.yaml#/components/responses/InternalServerError",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [plugins]
      summary: Update a native plugin global switch
      operationId: updateNativePlugin
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateNativePluginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/NativePlugin",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "500": {
          $ref: "../../components.yaml#/components/responses/InternalServerError",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/native-plugins/{kind}/{name}/agent-denials:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: List native plugin Agent denies
      operationId: listNativePluginAgentDenials
      parameters:
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/NativeAgentDenyList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "500": {
          $ref: "../../components.yaml#/components/responses/InternalServerError",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    post:
      tags: [plugins]
      summary: Deny one Agent native plugin access
      operationId: createNativePluginAgentDeny
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateNativeAgentDenyRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/NativeAgentDeny",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "500": {
          $ref: "../../components.yaml#/components/responses/InternalServerError",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/native-plugins/{kind}/{name}/agent-denials/{agent_id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: agent_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get one Agent native plugin deny
      operationId: getNativePluginAgentDeny
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/NativeAgentDeny",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "500": {
          $ref: "../../components.yaml#/components/responses/InternalServerError",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [plugins]
      summary: Remove one Agent native plugin deny
      operationId: allowNativePluginAgent
      responses:
        "204": { description: deleted }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "500": {
          $ref: "../../components.yaml#/components/responses/InternalServerError",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins:
    get:
      tags: [plugins]
      summary: List raw plugin resources visible to the caller
      operationId: listPlugins
      x-agent-tool:
        tool: settings_plugin
        action: list
        omit: [page_size, page_token, scope, agent_id]
      parameters:
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 20 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
        - name: scope
          in: query
          required: false
          description: Restrict results to one raw resource scope; omit to list all visible system, user, and requested-Agent layers.
          schema: {
            type: string,
            enum: [system, system_agent, user, user_agent],
          }
        - name: agent_id
          in: query
          required: false
          description: Restrict results to resources for this authorized Agent and its system/user layers.
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    post:
      tags: [plugins]
      summary: Create a raw plugin resource from declaration files
      operationId: createPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreatePluginRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginResource",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/import:
    post:
      tags: [plugins]
      summary: Import a plugin package directory into a target raw resource scope (admin only)
      operationId: importPluginPackage
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ImportPluginRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginResource",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{plugin_id}:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [plugins]
      summary: Get a visible raw plugin resource
      operationId: getPlugin
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginResource",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [plugins]
      summary: Enable or disable a raw plugin resource
      operationId: updatePlugin
      x-agent-tool:
        - tool: settings_plugin
          action: enable
          fixed: { is_enabled: true }
          body: false
        - tool: settings_plugin
          action: disable
          fixed: { is_enabled: false }
          body: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdatePluginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginResource",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [plugins]
      summary: Delete a raw plugin resource declaration without changing policy or grant files
      operationId: deletePlugin
      parameters:
        - name: expected_digest
          in: query
          required: true
          description: Exact current content digest required for deletion.
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{plugin_id}/copy:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [plugins]
      summary: Copy a complete plugin resource to a target scope
      operationId: copyPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CopyPluginRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginResource",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{plugin_id}/file:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [plugins]
      summary: Read one plugin declaration file
      operationId: getPluginFile
      parameters:
        - name: path
          in: query
          required: true
          description: Relative declaration path to read.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ResourceFileContent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [plugins]
      summary: Replace one plugin declaration file
      operationId: updatePluginFile
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdatePluginFileRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginResource",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [plugins]
      summary: Delete one plugin declaration file
      operationId: deletePluginFile
      parameters:
        - name: path
          in: query
          required: true
          description: Relative declaration path to delete.
          schema: { type: string, minLength: 1 }
        - name: expected_digest
          in: query
          required: true
          description: Exact current content digest required for deletion.
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/cli-tools/registry:
    get:
      tags: [plugins]
      summary: Search the mise tool registry (admin only)
      operationId: searchCliToolRegistry
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, default: 30 },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolRegistryResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
  /api/cli-tools/latest:
    get:
      tags: [plugins]
      summary: Resolve the latest version for a mise tool (admin only)
      operationId: getCliToolLatest
      parameters:
        - { name: tool, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolLatestResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
