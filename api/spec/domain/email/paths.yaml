paths:
  /api/email/accounts:
    get:
      tags: [email]
      summary: List configured email accounts
      operationId: listEmailAccounts
      # The resource lives in the action key, not in `resource`: the family has
      # two resources and toolgen keys dispatch on the action alone, so
      # `resource: message` + `action: list` would collide with the account
      # list.
      x-agent-tool: { tool: "email", action: "account_list" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/EmailAccountList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/email/folders:
    get:
      tags: [email]
      summary: List email folders
      operationId: listEmailFolders
      parameters:
        - name: account
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/EmailFolderList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/email/messages:
    get:
      tags: [email]
      summary: List email messages
      operationId: listEmailMessages
      # add narrows limit to what this handler actually honours: the HTTP
      # endpoint accepts 500, the tool refuses anything over 100, and a schema
      # maximum the handler then rejects teaches the model something false.
      x-agent-tool: {
        tool: "email",
        action: "message_list",
        add: {
          limit: {
            type: integer,
            default: 20,
            minimum: 1,
            maximum: 100,
            description: "Maximum envelopes to return.",
          },
        },
      }
      parameters:
        - {
            name: account,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: folder,
            in: query,
            required: false,
            schema: { type: string, default: "INBOX" },
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, default: 20, minimum: 1, maximum: 500 },
          }
        - {
            name: unread,
            in: query,
            required: false,
            schema: { type: boolean },
          }
        - { name: from, in: query, required: false, schema: { type: string } }
        - {
            name: subject,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: since,
            in: query,
            required: false,
            schema: { type: string, format: date },
          }
        - {
            name: before,
            in: query,
            required: false,
            schema: { type: string, format: date },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/EmailEnvelopeList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/email/messages/{uid}:
    parameters:
      - {
          name: uid,
          in: path,
          required: true,
          schema: { type: integer, minimum: 1, maximum: 4294967295 },
        }
    get:
      tags: [email]
      summary: Read an email message
      operationId: getEmailMessage
      x-agent-tool: { tool: "email", action: "message_read" }
      parameters:
        - {
            name: account,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: folder,
            in: query,
            required: false,
            schema: { type: string, default: "INBOX" },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/EmailMessage",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": {
          $ref: "../../components.yaml#/components/responses/NotFound",
        }

  /api/email/send:
    post:
      tags: [email]
      summary: Send an email
      operationId: sendEmail
      x-agent-tool: {
        tool: "email",
        action: "message_send",
        require: [idempotency_key],
      }
      parameters:
        - {
            name: account,
            in: query,
            required: false,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/EmailSendRequest",
            }
      responses:
        "204":
          description: sent
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/email/messages/{uid}/mark:
    parameters:
      - {
          name: uid,
          in: path,
          required: true,
          schema: { type: integer, minimum: 1, maximum: 4294967295 },
        }
    post:
      tags: [email]
      summary: Mark an email message as read or unread
      operationId: markEmailMessage
      parameters:
        - {
            name: account,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: folder,
            in: query,
            required: false,
            schema: { type: string, default: "INBOX" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/EmailMarkRequest",
            }
      responses:
        "204":
          description: marked
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": {
          $ref: "../../components.yaml#/components/responses/NotFound",
        }
