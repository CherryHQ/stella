openapi: 3.0.3
info:
  title: Embedding Components
  version: "1"
paths: {}
components:
  schemas:
    EmbeddingSettings:
      type: object
      description: >
        Deployment-wide semantic-search lane configuration. The model the lane
        runs on and the credentials it calls with are not here: they come from
        the deployment default models (model_embedding) and that model's
        provider.
      required: [enabled, dim, normalize]
      properties:
        enabled: { type: boolean }
        dim:
          type: integer
          description: >
            Requested output dimension. 0 means the model's native width.
        normalize: { type: boolean }

    EmbeddingSettingsUpdate:
      type: object
      description: >
        Update payload for the embedding lane. Enabling the lane requires
        model_embedding to resolve to a provider that has an API key.
      required: [enabled, dim, normalize]
      properties:
        enabled: { type: boolean }
        dim: { type: integer }
        normalize: { type: boolean }
