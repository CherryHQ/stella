openapi: 3.0.3
info:
  title: Embedding Components
  version: "1"
paths: {}
components:
  schemas:
    EmbeddingSettings:
      type: object
      description: >
        Deployment-wide semantic-search lane configuration. The model the lane
        runs on and the credentials it calls with are not here: they come from
        the deployment default models (model_embedding) and that model's
        provider.
      required: [enabled, dim, normalize, active]
      properties:
        enabled:
          type: boolean
          description: >
            Whether an admin has asked for the lane. This is intent: it can be
            true while the lane is not running.
        dim:
          type: integer
          description: >
            Requested output dimension. 0 means the model's native width.
        normalize: { type: boolean }
        active:
          type: boolean
          readOnly: true
          description: >
            Whether the lane is actually running: enabled AND model_embedding
            resolves to a configured provider that has an API key. Read-only —
            the server derives it.

    EmbeddingSettingsUpdate:
      type: object
      description: >
        Update payload for the embedding lane. `enabled` records intent: the
        lane only runs once model_embedding resolves to a configured provider,
        and reports itself off until then.
      required: [enabled, dim, normalize]
      properties:
        enabled: { type: boolean }
        dim: { type: integer }
        normalize: { type: boolean }
