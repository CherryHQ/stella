paths:
  /api/mcp/servers:
    get:
      tags: [mcp]
      summary: List file-backed MCP servers visible to the caller
      operationId: listMCPServers
      x-agent-tool:
        tool: settings_mcp
        resource: server
        action: list
        omit: [scope, agent_id]
        input:
          $ref: "../../components.yaml#/components/schemas/MCPServerToolListInput"
      parameters:
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [system, system_agent, user, user_agent],
          }
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 20 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServerList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    post:
      tags: [mcp]
      summary: Create one standalone MCP declaration file
      operationId: createMCPServer
      x-agent-tool:
        tool: settings_mcp
        resource: server
        action: create
        input:
          $ref: "../../components.yaml#/components/schemas/MCPServerToolCreateInput"
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateMCPServerRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/mcp/servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [mcp]
      summary: Get one file-backed MCP server
      operationId: getMCPServer
      x-agent-tool: { tool: settings_mcp, resource: server, action: get }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [mcp]
      summary: Update one file-backed MCP declaration or enablement
      operationId: updateMCPServer
      x-agent-tool:
        tool: settings_mcp
        resource: server
        action: update
        input:
          $ref: "../../components.yaml#/components/schemas/MCPServerToolUpdateInput"
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateMCPServerRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [mcp]
      summary: Delete one standalone MCP declaration
      operationId: deleteMCPServer
      x-agent-tool: { tool: settings_mcp, resource: server, action: delete }
      parameters:
        - name: expected_digest
          in: query
          required: true
          description: Exact current declaration digest required for deletion.
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/mcp/servers/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [mcp]
      summary: Read one standalone MCP declaration file
      operationId: getMCPServerFile
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ResourceFileContent",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [mcp]
      summary: Replace one standalone MCP declaration file
      operationId: updateMCPServerFile
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateMCPServerFileRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/mcp/servers/{id}/credentials:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [mcp]
      summary: Store one bearer token or OAuth client secret for an MCP declaration
      operationId: updateMCPServerCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateMCPServerCredentialsRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/mcp/servers/{id}/probe:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      summary: Probe one MCP server and return its current tools
      operationId: probeMCPServer
      x-agent-tool: { tool: settings_mcp, resource: server, action: probe }
      responses:
        "200":
          description: probe result
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/mcp/servers/{id}/oauth/start:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      summary: Begin OAuth for one MCP server
      operationId: startMCPServerOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_digest]
              properties:
                expected_digest: { type: string, minLength: 1 }
      responses:
        "201":
          description: authorization started
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPOAuthStart",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/mcp/servers/{id}/oauth/disconnect:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      summary: Disconnect the current OAuth grant for one MCP server
      operationId: disconnectMCPServerOAuth
      responses:
        "200":
          description: disconnected
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/mcp/oauth/callback:
    get:
      tags: [mcp]
      summary: MCP OAuth callback (browser redirect, unauthenticated)
      operationId: mcpOAuthCallback
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: redirect on success or fixed-enum error }
        "400": { description: bad request }

  /api/mcp/registry/servers:
    get:
      tags: [mcp]
      summary: Search the MCP marketplace catalog
      operationId: listMCPRegistryServers
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page_size
          in: query
          required: false
          description: >-
            Minimum matches per page. The registry has no transport filter, so
            a page may hold up to one upstream page more than requested.
          schema: { type: integer, default: 20, maximum: 50, minimum: 1 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPRegistryServerList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "503":
          description: registry rate limited or unavailable

  /api/mcp/registry/servers/{source}/{id}:
    parameters:
      - { name: source, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mcp]
      summary: Fetch one MCP marketplace server
      operationId: getMCPRegistryServer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPRegistryServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503":
          description: registry rate limited or unavailable
