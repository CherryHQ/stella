paths:
  /api/mcp/servers:
    get:
      tags: [mcp]
      summary: List scoped MCP server registrations
      operationId: listScopedMCPServers
      x-agent-tool: {
        tool: "settings_mcp",
        resource: "server",
        action: "list",
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registrations are listed.,
          },
          limit: {
            type: integer,
            default: 50,
            maximum: 50,
            description: Maximum registrations to return before truncation.,
          },
        },
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServerList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [mcp]
      summary: Register a scoped MCP server
      operationId: createScopedMCPServer
      x-agent-tool: {
        tool: "settings_mcp",
        resource: "server",
        action: "create",
        fixed: { auth_type: none },
        omit: [token],
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is created.,
          },
        },
      }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateMCPServerRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/mcp/servers/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: "MCP server id",
        }
    get:
      tags: [mcp]
      summary: Get a scoped MCP server registration
      operationId: getScopedMCPServer
      x-agent-tool: {
        tool: "settings_mcp",
        resource: "server",
        action: "get",
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is read.,
          },
        },
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [mcp]
      summary: Update a scoped MCP server registration
      operationId: updateScopedMCPServer
      x-agent-tool: {
        tool: "settings_mcp",
        resource: "server",
        action: "update",
        omit: [auth_type, token, "If-Match"],
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is updated.,
          },
          expected_version: {
            type: string,
            minLength: 1,
            description: Opaque version returned by settings_mcp_server_get.,
          },
        },
        require: [expected_version],
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: Optional opaque version; a stale value returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateMCPServerRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
    delete:
      tags: [mcp]
      summary: Remove a scoped MCP server registration
      operationId: deleteScopedMCPServer
      x-agent-tool: {
        tool: "settings_mcp",
        resource: "server",
        action: "delete",
        omit: ["If-Match"],
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is deleted.,
          },
          expected_version: {
            type: string,
            minLength: 1,
            description: Opaque version returned by settings_mcp_server_get.,
          },
        },
        require: [expected_version],
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: Optional opaque version; a stale value returns 409.
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/mcp/servers/{id}/probe:
    post:
      tags: [mcp]
      summary: Probe a scoped MCP server and refresh its tool catalog
      description: >-
        Connects to the server, runs tools/list, and persists the result. Always
        returns 200 with the updated server; a failed probe is reported through
        status=error / status=needs_auth with a redacted reason, not an error
        response.
      operationId: probeMCPServer
      x-agent-tool: {
        tool: "settings_mcp",
        resource: "server",
        action: "probe",
        body: false,
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is probed.,
          },
        },
      }
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string },
            description: "MCP server id",
          }
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: probe result (success or failure) persisted
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/mcp/servers/{id}/oauth-start:
    post:
      tags: [mcp]
      summary: Begin an OAuth authorization for a scoped MCP server
      operationId: startMCPOAuth
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string },
            description: "MCP server id",
          }
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "201":
          description: authorization started
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPOAuthStart",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/mcp/servers/{id}/oauth-disconnect:
    post:
      tags: [mcp]
      summary: Remove stored OAuth authorization for a scoped MCP server
      operationId: disconnectMCPOAuth
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string },
            description: "MCP server id",
          }
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: disconnected
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/mcp/oauth/callback:
    get:
      tags: [mcp]
      summary: MCP OAuth callback (browser redirect, unauthenticated)
      operationId: mcpOAuthCallback
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: redirect on success or fixed-enum error
        "400":
          description: bad request
