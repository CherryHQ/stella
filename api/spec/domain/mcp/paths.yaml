paths:
  /api/mcp/servers:
    get:
      tags: [mcp]
      summary: List MCP child servers visible to the caller
      operationId: listMCPServers
      parameters:
        - {
            name: parent_config_id,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServerList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    post:
      tags: [mcp]
      summary: Create one MCP child server under a package config
      operationId: createMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateMCPServerRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/mcp/servers/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      tags: [mcp]
      summary: Get one MCP child server
      operationId: getMCPServer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [mcp]
      summary: Update one MCP child server through its parent revision
      operationId: updateMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateMCPServerRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [mcp]
      summary: Delete one MCP child server through its parent revision
      operationId: deleteMCPServer
      parameters:
        - {
            name: expected_parent_revision,
            in: query,
            required: true,
            schema: { type: integer, format: int64, minimum: 1 },
          }
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/mcp/servers/{id}/probe:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [mcp]
      summary: Probe one MCP child server
      operationId: probeMCPServer
      responses:
        "200":
          description: probe result
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/mcp/servers/{id}/oauth/start:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [mcp]
      summary: Begin OAuth for one MCP child server
      operationId: startMCPServerOAuth
      responses:
        "201":
          description: authorization started
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPOAuthStart",
              }

  /api/mcp/servers/{id}/oauth/disconnect:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [mcp]
      summary: Disconnect OAuth for one MCP child server
      operationId: disconnectMCPServerOAuth
      responses:
        "200":
          description: disconnected
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }

  /api/mcp/oauth/callback:
    get:
      tags: [mcp]
      summary: MCP OAuth callback (browser redirect, unauthenticated)
      operationId: mcpOAuthCallback
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: redirect on success or fixed-enum error
        "400":
          description: bad request

  /api/mcp/registry/servers:
    get:
      tags: [mcp]
      summary: Search the MCP marketplace catalog
      operationId: listMCPRegistryServers
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page_size
          in: query
          required: false
          description: >-
            Minimum matches per page. The registry has no transport filter, so
            a page may hold up to one upstream page more than requested.
          schema: { type: integer, default: 20, maximum: 50, minimum: 1 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPRegistryServerList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "503":
          description: registry rate limited or unavailable

  /api/mcp/registry/servers/{source}/{id}:
    parameters:
      - { name: source, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [mcp]
      summary: Fetch one MCP marketplace server
      operationId: getMCPRegistryServer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPRegistryServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503":
          description: registry rate limited or unavailable
