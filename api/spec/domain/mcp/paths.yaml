paths:
  /api/mcp/servers:
    get:
      tags: [mcp]
      summary: List scoped MCP server registrations
      operationId: listScopedMCPServers
      x-agent-tool: {
        tool: "mcp",
        resource: "server",
        action: "list",
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registrations are listed.,
          },
        },
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServerList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [mcp]
      summary: Register a scoped MCP server
      operationId: createScopedMCPServer
      x-agent-tool: {
        tool: "mcp",
        resource: "server",
        action: "create",
        fixed: { auth_type: none },
        omit: [token],
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is created.,
          },
        },
      }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateMCPServerRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/mcp/servers/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: "MCP server id",
        }
    get:
      tags: [mcp]
      summary: Get a scoped MCP server registration
      operationId: getScopedMCPServer
      x-agent-tool: {
        tool: "mcp",
        resource: "server",
        action: "get",
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is read.,
          },
        },
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [mcp]
      summary: Update a scoped MCP server registration
      operationId: updateScopedMCPServer
      x-agent-tool: {
        tool: "mcp",
        resource: "server",
        action: "update",
        omit: [auth_type, token],
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is updated.,
          },
          expected_version: {
            type: string,
            description: Opaque version returned by mcp_server_get.,
          },
        },
        require: [expected_version],
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateMCPServerRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPServer",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [mcp]
      summary: Remove a scoped MCP server registration
      operationId: deleteScopedMCPServer
      x-agent-tool: {
        tool: "mcp",
        resource: "server",
        action: "delete",
        add: {
          target_agent_id: {
            type: string,
            description: Optional Agent whose scoped registration is deleted.,
          },
          expected_version: {
            type: string,
            description: Opaque version returned by mcp_server_get.,
          },
        },
        require: [expected_version],
      }
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
