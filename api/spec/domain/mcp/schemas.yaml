openapi: 3.0.3
info:
  title: MCP Components
  version: "1"
paths: {}
components:
  schemas:
    MCPServer:
      type: object
      required: [
        id,
        scope,
        name,
        url,
        transport,
        auth_type,
        enabled,
        status,
        credential_mode,
      ]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        user_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        url: { type: string }
        transport:
          type: string
          enum: [streamable_http, sse]
        auth_type:
          type: string
          enum: [none, bearer, oauth]
        enabled: { type: boolean }
        status:
          type: string
          enum: [unknown, ok, error, needs_auth]
          description: Result of the last probe (or credential rejection).
        status_error:
          type: string
          description: Redacted failure reason when status is error or needs_auth.
        probed_at:
          type: string
          format: date-time
          nullable: true
          description: When the server was last probed; null if never.
        tools:
          type: array
          description: Snapshot of the server's tools/list from the last successful probe.
          items: { $ref: "#/components/schemas/MCPTool" }
        credential_mode:
          type: string
          enum: [shared, per_user]
        version:
          type: string
          description: Opaque version digest; send it as If-Match on PATCH/DELETE.
        oauth:
          type: object
          description: >-
            OAuth connection state computed for the calling user (per_user) or
            the registration owner (shared). Never carries token material.
          required: [connected, needs_reconnect, client_registered]
          properties:
            connected: { type: boolean }
            access_expires_at:
              type: string
              format: date-time
              nullable: true
            needs_reconnect: { type: boolean }
            client_registered: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MCPOAuthStart:
      type: object
      required: [authorization_url, flow_id, expires_at]
      properties:
        authorization_url: {
          type: string,
          description: Open this in a browser to authorize.,
        }
        flow_id: { type: string }
        expires_at: { type: string, format: date-time }

    MCPTool:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true

    MCPServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPServer" }

    CreateMCPServerRequest:
      type: object
      required: [name, url, scope]
      properties:
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        agent_id: { type: string }
        name: { type: string }
        url: { type: string }
        transport:
          type: string
          enum: [streamable_http, sse]
          default: streamable_http
        auth_type:
          type: string
          enum: [none, bearer, oauth]
          default: none
        # token is the bearer credential; stored encrypted in the vault and never
        # returned by any response.
        token: { type: string }
        # oauth_client_id is the public pre-registered client id; without it the
        # server's registration endpoint (DCR) is used on the first oauth-start.
        oauth_client_id: { type: string, writeOnly: true }
        # oauth_client_secret is stored encrypted in the vault and never returned.
        oauth_client_secret: { type: string, writeOnly: true }
        credential_mode:
          type: string
          enum: [shared, per_user]
          default: shared
          description: per_user is only valid with auth_type oauth.
        # Marketplace provenance, written into metadata.registry on install.
        source: { type: string, writeOnly: true }
        source_id: { type: string, writeOnly: true }
        source_version: { type: string, writeOnly: true }

    UpdateMCPServerRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        agent_id: { type: string }
        name: { type: string }
        url: { type: string }
        # Same OAuth client fields as create; empty oauth_client_id removes the
        # stored id, empty oauth_client_secret clears the vault secret.
        oauth_client_id: { type: string, writeOnly: true }
        oauth_client_secret: { type: string, writeOnly: true }
        credential_mode:
          type: string
          enum: [shared, per_user]
        transport:
          type: string
          enum: [streamable_http, sse]
        auth_type:
          type: string
          enum: [none, bearer, oauth]
        enabled: { type: boolean }
        # Omit token to keep the existing bearer token. Send with auth_type=bearer
        # to replace it. Send auth_type=none to delete any stored token.
        token: { type: string }

    MCPRegistryServer:
      type: object
      required: [source, id, name, url, transport, auth]
      properties:
        source:
          type: string
          description: Registry source this row came from (currently always official).
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        url:
          type: string
          description: Connection URL of the first streamable-http remote.
        transport:
          type: string
          enum: [streamable_http]
        auth:
          type: string
          enum: [none, bearer, unsupported]
          description: >-
            Install-time classification from the advertised headers. bearer
            means a single Authorization: Bearer header; unsupported means the
            entry needs manual header setup. OAuth is not advertised by the
            registry and is discovered by the probe after install.
        headers:
          type: array
          description: Install-time header requirements advertised by the registry.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              template:
                type: string
                description: 'Raw value template, e.g. "Bearer {smithery_api_key}"; never a secret itself.'
              required: { type: boolean }
              is_secret: { type: boolean }
              description: { type: string }
        repository: { type: string }

    MCPRegistryServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPRegistryServer" }
        next_page_token:
          type: string
          nullable: true
