openapi: 3.0.3
info:
  title: MCP Components
  version: "1"
paths: {}
components:
  schemas:
    MCPOAuthStart:
      type: object
      required: [authorization_url, flow_id, expires_at]
      properties:
        authorization_url: {
          type: string,
          description: Open this in a browser to authorize.,
        }
        flow_id: { type: string }
        expires_at: { type: string, format: date-time }

    MCPTool:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true

    MCPServer:
      type: object
      additionalProperties: false
      required: [
        id,
        plugin_id,
        parent_config_id,
        parent_revision,
        server_key,
        scope,
        enabled,
        credential_mode,
        needs_auth,
        status,
        tools,
      ]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        plugin_id: { type: string, readOnly: true }
        parent_config_id: { type: string, format: uuid, readOnly: true }
        parent_revision: { type: integer, format: int64, readOnly: true }
        server_key: { type: string }
        url: { type: string, format: uri, readOnly: true }
        scope:
          type: string
          enum: [system, system_agent, user, user_agent]
          readOnly: true
        enabled: { type: boolean, readOnly: true }
        credential_mode: { type: string, enum: [shared, per_user] }
        auth_type: { type: string, enum: [none, bearer, oauth] }
        transport: { type: string, enum: [streamable_http, sse] }
        endpoint_configured: { type: boolean }
        bearer_configured: { type: boolean }
        oauth_client_id_configured: { type: boolean }
        oauth_client_secret_configured: { type: boolean }
        needs_auth: { type: boolean }
        status: { type: string, enum: [unknown, ready, needs_auth, error] }
        status_error: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/MCPTool" }
        revision: { type: integer, format: int64, readOnly: true }

    MCPServerList:
      type: object
      required: [servers, next_page_token]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPServer" }
        next_page_token: { type: string, nullable: true }

    CreateMCPServerRequest:
      type: object
      additionalProperties: false
      required: [parent_config_id, server_key, expected_parent_revision, url]
      properties:
        parent_config_id: { type: string, format: uuid }
        server_key: { type: string, minLength: 1 }
        expected_parent_revision: { type: integer, format: int64, minimum: 1 }
        url: { type: string, format: uri }
        transport: { type: string, enum: [streamable_http, sse] }
        auth_type: { type: string, enum: [none, bearer, oauth] }
        credential_mode: { type: string, enum: [shared, per_user] }
        metadata: { type: object, additionalProperties: true }
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true

    UpdateMCPServerRequest:
      type: object
      additionalProperties: false
      required: [expected_parent_revision]
      properties:
        expected_parent_revision: { type: integer, format: int64, minimum: 1 }
        url: { type: string, format: uri }
        transport: { type: string, enum: [streamable_http, sse] }
        auth_type: { type: string, enum: [none, bearer, oauth] }
        credential_mode: { type: string, enum: [shared, per_user] }
        metadata: { type: object, additionalProperties: true }
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true

    MCPRegistryServer:
      type: object
      required: [source, id, name, url, transport, auth]
      properties:
        source:
          type: string
          description: Registry source this row came from (currently always official).
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        url:
          type: string
          description: Connection URL of the first streamable-http remote.
        transport:
          type: string
          enum: [streamable_http]
        auth:
          type: string
          enum: [none, bearer, unsupported]
          description: >-
            Install-time classification from the advertised headers. bearer
            means a single Authorization: Bearer header; unsupported means the
            entry needs manual header setup. OAuth is not advertised by the
            registry and is discovered by the probe after install.
        headers:
          type: array
          description: Install-time header requirements advertised by the registry.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              template:
                type: string
                description: 'Raw value template, e.g. "Bearer {smithery_api_key}"; never a secret itself.'
              required: { type: boolean }
              is_secret: { type: boolean }
              description: { type: string }
        repository: { type: string }

    MCPRegistryServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPRegistryServer" }
        next_page_token:
          type: string
          nullable: true
