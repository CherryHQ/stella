openapi: 3.0.3
info:
  title: MCP Components
  version: "1"
paths: {}
components:
  schemas:
    MCPOAuthStart:
      type: object
      required: [authorization_url, flow_id, expires_at]
      properties:
        authorization_url: {
          type: string,
          description: Open this in a browser to authorize.,
        }
        flow_id: { type: string }
        expires_at: { type: string, format: date-time }

    MCPTool:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true

    MCPDeclaration:
      type: object
      additionalProperties: false
      required: [url, transport, auth_type, credential_mode]
      properties:
        url: { type: string, format: uri }
        transport: { type: string, enum: [streamable_http, sse] }
        description: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        call_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 300
          default: 0
        auth_type: { type: string, enum: [none, bearer, oauth] }
        credential_mode: { type: string, enum: [shared, per_user] }
        credential_ref: { type: string }
        client_id: { type: string }
        client_secret_ref: { type: string }
        token_endpoint_auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post, none]
        scopes:
          type: array
          items: { type: string }

    MCPServer:
      type: object
      additionalProperties: false
      required: [
        id,
        resource_id,
        server_key,
        name,
        scope,
        content_digest,
        settings_digest,
        is_enabled,
        is_read_only,
        is_standalone,
        is_overridden,
        diagnostics,
        declaration,
        needs_auth,
        status,
        tools,
      ]
      properties:
        id:
          type: string
          readOnly: true
          description: Stable opaque address for this file-backed MCP server.
        resource_id:
          type: string
          readOnly: true
          description: Stable identifier of the source file or package resource.
        server_key: { type: string, readOnly: true }
        name: { type: string, readOnly: true }
        scope:
          type: string
          enum: [system, system_agent, user, user_agent]
        user_id:
          type: string
          format: uuid
          readOnly: true
        agent_id: { type: string, readOnly: true }
        content_digest: { type: string, readOnly: true }
        settings_digest: { type: string, readOnly: true }
        is_enabled: { type: boolean }
        is_read_only: { type: boolean, readOnly: true }
        is_standalone: { type: boolean, readOnly: true }
        is_overridden: { type: boolean, readOnly: true }
        diagnostics:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/PluginDiagnostic" }
        declaration:
          allOf: [{ $ref: "#/components/schemas/MCPDeclaration" }]
          nullable: true
        needs_auth: { type: boolean }
        status: { type: string, enum: [unknown, ready, needs_auth, error] }
        status_error: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/MCPTool" }

    MCPServerList:
      type: object
      required: [servers, next_page_token, truncated]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPServer" }
        next_page_token: { type: string, nullable: true }
        truncated:
          type: boolean
          readOnly: true
          description: Whether the result was capped before all visible servers were returned.

    CreateMCPServerRequest:
      type: object
      additionalProperties: false
      required: [name, scope, declaration]
      properties:
        name: { type: string, minLength: 1 }
        scope: { type: string, enum: [system, system_agent, user, user_agent] }
        agent_id: { type: string }
        declaration: { $ref: "#/components/schemas/MCPDeclaration" }

    UpdateMCPServerRequest:
      description: Supply either declaration with expected_digest, or is_enabled with expected_settings_digest. Combining both mutations is rejected.
      type: object
      additionalProperties: false
      properties:
        expected_digest: { type: string, minLength: 1 }
        declaration: { $ref: "#/components/schemas/MCPDeclaration" }
        is_enabled: { type: boolean }
        expected_settings_digest: { type: string }

    UpdateMCPServerFileRequest:
      type: object
      additionalProperties: false
      required: [content_base64, expected_digest]
      properties:
        content_base64: { type: string, format: byte }
        expected_digest: { type: string, minLength: 1 }

    UpdateMCPServerCredentialsRequest:
      description: Supply exactly one of bearer_token or client_secret. Both or neither are rejected.
      type: object
      additionalProperties: false
      required: [expected_digest]
      properties:
        expected_digest: { type: string, minLength: 1 }
        bearer_token: { type: string, writeOnly: true, minLength: 1 }
        client_secret: { type: string, writeOnly: true, minLength: 1 }

    MCPServerToolCreateInput:
      type: object
      additionalProperties: false
      required: [name, scope, url]
      properties:
        name: { type: string, minLength: 1 }
        scope: { type: string, enum: [user, user_agent, system, system_agent] }
        url: { type: string, format: uri }
        transport: {
          type: string,
          enum: [streamable_http, sse],
          default: streamable_http,
        }

    MCPServerToolUpdateInput:
      type: object
      additionalProperties: false
      required: [expected_digest]
      properties:
        expected_digest: { type: string, minLength: 1 }
        expected_settings_digest: { type: string }
        url: { type: string, format: uri }
        transport: { type: string, enum: [streamable_http, sse] }
        is_enabled: { type: boolean }

    MCPServerToolListInput:
      type: object
      additionalProperties: false
      properties:
        page_size: { type: integer, minimum: 1, maximum: 50, default: 50 }
        page_token: { type: string }

    MCPRegistryServer:
      type: object
      required: [source, id, name, url, transport, auth]
      properties:
        source:
          type: string
          description: Registry source this row came from (currently always official).
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        url:
          type: string
          description: Connection URL of the first streamable-http remote.
        transport:
          type: string
          enum: [streamable_http]
        auth:
          type: string
          enum: [none, bearer, unsupported]
          description: >-
            Install-time classification from the advertised headers. bearer
            means a single Authorization: Bearer header; unsupported means the
            entry needs manual header setup. OAuth is not advertised by the
            registry and is discovered by the probe after install.
        headers:
          type: array
          description: Install-time header requirements advertised by the registry.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              template:
                type: string
                description: 'Raw value template, e.g. "Bearer {smithery_api_key}"; never a secret itself.'
              required: { type: boolean }
              is_secret: { type: boolean }
              description: { type: string }
        repository: { type: string }

    MCPRegistryServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPRegistryServer" }
        next_page_token:
          type: string
          nullable: true
