openapi: 3.0.3
info:
  title: Vision Components
  version: "1"
paths: {}
components:
  schemas:
    VisionSettings:
      type: object
      description: >
        Deployment-wide image-understanding configuration for chat images and
        scanned Library PDF OCR. model is a "provider/model" reference resolved
        against the configured providers. Configuring it authorizes Stella to
        send those pixels to that provider, which may be third-party and may
        charge per request. An empty string disables provider-backed image
        understanding; Library then keeps parsing local and scanned pages without
        native text cannot be transcribed.
      required: [model]
      properties:
        model: { type: string }

    VisionSettingsUpdate:
      type: object
      description: >
        Update payload for the vision settings. Send an empty model to clear the
        vision model.
      required: [model]
      properties:
        model: { type: string }
