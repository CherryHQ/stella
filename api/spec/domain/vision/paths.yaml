paths:
  /api/vision-settings:
    get:
      tags: [vision]
      summary: Get vision settings (admin only)
      operationId: getVisionSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/VisionSettings",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    put:
      tags: [vision]
      summary: Update vision settings (admin only)
      operationId: updateVisionSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/VisionSettingsUpdate",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/VisionSettings",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
