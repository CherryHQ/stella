openapi: 3.0.3
info:
  title: Providers Components
  version: "1"
paths: {}
components:
  schemas:
    ProviderModelCostTier:
      type: object
      required: [minContext]
      properties:
        minContext: { type: integer }
        input: { type: number, format: double }
        output: { type: number, format: double }
        cacheRead: { type: number, format: double }
        cacheWrite: { type: number, format: double }
        reasoning: { type: number, format: double }
        inputAudio: { type: number, format: double }
        outputAudio: { type: number, format: double }

    ProviderModelCost:
      type: object
      properties:
        input: { type: number, format: double }
        output: { type: number, format: double }
        cacheRead: { type: number, format: double }
        cacheWrite: { type: number, format: double }
        reasoning: { type: number, format: double }
        inputAudio: { type: number, format: double }
        outputAudio: { type: number, format: double }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/ProviderModelCostTier" }

    ProviderModel:
      type: object
      required: [enabled]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        reasoning: { type: boolean }
        input: { type: array, items: { type: string } }
        output: { type: array, items: { type: string } }
        contextWindow: { type: integer }
        maxTokens: { type: integer }
        cost: { $ref: "#/components/schemas/ProviderModelCost" }

    # Code Mode accepts only this closed variant. ProviderModel remains open so
    # legitimate HTTP provider-config extensions are not a breaking change.
    ProviderToolModelCostTier:
      type: object
      additionalProperties: false
      required: [minContext]
      properties:
        minContext: { type: integer }
        input: { type: number, format: double }
        output: { type: number, format: double }
        cacheRead: { type: number, format: double }
        cacheWrite: { type: number, format: double }
        reasoning: { type: number, format: double }
        inputAudio: { type: number, format: double }
        outputAudio: { type: number, format: double }

    ProviderToolModelCost:
      type: object
      additionalProperties: false
      properties:
        input: { type: number, format: double }
        output: { type: number, format: double }
        cacheRead: { type: number, format: double }
        cacheWrite: { type: number, format: double }
        reasoning: { type: number, format: double }
        inputAudio: { type: number, format: double }
        outputAudio: { type: number, format: double }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/ProviderToolModelCostTier" }

    ProviderToolModel:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        reasoning: { type: boolean }
        input: { type: array, items: { type: string } }
        output: { type: array, items: { type: string } }
        contextWindow: { type: integer }
        maxTokens: { type: integer }
        cost: { $ref: "#/components/schemas/ProviderToolModelCost" }

    ProviderToolInput:
      type: object
      required: [id, type, name, enabled, base_url]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        base_url: { type: string }
        models:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProviderToolModel"

    Provider:
      type: object
      required: [id, type, name, enabled, api_key, base_url]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        api_key: { type: string }
        base_url: { type: string }
        models:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProviderModel"

    ProviderEvidence:
      type: object
      description: Admin-only, safe identity for a configured provider model. It never includes credentials or the full provider configuration.
      required: [
        provider_id,
        model_id,
        gateway_endpoint,
        provider_type,
        model_price_digest,
      ]
      properties:
        provider_id: { type: string }
        model_id: { type: string }
        gateway_endpoint: { type: string }
        provider_type: { type: string }
        model_price_digest: { type: string }

    ProviderModelItem:
      type: object
      required: [id, source, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/ProviderModel" }

    ProviderType:
      type: object
      required: [id, name, default_url]
      properties:
        id: { type: string }
        name: { type: string }
        default_url: { type: string }

    FetchModelsRequest:
      type: object
      properties:
        api_key: { type: string }
        base_url: { type: string }

    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/Provider" }

    ProviderModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModelItem" }

    ProviderTypeList:
      type: object
      required: [provider_types]
      properties:
        provider_types:
          type: array
          items: { $ref: "#/components/schemas/ProviderType" }
