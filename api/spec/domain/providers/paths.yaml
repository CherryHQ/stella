paths:
  /api/providers:
    get:
      tags: [providers]
      summary: List all providers (admin only)
      operationId: listProviders
      x-agent-tool: { tool: "settings_provider", action: "list" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ProviderList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [providers]
      summary: Create a provider (admin only)
      operationId: createProvider
      x-agent-tool:
        tool: "settings_provider"
        action: "create"
        input: {
          $ref: "../../components.yaml#/components/schemas/ProviderToolInput",
        }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/Provider",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Provider",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [providers]
      summary: Get a provider (admin only)
      operationId: getProvider
      x-agent-tool: { tool: "settings_provider", action: "get" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Provider",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [providers]
      summary: Update a provider (admin only)
      operationId: updateProvider
      x-agent-tool: {
        tool: "settings_provider",
        action: "update",
        input: {
          $ref: "../../components.yaml#/components/schemas/ProviderToolInput",
        },
        add: {
          expected_version: {
            type: string,
            description: Opaque version returned by settings_provider_get.,
          },
        },
        require: [expected_version],
      }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ProviderPatch",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Provider",
              }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [providers]
      summary: Delete a provider (admin only)
      operationId: deleteProvider
      parameters:
        - name: expected_version
          in: query
          required: true
          schema: { type: string }
      x-agent-tool: {
        tool: "settings_provider",
        action: "delete",
        add: {
          expected_version: {
            type: string,
            description: Opaque version returned by settings_provider_get.,
          },
        },
        require: [expected_version],
      }
      responses:
        "204":
          description: deleted
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/providers/{id}/models:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [providers]
      summary: List models for a provider (admin only)
      operationId: listProviderModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ProviderModelList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [providers]
      summary: Fetch and cache models from upstream provider (admin only)
      operationId: fetchProviderModels
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/FetchModelsRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ProviderModelList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/providers/{id}/evidence:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [providers]
      summary: Get safe provider model evidence (admin only)
      operationId: getProviderEvidence
      parameters:
        - {
            name: model_id,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          description: Safe configured provider model identity without credentials.
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ProviderEvidence",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/model-catalog/providers:
    get:
      tags: [model-catalog]
      summary: List model catalog providers (admin only)
      operationId: listModelCatalogProviders
      parameters:
        - name: include_unsupported
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CatalogProviderList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/model-catalog/models:
    get:
      tags: [model-catalog]
      summary: List models across the complete model catalog (admin only)
      operationId: listModelCatalogModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CatalogModelReferenceList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/model-catalog/status:
    get:
      tags: [model-catalog]
      summary: Get model catalog status (admin only)
      operationId: getModelCatalogStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ModelCatalogStatus",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/model-catalog/sync:
    post:
      tags: [model-catalog]
      summary: Synchronize the model catalog (admin only)
      operationId: syncModelCatalog
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ModelCatalogSyncResult",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502": {
          $ref: "../../components.yaml#/components/responses/BadGateway",
        }

  /api/providers/probe:
    post:
      tags: [providers]
      summary: Probe a provider without persisting it (admin only)
      operationId: probeProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ProviderProbeRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ProviderModelList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502": {
          $ref: "../../components.yaml#/components/responses/BadGateway",
        }

  /api/provider-types:
    get:
      tags: [providers]
      summary: List available provider types (admin only)
      operationId: listProviderTypes
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ProviderTypeList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
