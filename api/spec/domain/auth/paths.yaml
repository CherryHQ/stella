paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../components.yaml#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/AuthResponse" }
        "400": { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "409":
          description: username already taken
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/Error" }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Authenticate and start a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../components.yaml#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/AuthResponse" }
        "400": { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../components.yaml#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "401": { $ref: "../../components.yaml#/components/responses/Unauthorized" }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      operationId: getMe
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "../../components.yaml#/components/schemas/MeResponse" }
        "401": { $ref: "../../components.yaml#/components/responses/Unauthorized" }
