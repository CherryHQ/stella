paths:
  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      responses:
        "204":
          description: logged out
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/local/login:
    post:
      tags: [auth]
      summary: Sign in with the built-in local provider
      operationId: loginLocal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/LocalLoginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/LocalAuthRedirect",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/auth/local/register:
    post:
      tags: [auth]
      summary: Register the first local user
      operationId: registerLocal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/LocalRegisterRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/LocalAuthRedirect",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }
        "409": {
          $ref: "../../components.yaml#/components/responses/Conflict",
        }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      operationId: getMe
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MeResponse",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/sessions:
    get:
      tags: [auth]
      summary: List current user's active sessions
      operationId: listAuthSessions
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthSessionList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [auth]
      summary: Revoke an auth session
      operationId: deleteAuthSession
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/providers:
    get:
      tags: [auth]
      summary: List available authentication providers
      operationId: listAuthProviders
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OIDCProviderList",
              }
