paths:
  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      operationId: getMe
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MeResponse",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/providers:
    get:
      tags: [auth]
      summary: List available authentication providers
      operationId: listAuthProviders
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OIDCProviderList",
              }
