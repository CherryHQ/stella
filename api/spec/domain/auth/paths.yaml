paths:
  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      responses:
        "204":
          description: logged out
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      operationId: getMe
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MeResponse",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/org:
    patch:
      tags: [auth]
      summary: Update the current user's organization name
      operationId: updateOrg
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateOrgRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/auth/sessions:
    get:
      tags: [auth]
      summary: List current user's active sessions
      operationId: listAuthSessions
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AuthSessionList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [auth]
      summary: Revoke an auth session
      operationId: deleteAuthSession
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/auth/providers:
    get:
      tags: [auth]
      summary: List available authentication providers
      operationId: listAuthProviders
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OIDCProviderList",
              }
