openapi: 3.0.3
info:
  title: Auth Components
  version: "1"
paths: {}
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }

    MeResponse:
      type: object
      required: [id, username, role, is_admin]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string }
        is_admin: { type: boolean }
        email: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        org_id: { type: string }
        org_name: { type: string }
        has_credentials: { type: boolean }

    UpdateOrgRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    AuthSession:
      type: object
      required: [id, expires_at, created_at]
      properties:
        id: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AuthSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuthSession" }

    OIDCProvider:
      type: object
      required: [name, login_url]
      properties:
        name:
          type: string
          description: Human-readable provider name (e.g. "Zitadel")
        login_url:
          type: string
          description: URL to redirect the browser to for login
        register_url:
          type: string
          description: URL to redirect the browser to for registration (local provider only)

    OIDCProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OIDCProvider"
