openapi: 3.0.3
info:
  title: Auth Components
  version: "1"
paths: {}
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }

    MeResponse:
      type: object
      required: [id, username, role, is_admin]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string }
        is_admin: { type: boolean }
