openapi: 3.0.3
info:
  title: Projects Components
  version: "1"
paths: {}
components:
  schemas:
    Project:
      type: object
      required: [
        id,
        agent_id,
        user_id,
        name,
        path,
        archived,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        agent_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        path:
          type: string
          description: Canonical path relative to the agent workspace; empty selects its root.
        description: { type: string }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string }
        description: { type: string }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        description: { type: string }

    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
