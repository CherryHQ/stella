openapi: 3.0.3
info:
  title: Projects Components
  version: "1"
paths: {}
components:
  schemas:
    Project:
      type: object
      required: [
        id,
        agent_id,
        user_id,
        name,
        base_dir,
        archived,
        is_unavailable,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        agent_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        base_dir:
          type: string
          description: Canonical path relative to the agent workspace root; `.` selects the root. Never a host path.
        description: { type: string }
        archived: { type: boolean }
        is_unavailable:
          type: boolean
          readOnly: true
          description: True when the persisted workspace coordinate requires repair; base_dir is empty until repaired.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [name, base_dir]
      properties:
        name: { type: string }
        base_dir:
          type: string
          description: Canonical path relative to the agent workspace root; `.` selects the root. Never a host path.
        description: { type: string }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        base_dir:
          type: string
          description: Canonical path relative to the agent workspace root; `.` selects the root. Never a host path.
        description: { type: string }

    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
