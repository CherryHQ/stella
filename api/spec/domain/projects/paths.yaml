paths:
  /api/agents/{agentId}/projects:
    get:
      tags: [projects]
      summary: List projects for an agent
      operationId: listProjects
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
          description: Include archived projects
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {
                  $ref: "../../components.yaml#/components/schemas/Project",
                }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [projects]
      summary: Create a project
      operationId: createProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateProjectRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Project",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{agentId}/projects/{projectId}:
    get:
      tags: [projects]
      summary: Get a project
      operationId: getProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Project",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    put:
      tags: [projects]
      summary: Update a project
      operationId: updateProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateProjectRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Project",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [projects]
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: no content
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
