paths:
  /api/groups:
    get:
      tags: [groups]
      summary: List groups owned by the current user
      operationId: listGroups
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/GroupList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [groups]
      summary: Create a new group with agent members
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateGroupRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Group",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [groups]
      summary: Get group detail
      operationId: getGroup
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Group",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [groups]
      summary: Update group name
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateGroupRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Group",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [groups]
      summary: Delete a group
      operationId: deleteGroup
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/groups/{groupId}/members:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [groups]
      summary: List group members
      operationId: listGroupMembers
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/GroupMemberList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [groups]
      summary: Add an agent to the group
      operationId: addGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AddGroupMemberRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/GroupMember",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/groups/{groupId}/members/{agentId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
      - { name: agentId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [groups]
      summary: Remove an agent from the group
      operationId: removeGroupMember
      responses:
        "204":
          description: removed
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/groups/{groupId}/messages:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [groups]
      summary: List group message history from event log
      operationId: listGroupMessages
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/GroupMessageList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

    post:
      tags: [groups]
      summary: Send a message to the group (SSE streaming)
      operationId: sendGroupMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SendGroupMessageRequest",
            }
      responses:
        "200":
          description: SSE stream of group chat events
          content:
            text/event-stream:
              schema: { type: string }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/groups/{groupId}/events:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [groups]
      summary: Stream canonical group message events
      operationId: streamGroupEvents
      parameters:
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: SSE stream of canonical messages and turn presence
          content:
            text/event-stream:
              schema: { type: string }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/groups/{groupId}/turns/{agentId}/abort:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
      - { name: agentId, in: path, required: true, schema: { type: string } }
    post:
      tags: [groups]
      summary: Stop an active group member turn
      operationId: abortGroupTurn
      responses:
        "204":
          description: turn stopped or already finished
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
