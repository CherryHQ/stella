openapi: 3.0.3
info:
  title: Groups Components
  version: "1"
paths: {}
components:
  schemas:
    Group:
      type: object
      required: [id, group_name, platform, created_at, updated_at]
      properties:
        id: { type: string }
        group_name: { type: string }
        platform: { type: string }
        created_by_user_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_active: { type: string, format: date-time, nullable: true }
        agent_chain_hard_limit: { type: integer }
        max_agent_posts_per_minute: { type: integer }
        max_replies_per_human_trigger: { type: integer }
        hold_limit: { type: integer }

    GroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        next_page_token: { type: string, nullable: true }

    GroupMember:
      type: object
      required: [group_id, agent_id, reply_channel_id, created_at]
      properties:
        group_id: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        reply_channel_id: { type: string }
        created_at: { type: string, format: date-time }

    GroupMemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }

    GroupMessage:
      type: object
      required: [id, group_id, seq, actor_type, actor_id, content, created_at]
      properties:
        id: { type: string }
        group_id: { type: string }
        seq: { type: integer }
        actor_type: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        content: { type: string }
        reasoning: { type: string }
        agent_session_id: { type: string }
        delivery_state: { type: string, readOnly: true }
        created_at: { type: string, format: date-time }

    GroupTurnEvent:
      type: object
      description: >-
        One `turn` frame on the group event stream: live presence for a single
        member. `running` is the only non-terminal state and is emitted when a
        turn passes the wake gate and starts generating; a fresh subscriber also
        receives one synthetic `running` frame per member whose dispatch is
        already executing. Every running turn is retired by exactly one terminal
        frame: `done` (reply accepted and delivered), `held` (reply was stale),
        `silent` (the gate or the model declined to speak), or `failed`.
      required: [agent_id, state]
      properties:
        agent_id: { type: string }
        state:
          type: string
          enum: [running, done, held, silent, failed]
        reason:
          type: string
          description: Why the turn reached this state, e.g. `hard_cap`, `model_pass`.

    GroupMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/GroupMessage" }
        next_page_token: { type: string, nullable: true }

    CreateGroupRequest:
      type: object
      required: [group_name, agent_ids]
      properties:
        group_name: { type: string }
        agent_ids:
          type: array
          items: { type: string }
          minItems: 1

    UpdateGroupRequest:
      type: object
      properties:
        group_name: { type: string }
        agent_chain_hard_limit: { type: integer, minimum: 1, maximum: 100 }
        max_agent_posts_per_minute: { type: integer, minimum: 1, maximum: 1000 }
        max_replies_per_human_trigger: {
          type: integer,
          minimum: 1,
          maximum: 100,
        }
        hold_limit: { type: integer, minimum: 0, maximum: 20 }

    AddGroupMemberRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string }

    SendGroupMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        client_message_id: {
          type: string,
          description: "Client-generated UUID for idempotent dedup",
        }
