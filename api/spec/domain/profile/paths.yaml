paths:
  # ── Identities ──────────────────────────────────────────────────────────────
  /api/users/me/identities:
    get:
      tags: [profile]
      summary: List linked identities for the current user
      operationId: listProfileIdentities
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/IdentityList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/identities/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
        }
    delete:
      tags: [profile]
      summary: Unlink an identity from the current user
      operationId: unlinkProfileIdentity
      responses:
        "204":
          description: deleted
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/users/me/password:
    patch:
      tags: [profile]
      summary: Change the current user's password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ChangePasswordRequest",
            }
      responses:
        # 204 by design: the password is write-only and has no resource
        # representation to return.
        "204":
          description: password changed
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/link-code:
    post:
      tags: [profile]
      summary: Generate a short-lived link code for a platform
      operationId: generateLinkCode
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/GenerateLinkCodeRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/LinkCodeResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  # ── Memories ────────────────────────────────────────────────────────────────
  /api/users/me/memories:
    get:
      tags: [profile]
      summary: List per-agent memories for the current user
      operationId: listProfileMemories
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/UserMemoryList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/memories/{agentId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: Get the memory for a specific agent
      operationId: getProfileMemory
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/UserMemory",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": {
          $ref: "../../components.yaml#/components/responses/NotFound",
        }
    patch:
      tags: [profile]
      summary: Set the memory for a specific agent
      operationId: setProfileMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SetMemoryRequest",
            }
      responses:
        "200":
          description: saved
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/UserMemory",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    delete:
      tags: [profile]
      summary: Delete the memory for a specific agent
      operationId: deleteProfileMemory
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  # ── Soul ────────────────────────────────────────────────────────────────────
  /api/users/me/soul/{agentId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [profile]
      summary: Set the soul for a specific agent
      operationId: setProfileSoul
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SetSoulRequest",
            }
      responses:
        "200":
          description: saved
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/UserMemory",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  # ── Constraints ──────────────────────────────────────────────────────────────
  /api/users/me/memories/{agentId}/constraints:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: List constraints for a specific agent
      operationId: listProfileConstraints
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ConstraintList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [profile]
      summary: Add a constraint for a specific agent
      operationId: addProfileConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AddConstraintRequest",
            }
      responses:
        "200":
          description: added
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ConstraintList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/memories/{agentId}/constraints/{constraintId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - {
          name: constraintId,
          in: path,
          required: true,
          schema: { type: string },
        }
    delete:
      tags: [profile]
      summary: Remove a constraint
      operationId: deleteProfileConstraint
      responses:
        "200":
          description: removed
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ConstraintList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  # ── Knowledge ────────────────────────────────────────────────────────────────
  /api/users/me/memories/{agentId}/knowledge:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: List active or removed Knowledge for a specific agent
      operationId: listProfileKnowledge
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [active, removed], default: active }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/KnowledgeList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    post:
      tags: [profile]
      summary: Create manual Knowledge for a specific agent
      operationId: createProfileKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateKnowledgeRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/KnowledgeItem",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/users/me/memories/{agentId}/knowledge/{factId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: factId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [profile]
      summary: Atomically replace active Knowledge with a manual successor
      operationId: updateProfileKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateKnowledgeRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/KnowledgeItem",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [profile]
      summary: Manually deprecate active Knowledge
      operationId: deleteProfileKnowledge
      responses:
        "204":
          description: deprecated
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/users/me/memories/{agentId}/knowledge/{factId}/restore:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: factId, in: path, required: true, schema: { type: string } }
    post:
      tags: [profile]
      summary: Restore eligible removed Knowledge
      operationId: restoreProfileKnowledge
      responses:
        "200":
          description: restored
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/KnowledgeItem",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "410": { $ref: "../../components.yaml#/components/responses/Gone" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  # ── Changelog ────────────────────────────────────────────────────────────────
  /api/users/me/memories/{agentId}/changelog:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: List recent memory changelog entries
      operationId: listProfileChangelog
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [profile, soul, knowledge, constraint] }
          description: Filter by scope; omitted merges all four memory scopes
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ChangelogList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  # ── Vault ───────────────────────────────────────────────────────────────────
  /api/vault:
    get:
      tags: [profile]
      summary: List scoped vault entries
      operationId: listScopedVaultEntries
      x-agent-tool: {
        tool: "vault",
        resource: "secret",
        action: "list",
        restrict: { scope: [user, user_agent] },
      }
      parameters:
        - {
            name: scope,
            in: query,
            required: false,
            schema: {
              type: string,
              enum: [user, user_agent, system, system_agent],
              default: user,
            },
          }
        - {
            name: agent_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/VaultEntryList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }

  /api/vault/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: Get a scoped vault entry value
      operationId: getScopedVaultEntry
      parameters:
        - {
            name: scope,
            in: query,
            required: false,
            schema: {
              type: string,
              enum: [user, user_agent, system, system_agent],
              default: user,
            },
          }
        - {
            name: agent_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/VaultEntryValue",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    put:
      tags: [profile]
      summary: Create or update a scoped vault entry
      operationId: setScopedVaultEntry
      x-agent-tool: {
        tool: "vault",
        resource: "secret",
        action: "set",
        restrict: { scope: [user, user_agent] },
        fixed: { description: "" },
      }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SetVaultEntryRequest",
            }
      responses:
        "200":
          description: saved
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/VaultEntry",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }
    delete:
      tags: [profile]
      summary: Delete a scoped vault entry
      operationId: deleteScopedVaultEntry
      x-agent-tool: {
        tool: "vault",
        resource: "secret",
        action: "delete",
        restrict: { scope: [user, user_agent] },
      }
      parameters:
        - {
            name: scope,
            in: query,
            required: false,
            schema: {
              type: string,
              enum: [user, user_agent, system, system_agent],
              default: user,
            },
          }
        - {
            name: agent_id,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "204":
          description: no content
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }

  # ── OAuth ───────────────────────────────────────────────────────────────────
  /api/users/me/oauth/providers:
    get:
      tags: [profile]
      summary: List OAuth provider statuses for the current user
      operationId: listOAuthProviders
      x-agent-tool: { tool: "oauth", action: "list" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OAuthProviderStatusList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/oauth/{provider}/start:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
    post:
      tags: [profile]
      summary: Start an OAuth device flow for a provider
      operationId: startOAuthFlow
      x-agent-tool: { tool: "oauth", action: "connect" }
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/StartOAuthFlowRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OAuthFlowStatus",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/oauth/{provider}/status/{flowId}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
      - { name: flowId, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: Poll the status of an OAuth flow
      operationId: pollOAuthFlow
      # flow_status, not status: "status" reads like a generic health check next
      # to oauth_list, and the tool only reports one in-flight authorization.
      x-agent-tool: { tool: "oauth", action: "flow_status" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OAuthFlowStatus",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/oauth/{provider}/connected:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: Check if the current user is connected to an OAuth provider
      operationId: getOAuthConnected
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OAuthConnectedResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/oauth/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
    delete:
      tags: [profile]
      summary: Disconnect an OAuth provider
      operationId: disconnectOAuth
      x-agent-tool: { tool: "oauth", action: "disconnect" }
      responses:
        "204":
          description: no content
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/admin/oauth-providers/{id}/config:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [profile]
      summary: Get OAuth provider config (admin only)
      operationId: getOAuthProviderConfig
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OAuthProviderConfig",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }
    delete:
      tags: [profile]
      summary: Delete OAuth provider config override (admin only)
      operationId: deleteOAuthProviderConfig
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }
    put:
      tags: [profile]
      summary: Set OAuth provider credentials (admin only)
      operationId: setOAuthProviderConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/OAuthProviderConfigInput",
            }
      responses:
        "200":
          description: saved
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/OAuthProviderConfig",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": {
          $ref: "../../components.yaml#/components/responses/Forbidden",
        }
