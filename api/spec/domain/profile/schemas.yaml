openapi: 3.0.3
info:
  title: Profile Components
  version: "1"
paths: {}
components:
  schemas:
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }

    GenerateLinkCodeRequest:
      type: object
      required: [platform]
      properties:
        platform: { type: string }

    LinkCodeResponse:
      type: object
      required: [code, platform]
      properties:
        code: { type: string }
        platform: { type: string }

    SetSoulRequest:
      type: object
      required: [soul]
      properties:
        soul: { type: string }

    VaultEntry:
      type: object
      required: [
        name,
        scope,
        inject_always,
        inject_agent_ids,
        inject_project_ids,
        created_at,
        updated_at,
      ]
      properties:
        name: { type: string }
        scope: { type: string, enum: [user, user_agent, system, system_agent] }
        user_id: { type: string }
        agent_id: { type: string }
        inject_always: { type: boolean }
        inject_agent_ids:
          type: array
          items: { type: string }
        inject_project_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SetVaultEntryRequest:
      type: object
      required: [value]
      properties:
        value: { type: string }
        scope: {
          type: string,
          enum: [user, user_agent, system, system_agent],
          default: user,
        }
        agent_id: { type: string }
        inject_always: { type: boolean }
        inject_agent_ids:
          type: array
          items: { type: string }
        inject_project_ids:
          type: array
          items: { type: string }

    VaultEntryValue:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    OAuthProviderStatus:
      type: object
      required: [provider, available, configured, connected]
      properties:
        provider: { type: string }
        available: { type: boolean }
        configured: { type: boolean }
        connected: { type: boolean }
        username: { type: string }
        unavailable: { type: string }
        required_by:
          type: array
          items: { type: string }
          description: >-
            Display names of enabled tools that need this provider connected.
            Drives the "connect to enable X" prompt on the credentials page.

    OAuthProviderConfig:
      type: object
      required: [provider_id, client_id, client_secret]
      properties:
        provider_id: { type: string }
        client_id: { type: string }
        client_secret: { type: string }
        redirect_url: { type: string }

    OAuthProviderConfigInput:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        redirect_url: { type: string }

    OAuthFlowStatus:
      type: object
      required: [provider, flow_id, verification_uri, expires_at, state]
      properties:
        provider: { type: string }
        flow_id: { type: string }
        verification_uri: { type: string }
        user_code: { type: string }
        expires_at: { type: string, format: date-time }
        state: { type: string }

    OAuthConnectedResponse:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        username: { type: string }

    VaultEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/VaultEntry" }

    OAuthProviderStatusList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/OAuthProviderStatus" }

    ConstraintEntry:
      type: object
      required: [id, text, created_at]
      properties:
        id: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }

    ConstraintList:
      type: object
      required: [constraints]
      properties:
        constraints:
          type: array
          items: { $ref: "#/components/schemas/ConstraintEntry" }

    AddConstraintRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }

    ChangelogEntry:
      type: object
      required: [id, scope, action, source, created_at]
      properties:
        id: { type: string }
        scope: { type: string }
        action: { type: string }
        source: { type: string }
        memory_version_before: { type: integer, nullable: true }
        memory_version_after: { type: integer, nullable: true }
        before_text: { type: string }
        after_text: { type: string }
        created_at: { type: string, format: date-time }

    ChangelogList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ChangelogEntry" }
