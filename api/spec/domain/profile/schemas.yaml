openapi: 3.0.3
info:
  title: Profile Components
  version: "1"
paths: {}
components:
  schemas:
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }

    GenerateLinkCodeRequest:
      type: object
      required: [platform]
      properties:
        platform: { type: string }

    LinkCodeResponse:
      type: object
      required: [code, platform]
      properties:
        code: { type: string }
        platform: { type: string }

    SetSoulRequest:
      type: object
      required: [soul]
      properties:
        soul: { type: string }

    VaultEntry:
      type: object
      required: [name, created_at, updated_at]
      properties:
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SetVaultEntryRequest:
      type: object
      required: [value]
      properties:
        value: { type: string }

    VaultEntryValue:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    OAuthProviderStatus:
      type: object
      required: [provider, available, configured, connected]
      properties:
        provider: { type: string }
        available: { type: boolean }
        configured: { type: boolean }
        connected: { type: boolean }
        username: { type: string }
        unavailable: { type: string }

    OAuthProviderConfig:
      type: object
      required: [provider_id, client_id, client_secret]
      properties:
        provider_id: { type: string }
        client_id: { type: string }
        client_secret: { type: string }
        redirect_url: { type: string }

    OAuthProviderConfigInput:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        redirect_url: { type: string }

    OAuthFlowStatus:
      type: object
      required: [provider, flow_id, verification_uri, expires_at, state]
      properties:
        provider: { type: string }
        flow_id: { type: string }
        verification_uri: { type: string }
        user_code: { type: string }
        expires_at: { type: string, format: date-time }
        state: { type: string }

    OAuthConnectedResponse:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        username: { type: string }

    VaultEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/VaultEntry" }
        next_page_token: { type: string, nullable: true }

    OAuthProviderStatusList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/OAuthProviderStatus" }
        next_page_token: { type: string, nullable: true }
