openapi: 3.0.3
info:
  title: Profile Components
  version: "1"
paths: {}
components:
  schemas:
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }

    GenerateLinkCodeRequest:
      type: object
      required: [platform]
      properties:
        platform: { type: string }

    LinkCodeResponse:
      type: object
      required: [code, platform]
      properties:
        code: { type: string }
        platform: { type: string }

    SetSoulRequest:
      type: object
      required: [soul]
      properties:
        soul: { type: string }

    VaultEntry:
      type: object
      required: [
        name,
        scope,
        created_at,
        updated_at,
      ]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        scope: { type: string, enum: [user, user_agent, system, system_agent] }
        user_id: { type: string }
        agent_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SetVaultEntryRequest:
      type: object
      required: [value]
      properties:
        value: { type: string }
        description: { type: string, nullable: true }
        scope: {
          type: string,
          enum: [user, user_agent, system, system_agent],
          default: user,
        }
        agent_id: { type: string }

    VaultEntryValue:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    OAuthProviderStatus:
      type: object
      required: [provider, available, configured, connected]
      properties:
        provider: { type: string }
        available: { type: boolean }
        configured: { type: boolean }
        connected: { type: boolean }
        username: { type: string }
        unavailable: { type: string }
        required_by:
          type: array
          items: { type: string }
          description: >-
            Display names of enabled tools that need this provider connected.
            Drives the "connect to enable X" prompt on the credentials page.
        requested_scopes:
          type: array
          items: { type: string }
          description: Effective scope list the connect flow requests.
        granted_scopes:
          type: array
          items: { type: string }
          description: >-
            Scopes the stored token actually holds. Absent means unknown (a
            token captured before grant tracking), which is distinct from "no
            scopes".
        access_expires_at:
          type: string
          format: date-time
          description: Access-token expiry; omitted when unknown.
        refresh_expires_at:
          type: string
          format: date-time
          description: Refresh-token expiry; omitted when unknown.
        needs_reconnect:
          type: boolean
          description: True when the user must re-authorize to stay usable.
        reconnect_reason:
          type: string
          enum: [credentials_rotated, missing_scopes]
          description: Why a reconnect is needed, when needs_reconnect is true.

    OAuthProviderConfig:
      type: object
      required: [provider_id, client_id, client_secret]
      properties:
        provider_id: { type: string }
        client_id: { type: string }
        client_secret: { type: string }
        redirect_url: { type: string }
        scopes:
          type: array
          items: { type: string }
          description: Admin scope override; empty means "use the default".
        default_scopes:
          type: array
          items: { type: string }
          description: Built-in YAML default scopes (output-only, for diff/reset).

    OAuthProviderConfigInput:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        redirect_url: { type: string }
        scopes:
          type: array
          items: { type: string }
          description: >-
            Scope override to request on connect. Empty or omitted clears the
            override (reverts to the built-in default).

    OAuthFlowStatus:
      type: object
      required: [provider, flow_id, verification_uri, expires_at, state]
      properties:
        provider: { type: string }
        flow_id: { type: string }
        verification_uri: { type: string }
        user_code: { type: string }
        expires_at: { type: string, format: date-time }
        state: { type: string }
        error:
          type: string
          description: Failure reason when state is "failed".

    OAuthConnectedResponse:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        username: { type: string }

    VaultEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/VaultEntry" }

    OAuthProviderStatusList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/OAuthProviderStatus" }

    ConstraintEntry:
      type: object
      required: [id, text, created_at]
      properties:
        id: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }

    ConstraintList:
      type: object
      required: [constraints]
      properties:
        constraints:
          type: array
          items: { $ref: "#/components/schemas/ConstraintEntry" }

    AddConstraintRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }

    KnowledgeItem:
      type: object
      required: [id, content, source, created_at, updated_at, is_restorable]
      properties:
        id: { type: string }
        content: { type: string }
        source: { type: string, enum: [manual, reflect] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        is_restorable: { type: boolean }
        removal_source:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RemovalSource"
        deprecated_at: { type: string, format: date-time, nullable: true }
        restore_deadline: { type: string, format: date-time, nullable: true }

    KnowledgeList:
      type: object
      required: [knowledge, total_size]
      properties:
        knowledge:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeItem" }
        total_size: { type: integer }
        next_page_token: { type: string, nullable: true }

    CreateKnowledgeRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    UpdateKnowledgeRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    ChangelogEntry:
      type: object
      required: [id, scope, action, source, created_at]
      properties:
        id: { type: string }
        scope: { type: string }
        action: { type: string }
        source: { type: string }
        memory_version_before: { type: integer, nullable: true }
        memory_version_after: { type: integer, nullable: true }
        before_text: { type: string }
        after_text: { type: string }
        created_at: { type: string, format: date-time }

    ChangelogList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ChangelogEntry" }
        next_page_token: { type: string, nullable: true }
