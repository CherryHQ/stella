paths:
  /api/agents/{agentId}/sessions:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: List sessions (all users see their own; admins see all)
      operationId: listSessions
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 500 }
          description: Maximum number of sessions to return
        - name: page_token
          in: query
          schema: { type: string }
          description: Opaque pagination token from a previous response
        - name: kind
          in: query
          schema: {
            type: string,
            enum: [main, chat, delegate, scheduler, task],
          }
          description: Filter by session kind
        - name: project_id
          in: query
          schema: { type: string }
          description: Filter by project ID
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [sessions]
      summary: Create a new session
      operationId: createSession
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateSessionRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Session",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{agentId}/sessions/{sessionId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get session detail
      operationId: getSession
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionDetail",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [sessions]
      summary: Update session metadata
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateSessionRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Session",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Delete a session
      operationId: deleteSession
      responses:
        "204": { description: deleted }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/messages:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get messages for a session
      operationId: getSessionMessages
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
          description: Maximum number of messages to return
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
          description: Number of messages to skip from the end
        - name: after
          in: query
          schema: { type: string }
          description: Only return messages created at or after this timestamp
        - name: before
          in: query
          schema: { type: string }
          description: Only return messages created at or before this timestamp
        - name: seq_from
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Only return messages with seq greater than or equal to this value.
            Must be provided together with seq_to; when set, the seq range
            takes precedence over limit/skip/after/before.
        - name: seq_to
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Only return messages with seq less than or equal to this value.
            Must be provided together with seq_from.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionMessageList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [sessions]
      summary: Send a message to a session (SSE streaming)
      operationId: sendSessionMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SendMessageRequest",
            }
      responses:
        "200":
          description: SSE stream of session events
          content:
            text/event-stream:
              schema: { type: string }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/agents/{agentId}/sessions/{sessionId}/events:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Stream a session's live turn events (read-only SSE)
      description: >
        Subscribe to the events of an in-flight turn on this session without
        initiating one. Used by the web UI to watch server-driven turns
        (scheduler, task, delegate) or a turn started in another tab in real
        time. The stream emits the same Vercel AI-SDK UI message frames as the
        message-send endpoint and ends when the turn finishes.
      operationId: streamSessionEvents
      responses:
        "200":
          description: SSE stream of session events
          content:
            text/event-stream:
              schema: { type: string }
        "204": { description: No turn currently in flight on this session }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/context-items:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: List compacted context items for a session
      operationId: getSessionContextItems
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionContextItemList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/summaries/{summaryId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: summaryId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get compacted summary detail for a session
      operationId: getSessionSummary
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionSummaryDetail",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/workspace:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: List workspace disk entries and usage
      operationId: getSessionWorkspace
      parameters:
        - name: show_hidden
          in: query
          schema: { type: boolean, default: false }
          description: Include dot-prefixed files and directories
        - name: path
          in: query
          schema: { type: string, default: "" }
          description: Directory path to list relative to the workspace root
        - name: depth
          in: query
          schema: { type: integer, default: 2, minimum: 1 }
          description: Maximum number of levels to return below path
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to list (agent home or shared user data)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionWorkspace",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/workspace/files:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: Create a file or directory in the session workspace
      operationId: createWorkspaceFile
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceCreateRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionWorkspace",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Delete a file or directory from the session workspace
      operationId: deleteWorkspaceFile
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceDeleteRequest",
            }
      responses:
        "204":
          description: deleted
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [sessions]
      summary: Rename or move a file or directory in the session workspace
      operationId: moveWorkspaceFile
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceMoveRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionWorkspace",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/workspace/file-content:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get the content of a file in the session workspace
      operationId: getWorkspaceFileContent
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: >-
            Either a workspace-relative path (paired with scope) or a
            sandbox-view/host absolute path that resolves inside one of the
            session's workspace roots. When the path is absolute it is
            self-describing and the scope parameter is ignored: the server first
            checks host-root containment (a real host path is served from the
            root that physically contains it), then falls back to sandbox mount
            mapping (/user and /workspace map to the user-data and agent roots).
            An absolute path that matches neither is rejected.
        - name: raw
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, serve the file bytes directly with the detected Content-Type instead of a JSON envelope
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to read from (agent home or shared user data)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WorkspaceFileContent",
              }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [sessions]
      summary: Write content to a file in the session workspace
      operationId: updateWorkspaceFileContent
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceUpdateContentRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WorkspaceFileContent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/workspace/upload:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: Upload a file to the session workspace assets directory
      operationId: uploadWorkspaceFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WorkspaceUploadResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/system-prompt:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get the system prompt for a session
      operationId: getSessionSystemPrompt
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SystemPromptResponse",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
