paths:
  /api/agents/{agentId}/sessions:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: List sessions (all users see their own; admins see all)
      operationId: listSessions
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 500 }
          description: Maximum number of sessions to return
        - name: page_token
          in: query
          schema: { type: string }
          description: Opaque pagination token from a previous response
        - name: kind
          in: query
          schema: {
            type: string,
            enum: [main, chat, delegate, scheduler, task],
          }
          description: Filter by session kind
        - name: project_id
          in: query
          schema: { type: string }
          description: Filter by project ID
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [sessions]
      summary: Create a new session
      operationId: createSession
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreateSessionRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Session",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{agentId}/sessions/{sessionId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get session detail
      operationId: getSession
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionDetail",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [sessions]
      summary: Update session metadata
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateSessionRequest",
            }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Session",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Delete a session
      operationId: deleteSession
      responses:
        "204": { description: deleted }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/messages:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get messages for a session
      operationId: getSessionMessages
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
          description: Maximum number of messages to return
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
          description: Number of messages to skip from the end
        - name: after
          in: query
          schema: { type: string }
          description: Only return messages created at or after this timestamp
        - name: before
          in: query
          schema: { type: string }
          description: Only return messages created at or before this timestamp
        - name: seq_from
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Only return messages with seq greater than or equal to this value.
            Must be provided together with seq_to; when set, the seq range
            takes precedence over limit/skip/after/before.
        - name: seq_to
          in: query
          schema: { type: integer, minimum: 1 }
          description: >-
            Only return messages with seq less than or equal to this value.
            Must be provided together with seq_from.
        - name: snapshot_seq
          in: query
          schema: { type: integer, minimum: 0 }
          description: >-
            Cap the visible transcript at raw rows with seq less than or equal
            to this value, applied before seq-range, paging, and logical
            message merging; combines with the other filters as an
            intersection. A value of 0 returns an empty transcript.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionMessageList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [sessions]
      summary: Send a message to a session (SSE streaming)
      description: >-
        Durable turns include history-boundary and message-identity response
        headers. Immediate command replies may omit them. The sending client
        can retain its optimistic input; history reconstruction is needed
        when attaching through the read-only events endpoint.
      operationId: sendSessionMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/SendMessageRequest",
            }
      responses:
        "200":
          description: SSE stream of session events
          headers:
            X-Stella-History-Before:
              description: >-
                Inclusive transcript sequence after this turn's input was
                stored and before its first assistant or tool output. Use
                snapshot_seq with this value when rebuilding the turn.
              schema: { type: integer, format: int64, minimum: 0 }
            X-Stella-Message-Id:
              description: >-
                Stable message ID emitted by the stream's start frame. Its
                msg- prefix is followed by the exact observation scope.
              schema: { type: string }
          content:
            text/event-stream:
              schema: { type: string }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "410":
          description: >-
            The turn is terminal without a retained start boundary. Read the
            canonical transcript instead of creating a live assistant message.

  /api/agents/{agentId}/sessions/{sessionId}/usage:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get provider-reported LLM usage for a session
      description: >-
        Returns exact provider usage, never message-length estimates. Usage is
        persisted synchronously; pending_call_count remains zero for compatibility.
        A running session may still make more model calls. Token
        and cost totals are null unless every request reported usage and, for
        cost, every reported request had configured pricing.
      operationId: getSessionUsage
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionUsage",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/media/{mediaId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: mediaId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get immutable media referenced by a session message
      operationId: getSessionMedia
      responses:
        "200":
          description: media bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: media unchanged }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/stop:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: Stop the active turn on a session
      description: >
        Explicitly cancel the session's in-flight turn. Disconnecting from a
        message or events stream does not stop the turn.
      operationId: stopSession
      responses:
        "204": {
          description: "The active turn was stopped, or no turn was active",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/view:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: Mark a session viewed
      description: Clear its terminal status after the user opens the session.
      operationId: markSessionViewed
      responses:
        "204": { description: Session was marked viewed }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/events:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Stream a session's live turn events (read-only SSE)
      description: >-
        Observe one turn without initiating it, including turns executing on
        another replica. The stream emits the same AI-SDK UI message frames
        as the message-send endpoint. Without a cursor, it selects the current
        execution or an unclaimed queued run. A scoped cursor stays on that
        exact turn even if a later turn has started.

        A full rebuild first reads the transcript through
        X-Stella-History-Before, then seeds an empty assistant with
        X-Stella-Message-Id before consuming the stream from sequence 0. The
        history boundary and event cursor are different sequence coordinates.
        Reusing a positive event cursor requires matching applied UI state.
        A durable terminal frame ends the turn; connection loss alone does not.
      operationId: streamSessionEvents
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
          description: >-
            Observation cursor in scope:seq form. The scope is the run UUID,
            or x followed by the execution UUID for a turn without a run.
            The sequence is nonnegative; 0 replays that scope from its start.
      responses:
        "200":
          description: SSE stream of session events
          headers:
            X-Stella-History-Before:
              description: >-
                Inclusive transcript sequence after this turn's input was
                stored and before its first assistant or tool output. Use
                snapshot_seq with this value when rebuilding the turn.
              schema: { type: integer, format: int64, minimum: 0 }
            X-Stella-Message-Id:
              description: >-
                Stable message ID emitted by the stream's start frame. Its
                msg- prefix is followed by the exact observation scope.
              schema: { type: string }
          content:
            text/event-stream:
              schema: { type: string }
        "204":
          description: No current turn or no retained turn matching the supplied scope
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

        "409":
          description: >-
            The run cursor predates the retained event window. Rebuild from
            the canonical transcript instead of continuing from that cursor.
        "410":
          description: >-
            The selected turn is terminal without a retained start boundary.
            Read the canonical transcript without creating a live assistant.

  /api/agents/{agentId}/sessions/{sessionId}/context-items:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: List compacted context items for a session
      operationId: getSessionContextItems
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionContextItemList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/summaries/{summaryId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: summaryId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get compacted summary detail for a session
      operationId: getSessionSummary
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionSummaryDetail",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentId}/sessions/{sessionId}/workspace:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: List workspace disk entries and usage
      operationId: getSessionWorkspace
      parameters:
        - name: show_hidden
          in: query
          schema: { type: boolean, default: false }
          description: Include dot-prefixed files and directories
        - name: path
          in: query
          schema: { type: string, default: "" }
          description: Directory path to list relative to the workspace root
        - name: depth
          in: query
          schema: { type: integer, default: 2, minimum: 1 }
          description: Maximum number of levels to return below path
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to list (agent home or shared user data)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionWorkspace",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "413":
          description: workspace listing exceeds the supported entry limit
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/agents/{agentId}/sessions/{sessionId}/workspace/files:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: Create a file or directory in the session workspace
      operationId: createWorkspaceFile
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceCreateRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionWorkspace",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          description: mutation outcome is unknown; inspect workspace state before retrying
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }
    delete:
      tags: [sessions]
      summary: Delete a file or directory from the session workspace
      operationId: deleteWorkspaceFile
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceDeleteRequest",
            }
      responses:
        "204":
          description: deleted
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          description: mutation outcome is unknown; inspect workspace state before retrying
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }
    patch:
      tags: [sessions]
      summary: Rename or move a file or directory in the session workspace
      operationId: moveWorkspaceFile
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceMoveRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SessionWorkspace",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          description: mutation outcome is unknown; inspect workspace state before retrying
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/agents/{agentId}/sessions/{sessionId}/workspace/file-content:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sessions]
      summary: Get the content of a file in the session workspace
      operationId: getWorkspaceFileContent
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: >-
            A canonical workspace-relative path paired with scope. Portable
            $HOME, $STELLA_ASSETS_DIR, /workspace, and /user logical forms are
            accepted and mapped to their typed root. Host paths are rejected.
        - name: raw
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, serve the file bytes directly with the detected Content-Type instead of a JSON envelope
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to read from (agent home or shared user data)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WorkspaceFileContent",
              }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "413":
          description: file exceeds the supported read size
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }
    patch:
      tags: [sessions]
      summary: Write content to a file in the session workspace
      operationId: updateWorkspaceFileContent
      parameters:
        - name: scope
          in: query
          schema: {
            $ref: "../../components.yaml#/components/schemas/WorkspaceScope",
          }
          description: Which workspace root to target (agent home or shared user data)
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WorkspaceUpdateContentRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WorkspaceFileContent",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          description: mutation outcome is unknown; inspect workspace state before retrying
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/agents/{agentId}/sessions/{sessionId}/workspace/upload:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: Upload a file to the session workspace assets directory
      operationId: uploadWorkspaceFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WorkspaceUploadResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          description: mutation outcome is unknown; inspect workspace state before retrying
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }
        "413":
          description: file exceeds the supported upload size
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

