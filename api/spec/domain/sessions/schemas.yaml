openapi: 3.0.3
info:
  title: Sessions Components
  version: "1"
paths: {}
components:
  schemas:
    Session:
      type: object
      required: [id, channel, title, agent_id, user_id, created_at, last_active, archived]
      properties:
        id:          { type: string }
        channel:     { type: string }
        title:       { type: string }
        agent_id:    { type: string }
        user_id:     { type: integer, format: int64 }
        created_at:  { type: string }
        last_active: { type: string }
        archived:    { type: boolean }

    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            agent_name: { type: string }
            user_name:  { type: string }

    CreateSessionRequest:
      type: object
      properties:
        agent_id: { type: string }

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "Message content (required)"

    SystemPromptResponse:
      type: object
      required: [system_prompt]
      properties:
        system_prompt: { type: string }

    SessionWorkspace:
      type: object
      required: [root, paths]
      properties:
        root:
          type: string
          description: Absolute path of the workspace root directory
        paths:
          type: array
          items: { type: string }
          description: Relative file paths within the workspace

    WorkspaceCreateRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative path for the new file or directory
        is_dir:
          type: boolean
          description: Create a directory when true; a file when false or omitted
        content:
          type: string
          description: Initial file content (ignored when is_dir is true)

    WorkspaceDeleteRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative path of the file or directory to delete

    WorkspaceMoveRequest:
      type: object
      required: [path, new_path]
      properties:
        path:
          type: string
          description: Current relative path
        new_path:
          type: string
          description: New relative path (rename or move destination)

    WorkspaceFileContent:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: Relative path of the file within the workspace
        content:
          type: string
          description: File text content
        language:
          type: string
          description: Detected language hint for syntax highlighting

    WorkspaceUpdateContentRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: Relative path of the file within the workspace
        content:
          type: string
          description: New file content to write

    WorkspaceUploadResponse:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative path of the uploaded file within the workspace
