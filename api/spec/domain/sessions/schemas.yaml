openapi: 3.0.3
info:
  title: Sessions Components
  version: "1"
paths: {}
components:
  schemas:
    Session:
      type: object
      required: [
        id,
        channel,
        kind,
        title,
        agent_id,
        user_id,
        created_at,
        last_active,
        activity_status,
        archived,
      ]
      properties:
        id: { type: string }
        channel: { type: string }
        kind:
          type: string
          description: >-
            Session kind. "task" is the goal-worker session kind; the wire
            value predates the goal rename and is kept for stored sessions.
          enum: [main, chat, delegate, scheduler, task]
        project_id: { type: string }
        title: { type: string, maxLength: 1000 }
        agent_id: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        last_active: { type: string, format: date-time }
        activity_status:
          type: string
          readOnly: true
          description: >-
            Activity state for this session. Working is live process state;
            success and error describe an unviewed completed turn.
          enum: [idle, working, success, error]
        archived: { type: boolean }

    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            agent_name: { type: string }
            user_name: { type: string }

    CreateSessionRequest:
      type: object
      properties:
        agent_id: { type: string }
        kind:
          type: string
          enum: [main, chat]
        project_id: { type: string }

    UpdateSessionRequest:
      type: object
      properties:
        title: { type: string, maxLength: 1000 }

    MessagePart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, image, file]
        text:
          type: string
          description: Text content (when type is "text")
        image:
          type: string
          description: Base64-encoded image data (when type is "image")
        url:
          type: string
          description: File URL (when type is "file")
        mimeType:
          type: string
          description: MIME type of the image or file

    SendMessageRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/MessagePart"
          description: Message content parts (text, image, file)

    SystemPromptResponse:
      type: object
      required: [system_prompt]
      properties:
        system_prompt: { type: string }

    WorkspaceScope:
      type: string
      enum: [agent, user]
      default: agent
      description: >-
        Which root to operate on: agent — the agent work root ($HOME); user —
        shared user files, including $STELLA_ASSETS_DIR for assets.

    SessionWorkspace:
      type: object
      required: [root, paths, total_files, total_dirs, total_bytes]
      properties:
        root:
          type: string
          description: Canonical logical workspace root (/workspace for agent scope or /user for user scope), never a host path
        paths:
          type: array
          items: { type: string }
          description: Relative file and directory paths within the workspace. Directory paths end with a slash.
        total_files:
          type: integer
          description: Number of files in the workspace
        total_dirs:
          type: integer
          description: Number of directories in the workspace, excluding the root
        total_bytes:
          type: integer
          format: int64
          description: Total size of regular files in bytes

    WorkspaceCreateRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative path for the new file or directory
        is_dir:
          type: boolean
          description: Create a directory when true; a file when false or omitted
        content:
          type: string
          description: Initial file content (ignored when is_dir is true)

    WorkspaceDeleteRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative path of the file or directory to delete

    WorkspaceMoveRequest:
      type: object
      required: [path, new_path]
      properties:
        path:
          type: string
          description: Current relative path
        new_path:
          type: string
          description: New relative path (rename or move destination)

    WorkspaceFileContent:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: Relative path of the file within the workspace
        content:
          type: string
          description: File text content
        language:
          type: string
          description: Detected language hint for syntax highlighting

    WorkspaceUpdateContentRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: Relative path of the file within the workspace
        content:
          type: string
          description: New file content to write

    WorkspaceUploadResponse:
      type: object
      required: [path, relative_path, scope]
      properties:
        path:
          type: string
          description: >-
            Portable logical path of the uploaded file under $STELLA_ASSETS_DIR,
            embedded in the message text the agent reads; never a host path.
        relative_path:
          type: string
          description: >-
            Path of the uploaded file relative to its workspace root. Combine with
            scope to build a workspace file-content read URL.
        scope:
          allOf:
            - $ref: "#/components/schemas/WorkspaceScope"
          description: Which workspace root the file was written to.

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        next_page_token: { type: string, nullable: true }

    SessionMessageBlock:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, thinking, tool_call, image]
        text:
          type: string
          description: Text content when type is "text".
        thinking:
          type: string
          description: Reasoning content when type is "thinking".
        id:
          type: string
          description: Tool call ID when type is "tool_call".
        name:
          type: string
          description: Tool name when type is "tool_call".
        arguments:
          type: object
          additionalProperties: {}
          description: Tool arguments when type is "tool_call".
        media_id:
          type: string
          description: Immutable session media ID when type is "image".
        mime_type:
          type: string
          description: Detected MIME type when type is "image".
        url:
          type: string
          description: Authenticated session-relative media URL when type is "image".

    SessionMessageReference:
      type: object
      required: [v, type, id]
      properties:
        v: { type: integer }
        type: { type: string }
        id: { type: string }
        agent_id: { type: string }
        intent: { type: string }
        preview:
          type: object
          properties:
            title: { type: string }
            status: { type: string }

    SessionMessage:
      type: object
      required: [id, role, actor_type, timestamp, token_count]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant, tool]
        actor_type:
          type: string
          enum: [human, agent, system]
        actor_id: { type: string }
        source_session_id: { type: string }
        content: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/SessionMessageBlock" }
        tool_call_id: { type: string }
        tool_name: { type: string }
        is_error: { type: boolean }
        references:
          type: array
          items: { $ref: "#/components/schemas/SessionMessageReference" }
        timestamp: { type: string, format: date-time }
        token_count: { type: integer, format: int64 }

    SessionMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/SessionMessage" }

    SessionContextMeta:
      type: object
      required:
        [
          message_count,
          source_token_count,
          active_token_count,
          summary_depth,
        ]
      properties:
        message_count: { type: integer }
        source_token_count: { type: integer }
        active_token_count: { type: integer }
        summary_depth: { type: integer }

    SessionContextMessage:
      type: object
      required: [id, seq, role, actor_type, timestamp, token_count]
      properties:
        id: { type: string }
        seq: { type: integer }
        role: { type: string }
        actor_type:
          type: string
          enum: [human, agent, system]
        actor_id: { type: string }
        source_session_id: { type: string }
        event_type: { type: string }
        content: { type: string }
        timestamp: { type: string, format: date-time }
        token_count: { type: integer }
        data:
          type: object
          additionalProperties: {}

    SessionContextSummary:
      type: object
      required:
        [
          id,
          kind,
          depth,
          content,
          token_count,
          descendant_count,
          descendant_token_count,
          source_message_token_count,
          created_at,
        ]
      properties:
        id: { type: string }
        kind: { type: string }
        depth: { type: integer }
        content: { type: string }
        token_count: { type: integer }
        earliest_at: { type: string, format: date-time, nullable: true }
        latest_at: { type: string, format: date-time, nullable: true }
        descendant_count: { type: integer }
        descendant_token_count: { type: integer }
        source_message_token_count: { type: integer }
        created_at: { type: string, format: date-time }

    SessionContextItem:
      type: object
      required: [ordinal, type]
      properties:
        ordinal: { type: integer }
        type:
          type: string
          enum: [message, summary]
        event_type: { type: string }
        message: { $ref: "#/components/schemas/SessionContextMessage" }
        summary: { $ref: "#/components/schemas/SessionContextSummary" }

    SessionContextItemList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionContextItem" }
        meta: { $ref: "#/components/schemas/SessionContextMeta" }
        next_page_token: { type: string, nullable: true }

    SessionSummaryDetail:
      type: object
      required: [summary, children]
      properties:
        summary: { $ref: "#/components/schemas/SessionContextSummary" }
        children:
          type: array
          items: { $ref: "#/components/schemas/SessionContextSummary" }
        message_seq_from: { type: integer, nullable: true }
        message_seq_to: { type: integer, nullable: true }
