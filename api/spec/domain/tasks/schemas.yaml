openapi: 3.0.3
info:
  title: Agent Tasks Components
  version: "1"
paths: {}
components:
  schemas:
    AgentTask:
      type: object
      required: [id, title, status, priority, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [
            pending,
            running,
            blocked,
            review_requested,
            done,
            failed,
            cancelled,
          ]
        priority:
          type: string
          enum: [routine, urgent]
        session_id: { type: string }
        context:
          type: object
          additionalProperties: {}
          description: "Task-level metadata checkpoint (phase, decisions, blockers)"
        review_request:
          $ref: "#/components/schemas/AgentTaskReviewRequest"
        deps:
          type: array
          items: { type: string }
          description: "IDs of tasks that must be done before this task can run"
        notify_at: {
          type: string,
          format: date-time,
          description: "When to next notify the user; null means no pending notification",
        }
        agent_id: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTask" }

    AgentTaskInput:
      type: object
      required: [title, agent_id]
      description: "Fields for creating an agent task"
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }
        deps:
          type: array
          items: { type: string }
          description: "IDs of tasks that must be done before this task can run"

    AgentTaskUpdate:
      type: object
      description: "Fields for updating an agent task (all optional)"
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }

    AgentTaskAction:
      type: object
      required: [type]
      description: "An action taken on a task (approve/reject review, respond to block, cancel)"
      properties:
        type:
          type: string
          enum: [approve, reject, respond, cancel]
        message: {
          type: string,
          description: "Optional message for respond/reject actions",
        }

    AgentTaskReviewRequest:
      type: object
      description: "Structured review request set by the task agent"
      properties:
        question: { type: string }
        options:
          type: array
          items: { type: string }
        recommendation: { type: string }
        risk:
          type: string
          enum: [low, medium, high]
        details: { type: string }

    AgentTaskEvent:
      type: object
      required: [id, task_id, event_type, created_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        event_type:
          type: string
          enum: [
            started,
            progress,
            blocked,
            review_requested,
            done,
            failed,
            cancelled,
          ]
        detail:
          type: object
          additionalProperties: {}
        created_at: { type: string, format: date-time }

    AgentTaskEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskEvent" }

    AgentTaskDepsInput:
      type: object
      required: [dep_id]
      properties:
        dep_id:
          type: string
          description: "ID of the task to add as a dependency"

    AgentTaskDepsInfo:
      type: object
      required: [upstream, downstream]
      properties:
        upstream:
          type: array
          items: { $ref: "#/components/schemas/AgentTask" }
          description: "Tasks this task depends on"
        downstream:
          type: array
          items: { $ref: "#/components/schemas/AgentTask" }
          description: "Tasks that depend on this task"

    AgentTaskBatchInput:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskBatchItem" }

    AgentTaskBatchItem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }
        draft_id:
          type: string
          description: "Temporary ID for intra-batch dep references"
        deps:
          type: array
          items: { type: string }
          description: "IDs of existing tasks or draft_ids from this batch"
