openapi: 3.0.3
info:
  title: Task System Components
  version: "2"
paths: {}
components:
  schemas:
    AgentTask:
      type: object
      required: [
        id,
        org_id,
        user_id,
        title,
        status,
        priority,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        org_id: { type: string }
        user_id: { type: string }
        agent_id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [
            draft,
            ready,
            running,
            blocked,
            reviewing,
            done,
            failed,
            cancelled,
          ]
        priority:
          type: string
          enum: [routine, urgent]
        required_flag: { type: boolean }
        retry_count: { type: integer }
        max_retries: { type: integer }
        not_before: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        session_id: { type: string }
        active_run_id: { type: string }
        active_blocker_id: { type: string }
        context:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }

    AgentTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTask" }

    AgentTaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        executor_agent_id: { type: string }
        max_retries: { type: integer }
        not_before: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        context:
          type: object
          additionalProperties: true
        deps:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskDepInput" }
        activate:
          type: boolean

    AgentTaskDepInput:
      type: object
      required: [dep_task_id]
      properties:
        dep_task_id: { type: string }
        kind:
          type: string
          enum: [hard, soft]
        on_failure:
          type: string
          enum: [block, fail, ignore]

    AgentTaskReadiness:
      type: object
      required: [state, dispatchable]
      properties:
        state:
          type: string
          enum: [
            dispatchable,
            waiting_deps,
            deferred,
            throttled,
            blocked,
            running,
            terminal,
            draft,
          ]
        dispatchable: { type: boolean }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskReadinessReason" }

    AgentTaskReadinessReason:
      type: object
      required: [type]
      properties:
        type: { type: string }
        upstream_id: { type: string }
        detail: { type: string }
