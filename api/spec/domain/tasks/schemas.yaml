openapi: 3.0.3
info:
  title: Agent Tasks Components
  version: "1"
paths: {}
components:
  schemas:
    AgentTask:
      type: object
      required: [id, title, status, priority, task_type, created_at, updated_at]
      properties:
        id: { type: string }
        parent_id: { type: string, nullable: true }
        root_id: { type: string }
        task_type:
          type: string
          enum: [goal, task]
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [
            draft,
            ready,
            running,
            blocked,
            reviewing,
            changes_requested,
            done,
            failed,
            cancelled,
          ]
        priority:
          type: string
          enum: [routine, urgent]
        required: { type: boolean }
        retry_count: { type: integer }
        max_retries: { type: integer }
        review_policy:
          type: string
          nullable: true
          enum: [auto, agent, human]
        session_id: { type: string }
        context:
          type: object
          additionalProperties: {}
          description: "Task-level metadata checkpoint (phase, decisions, blockers)"
        review_request:
          $ref: "#/components/schemas/AgentTaskReviewRequest"
        deps:
          type: array
          items: { type: string }
          description: "IDs of tasks that must be done before this task can run"
        notify_at: {
          type: string,
          format: date-time,
          nullable: true,
          description: "When to next notify the user; null means no pending notification",
        }
        assignee_agent_id: { type: string, nullable: true }
        created_by_agent_id: { type: string, nullable: true }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTask" }

    AgentTaskInput:
      type: object
      required: [title]
      description: "Fields for creating an agent task"
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }
        review_policy:
          type: string
          enum: [auto, agent, human]
        deps:
          type: array
          items: { type: string }
          description: "IDs of tasks that must be done before this task can run"

    AgentTaskUpdate:
      type: object
      description: "Fields for updating an agent task (all optional)"
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }

    AgentTaskAction:
      type: object
      required: [type]
      description: "An action taken on a task (approve/reject review, respond to block, cancel)"
      properties:
        type:
          type: string
          enum: [approve, reject, respond, cancel]
        message: {
          type: string,
          description: "Optional message for respond/reject actions",
        }

    AgentTaskReviewRequest:
      type: object
      description: "Structured review request set by the task agent"
      properties:
        question: { type: string }
        options:
          type: array
          items: { type: string }
        recommendation: { type: string }
        risk:
          type: string
          enum: [low, medium, high]
        details: { type: string }

    AgentTaskEvent:
      type: object
      required: [id, task_id, event_type, created_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        run_id: { type: string, nullable: true }
        review_id: { type: string, nullable: true }
        event_type:
          type: string
          enum: [
            started,
            progress,
            blocked,
            reviewing,
            done,
            failed,
            cancelled,
            reopened,
            plan_ready,
          ]
        detail:
          type: object
          additionalProperties: {}
        created_at: { type: string, format: date-time }

    AgentTaskEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskEvent" }

    AgentTaskDepsInput:
      type: object
      required: [dep_id]
      properties:
        dep_id:
          type: string
          description: "ID of the task to add as a dependency"

    AgentTaskDepsInfo:
      type: object
      required: [upstream, downstream]
      properties:
        upstream:
          type: array
          items: { $ref: "#/components/schemas/AgentTask" }
          description: "Tasks this task depends on"
        downstream:
          type: array
          items: { $ref: "#/components/schemas/AgentTask" }
          description: "Tasks that depend on this task"

    AgentTaskBatchInput:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskBatchItem" }

    AgentTaskBatchItem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }
        draft_id:
          type: string
          description: "Temporary ID for intra-batch dep references"
        deps:
          type: array
          items: { type: string }
          description: "IDs of existing tasks or draft_ids from this batch"

    AgentTaskRun:
      type: object
      required: [id, task_id, kind, purpose, status, created_at, updated_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        agent_id: { type: string, nullable: true }
        kind:
          type: string
          enum: [manager_run, worker_run, reviewer_run]
        purpose:
          type: string
          enum: [
            planning,
            synthesis,
            replan,
            execution,
            review,
            auto_approval,
            failure_assessment,
          ]
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, interrupted]
        session_id: { type: string, nullable: true }
        result_json:
          type: object
          additionalProperties: {}
        error: { type: string }
        deadline_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentTaskRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskRun" }

    AgentTaskReview:
      type: object
      required: [id, task_id, reviewer_type, status, created_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        reviewer_type:
          type: string
          enum: [agent, human, system]
        reviewer_id: { type: string }
        submitted_run_id: { type: string }
        reviewer_run_id: { type: string, nullable: true }
        status:
          type: string
          enum: [requested, approved, changes_requested, rejected, cancelled]
        summary: { type: string }
        feedback: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskReviewItem" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    AgentTaskReviewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskReview" }

    AgentTaskReviewItem:
      type: object
      required: [id, criterion_id]
      properties:
        id: { type: string }
        criterion_id: { type: string }
        passed: { type: boolean, nullable: true }
        evidence: { type: string }
        created_at: { type: string, format: date-time }

    AgentTaskAcceptanceCriterion:
      type: object
      required: [id, task_id, description, required, position]
      properties:
        id: { type: string }
        task_id: { type: string }
        description: { type: string }
        required: { type: boolean }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    AgentTaskAcceptanceCriterionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskAcceptanceCriterion" }

    AgentTaskAcceptanceCriterionInput:
      type: object
      required: [description]
      properties:
        description: { type: string }
        required: { type: boolean, default: true }
        position: { type: integer }

    GoalInput:
      type: object
      required: [title]
      description: "Fields for creating a goal"
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }

    SplitTaskInput:
      type: object
      required: [children]
      description: "Children to create under a goal"
      properties:
        children:
          type: array
          items: { $ref: "#/components/schemas/ChildTaskInput" }

    ChildTaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority:
          type: string
          enum: [routine, urgent]
        agent_id: { type: string }
        required: { type: boolean, default: true }
        review_policy:
          type: string
          enum: [auto, agent, human]
        deps:
          type: array
          items: { type: string }
          description: "Index or ID of sibling/external task dependencies"
        criteria:
          type: array
          items: { type: string }
          description: "Acceptance criterion descriptions"

    ReviewDecisionInput:
      type: object
      required: [status]
      description: "A review decision on a task"
      properties:
        status:
          type: string
          enum: [approved, changes_requested, rejected]
        summary: { type: string }
        feedback: { type: string }
        items:
          type: array
          items:
            type: object
            required: [criterion_id, passed]
            properties:
              criterion_id: { type: string }
              passed: { type: boolean }
              evidence: { type: string }
