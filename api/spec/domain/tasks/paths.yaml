paths:
  /api/tasks:
    get:
      tags: [tasks]
      summary: List tasks for the caller's org
      operationId: listTasks
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - {
            name: offset,
            in: query,
            required: false,
            schema: { type: integer },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTaskList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [tasks]
      summary: Create a task
      description: |
        Creates a task in `draft`. If `activate=true`, transitions to `ready` before returning.
        If `executor_agent_id` is set, writes a dispatch hint the dispatcher consumes on first claim (D13).
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AgentTaskInput",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/tasks/{taskID}:
    parameters:
      - { name: taskID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: Get a task
      operationId: getTask
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/tasks/{taskID}/cancel:
    parameters:
      - { name: taskID, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: Cancel a task
      operationId: cancelTask
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/tasks/{taskID}/readiness:
    parameters:
      - { name: taskID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: Computed readiness for a task
      operationId: getTaskReadiness
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTaskReadiness",
              }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
