paths:
  /api/tasks:
    get:
      tags: [tasks]
      summary: List tasks
      operationId: listTasks
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - {
            name: agent_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer, format: int64 },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/TaskList" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
    post:
      tags: [tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CreateTaskRequest",
              }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Task" }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/tasks/{taskID}:
    parameters:
      - { name: taskID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: Get a task
      operationId: getTask
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Task" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/tasks/{taskID}/cancel:
    parameters:
      - { name: taskID, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: Cancel a task
      operationId: cancelTask
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CancelRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Task" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/tasks/{taskID}/reopen:
    parameters:
      - { name: taskID, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: Reopen a done/failed task; optionally cascade-reset downstream
      operationId: reopenTask
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/ReopenRequest",
              }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Task" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/tasks/{taskID}/readiness:
    parameters:
      - { name: taskID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: Compute task readiness
      operationId: getTaskReadiness
      responses:
        "200":
          description: ok
          content:
            application/json:
