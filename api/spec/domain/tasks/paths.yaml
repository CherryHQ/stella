paths:
  /api/tasks:
    get:
      tags: [tasks]
      summary: List tasks
      operationId: listTasks
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - {
            name: agent_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: project_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - name: archived
          in: query
          required: false
          description: When true returns only archived tasks (the history/restore view) instead of the default active set.
          schema: { type: boolean }
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/TaskList" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
    post:
      tags: [tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../components.yaml#/components/schemas/CreateTaskRequest",
              }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Task" }
        "400":
          { $ref: "../../components.yaml#/components/responses/BadRequest" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/tasks/{taskId}:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: Get a task
      operationId: getTask
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Task" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

    delete:
      tags: [tasks]
      summary: Archive a task
      description: Audit-safe delete; hides terminal/draft tasks from default lists without removing history.
      operationId: deleteTask
      responses:
        "204": { description: archived }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/tasks/{taskId}/unarchive:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: Restore an archived task to default lists
      operationId: unarchiveTask
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                { $ref: "../../components.yaml#/components/schemas/Task" }
        "401":
          { $ref: "../../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409":
          { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/tasks/{taskId}/cancel:
