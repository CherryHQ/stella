paths:
  /api/agents/{agentID}/tasks:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: List agent tasks
      operationId: listAgentTasks
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTaskList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [tasks]
      summary: Create an agent task
      operationId: createAgentTask
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AgentTaskInput",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{agentID}/tasks/batch:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: Batch create agent tasks with intra-batch dependencies
      operationId: batchCreateAgentTasks
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AgentTaskBatchInput",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTaskList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{agentID}/tasks/unblocked:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: List unblocked agent tasks (all deps done)
      operationId: listUnblockedAgentTasks
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTaskList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/agents/{agentID}/tasks/{taskID}:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
      - { name: taskID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: Get an agent task
      operationId: getAgentTask
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      summary: Update an agent task
      operationId: updateAgentTask
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AgentTaskUpdate",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [tasks]
      summary: Delete an agent task
      operationId: deleteAgentTask
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentID}/tasks/{taskID}/action:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
      - { name: taskID, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: Take an action on an agent task
      operationId: agentTaskAction
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AgentTaskAction",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentID}/tasks/{taskID}/events:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
      - { name: taskID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: List agent task events
      operationId: listAgentTaskEvents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTaskEventList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentID}/tasks/{taskID}/deps:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
      - { name: taskID, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: Get task dependency info (upstream and downstream)
      operationId: getAgentTaskDeps
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTaskDepsInfo",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    post:
      tags: [tasks]
      summary: Add a dependency to a task
      operationId: addAgentTaskDep
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/AgentTaskDepsInput",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/agents/{agentID}/tasks/{taskID}/deps/{depID}:
    parameters:
      - { name: agentID, in: path, required: true, schema: { type: string } }
      - { name: taskID, in: path, required: true, schema: { type: string } }
      - { name: depID, in: path, required: true, schema: { type: string } }
    delete:
      tags: [tasks]
      summary: Remove a dependency from a task
      operationId: removeAgentTaskDep
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/AgentTask",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
