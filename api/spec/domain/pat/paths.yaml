paths:
  /api/users/me/tokens:
    get:
      tags: [pat]
      summary: List the current user's personal access tokens
      operationId: listPersonalAccessTokens
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PersonalAccessTokenList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
    post:
      tags: [pat]
      summary: Create a personal access token
      operationId: createPersonalAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreatePersonalAccessTokenRequest",
            }
      responses:
        "201":
          description: created; plaintext token returned once
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CreatePersonalAccessTokenResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/users/me/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [pat]
      summary: Get a personal access token
      operationId: getPersonalAccessToken
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PersonalAccessToken",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [pat]
      summary: Revoke a personal access token
      operationId: revokePersonalAccessToken
      responses:
        "204":
          description: revoked
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
