paths:
  /api/builtin/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
    get:
      tags: [builtin]
      summary: List builtin resources of a given kind
      operationId: listBuiltinResources
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {
                  $ref: "../../components.yaml#/components/schemas/BuiltinResource",
                }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/builtin/{kind}/{id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [builtin]
      summary: Get a specific builtin resource
      operationId: getBuiltinResource
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/BuiltinResourceDetail",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
