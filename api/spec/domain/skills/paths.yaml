paths:
  /api/skills/search:
    get:
      tags: [skills]
      summary: Search skills from mcphub (any authenticated user)
      operationId: searchSkills
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillSearchResultList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/skills:
    get:
      tags: [skills]
      summary: List scoped skills for management
      operationId: listScopedSkills
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, user_agent, system, system_agent]
            default: user
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [skills]
      summary: Create a scoped skill
      operationId: createScopedSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ScopedCreateSkillRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/skills/install:
    post:
      tags: [skills]
      summary: Install a scoped skill from a remote source
      operationId: installScopedSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ScopedInstallSkillRequest",
            }
      responses:
        "201":
          description: installed
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/skills/upload:
    post:
      tags: [skills]
      summary: Upload a scoped skill zip
      operationId: uploadScopedSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                scope:
                  type: string
                  enum: [user, user_agent, system, system_agent]
                agent_id: { type: string }
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }

  /api/skills/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: "Skill id",
        }
    get:
      tags: [skills]
      summary: Get a scoped skill by id
      operationId: getScopedSkill
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [skills]
      summary: Update a scoped skill
      operationId: updateScopedSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdateSkillRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Skill",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [skills]
      summary: Delete a scoped skill
      operationId: deleteScopedSkill
      parameters:
        - name: expected_digest
          in: query
          required: false
          description: Required for mutable Home-backed Skills; validated after authorization.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/skills/{id}/file:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string },
          description: "Skill id",
        }
    get:
      tags: [skills]
      summary: Get a scoped skill file by path
      operationId: getScopedSkillFile
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/SkillFileResponse",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [skills]
      summary: Delete a scoped skill file by path
      operationId: deleteScopedSkillFile
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: expected_digest
          in: query
          required: false
          description: Required for mutable Home-backed Skills; validated after authorization.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "204":
          description: deleted
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
