openapi: 3.0.3
info:
  title: Skills Components
  version: "1"
paths: {}
components:
  schemas:
    SkillSearchResult:
      type: object
      properties:
        id: { type: string }
        skillId: { type: string }
        name: { type: string }
        installs: { type: integer }
        source: { type: string }

    SkillSearchResultList:
      type: object
      required: [skills]
      properties:
        skills: {
          type: array,
          items: { $ref: "#/components/schemas/SkillSearchResult" },
        }

    ScopedCreateSkillRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        agent_id: { type: string }
        description: { type: string }
        disable_model_invocation: { type: boolean }
        files:
          type: object
          additionalProperties: { type: string }

    ScopedInstallSkillRequest:
      type: object
      required: [source, scope]
      properties:
        source: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        agent_id: { type: string }

    CopyPackageSkillRequest:
      type: object
      required: [source_id, expected_digest, skill_name, scope]
      properties:
        source_id:
          type: string
          description: Plugin definition whose published package provides the Skill.
        expected_digest:
          type: string
          description: Content digest of the package the caller reviewed.
        skill_name:
          type: string
          description: Declared Skill name to copy from the package.
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        agent_id:
          type: string
          description: Target Agent for an agent-scoped copy.
