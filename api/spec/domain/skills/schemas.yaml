openapi: 3.0.3
info:
  title: Skills Components
  version: "1"
paths: {}
components:
  schemas:
    SkillSearchResult:
      type: object
      properties:
        id: { type: string }
        skillId: { type: string }
        name: { type: string }
        installs: { type: integer }
        source: { type: string }

    SkillSearchResultList:
      type: object
      required: [skills]
      properties:
        skills: {
          type: array,
          items: { $ref: "#/components/schemas/SkillSearchResult" },
        }
        next_page_token: { type: string, nullable: true }
