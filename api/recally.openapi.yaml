openapi: 3.0.3
info:
  title: anna recally API
  description: |
    REST API for the recally reading-assistant feature of anna.

    The anna server is the only process that reads or writes the recally
    database and the article markdown files on disk. CLI, web UI, and
    third-party clients all talk HTTP.

    This spec is the source of truth: the generated Go server interface
    (`internal/admin/recally_gen.go`) and Go client
    (`pkg/recally/client/client_gen.go`) are derived from it.
  version: "1"
servers:
  - url: http://127.0.0.1:25678
    description: local anna server (default port)
security:
  - BearerAuth: []
tags:
  - name: articles
  - name: feeds
  - name: feed-entries
  - name: digest
paths:
  /api/recally/articles:
    get:
      tags: [articles]
      summary: List or search articles
      operationId: listArticles
      parameters:
        - { name: q,             in: query, description: "Free-text search across title, summary, tags, author", schema: { type: string } }
        - { name: status,        in: query, schema: { $ref: "#/components/schemas/ArticleStatus" } }
        - { name: source_type,   in: query, schema: { $ref: "#/components/schemas/SourceType" } }
        - { name: starred,       in: query, schema: { type: boolean } }
        - { name: canonical_url, in: query, description: "Lookup by exact canonical URL", schema: { type: string } }
        - { name: limit,         in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [articles]
      summary: Save an article (upsert by canonical URL)
      operationId: saveArticle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveArticleRequest" }
      responses:
        "200":
          description: existing article was updated (canonical URL already present)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "201":
          description: new article was created
          headers:
            Location: { schema: { type: string }, description: "Path to the new article resource" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/recally/articles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [articles]
      summary: Get an article
      operationId: getArticle
      parameters:
        - { name: include, in: query, description: "Comma-separated extras (only `content` supported)", schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [articles]
      summary: Update article fields (partial)
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateArticleRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [articles]
      summary: Delete an article (DB row + markdown file)
      operationId: deleteArticle
      responses:
        "204": { description: deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/recally/feeds:
    get:
      tags: [feeds]
      summary: List subscribed feeds
      operationId: listFeeds
      parameters:
        - { name: url, in: query, description: "Lookup by exact feed URL", schema: { type: string, format: uri } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [feeds]
      summary: Subscribe to a new feed (server fetches metadata)
      operationId: createFeed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFeedRequest" }
      responses:
        "201":
          description: created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: already subscribed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/recally/feeds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [feeds]
      summary: Get a feed
      operationId: getFeed
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [feeds]
      summary: Update feed fields (partial)
      operationId: updateFeed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeedRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [feeds]
      summary: Unsubscribe from a feed (cascade deletes entries)
      operationId: deleteFeed
      responses:
        "204": { description: deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/recally/feeds/{id}/poll:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [feeds]
      summary: Poll a feed (server fetches RSS, creates pending entries)
      operationId: pollFeed
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPollResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/recally/feeds/{feedId}/entries:
    parameters:
      - { name: feedId, in: path, required: true, schema: { type: string } }
    get:
      tags: [feed-entries]
      summary: List entries for a feed
      operationId: listFeedEntries
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FeedEntryStatus" } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedEntryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/recally/feeds/{feedId}/entries/{id}:
    parameters:
      - { name: feedId, in: path, required: true, schema: { type: string } }
      - { name: id,     in: path, required: true, schema: { type: string } }
    put:
      tags: [feed-entries]
      summary: Update an entry (status transition)
      operationId: updateFeedEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeedEntryRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/recally/digest:
    get:
      tags: [digest]
      summary: Get the current user's reading digest
      operationId: getDigest
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Digest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: ANNA_TOKEN bearer token (generated via vault)

  responses:
    Unauthorized:
      description: missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    ArticleStatus:
      type: string
      enum: [unread, read, archived]
    SourceType:
      type: string
      enum: [web, twitter, youtube, github, rss, pdf]
    FeedEntryStatus:
      type: string
      enum: [pending, saved, skipped, error]

    Article:
      type: object
      required: [id, url, canonical_url, source_type, title, status, starred, file_path, saved_at, created_at, updated_at]
      properties:
        id:            { type: string }
        agent_id:      { type: string, nullable: true }
        url:           { type: string, format: uri }
        canonical_url: { type: string }
        source_type:   { $ref: "#/components/schemas/SourceType" }
        title:         { type: string }
        author:        { type: string }
        summary:       { type: string }
        tags:          { type: array, items: { type: string } }
        status:        { $ref: "#/components/schemas/ArticleStatus" }
        starred:       { type: boolean }
        file_path:     { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        published_at:  { type: string, format: date-time, nullable: true }
        saved_at:      { type: string, format: date-time }
        read_at:       { type: string, format: date-time, nullable: true }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
        content:
          type: string
          description: "Article body in markdown. Returned only when ?include=content is set."
          nullable: true

    ArticleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Article" } }

    SaveArticleRequest:
      type: object
      required: [url]
      properties:
        url:           { type: string, format: uri }
        canonical_url: { type: string }
        source_type:   { $ref: "#/components/schemas/SourceType" }
        title:         { type: string }
        author:        { type: string }
        summary:       { type: string }
        tags:          { type: array, items: { type: string } }
        content:
          type: string
          description: "Markdown body. If empty and the article exists, only metadata is updated; if empty and the article is new, the request fails 400."
        metadata:
          type: object
          additionalProperties: { type: string }
        published_at:  { type: string, format: date-time, nullable: true }
        agent_id:      { type: string, nullable: true }

    UpdateArticleRequest:
      type: object
      description: "Only provided fields are updated."
      properties:
        title:     { type: string }
        author:    { type: string }
        summary:   { type: string }
        tags:      { type: array, items: { type: string } }
        status:    { $ref: "#/components/schemas/ArticleStatus" }
        starred:   { type: boolean }
        file_path: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        content:
          type: string
          description: "If set, rewrites the markdown file body."

    Feed:
      type: object
      required: [id, url, title, check_interval, enabled, created_at, updated_at]
      properties:
        id:              { type: string }
        agent_id:        { type: string, nullable: true }
        url:             { type: string, format: uri }
        title:           { type: string }
        description:     { type: string }
        check_interval:  { type: string }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_etag:       { type: string }
        last_modified:   { type: string }
        enabled:         { type: boolean }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }

    FeedList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Feed" } }

    CreateFeedRequest:
      type: object
      required: [url]
      properties:
        url:      { type: string, format: uri }
        title:    { type: string, description: "Optional override; server fetches feed metadata if omitted" }
        agent_id: { type: string, nullable: true }

    UpdateFeedRequest:
      type: object
      properties:
        title:           { type: string }
        description:     { type: string }
        check_interval:  { type: string }
        enabled:         { type: boolean }

    FeedEntry:
      type: object
      required: [id, feed_id, guid, url, title, status, attempts, discovered_at]
      properties:
        id:           { type: string }
        feed_id:      { type: string }
        guid:         { type: string }
        url:          { type: string }
        title:        { type: string }
        status:       { $ref: "#/components/schemas/FeedEntryStatus" }
        article_id:   { type: string, nullable: true }
        attempts:     { type: integer }
        error_msg:    { type: string }
        discovered_at: { type: string, format: date-time }
        processed_at:  { type: string, format: date-time, nullable: true }

    FeedEntryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FeedEntry" } }

    UpdateFeedEntryRequest:
      type: object
      required: [status]
      properties:
        status:     { $ref: "#/components/schemas/FeedEntryStatus" }
        article_id: { type: string, nullable: true }
        error_msg:  { type: string }

    FeedPollResult:
      type: object
      required: [feed, new_entries]
      properties:
        feed:        { $ref: "#/components/schemas/Feed" }
        new_entries: { type: array, items: { $ref: "#/components/schemas/FeedEntry" } }
        error:       { type: string, nullable: true, description: "Set if the upstream RSS fetch failed but the feed exists" }

    TagCount:
      type: object
      required: [tag, count]
      properties:
        tag:   { type: string }
        count: { type: integer, format: int64 }

    Digest:
      type: object
      required:
        - date
        - saved_yesterday
        - saved_yesterday_count
        - unread_count
        - read_count
        - archived_count
        - starred_count
        - worth_revisiting
        - worth_revisiting_count
        - top_tags
        - total_articles
      properties:
        date:                   { type: string, format: date-time }
        saved_yesterday:        { type: array, items: { $ref: "#/components/schemas/Article" } }
        saved_yesterday_count:  { type: integer }
        unread_count:           { type: integer, format: int64 }
        read_count:             { type: integer, format: int64 }
        archived_count:         { type: integer, format: int64 }
        starred_count:          { type: integer, format: int64 }
        worth_revisiting:       { type: array, items: { $ref: "#/components/schemas/Article" } }
        worth_revisiting_count: { type: integer }
        top_tags:               { type: array, items: { $ref: "#/components/schemas/TagCount" } }
        total_articles:         { type: integer, format: int64 }
