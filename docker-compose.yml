# Stella — Docker Compose example
#
# Named volume mode with Docker sandbox backend (DooD):
#   stellad runs inside the container; sandbox containers are created via the
#   host Docker socket. STELLA_HOME is backed by a named volume so the host
#   daemon can mount workspace subdirectories into sandbox containers via
#   volume subpath mounts (requires Docker Engine 25+).
#
# Quick start:
#   1. Set STELLA_VAULT_KEY (run `stella vault keygen`) and your API key in the
#      environment or a .env file.
#   2. Create the named volumes — they are external on purpose (see the volumes
#      section), so create them once before the first `up`:
#        docker volume create stella-data && docker volume create otel-data
#   3. docker compose up -d
#   4. Open http://localhost:25678 to configure agents and channels.
#
# First-run setup (before running in the background):
#   docker compose run --rm -p 8080:8080 stella stellad server --port 8080
#   Then open http://localhost:8080 to finish setup.

services:
  stella:
    image: ${STELLA_IMAGE:-ghcr.io/cherryhq/stella:latest} # mise run dev:api:docker sets this to the local stella:latest
    restart: unless-stopped
    ports:
      - "25678:25678"
    volumes:
      # Named volume backing STELLA_HOME (~/.stella for the image's stella user) — required for docker sandbox volume mode
      - stella-data:/home/stella/.stella
      # Host Docker socket so stellad can create sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - STELLA_VAULT_KEY=${STELLA_VAULT_KEY:?set STELLA_VAULT_KEY first (run stella vault keygen)}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Authenticates the boot-time mise reconcile of builtin tools (avoids GitHub rate limits)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Lock sandbox backend via env (docker | local | none); UI becomes read-only
      - STELLA_SANDBOX_BACKEND=docker
      # Explicit Docker sandbox mode: host | bind | volume
      - STELLA_DOCKER_SANDBOX_MODE=volume
      # Tell volume mode which named volume backs STELLA_HOME
      - STELLA_HOME_VOLUME=stella-data
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4318

  otel:
    image: grafana/otel-lgtm
    container_name: otel-lgtm
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3000:3000" # Grafana UI
    volumes:
      - otel-data:/data

volumes:
  # external on purpose: a fixed-name, pre-created volume is shared across
  # projects/worktrees and survives `docker compose down -v`, so STELLA_HOME data
  # is never silently recreated. Create them once (see Quick start step 2).
  stella-data:
    external: true
  otel-data:
    external: true
