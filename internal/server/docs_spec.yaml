openapi: 3.0.3
info:
  title: stella API
  description: |
    Full REST API for stella covering ALL /api/* routes. This is the aggregated
    entry point; individual feature specs live in sub-files under api/spec/domain/:

    - Agents, Skills, Sessions, Models, Providers
    - Auth, Auth-Users, Profile, OAuth
    - Channels, Plugins, Manifest-Plugins
    - Recally (reading assistant), Scheduler (job scheduling)
    - Users, Vault, Builtin, Tools, Weixin

    Schema source of truth (human-edited, domain-organized):
      api/spec/components/common.yaml    — security schemes, shared responses
      api/spec/domain/<domain>/schemas.yaml — domain schemas

    api/spec/components.yaml is ASSEMBLED from the above by `mise run generate:api`.
    Do not hand-edit api/spec/components.yaml.

    Go code is generated via configs in api/codegen/:
      - api/types/gen.go  — from api/spec/components.yaml
      - api/server/gen.go       — from this file
      - api/client/gen.go       — from this file
    See the `generate:api` task in mise.toml.
  version: '1'
servers:
  - url: http://127.0.0.1:25678
    description: local stella server (default port)
security:
  - BearerAuth: []
tags:
  - name: articles
  - name: feeds
  - name: feed-entries
  - name: digest
  - name: jobs
  - name: models
  - name: tools
  - name: builtin
  - name: channels
  - name: weixin
  - name: providers
  - name: sessions
  - name: shares
  - name: agents
  - name: skills
  - name: users
  - name: auth-users
  - name: profile
  - name: auth
  - name: plugins
  - name: status
  - name: tasks
  - name: projects
paths:
  /api/status:
    get:
      tags:
        - status
      operationId: getStatus
      summary: Get runtime status and version metadata
      security: []
      responses:
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/auth/logout:
    post:
      tags:
        - auth
      summary: End the current session
      operationId: logout
      responses:
        '204':
          description: logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags:
        - auth
      summary: Get the currently authenticated user
      operationId: getMe
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/providers:
    get:
      tags:
        - auth
      summary: List available authentication providers
      operationId: listAuthProviders
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProviderList'
  /api/auth/sessions:
    get:
      tags:
        - auth
      summary: List current user's active sessions
      operationId: listAuthSessions
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - auth
      summary: Revoke an auth session
      operationId: deleteAuthSession
      responses:
        '204':
          description: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/agents:
    get:
      tags:
        - agents
      summary: List agents (any authenticated user; non-admin sees accessible only)
      operationId: listAgents
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - agents
      summary: Create an agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - agents
      summary: Get an agent
      operationId: getAgent
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - agents
      summary: Update an agent
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Agent'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - agents
      summary: Delete an agent
      operationId: deleteAgent
      responses:
        '204':
          description: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/{id}/users:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - agents
      summary: List users assigned to an agent (admin only)
      operationId: listAgentUsers
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - agents
      summary: Assign a user to an agent (admin only)
      operationId: assignAgentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignAgentUserRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/{id}/users/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - agents
      summary: Remove a user from an agent (admin only)
      operationId: removeAgentUser
      responses:
        '204':
          description: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/{id}/skills:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - skills
      summary: List skills visible to the current user in an agent context
      operationId: listAgentSkills
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - project
              - user
              - agent
              - system
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - skills
      summary: Create a skill in an agent or current-user scope
      operationId: createAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/{id}/skills/install:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - skills
      summary: Install a skill from a remote source
      operationId: installAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallSkillRequest'
      responses:
        '201':
          description: installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/{id}/skills/upload:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - skills
      summary: Upload a skill zip
      operationId: uploadAgentSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                scope:
                  type: string
                  enum:
                    - user
                    - agent
      responses:
        '201':
          description: uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/agents/{id}/skills/{skillId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: skillId
        in: path
        required: true
        schema:
          type: string
        description: Skill name
    get:
      tags:
        - skills
      summary: Get a skill by name (optionally scoped)
      operationId: getAgentSkill
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - project
              - user
              - agent
              - system
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - skills
      summary: Update a skill
      operationId: updateAgentSkill
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - user
              - agent
              - system
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - skills
      summary: Delete a skill
      operationId: deleteAgentSkill
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - user
              - agent
              - system
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '204':
          description: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/{id}/skills/{skillId}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: skillId
        in: path
        required: true
        schema:
          type: string
        description: Skill name
    get:
      tags:
        - skills
      summary: Get a skill file by path
      operationId: getAgentSkillFile
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - project
              - user
              - agent
              - system
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - skills
      summary: Delete a skill file
      operationId: deleteAgentSkillFile
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - user
              - agent
              - system
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '204':
          description: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/{agentId}/projects:
    get:
      tags:
        - projects
      summary: List projects for an agent
      operationId: listProjects
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
          description: Include archived projects
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - projects
      summary: Create a project
      operationId: createProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/agents/{agentId}/projects/{projectId}:
    get:
      tags:
        - projects
      summary: Get a project
      operationId: getProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - projects
      summary: Update a project
      operationId: updateProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - projects
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/skills/search:
    get:
      tags:
        - skills
      summary: Search skills from mcphub (any authenticated user)
      operationId: searchSkills
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillSearchResultList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/recally/articles:
    get:
      tags:
        - articles
      summary: List or search articles
      operationId: listArticles
      parameters:
        - name: q
          in: query
          description: Free-text search across title, summary, tags, author
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ArticleStatus'
        - name: source_type
          in: query
          schema:
            $ref: '#/components/schemas/SourceType'
        - name: starred
          in: query
          schema:
            type: boolean
        - name: canonical_url
          in: query
          description: Lookup by exact canonical URL
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - articles
      summary: Save an article (upsert by canonical URL)
      operationId: saveArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveArticleRequest'
      responses:
        '200':
          description: existing article was updated (canonical URL already present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '201':
          description: new article was created
          headers:
            Location:
              schema:
                type: string
              description: Path to the new article resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/recally/articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - articles
      summary: Get an article
      operationId: getArticle
      parameters:
        - name: include
          in: query
          description: Comma-separated extras (only `content` supported)
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - articles
      summary: Update article fields (partial)
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - articles
      summary: Delete an article (DB row + markdown file)
      operationId: deleteArticle
      responses:
        '204':
          description: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/recally/feeds:
    get:
      tags:
        - feeds
      summary: List subscribed feeds
      operationId: listFeeds
      parameters:
        - name: url
          in: query
          description: Lookup by exact feed URL
          schema:
            type: string
            format: uri
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - feeds
      summary: Subscribe to a new feed (server fetches metadata)
      operationId: createFeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedRequest'
      responses:
        '201':
          description: created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: already subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/recally/feeds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - feeds
      summary: Get a feed
      operationId: getFeed
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - feeds
      summary: Update feed fields (partial)
      operationId: updateFeed
      requestBody:
