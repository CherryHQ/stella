components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: STELLA_TOKEN bearer token (generated via vault)
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    ArticleStatus:
      type: string
      enum:
        - unread
        - read
        - archived
    SourceType:
      type: string
      enum:
        - web
        - twitter
        - youtube
        - github
        - rss
        - pdf
    FeedEntryStatus:
      type: string
      enum:
        - pending
        - saved
        - skipped
        - error
    Article:
      type: object
      required:
        - id
        - url
        - canonical_url
        - source_type
        - title
        - status
        - starred
        - file_path
        - saved_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
        agent_id:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        canonical_url:
          type: string
        source_type:
          $ref: "#/components/schemas/SourceType"
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        starred:
          type: boolean
        file_path:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        saved_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        content:
          type: string
          description: Article body in markdown. Returned only when ?include=content is set.
          nullable: true
    ArticleList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
    SaveArticleRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        canonical_url:
          type: string
        source_type:
          $ref: "#/components/schemas/SourceType"
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        content:
          type: string
          description: Markdown body. If empty and the article exists, only metadata is updated; if empty and the article is new, the request fails 400.
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        agent_id:
          type: string
          nullable: true
    UpdateArticleRequest:
      type: object
      description: Only provided fields are updated.
      properties:
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        starred:
          type: boolean
        file_path:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        content:
          type: string
          description: If set, rewrites the markdown file body.
    Feed:
      type: object
      required:
        - id
        - url
        - title
        - check_interval
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
        agent_id:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        check_interval:
          type: string
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        last_etag:
          type: string
        last_modified:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FeedList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Feed"
    CreateFeedRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
          description: Optional override; server fetches feed metadata if omitted
        agent_id:
          type: string
          nullable: true
    UpdateFeedRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        check_interval:
          type: string
        enabled:
          type: boolean
    FeedEntry:
      type: object
      required:
        - id
        - feed_id
        - guid
        - url
        - title
        - status
        - attempts
        - discovered_at
      properties:
        id:
          type: string
        feed_id:
          type: string
        guid:
          type: string
        url:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/FeedEntryStatus"
        article_id:
          type: string
          nullable: true
        attempts:
          type: integer
        error_msg:
          type: string
        discovered_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
    FeedEntryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedEntry"
    UpdateFeedEntryRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/FeedEntryStatus"
        article_id:
          type: string
          nullable: true
        error_msg:
          type: string
    FeedPollResult:
      type: object
      required:
        - feed
        - new_entries
      properties:
        feed:
          $ref: "#/components/schemas/Feed"
        new_entries:
          type: array
          items:
            $ref: "#/components/schemas/FeedEntry"
        error:
          type: string
          nullable: true
          description: Set if the upstream RSS fetch failed but the feed exists
    TagCount:
      type: object
      required:
        - tag
        - count
      properties:
        tag:
          type: string
        count:
          type: integer
          format: int64
    Digest:
      type: object
      required:
