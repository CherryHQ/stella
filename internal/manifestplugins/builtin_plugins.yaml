plugins:
  - id: tool/mise
    kind: tool
    name: mise
    display_name: mise
    description: "Inject mise usage guidance into the system prompt and provide the mise binary."
    enabled: true
    binaries:
      - name: mise
        repo: jdx/mise
        # mise is bootstrapped via direct download in reconcile; this entry keeps it
        # tracked in the manifest for UI visibility and state tracking.

  - id: tool/tap-web
    kind: tool
    name: tap-web
    display_name: Tap Web
    description: "Web browsing skill powered by the tap CLI — fetch pages, run browser automation, and capture network traffic."
    enabled: true
    binaries:
      - name: tap
        repo: vaayne/tap
        version: "0.4.4"
        platforms:
          macos-arm64: "tap_*_darwin_arm64.tar.gz"
          macos-x64: "tap_*_darwin_amd64.tar.gz"
          linux-arm64: "tap_*_linux_arm64.tar.gz"
          linux-x64: "tap_*_linux_amd64.tar.gz"
      - name: lightpanda
        repo: lightpanda-io/browser
        version: "nightly"
        # mise auto-detects the raw binary and strips OS/arch suffix

  - id: tool/gh
    kind: tool
    name: gh
    display_name: GitHub CLI
    description: "GitHub CLI integration with OAuth-backed auth, session env, and prompt guidance."
    enabled: true
    binaries:
      - name: gh
        repo: cli/cli
        bin_path: "bin"
    session_env:
      - env_var: GH_TOKEN
        source: github_token

  - id: tool/lark-cli
    kind: tool
    name: lark-cli
    display_name: Lark CLI
    description: "Lark CLI integration with OAuth-backed auth, bundled skills, session env, and prompt guidance."
    enabled: true
    binaries:
      - name: lark-cli
        repo: larksuite/cli
        platforms:
          macos-arm64: "lark-cli-*-darwin-arm64.tar.gz"
          macos-x64: "lark-cli-*-darwin-amd64.tar.gz"
          linux-arm64: "lark-cli-*-linux-arm64.tar.gz"
          linux-x64: "lark-cli-*-linux-amd64.tar.gz"
    session_env:
      - env_var: LARKSUITE_CLI_USER_ACCESS_TOKEN
        source: lark_access_token
      - env_var: LARKSUITE_CLI_APP_ID
        source: lark_app_id
      - env_var: LARKSUITE_CLI_BRAND
        source: lark_brand
