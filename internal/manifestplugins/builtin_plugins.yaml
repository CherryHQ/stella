oauth_providers:
  - id: github
    scopes:
      - repo
      - workflow
      - gist
      - user
      - read:org
    vault_key: GH_OAUTH
    flows:
      - type: authorization_code
        auth_url: https://github.com/login/oauth/authorize
        token_url: https://github.com/login/oauth/access_token
      - type: device_code
        device_auth_url: https://github.com/login/device/code
        token_url: https://github.com/login/oauth/access_token

  - id: lark
    scopes:
      - offline_access
      - contact:user.base:readonly
      - im:message
      - im:chat:readonly
      - calendar:calendar:readonly
      - drive:file:download
      - drive:drive.metadata:readonly
      - docs:document.content:read
      - docs:document.comment:read
      - docs:document.comment:create
      - docs:document:export
      - docx:document
      - wiki:wiki
      - sheets:spreadsheet
      - slides:presentation:read
      - slides:presentation:update
      - task:task
      - task:comment:read
      - task:comment:write
    vault_key: LARK_CLI_OAUTH
    flows:
      - type: authorization_code
        auth_url: https://open.larksuite.com/open-apis/authen/v1/authorize
        token_url: https://open.larksuite.com/open-apis/authen/v2/oauth/token
        auth_style: in_params

  - id: feishu
    scopes:
      - offline_access
      - contact:user.base:readonly
      - im:message
      - im:chat:readonly
      - calendar:calendar:readonly
      - drive:file:download
      - drive:drive.metadata:readonly
      - docs:document.content:read
      - docs:document.comment:read
      - docs:document.comment:create
      - docs:document:export
      - docx:document
      - wiki:wiki
      - sheets:spreadsheet
      - slides:presentation:read
      - slides:presentation:update
      - task:task
      - task:comment:read
      - task:comment:write
    vault_key: FEISHU_CLI_OAUTH
    flows:
      - type: authorization_code
        auth_url: https://open.feishu.cn/open-apis/authen/v1/authorize
        token_url: https://open.feishu.cn/open-apis/authen/v2/oauth/token
        auth_style: in_params

plugins:
  - id: tool/tap-web
    kind: tool
    name: tap-web
    display_name: Tap Web
    description: "Web browsing skill powered by the tap CLI — fetch pages, run browser automation, and capture network traffic."
    enabled: true
    binaries:
      - name: tap
        repo: vaayne/tap
        version: "0.4.4"
      - name: lightpanda
        repo: lightpanda-io/browser
        version: "nightly"

  - id: tool/gh
    kind: tool
    name: gh
    display_name: GitHub CLI
    description: "GitHub CLI integration with OAuth-backed session auth."
    enabled: true
    binaries:
      - name: gh
        repo: cli/cli
        bin_path: "bin"
    oauth_provider: github
    session_env:
      - env_var: GH_TOKEN
        source: oauth.access_token

  - id: tool/lark-cli
    kind: tool
    name: lark-cli
    display_name: Lark CLI
    description: "Lark CLI integration with OAuth-backed auth, bundled skills, session env, and prompt guidance."
    enabled: true
    binaries:
      - name: lark-cli
        repo: larksuite/cli
    oauth_provider_config_field: brand
    oauth_provider_choices: [lark, feishu]
    session_env:
      - env_var: LARKSUITE_CLI_USER_ACCESS_TOKEN
        source: oauth.access_token
      - env_var: LARKSUITE_CLI_APP_ID
        source: oauth.client_id
      - env_var: LARKSUITE_CLI_BRAND
        source: oauth.brand

  - id: hook/rtk
    kind: hook
    name: rtk
    display_name: RTK
    description: "Rewrite bash commands through the rtk binary."
    enabled: true
    binaries:
      - name: rtk
        repo: rtk-ai/rtk
        version: "0.30.0"
