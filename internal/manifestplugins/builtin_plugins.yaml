plugins:
  - id: tool/mise
    kind: tool
    name: mise
    display_name: mise
    description: "Inject mise usage guidance into the system prompt and provide the mise binary."
    enabled: true
    prompt: "Use mise to install tools and manage environment variables."

  - id: tool/tap-web
    kind: tool
    name: tap-web
    display_name: Tap Web
    description: "Web browsing skill powered by the tap CLI — fetch pages, run browser automation, and capture network traffic."
    enabled: true
    prompt: "Use tap to access the web."
    binaries:
      - name: tap
        tool: github:vaayne/tap
      - name: lightpanda
        tool: github:lightpanda-io/browser
        version: "nightly"

  - id: tool/gh
    kind: tool
    name: gh
    display_name: GitHub CLI
    description: "GitHub CLI integration with OAuth-backed session auth."
    enabled: true
    binaries:
      - name: gh
        tool: github:cli/cli
    oauth_provider: github
    session_env:
      - env_var: GH_TOKEN
        source: oauth.access_token

  - id: tool/lark-cli
    kind: tool
    name: lark-cli
    display_name: Lark CLI
    description: "Lark CLI integration with OAuth-backed auth, bundled skills, session env, and prompt guidance."
    enabled: true
    binaries:
      - name: lark-cli
        tool: github:larksuite/cli
    oauth_provider_config_field: brand
    oauth_provider_choices: [lark, feishu]
    session_env:
      - env_var: LARKSUITE_CLI_USER_ACCESS_TOKEN
        source: oauth.access_token
      - env_var: LARKSUITE_CLI_APP_ID
        source: oauth.client_id
      - env_var: LARKSUITE_CLI_BRAND
        source: oauth.brand

  - id: hook/rtk
    kind: hook
    name: rtk
    display_name: RTK
    description: "Rewrite bash commands through the rtk binary."
    enabled: true
    binaries:
      - name: rtk
        tool: github:rtk-ai/rtk

  - id: tool/kreuzberg
    kind: tool
    name: kreuzberg
    display_name: Kreuzberg
    description: "Extract text, metadata, images, and structured information from PDFs, Office documents, images, and 97+ formats."
    enabled: true
    binaries:
      - name: kreuzberg
        tool: github:kreuzberg-dev/kreuzberg
        version: 4.9.5
        asset_pattern: "kreuzberg-cli-*.tar.gz"
