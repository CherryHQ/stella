    <!-- ════════ PROVIDERS ════════ -->
    <section x-show="tab === 'providers'" x-transition.opacity.duration.150ms>
      <p class="text-[11px] font-mono font-medium tracking-[0.15em] text-terra-500 uppercase mb-3">Providers</p>
      <h1 class="font-serif text-3xl md:text-4xl tracking-tight mb-3">LLM connections</h1>
      <p class="text-warm-500 text-sm mb-8 max-w-lg">API keys and endpoints for each model provider Anna can use.</p>
      <div class="border-t border-warm-200 dark:border-warm-800 pt-8">
        <!-- Add bar -->
        <div class="flex items-center gap-3 mb-8">
          <select x-model="newProviderType" class="input-line flex-1 h-10 px-0 text-sm">
            <option value="" disabled>Select provider to add...</option>
            <template x-for="p in addableProviders" :key="p"><option :value="p" x-text="p"></option></template>
          </select>
          <button @click="addProvider()" :disabled="!newProviderType"
                  class="px-4 h-9 text-sm font-medium text-white bg-terra-500 hover:bg-terra-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors rounded-sm cursor-pointer">Add</button>
        </div>

        <!-- Empty -->
        <div x-show="providers.length === 0" class="py-16 text-center">
          <p class="text-warm-500 text-sm">No providers yet. Add one above to connect Anna to an LLM API.</p>
        </div>

        <!-- List -->
        <div class="divide-y divide-warm-200 dark:divide-warm-800">
          <template x-for="p in providers" :key="p.id">
            <div class="py-6">
              <div class="flex items-baseline justify-between mb-4">
                <div class="flex items-baseline gap-3">
                  <span class="font-medium text-lg" x-text="p.name || p.id"></span>
                  <span class="text-xs font-mono text-warm-400" x-show="p.name && p.name !== p.id" x-text="p.id"></span>
                </div>
                <button @click="confirmDelete('Delete provider ' + p.id + '?', () => doDeleteProvider(p.id))"
                        class="text-xs text-warm-400 hover:text-red-600 dark:hover:text-red-400 transition-colors cursor-pointer">remove</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4 mb-4">
                <div>
                  <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">API Key</label>
                  <input type="password" x-model="p.api_key" placeholder="sk-..." class="input-line w-full h-9 text-sm font-mono">
                </div>
                <div>
                  <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">Base URL</label>
                  <input type="text" x-model="p.base_url" :placeholder="providerDefaults[p.id]?.base_url || ''" class="input-line w-full h-9 text-sm font-mono">
                </div>
              </div>
              <div class="flex items-center gap-4">
                <button @click="saveProvider(p)" class="px-3 h-8 text-xs font-medium text-white bg-terra-500 hover:bg-terra-600 rounded-sm transition-colors cursor-pointer">Save</button>
                <button @click="fetchModels(p)" :disabled="p._fetching" class="text-xs text-warm-500 hover:text-terra-500 transition-colors cursor-pointer disabled:opacity-40">
                  <span x-text="p._fetching ? 'fetching...' : 'Fetch models'"></span>
                </button>
                <button x-show="p._modelCount > 0" @click="p._showModels = !p._showModels"
                        class="text-xs font-mono text-terra-500 cursor-pointer">
                  <span x-text="p._modelCount + ' models'"></span>
                  <span x-text="p._showModels ? '↑' : '↓'"></span>
                </button>
              </div>
              <div x-show="p._showModels && providerModels[p.id]?.length" x-transition class="mt-4 pl-4 border-l-2 border-warm-200 dark:border-warm-700">
                <div class="max-h-48 overflow-y-auto space-y-0.5">
                  <template x-for="m in providerModels[p.id] || []" :key="m">
                    <div class="text-xs font-mono text-warm-600 dark:text-warm-400 py-0.5" x-text="m"></div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
