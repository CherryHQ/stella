    <!-- ════════ AGENTS ════════ -->
    <section x-show="tab === 'agents'" x-transition.opacity.duration.150ms>
      <p class="text-[11px] font-mono font-medium tracking-[0.15em] text-terra-500 uppercase mb-3">Agents</p>
      <h1 class="font-serif text-3xl md:text-4xl tracking-tight mb-3">Agent configurations</h1>
      <p class="text-warm-500 text-sm mb-8 max-w-lg">Each agent has its own model, system prompt, and workspace.</p>
      <div class="border-t border-warm-200 dark:border-warm-800 pt-8">
        <div class="flex items-center justify-between mb-8">
          <span class="text-xs font-mono text-warm-400" x-text="agents.length + ' agents'"></span>
          <button @click="showAgentForm = !showAgentForm; if(!showAgentForm) resetAgentForm()"
                  class="text-sm text-terra-500 hover:text-terra-600 transition-colors cursor-pointer font-medium"
                  x-text="showAgentForm ? 'Cancel' : '+ Add agent'"></button>
        </div>

        <!-- Agent form -->
        <div x-show="showAgentForm" x-transition class="mb-8 pb-8 border-b border-warm-200 dark:border-warm-800">
          <p class="text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-4" x-text="editingAgentId ? 'EDIT AGENT' : 'NEW AGENT'"></p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4 mb-4">
            <div>
              <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">ID</label>
              <input x-model="agentForm.id" :disabled="!!editingAgentId" placeholder="anna" class="input-line w-full h-9 text-sm disabled:opacity-40">
            </div>
            <div>
              <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">Name</label>
              <input x-model="agentForm.name" placeholder="Anna" class="input-line w-full h-9 text-sm">
            </div>
          </div>
          <p class="text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-3 mt-6">Models <span class="normal-case tracking-normal text-warm-400">— format: provider/model</span></p>
          <div class="space-y-4 mb-4">
            <div x-data="modelCombo('agentForm.model')" class="relative">
              <label class="block text-[10px] font-mono text-warm-400 mb-1">Default</label>
              <input type="text" :value="getModelValue('model')" @input="setModelValue('model', $event.target.value); open = true; search = $event.target.value"
                     @focus="open = true; search = ''" placeholder="anthropic/claude-sonnet-4-6" class="input-line w-full h-9 text-sm font-mono">
              <div x-show="open && allProviderModels().length > 0" @click.away="open = false" x-transition.opacity
                   class="absolute z-20 mt-1 w-full max-h-48 overflow-y-auto border border-warm-200 dark:border-warm-700 bg-warm-50 dark:bg-warm-900 py-1">
                <template x-for="m in filteredProviderModels(search)" :key="m">
                  <button @click="setModelValue('model', m); open = false" type="button"
                          :class="getModelValue('model') === m ? 'text-terra-500' : 'text-warm-600 dark:text-warm-400'"
                          class="w-full text-left px-3 py-1.5 text-xs font-mono hover:bg-warm-100 dark:hover:bg-warm-800 cursor-pointer" x-text="m"></button>
                </template>
                <div x-show="filteredProviderModels(search).length === 0" class="px-3 py-2 text-xs text-warm-400">No matches</div>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4">
              <div x-data="modelCombo('agentForm.model_strong')" class="relative">
                <label class="block text-[10px] font-mono text-warm-400 mb-1">Strong <span class="text-warm-300">(optional)</span></label>
                <input type="text" :value="getModelValue('model_strong')" @input="setModelValue('model_strong', $event.target.value); open = true; search = $event.target.value"
                       @focus="open = true; search = ''" placeholder="Falls back to default" class="input-line w-full h-9 text-sm font-mono">
                <div x-show="open && allProviderModels().length > 0" @click.away="open = false" x-transition.opacity
                     class="absolute z-20 mt-1 w-full max-h-48 overflow-y-auto border border-warm-200 dark:border-warm-700 bg-warm-50 dark:bg-warm-900 py-1">
                  <template x-for="m in filteredProviderModels(search)" :key="m">
                    <button @click="setModelValue('model_strong', m); open = false" type="button" class="w-full text-left px-3 py-1.5 text-xs font-mono text-warm-600 dark:text-warm-400 hover:bg-warm-100 dark:hover:bg-warm-800 cursor-pointer" x-text="m"></button>
                  </template>
                </div>
              </div>
              <div x-data="modelCombo('agentForm.model_fast')" class="relative">
                <label class="block text-[10px] font-mono text-warm-400 mb-1">Fast <span class="text-warm-300">(optional)</span></label>
                <input type="text" :value="getModelValue('model_fast')" @input="setModelValue('model_fast', $event.target.value); open = true; search = $event.target.value"
                       @focus="open = true; search = ''" placeholder="Falls back to default" class="input-line w-full h-9 text-sm font-mono">
                <div x-show="open && allProviderModels().length > 0" @click.away="open = false" x-transition.opacity
                     class="absolute z-20 mt-1 w-full max-h-48 overflow-y-auto border border-warm-200 dark:border-warm-700 bg-warm-50 dark:bg-warm-900 py-1">
                  <template x-for="m in filteredProviderModels(search)" :key="m">
                    <button @click="setModelValue('model_fast', m); open = false" type="button" class="w-full text-left px-3 py-1.5 text-xs font-mono text-warm-600 dark:text-warm-400 hover:bg-warm-100 dark:hover:bg-warm-800 cursor-pointer" x-text="m"></button>
                  </template>
                </div>
              </div>
            </div>
          </div>
          <div class="mb-4">
            <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">Workspace</label>
            <input x-model="agentForm.workspace" placeholder="~/.anna/workspaces/anna" class="input-line w-full h-9 text-sm font-mono">
          </div>
          <div class="mb-4">
            <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">System Prompt</label>
            <textarea x-model="agentForm.system_prompt" rows="4" class="input-line w-full text-sm font-mono py-2 resize-y"></textarea>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer text-sm">
              <input type="checkbox" x-model="agentForm.enabled" class="accent-terra-500 w-4 h-4">
              <span>Enabled</span>
            </label>
            <button @click="saveAgent()" class="px-4 h-9 text-sm font-medium text-white bg-terra-500 hover:bg-terra-600 rounded-sm transition-colors cursor-pointer"
                    x-text="editingAgentId ? 'Update' : 'Create'"></button>
          </div>
        </div>

        <!-- Agent list -->
        <div class="divide-y divide-warm-200 dark:divide-warm-800">
          <template x-for="a in agents" :key="a.id">
            <div class="py-5 group">
              <div class="flex items-baseline justify-between">
                <div class="flex items-baseline gap-3">
                  <span class="font-medium" x-text="a.name"></span>
                  <span class="text-xs font-mono text-warm-400" x-text="a.id"></span>
                  <span class="text-[10px] font-mono uppercase tracking-wider" :class="a.enabled ? 'text-green-600 dark:text-green-500' : 'text-warm-400'" x-text="a.enabled ? 'on' : 'off'"></span>
                </div>
                <div class="flex items-center gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button @click="editAgent(a)" class="text-xs text-warm-400 hover:text-terra-500 transition-colors cursor-pointer">edit</button>
                  <button @click="confirmDelete('Delete agent ' + a.id + '?', () => doDeleteAgent(a.id))"
                          class="text-xs text-warm-400 hover:text-red-600 dark:hover:text-red-400 transition-colors cursor-pointer">remove</button>
                </div>
              </div>
              <div class="text-sm font-mono text-warm-500 mt-1" x-text="a.model"></div>
            </div>
          </template>
        </div>
        <div x-show="agents.length === 0 && !showAgentForm" class="py-16 text-center text-sm text-warm-500">No agents configured yet.</div>
      </div>
    </section>
