    <!-- ════════ SESSIONS ════════ -->
    <section x-show="tab === 'sessions'" x-transition.opacity.duration.150ms>

      <!-- Session detail (transcript view) -->
      <template x-if="sessionDetail">
        <div>
          <button @click="sessionDetail = null; sessionMessages = []; sessionSystemPrompt = ''; showTools = false"
                  class="text-xs text-warm-400 hover:text-warm-600 dark:hover:text-warm-300 transition-colors cursor-pointer mb-6 flex items-center gap-1">
            <span>←</span> Back to sessions
          </button>
          <h1 class="font-serif text-2xl md:text-3xl tracking-tight mb-2" x-text="sessionDetail.title || 'Untitled session'"></h1>
          <div class="flex items-center gap-3 flex-wrap text-xs font-mono text-warm-500 mb-2">
            <span x-text="sessionDetail.channel || 'unknown'"></span>
            <span class="text-warm-300">·</span>
            <span x-show="sessionDetail.agent_name || sessionDetail.agent_id" x-text="sessionDetail.agent_name || sessionDetail.agent_id"></span>
            <span x-show="sessionDetail.user_name" class="text-warm-300">·</span>
            <span x-show="sessionDetail.user_name" x-text="sessionDetail.user_name"></span>
            <span class="text-warm-300">·</span>
            <span x-text="formatTime(sessionDetail.last_active)"></span>
            <span x-show="sessionDetail.archived" class="text-warm-400">(archived)</span>
          </div>
          <div class="text-[10px] font-mono text-warm-400 mb-6" x-text="sessionDetail.id"></div>

          <!-- Controls -->
          <div class="flex items-center gap-4 mb-6">
            <button @click="showTools = !showTools" :class="showTools ? 'text-terra-500' : 'text-warm-400 hover:text-warm-600'"
                    class="text-xs font-mono cursor-pointer transition-colors" x-text="showTools ? '▾ Tools' : '▸ Tools'"></button>
          </div>

          <!-- Tools list (inline, not sidebar) -->
          <div x-show="showTools" x-transition class="mb-8 pl-4 border-l-2 border-terra-200 dark:border-terra-800">
            <div x-show="toolsLoading" class="text-xs text-warm-400 py-2">Loading tools...</div>
            <div class="divide-y divide-warm-100 dark:divide-warm-800">
              <template x-for="tool in tools" :key="tool.name">
                <div x-data="{ expanded: false }" class="py-2">
                  <button @click="expanded = !expanded" class="w-full text-left cursor-pointer">
                    <div class="flex items-baseline gap-2">
                      <span class="text-sm font-mono font-medium" x-text="tool.name"></span>
                      <span class="text-[10px] font-mono text-warm-400" x-text="tool.category"></span>
                    </div>
                    <p class="text-xs text-warm-500 mt-0.5 leading-relaxed" x-text="tool.description"></p>
                  </button>
                  <div x-show="expanded" x-transition class="mt-2">
                    <pre class="text-[10px] font-mono text-warm-600 dark:text-warm-400 bg-warm-100 dark:bg-warm-900 p-3 overflow-x-auto" x-text="JSON.stringify(tool.input_schema, null, 2)"></pre>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- System prompt -->
          <div x-show="sessionSystemPrompt" x-data="{ expanded: false }" class="mb-8">
            <button @click="expanded = !expanded" class="text-xs font-mono text-warm-400 hover:text-warm-600 transition-colors cursor-pointer flex items-center gap-1 mb-2">
              <span x-text="expanded ? '▾' : '▸'"></span>
              <span>System Prompt</span>
              <span class="text-warm-300 ml-1" x-text="'~' + Math.round(sessionSystemPrompt.length / 4) + ' tokens'"></span>
            </button>
            <div x-show="expanded" x-transition class="pl-4 border-l-2 border-terra-200 dark:border-terra-800 max-h-96 overflow-y-auto">
              <pre class="text-xs font-mono text-warm-600 dark:text-warm-400 whitespace-pre-wrap leading-relaxed" x-text="sessionSystemPrompt"></pre>
            </div>
          </div>

          <!-- Messages (transcript style) -->
          <div class="border-t border-warm-200 dark:border-warm-800 pt-8">
            <div x-show="sessionMessagesLoading" class="text-sm text-warm-400 py-12 text-center">Loading messages...</div>
            <div x-show="!sessionMessagesLoading && sessionMessages.length === 0" class="text-sm text-warm-400 py-12 text-center">Empty session.</div>
            <div class="space-y-6">
              <template x-for="(msg, idx) in sessionMessages" :key="idx">
                <div>
                  <!-- User -->
                  <template x-if="msg.role === 'user'">
                    <div class="flex gap-4">
                      <div class="w-16 shrink-0 text-right">
                        <span class="text-[10px] font-mono font-medium tracking-wider uppercase text-warm-400">You</span>
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="text-sm whitespace-pre-wrap leading-relaxed" x-text="msg.content || (msg.blocks ? msg.blocks.filter(b => b.type === 'text').map(b => b.text).join('') : '')"></div>
                        <div class="text-[10px] font-mono text-warm-300 mt-1" x-text="formatTime(msg.timestamp)"></div>
                      </div>
                    </div>
                  </template>

                  <!-- Assistant -->
                  <template x-if="msg.role === 'assistant'">
                    <div class="flex gap-4">
                      <div class="w-16 shrink-0 text-right">
                        <span class="text-[10px] font-mono font-medium tracking-wider uppercase text-terra-500">Anna</span>
                      </div>
                      <div class="flex-1 min-w-0 space-y-2">
                        <template x-for="(block, bi) in (msg.blocks || [])" :key="bi">
                          <div>
                            <!-- Thinking -->
                            <template x-if="block.type === 'thinking'">
                              <div x-data="{ expanded: false }">
                                <button @click="expanded = !expanded" class="text-[10px] font-mono text-warm-400 hover:text-warm-600 cursor-pointer flex items-center gap-1">
                                  <span x-text="expanded ? '▾' : '▸'"></span>
                                  <span x-text="block.redacted ? 'thinking (redacted)' : 'thinking'"></span>
                                  <span class="text-warm-300" x-text="block.thinking && !block.redacted && block.thinking.length > 100 ? '~' + Math.round(block.thinking.length/4) + ' tokens' : ''"></span>
                                </button>
                                <div x-show="expanded" x-transition class="mt-1 pl-4 border-l border-warm-200 dark:border-warm-700">
                                  <pre class="text-xs font-mono text-warm-500 italic whitespace-pre-wrap max-h-64 overflow-y-auto leading-relaxed" x-text="block.thinking || '(redacted)'"></pre>
                                </div>
                              </div>
                            </template>
                            <!-- Text -->
                            <template x-if="block.type === 'text'">
                              <div class="text-sm whitespace-pre-wrap leading-relaxed" x-text="block.text"></div>
                            </template>
                            <!-- Tool call -->
                            <template x-if="block.type === 'tool_call'">
                              <div x-data="{ expanded: false }" class="pl-4 border-l-2 border-terra-200 dark:border-terra-800">
                                <button @click="expanded = !expanded" class="text-xs font-mono cursor-pointer flex items-center gap-2">
                                  <span x-text="expanded ? '▾' : '▸'" class="text-warm-400"></span>
                                  <span class="font-medium text-terra-600 dark:text-terra-400" x-text="block.name"></span>
                                  <span class="text-warm-300" x-text="block.id ? block.id.slice(-6) : ''"></span>
                                </button>
                                <div x-show="expanded" x-transition class="mt-1">
                                  <pre class="text-[10px] font-mono text-warm-600 dark:text-warm-400 bg-warm-100 dark:bg-warm-900 p-2 overflow-x-auto" x-text="JSON.stringify(block.arguments, null, 2)"></pre>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>
                        <div class="flex items-center gap-3 text-[10px] font-mono text-warm-300">
                          <span x-show="msg.model" x-text="msg.model"></span>
                          <span x-text="formatTime(msg.timestamp)"></span>
                        </div>
                      </div>
                    </div>
                  </template>

                  <!-- Tool result -->
                  <template x-if="msg.role === 'tool'">
                    <div class="flex gap-4">
                      <div class="w-16 shrink-0"></div>
                      <div class="flex-1 min-w-0 pl-4" :class="msg.is_error ? 'border-l-2 border-red-400 dark:border-red-700' : 'border-l-2 border-green-400 dark:border-green-700'">
                        <div x-data="{ expanded: false }">
                          <button @click="expanded = !expanded" class="text-xs font-mono cursor-pointer flex items-center gap-2">
                            <span x-text="expanded ? '▾' : '▸'" class="text-warm-400"></span>
                            <span :class="msg.is_error ? 'text-red-600 dark:text-red-400' : 'text-green-700 dark:text-green-500'" x-text="msg.tool_name || 'tool'"></span>
                            <span x-show="msg.is_error" class="text-red-500 text-[10px]">error</span>
                            <span class="text-warm-300 text-[10px]" x-text="msg.content ? (msg.content.length > 200 ? '~' + Math.round(msg.content.length/4) + ' tokens' : msg.content.length + ' chars') : ''"></span>
                          </button>
                          <div x-show="expanded" x-transition class="mt-1">
                            <pre class="text-[10px] font-mono whitespace-pre-wrap max-h-64 overflow-y-auto leading-relaxed"
                                 :class="msg.is_error ? 'text-red-600 dark:text-red-400' : 'text-warm-600 dark:text-warm-400'"
                                 x-text="msg.content || '(empty)'"></pre>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Session list -->
      <template x-if="!sessionDetail">
        <div>
          <p class="text-[11px] font-mono font-medium tracking-[0.15em] text-terra-500 uppercase mb-3">Sessions</p>
          <h1 class="font-serif text-3xl md:text-4xl tracking-tight mb-3">Conversations</h1>
          <p class="text-warm-500 text-sm mb-8 max-w-lg">Browse and inspect past sessions across all channels.</p>
          <div class="border-t border-warm-200 dark:border-warm-800 divide-y divide-warm-200 dark:divide-warm-800">
            <template x-for="s in sessions" :key="s.id">
              <div @click="openSession(s.id)" class="py-4 cursor-pointer group">
                <div class="flex items-baseline justify-between">
                  <div class="flex items-baseline gap-3 min-w-0">
                    <span class="font-medium truncate group-hover:text-terra-500 transition-colors" x-text="s.title || 'Untitled'"></span>
                    <span class="text-[10px] font-mono text-warm-400 shrink-0" x-text="s.channel"></span>
                    <span x-show="s.agent_id" class="text-[10px] font-mono text-warm-400 shrink-0" x-text="s.agent_id"></span>
                    <span x-show="s.archived" class="text-[10px] font-mono text-warm-300 shrink-0">archived</span>
                  </div>
                  <span class="text-[10px] font-mono text-warm-300 shrink-0 ml-3" x-text="formatTime(s.last_active)"></span>
                </div>
              </div>
            </template>
          </div>
          <div x-show="sessions.length === 0" class="py-16 text-center text-sm text-warm-500">No sessions yet.</div>
        </div>
      </template>
    </section>
