    <!-- ════════ SCHEDULER ════════ -->
    <section x-show="tab === 'scheduler'" x-transition.opacity.duration.150ms>
      <p class="text-[11px] font-mono font-medium tracking-[0.15em] text-terra-500 uppercase mb-3">Scheduler</p>
      <h1 class="font-serif text-3xl md:text-4xl tracking-tight mb-3">Scheduled tasks</h1>
      <p class="text-warm-500 text-sm mb-8 max-w-lg">Recurring jobs that Anna executes on a schedule.</p>
      <div class="border-t border-warm-200 dark:border-warm-800 pt-8">
        <!-- Job form -->
        <div class="mb-8 pb-8 border-b border-warm-200 dark:border-warm-800">
          <div class="flex items-center justify-between mb-4">
            <p class="text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider" x-text="editingJobId ? 'EDIT JOB' : 'NEW JOB'"></p>
            <button x-show="editingJobId" @click="resetJobForm()" class="text-xs text-warm-400 hover:text-warm-600 cursor-pointer">Cancel</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4 mb-4">
            <div>
              <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">Name</label>
              <input type="text" x-model="jobForm.name" placeholder="Daily summary" class="input-line w-full h-9 text-sm">
            </div>
            <div>
              <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">Session Mode</label>
              <select x-model="jobForm.session_mode" class="input-line w-full h-9 text-sm bg-transparent">
                <option value="reuse">Reuse session</option><option value="new">New session each run</option>
              </select>
            </div>
          </div>
          <div class="mb-4">
            <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-2">Schedule</label>
            <div class="flex items-center gap-4 mb-2">
              <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" x-model="jobForm.schedule_type" value="cron" class="accent-terra-500"> Cron</label>
              <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" x-model="jobForm.schedule_type" value="every" class="accent-terra-500"> Interval</label>
            </div>
            <input x-show="jobForm.schedule_type === 'cron'" type="text" x-model="jobForm.cron" placeholder="0 9 * * 1-5" class="input-line w-full h-9 text-sm font-mono">
            <input x-show="jobForm.schedule_type === 'every'" type="text" x-model="jobForm.every" placeholder="30m, 2h" class="input-line w-full h-9 text-sm font-mono">
          </div>
          <div class="mb-4">
            <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">Agent</label>
            <select x-model="jobForm.agent_id" class="input-line w-full h-9 text-sm bg-transparent">
              <option value="">Default agent</option>
              <template x-for="a in agents" :key="a.id"><option :value="a.id" x-text="a.name"></option></template>
            </select>
          </div>
          <div class="mb-4">
            <label class="block text-[10px] font-mono font-medium text-warm-500 uppercase tracking-wider mb-1">Message</label>
            <textarea x-model="jobForm.message" rows="2" placeholder="What should the agent do?" class="input-line w-full text-sm py-2 resize-y"></textarea>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" x-model="jobForm.enabled" class="accent-terra-500 w-4 h-4"> Enabled</label>
            <button @click="saveJob()" :disabled="!jobForm.name || !jobForm.message || (jobForm.schedule_type === 'cron' ? !jobForm.cron : !jobForm.every)"
                    class="px-4 h-9 text-sm font-medium text-white bg-terra-500 hover:bg-terra-600 disabled:opacity-40 disabled:cursor-not-allowed rounded-sm transition-colors cursor-pointer"
                    x-text="editingJobId ? 'Update' : 'Create'"></button>
          </div>
        </div>

        <!-- Job list -->
        <div class="divide-y divide-warm-200 dark:divide-warm-800">
          <template x-for="j in jobs" :key="j.id">
            <div class="py-5 group">
              <div class="flex items-baseline justify-between">
                <div class="flex items-baseline gap-3">
                  <span class="font-medium" x-text="j.name"></span>
                  <span class="text-[10px] font-mono uppercase tracking-wider" :class="j.enabled ? 'text-green-600 dark:text-green-500' : 'text-warm-400'" x-text="j.enabled ? 'on' : 'off'"></span>
                  <span class="text-xs font-mono text-warm-400" x-text="j.cron ? j.cron : 'every ' + j.every"></span>
                </div>
                <div class="flex items-center gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button @click="toggleJob(j)" class="text-xs text-warm-400 hover:text-warm-600 cursor-pointer" x-text="j.enabled ? 'disable' : 'enable'"></button>
                  <button @click="editJob(j)" class="text-xs text-warm-400 hover:text-terra-500 cursor-pointer">edit</button>
                  <button @click="confirmDelete('Delete this job?', () => doDeleteJob(j.id))" class="text-xs text-warm-400 hover:text-red-600 dark:hover:text-red-400 cursor-pointer">remove</button>
                </div>
              </div>
              <div class="text-sm text-warm-500 mt-1 line-clamp-1" x-text="j.message"></div>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-[10px] font-mono text-warm-400" x-text="j.session_mode"></span>
                <span x-show="j.agent_id" class="text-[10px] font-mono text-warm-300">·</span>
                <span x-show="j.agent_id" class="text-[10px] font-mono text-warm-400" x-text="j.agent_id"></span>
              </div>
            </div>
          </template>
        </div>
        <div x-show="jobs.length === 0" class="py-16 text-center text-sm text-warm-500">No jobs yet. Create one above to schedule recurring tasks.</div>
      </div>
    </section>
