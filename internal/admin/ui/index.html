<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Admin</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            surface: { 0: '#ffffff', 1: '#f8f9fa', 2: '#f1f3f5', 3: '#e9ecef', 4: '#dee2e6' },
            ink: { 0: '#212529', 1: '#495057', 2: '#868e96', 3: '#adb5bd', 4: '#ced4da' },
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
            success: { 50: '#ecfdf5', 500: '#22c55e', 600: '#16a34a' },
            danger: { 50: '#fef2f2', 500: '#ef4444', 600: '#dc2626' },
            warn: { 50: '#fffbeb', 500: '#f59e0b', 600: '#d97706' },
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgb(0 0 0 / 0.04), 0 1px 2px -1px rgb(0 0 0 / 0.04)',
            'card-hover': '0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.04)',
            'input-focus': '0 0 0 3px rgb(99 102 241 / 0.12)',
          },
        },
      },
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #adb5bd; }
    input::-ms-reveal { display: none; }
  </style>
</head>
<body class="bg-surface-1 min-h-screen font-sans text-ink-0 antialiased">

<div x-data="adminApp()" x-init="init()" x-cloak class="min-h-screen flex flex-col">

  <!-- Top bar -->
  <header class="sticky top-0 z-30 bg-surface-0/80 backdrop-blur-lg border-b border-surface-3">
    <div class="max-w-4xl mx-auto px-5 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z"/></svg>
        </div>
        <span class="text-sm font-semibold text-ink-0 tracking-tight">Anna</span>
        <span class="text-xs text-ink-3 hidden sm:inline">/</span>
        <span class="text-xs text-ink-2 hidden sm:inline">Admin</span>
      </div>
      <span class="text-xs text-ink-2" x-text="status"></span>
    </div>
  </header>

  <!-- Toast -->
  <div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-full max-w-sm px-4"
       x-show="toast" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-1 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0 scale-100" x-transition:leave-end="opacity-0 -translate-y-1 scale-95">
    <div :class="toastType === 'error' ? 'bg-danger-600' : 'bg-ink-0'" class="flex items-center gap-2 px-3.5 py-2.5 rounded-lg shadow-lg ring-1 ring-black/5 text-xs text-white">
      <span x-text="toast" class="leading-snug"></span>
    </div>
  </div>

  <!-- Main -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-5 py-8">

    <!-- Tab navigation -->
    <nav class="flex gap-0.5 p-1 bg-surface-2 rounded-lg mb-8 w-fit flex-wrap" role="tablist">
      <template x-for="(t, i) in tabs" :key="t.id">
        <button @click="tab = t.id" role="tab" :aria-selected="tab === t.id"
                :class="tab === t.id ? 'bg-surface-0 text-ink-0 shadow-card' : 'text-ink-2 hover:text-ink-1'"
                class="px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-150 cursor-pointer" x-text="t.label">
        </button>
      </template>
    </nav>

    <!-- ==================== PROVIDERS TAB ==================== -->
    <section x-show="tab === 'providers'" x-transition.opacity.duration.150ms>

      <!-- Add bar -->
      <div class="flex items-center gap-2 mb-5">
        <select x-model="newProviderType"
                class="flex-1 h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm text-ink-0 shadow-card focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all duration-150 cursor-pointer appearance-none">
          <option value="" disabled>Select provider...</option>
          <template x-for="p in addableProviders" :key="p">
            <option :value="p" x-text="p"></option>
          </template>
        </select>
        <button @click="addProvider()" :disabled="!newProviderType"
                class="inline-flex items-center gap-1.5 h-10 px-4 text-xs font-medium text-white bg-primary-600 rounded-lg shadow-sm hover:bg-primary-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-150 cursor-pointer">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Add
        </button>
      </div>

      <!-- Empty -->
      <template x-if="providers.length === 0">
        <div class="rounded-xl border-2 border-dashed border-surface-3 py-16 text-center">
          <div class="w-10 h-10 rounded-full bg-surface-2 flex items-center justify-center mx-auto mb-3">
            <svg class="w-5 h-5 text-ink-3" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          </div>
          <p class="text-sm text-ink-2">No providers yet</p>
          <p class="text-xs text-ink-3 mt-0.5">Add one above to connect to an LLM API</p>
        </div>
      </template>

      <!-- Provider cards -->
      <div class="space-y-3">
        <template x-for="p in providers" :key="p.id">
          <div class="rounded-xl border border-surface-3 bg-surface-0 shadow-card hover:shadow-card-hover transition-shadow duration-200 overflow-hidden">
            <!-- Header -->
            <div class="flex items-center justify-between px-4 py-2.5 border-b border-surface-2">
              <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-ink-0" x-text="p.name || p.id"></span>
                <span class="text-xs text-ink-3" x-text="'(' + p.id + ')'" x-show="p.name && p.name !== p.id"></span>
              </div>
              <button @click="deleteProvider(p.id)"
                      class="p-1 rounded-md text-ink-3 hover:text-danger-500 hover:bg-danger-50 transition-colors duration-150 cursor-pointer">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
              </button>
            </div>

            <!-- Body -->
            <div class="px-4 py-4 space-y-3">
              <div>
                <label class="flex items-center gap-1 text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5">API Key</label>
                <input type="password" x-model="p.api_key" placeholder="sk-..."
                       class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm text-ink-0 font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all duration-150">
              </div>
              <div>
                <label class="flex items-center gap-1 text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5">Base URL</label>
                <input type="text" x-model="p.base_url" :placeholder="providerDefaults[p.id]?.base_url || ''"
                       class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm text-ink-1 font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all duration-150">
              </div>

              <!-- Save + Fetch models -->
              <div class="flex items-center gap-2 pt-1">
                <button @click="saveProvider(p)"
                        class="inline-flex items-center gap-1.5 h-8 px-3 text-[11px] font-medium rounded-md bg-primary-600 text-white hover:bg-primary-700 transition-all duration-150 cursor-pointer">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                  Save
                </button>
                <button @click="fetchModels(p)" :disabled="p._fetching"
                        class="inline-flex items-center gap-1.5 h-8 px-3 text-[11px] font-medium rounded-md border bg-surface-0 border-surface-4 text-ink-1 hover:bg-surface-1 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-150 cursor-pointer">
                  <svg x-show="!p._fetching" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                  <svg x-show="p._fetching" class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                  <span x-text="p._fetching ? 'Fetching...' : 'Fetch Models'"></span>
                </button>
                <button x-show="p._modelCount > 0" @click="p._showModels = !p._showModels"
                        class="inline-flex items-center gap-1 text-[11px] text-success-600 font-medium cursor-pointer hover:text-success-500 transition-colors">
                  <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                  <span x-text="p._modelCount + ' models'"></span>
                  <svg class="w-3 h-3 transition-transform" :class="p._showModels ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
                </button>
              </div>

              <!-- Models list -->
              <div x-show="p._showModels && providerModels[p.id]?.length" x-transition class="border-t border-surface-2 px-4 py-3">
                <div class="max-h-48 overflow-y-auto space-y-0.5">
                  <template x-for="m in providerModels[p.id] || []" :key="m">
                    <div class="text-xs font-mono text-ink-1 py-0.5 px-1 rounded hover:bg-surface-1" x-text="m"></div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- ==================== AGENTS TAB ==================== -->
    <section x-show="tab === 'agents'" x-transition.opacity.duration.150ms>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">Agents</h2>
        <button @click="showAgentForm = !showAgentForm; if(!showAgentForm) resetAgentForm()"
          class="inline-flex items-center gap-1.5 h-8 px-3.5 text-xs font-medium text-white bg-primary-600 rounded-md hover:bg-primary-700 transition-all cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          <span x-text="showAgentForm ? 'Cancel' : 'Add Agent'"></span>
        </button>
      </div>

      <!-- Agent Form -->
      <div x-show="showAgentForm" x-transition class="rounded-xl border border-surface-3 bg-surface-0 shadow-card overflow-hidden mb-5">
        <div class="flex items-center gap-2 px-4 py-2.5 border-b border-surface-2">
          <span class="text-sm font-medium text-ink-0" x-text="editingAgentId ? 'Edit Agent' : 'New Agent'"></span>
        </div>
        <div class="px-4 py-4 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">ID (slug)</label>
              <input x-model="agentForm.id" :disabled="!!editingAgentId"
                     class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all disabled:opacity-50" placeholder="anna">
            </div>
            <div>
              <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Name</label>
              <input x-model="agentForm.name" class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all" placeholder="Anna">
            </div>
          </div>

          <!-- Model fields with autocomplete -->
          <fieldset class="space-y-3">
            <legend class="text-[11px] font-semibold text-ink-2 uppercase tracking-wider">Models <span class="normal-case font-normal text-ink-3">format: provider/model</span></legend>

            <!-- Default model -->
            <div x-data="modelCombo('agentForm.model')" class="relative">
              <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Default Model</label>
              <div class="relative">
                <input type="text" :value="getModelValue('model')" @input="setModelValue('model', $event.target.value); open = true; search = $event.target.value"
                       @focus="open = true; search = ''" placeholder="anthropic/claude-sonnet-4-6"
                       class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 pl-3 pr-8 text-sm font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all">
                <button @click="open = !open" type="button" tabindex="-1"
                        class="absolute right-0 top-0 h-10 w-8 flex items-center justify-center text-ink-3 hover:text-ink-1 cursor-pointer">
                  <svg class="w-4 h-4 transition-transform duration-150" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
                </button>
              </div>
              <div x-show="open && allProviderModels().length > 0" @click.away="open = false" x-transition.opacity.duration.100ms
                   class="absolute z-20 mt-1 w-full max-h-48 overflow-y-auto rounded-lg border border-surface-3 bg-surface-0 shadow-lg py-1">
                <template x-for="m in filteredProviderModels(search)" :key="m">
                  <button @click="setModelValue('model', m); open = false" type="button"
                          :class="getModelValue('model') === m ? 'bg-primary-50 text-primary-700' : 'text-ink-1 hover:bg-surface-1'"
                          class="w-full text-left px-3 py-1.5 text-xs font-mono cursor-pointer transition-colors" x-text="m"></button>
                </template>
                <div x-show="filteredProviderModels(search).length === 0" class="px-3 py-2 text-xs text-ink-3">No matching models</div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <!-- Strong model -->
              <div x-data="modelCombo('agentForm.model_strong')" class="relative">
                <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Strong <span class="normal-case font-normal text-ink-3">optional</span></label>
                <div class="relative">
                  <input type="text" :value="getModelValue('model_strong')" @input="setModelValue('model_strong', $event.target.value); open = true; search = $event.target.value"
                         @focus="open = true; search = ''" placeholder="Falls back to default"
                         class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 pl-3 pr-8 text-sm font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all">
                  <button @click="open = !open" type="button" tabindex="-1"
                          class="absolute right-0 top-0 h-10 w-8 flex items-center justify-center text-ink-3 hover:text-ink-1 cursor-pointer">
                    <svg class="w-4 h-4 transition-transform duration-150" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
                  </button>
                </div>
                <div x-show="open && allProviderModels().length > 0" @click.away="open = false" x-transition.opacity.duration.100ms
                     class="absolute z-20 mt-1 w-full max-h-48 overflow-y-auto rounded-lg border border-surface-3 bg-surface-0 shadow-lg py-1">
                  <template x-for="m in filteredProviderModels(search)" :key="m">
                    <button @click="setModelValue('model_strong', m); open = false" type="button"
                            :class="getModelValue('model_strong') === m ? 'bg-primary-50 text-primary-700' : 'text-ink-1 hover:bg-surface-1'"
                            class="w-full text-left px-3 py-1.5 text-xs font-mono cursor-pointer transition-colors" x-text="m"></button>
                  </template>
                </div>
              </div>

              <!-- Fast model -->
              <div x-data="modelCombo('agentForm.model_fast')" class="relative">
                <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Fast <span class="normal-case font-normal text-ink-3">optional</span></label>
                <div class="relative">
                  <input type="text" :value="getModelValue('model_fast')" @input="setModelValue('model_fast', $event.target.value); open = true; search = $event.target.value"
                         @focus="open = true; search = ''" placeholder="Falls back to default"
                         class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 pl-3 pr-8 text-sm font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all">
                  <button @click="open = !open" type="button" tabindex="-1"
                          class="absolute right-0 top-0 h-10 w-8 flex items-center justify-center text-ink-3 hover:text-ink-1 cursor-pointer">
                    <svg class="w-4 h-4 transition-transform duration-150" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
                  </button>
                </div>
                <div x-show="open && allProviderModels().length > 0" @click.away="open = false" x-transition.opacity.duration.100ms
                     class="absolute z-20 mt-1 w-full max-h-48 overflow-y-auto rounded-lg border border-surface-3 bg-surface-0 shadow-lg py-1">
                  <template x-for="m in filteredProviderModels(search)" :key="m">
                    <button @click="setModelValue('model_fast', m); open = false" type="button"
                            :class="getModelValue('model_fast') === m ? 'bg-primary-50 text-primary-700' : 'text-ink-1 hover:bg-surface-1'"
                            class="w-full text-left px-3 py-1.5 text-xs font-mono cursor-pointer transition-colors" x-text="m"></button>
                  </template>
                </div>
              </div>
            </div>
          </fieldset>

          <div>
            <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Workspace</label>
            <input x-model="agentForm.workspace" class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all" placeholder="~/.anna/workspaces/anna">
          </div>
          <div>
            <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">System Prompt</label>
            <textarea x-model="agentForm.system_prompt" rows="4" class="w-full rounded-lg border border-surface-4 bg-surface-0 px-3 py-2 text-sm font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all resize-y"></textarea>
          </div>
          <div class="flex items-center justify-between pt-1">
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="agentForm.enabled" class="accent-primary-600 w-4 h-4 rounded">
              <span class="text-xs text-ink-1">Enabled</span>
            </label>
            <button @click="saveAgent()"
                    class="inline-flex items-center gap-1.5 h-8 px-3.5 text-xs font-medium text-white bg-primary-600 rounded-md hover:bg-primary-700 transition-all cursor-pointer">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
              <span x-text="editingAgentId ? 'Update' : 'Create'"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Agent list -->
      <div class="space-y-2">
        <template x-for="a in agents" :key="a.id">
          <div class="rounded-xl border border-surface-3 bg-surface-0 shadow-card hover:shadow-card-hover transition-shadow px-4 py-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="font-medium" x-text="a.name"></span>
                <span class="text-sm text-ink-2" x-text="'(' + a.id + ')'"></span>
                <span class="text-xs px-2 py-0.5 rounded-full"
                  :class="a.enabled ? 'bg-success-50 text-success-600' : 'bg-surface-2 text-ink-2'"
                  x-text="a.enabled ? 'enabled' : 'disabled'"></span>
              </div>
              <div class="flex items-center gap-1">
                <button @click="editAgent(a)" class="p-1.5 rounded-md text-ink-3 hover:text-primary-600 hover:bg-primary-50 transition-colors cursor-pointer" title="Edit">

                    <div class="flex items-center justify-between px-3 py-2 bg-surface-2/50 border-b border-surface-3">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-primary-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
                        <span class="text-xs font-medium text-ink-0" x-text="mem.agent_id"></span>
                      </div>
                      <span class="text-[10px] text-ink-3" x-text="mem.updated_at"></span>
                    </div>
                    <div class="p-3">
                      <textarea x-model="mem._content" rows="3"
                                class="w-full rounded-md border border-surface-4 bg-surface-0 px-2.5 py-2 text-xs font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all resize-y"></textarea>
                      <div class="flex justify-end gap-1.5 mt-2">
                        <button @click="deleteUserMemory(u.id, mem.agent_id)"
                                class="h-7 px-2.5 text-[11px] font-medium text-danger-500 bg-danger-50 rounded-md hover:bg-danger-600 hover:text-white transition-all cursor-pointer">Delete</button>
                        <button @click="saveUserMemory(u.id, mem.agent_id, mem._content)"
                                :disabled="mem._content === mem.content"
                                :class="mem._content === mem.content ? 'opacity-40 cursor-not-allowed' : 'hover:bg-primary-700 cursor-pointer'"
                                class="h-7 px-2.5 text-[11px] font-medium text-white bg-primary-600 rounded-md transition-all">Save</button>
                      </div>
                    </div>
                  </div>
                </template>

                <div x-show="(userMemories[u.id] || []).length === 0 && !u._showAddMemory"
                     class="text-xs text-ink-3 text-center py-3">No agent memories yet</div>

                <!-- Add memory form -->
                <div x-show="u._showAddMemory" class="rounded-lg border border-primary-200 bg-primary-50/30 p-3">
                  <div class="flex items-center gap-2 mb-2">
                    <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider shrink-0">Agent</label>
                    <select x-model="u._newMemoryAgent"
                            class="flex-1 h-8 rounded-md border border-surface-4 bg-surface-0 px-2 text-xs shadow-card focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all cursor-pointer appearance-none">
                      <option value="" disabled>Select agent...</option>
                      <template x-for="a in agents.filter(a => !(userMemories[u.id] || []).some(m => m.agent_id === a.id))" :key="a.id">
                        <option :value="a.id" x-text="a.name + ' (' + a.id + ')'"></option>
                      </template>
                    </select>
                  </div>
                  <textarea x-model="u._newMemoryContent" rows="3" placeholder="Enter memory content..."
                            class="w-full rounded-md border border-surface-4 bg-surface-0 px-2.5 py-2 text-xs font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all resize-y"></textarea>
                  <div class="flex justify-end gap-1.5 mt-2">
                    <button @click="u._showAddMemory = false; u._newMemoryAgent = ''; u._newMemoryContent = ''"
                            class="h-7 px-2.5 text-[11px] font-medium text-ink-2 bg-surface-2 rounded-md hover:bg-surface-3 transition-all cursor-pointer">Cancel</button>
                    <button @click="addUserMemory(u)"
                            :disabled="!u._newMemoryAgent || !u._newMemoryContent"
                            :class="!u._newMemoryAgent || !u._newMemoryContent ? 'opacity-40 cursor-not-allowed' : 'hover:bg-primary-700 cursor-pointer'"
                            class="h-7 px-2.5 text-[11px] font-medium text-white bg-primary-600 rounded-md transition-all">Add</button>
                  </div>
                </div>

                <!-- Add memory button -->
                <button x-show="!u._showAddMemory" @click="u._showAddMemory = true; u._newMemoryAgent = ''; u._newMemoryContent = ''"
                        class="inline-flex items-center gap-1 text-xs text-primary-600 hover:text-primary-700 transition-colors cursor-pointer">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                  Add memory for agent
                </button>
              </div>
            </div>
          </div>
        </template>
        <div x-show="users.length === 0" class="text-sm text-ink-2 text-center py-8">No users yet</div>
      </div>
    </section>

    <!-- ==================== SESSIONS TAB ==================== -->
    <section x-show="tab === 'sessions'" x-transition.opacity.duration.150ms>

      <!-- Session detail view -->
      <template x-if="sessionDetail">
        <div>
          <!-- Back button + header -->
          <div class="flex items-center gap-3 mb-5">
            <button @click="sessionDetail = null; sessionMessages = []"
                    class="p-1.5 rounded-md text-ink-2 hover:text-ink-0 hover:bg-surface-2 transition-colors cursor-pointer">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
            </button>
            <div class="flex-1 min-w-0">
              <h2 class="text-lg font-semibold truncate" x-text="sessionDetail.title || 'Untitled Session'"></h2>
              <div class="flex items-center gap-2 mt-0.5 flex-wrap">
                <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium uppercase tracking-wider"
                  :class="sessionDetail.channel === 'telegram' ? 'bg-blue-50 text-blue-600' : sessionDetail.channel === 'cli' ? 'bg-surface-2 text-ink-2' : sessionDetail.channel === 'qq' ? 'bg-green-50 text-green-600' : 'bg-purple-50 text-purple-600'"
                  x-text="sessionDetail.channel || 'unknown'"></span>
                <span x-show="sessionDetail.agent_name || sessionDetail.agent_id" class="text-[10px] px-1.5 py-0.5 rounded-full bg-primary-50 text-primary-600 font-medium"
                  x-text="sessionDetail.agent_name || sessionDetail.agent_id"></span>
                <span x-show="sessionDetail.user_name" class="text-[10px] px-1.5 py-0.5 rounded-full bg-warn-50 text-warn-600 font-medium"
                  x-text="sessionDetail.user_name"></span>
                <span class="text-[10px] text-ink-3" x-text="'Last active: ' + formatTime(sessionDetail.last_active)"></span>
                <span x-show="sessionDetail.archived" class="text-[10px] px-1.5 py-0.5 rounded-full bg-surface-2 text-ink-2 font-medium">Archived</span>
              </div>
            </div>
          </div>

          <!-- Session ID -->
          <div class="text-[11px] text-ink-3 font-mono mb-4 px-1" x-text="sessionDetail.id"></div>

          <!-- Messages loading -->
          <div x-show="sessionMessagesLoading" class="text-sm text-ink-2 text-center py-12">Loading messages...</div>

          <!-- Message timeline -->
          <div x-show="!sessionMessagesLoading" class="space-y-2">
            <div x-show="sessionMessages.length === 0" class="text-sm text-ink-2 text-center py-8">No messages in this session</div>
            <template x-for="(msg, idx) in sessionMessages" :key="idx">
              <div>
                <!-- User message -->
                <template x-if="msg.role === 'user'">
                  <div class="flex justify-end">
                    <div class="max-w-[80%] rounded-xl rounded-tr-sm bg-primary-600 text-white px-4 py-2.5 shadow-card">
                      <div class="text-sm whitespace-pre-wrap" x-text="msg.content || (msg.blocks ? msg.blocks.filter(b => b.type === 'text').map(b => b.text).join('') : '')"></div>
                      <div class="text-[10px] opacity-60 mt-1 text-right" x-text="formatTime(msg.timestamp)"></div>
                    </div>
                  </div>
                </template>

                <!-- Assistant message -->
                <template x-if="msg.role === 'assistant'">
                  <div class="flex justify-start">
                    <div class="max-w-[85%] space-y-1.5">
                      <template x-for="(block, bi) in (msg.blocks || [])" :key="bi">
                        <div>
                          <!-- Thinking block -->
                          <template x-if="block.type === 'thinking'">
                            <div x-data="{ expanded: false }" class="rounded-lg border border-surface-3 bg-surface-1 overflow-hidden">
                              <button @click="expanded = !expanded" class="w-full flex items-center gap-1.5 px-3 py-1.5 text-[11px] text-ink-2 hover:bg-surface-2 transition-colors cursor-pointer">
                                <svg class="w-3 h-3 transition-transform duration-150" :class="expanded ? 'rotate-90' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
                                <svg class="w-3 h-3 text-ink-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18"/></svg>
                                <span x-text="block.redacted ? 'Thinking (redacted)' : 'Thinking'"></span>
                                <span class="text-ink-3 ml-auto" x-text="block.thinking ? (block.thinking.length > 100 ? Math.round(block.thinking.length/4) + ' tokens' : '') : ''"></span>
                              </button>
                              <div x-show="expanded" x-transition class="px-3 py-2 border-t border-surface-3 text-xs font-mono text-ink-2 whitespace-pre-wrap max-h-64 overflow-y-auto" x-text="block.thinking || '(redacted)'"></div>
                            </div>
                          </template>
                          <!-- Text block -->
                          <template x-if="block.type === 'text'">
                            <div class="rounded-xl rounded-tl-sm bg-surface-0 border border-surface-3 px-4 py-2.5 shadow-card">
                              <div class="text-sm whitespace-pre-wrap" x-text="block.text"></div>
                            </div>
                          </template>
                          <!-- Tool call block -->
                          <template x-if="block.type === 'tool_call'">
                            <div x-data="{ expanded: false }" class="rounded-lg border border-primary-200 bg-primary-50/30 overflow-hidden">
                              <button @click="expanded = !expanded" class="w-full flex items-center gap-1.5 px-3 py-1.5 text-[11px] hover:bg-primary-50 transition-colors cursor-pointer">
                                <svg class="w-3 h-3 transition-transform duration-150" :class="expanded ? 'rotate-90' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
                                <svg class="w-3 h-3 text-primary-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085"/></svg>
                                <span class="font-mono font-medium text-primary-700" x-text="block.name"></span>
                                <span class="text-ink-3 font-mono" x-text="block.id ? '(' + block.id.slice(-6) + ')' : ''"></span>
                              </button>
                              <div x-show="expanded" x-transition class="px-3 py-2 border-t border-primary-200 text-xs font-mono text-ink-1 whitespace-pre-wrap max-h-48 overflow-y-auto bg-surface-0" x-text="JSON.stringify(block.arguments, null, 2)"></div>
                            </div>
                          </template>
                        </div>
                      </template>
                      <div class="flex items-center gap-2 px-1">
                        <span x-show="msg.model" class="text-[10px] text-ink-3 font-mono" x-text="msg.model"></span>
                        <span class="text-[10px] text-ink-3" x-text="formatTime(msg.timestamp)"></span>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Tool result -->
                <template x-if="msg.role === 'tool'">
                  <div class="flex justify-start pl-4" x-data="{ expanded: false }">
                    <div class="max-w-[80%] rounded-lg border overflow-hidden"
                         :class="msg.is_error ? 'border-danger-500/30 bg-danger-50/30' : 'border-success-500/30 bg-success-50/30'">
                      <button @click="expanded = !expanded" class="w-full flex items-center gap-1.5 px-3 py-1.5 text-[11px] cursor-pointer"
                              :class="msg.is_error ? 'text-danger-600 hover:bg-danger-50' : 'text-success-600 hover:bg-success-50'">
                        <svg class="w-3 h-3 transition-transform duration-150" :class="expanded ? 'rotate-90' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
                        <span class="font-mono font-medium" x-text="msg.tool_name || 'tool'"></span>
                        <span x-show="msg.is_error" class="text-[10px] px-1 rounded bg-danger-500/10 text-danger-600">error</span>
                        <span class="text-ink-3 ml-auto text-[10px]" x-text="msg.content ? (msg.content.length > 200 ? Math.round(msg.content.length/4) + ' tokens' : msg.content.length + ' chars') : ''"></span>
                      </button>
                      <div x-show="expanded" x-transition class="px-3 py-2 border-t text-xs font-mono whitespace-pre-wrap max-h-64 overflow-y-auto bg-surface-0"
                           :class="msg.is_error ? 'border-danger-500/20 text-danger-600' : 'border-success-500/20 text-ink-1'"
                           x-text="msg.content || '(empty)'"></div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Session list (when no detail selected) -->
      <template x-if="!sessionDetail">
        <div>
          <h2 class="text-lg font-semibold mb-4">Sessions</h2>
          <div class="space-y-2">
            <template x-for="s in sessions" :key="s.id">
              <div @click="openSession(s.id)" class="rounded-xl border border-surface-3 bg-surface-0 shadow-card hover:shadow-card-hover transition-shadow px-4 py-3 cursor-pointer">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="font-medium text-sm truncate" x-text="s.title || 'Untitled'"></span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium uppercase tracking-wider shrink-0"
                      :class="s.channel === 'telegram' ? 'bg-blue-50 text-blue-600' : s.channel === 'cli' ? 'bg-surface-2 text-ink-2' : s.channel === 'qq' ? 'bg-green-50 text-green-600' : 'bg-purple-50 text-purple-600'"
                      x-text="s.channel || '?'"></span>
                    <span x-show="s.agent_id" class="text-[10px] px-1.5 py-0.5 rounded-full bg-primary-50 text-primary-600 font-medium shrink-0" x-text="s.agent_id"></span>
                    <span x-show="s.archived" class="text-[10px] px-1.5 py-0.5 rounded-full bg-surface-2 text-ink-2 font-medium shrink-0">archived</span>
                  </div>
                  <div class="flex items-center gap-2 shrink-0 ml-3">
                    <span class="text-[10px] text-ink-3" x-text="formatTime(s.last_active)"></span>
                    <svg class="w-3.5 h-3.5 text-ink-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
                  </div>
                </div>
                <div class="text-[10px] text-ink-3 font-mono mt-1 truncate" x-text="s.id"></div>
              </div>
            </template>
            <div x-show="sessions.length === 0" class="text-sm text-ink-2 text-center py-8">No sessions yet</div>
          </div>
        </div>
      </template>
    </section>

    <!-- ==================== SCHEDULER TAB ==================== -->
    <section x-show="tab === 'scheduler'" x-transition.opacity.duration.150ms>

      <!-- New / Edit form -->
      <div class="rounded-xl border border-surface-3 bg-surface-0 shadow-card overflow-hidden mb-5">
        <div class="flex items-center gap-2 px-4 py-2.5 border-b border-surface-2">
          <svg class="w-4 h-4 text-primary-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
          <span class="text-sm font-medium text-ink-0" x-text="editingJobId ? 'Edit Job' : 'New Job'"></span>
          <button x-show="editingJobId" @click="resetJobForm()"
                  class="ml-auto text-[11px] text-ink-2 hover:text-ink-0 cursor-pointer">Cancel</button>
        </div>
        <div class="px-4 py-4 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Name</label>
              <input type="text" x-model="jobForm.name" placeholder="Daily summary"
                     class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all">
            </div>
            <div>
              <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Session Mode</label>
              <select x-model="jobForm.session_mode"
                      class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm shadow-card focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all cursor-pointer appearance-none">
                <option value="reuse">Reuse session</option>
                <option value="new">New session each run</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Schedule</label>
            <div class="flex items-center gap-2 mb-2">
              <label class="inline-flex items-center gap-1.5 cursor-pointer">
                <input type="radio" x-model="jobForm.schedule_type" value="cron" class="accent-primary-600">
                <span class="text-xs text-ink-1">Cron expression</span>
              </label>
              <label class="inline-flex items-center gap-1.5 cursor-pointer">
                <input type="radio" x-model="jobForm.schedule_type" value="every" class="accent-primary-600">
                <span class="text-xs text-ink-1">Interval</span>
              </label>
            </div>
            <input x-show="jobForm.schedule_type === 'cron'" type="text" x-model="jobForm.cron" placeholder="0 9 * * 1-5 (weekdays at 9am)"
                   class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all">
            <input x-show="jobForm.schedule_type === 'every'" type="text" x-model="jobForm.every" placeholder="30m, 2h, 1h30m"
                   class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm font-mono shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all">
          </div>
          <div>
            <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Agent</label>
            <select x-model="jobForm.agent_id"
                    class="w-full h-10 rounded-lg border border-surface-4 bg-surface-0 px-3 text-sm shadow-card focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all cursor-pointer appearance-none">
              <option value="">Default agent</option>
              <template x-for="a in agents" :key="a.id">
                <option :value="a.id" x-text="a.name"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-medium text-ink-2 uppercase tracking-wider mb-1.5 block">Message / Instruction</label>
            <textarea x-model="jobForm.message" rows="3" placeholder="What should the agent do when this job runs?"
                      class="w-full rounded-lg border border-surface-4 bg-surface-0 px-3 py-2 text-sm shadow-card placeholder:text-ink-3 focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all resize-y"></textarea>
          </div>
          <div class="flex items-center justify-between pt-1">
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="jobForm.enabled" class="accent-primary-600 w-4 h-4 rounded">
              <span class="text-xs text-ink-1">Enabled</span>
            </label>
            <button @click="saveJob()" :disabled="!jobForm.name || !jobForm.message || (jobForm.schedule_type === 'cron' ? !jobForm.cron : !jobForm.every)"
                    class="inline-flex items-center gap-1.5 h-8 px-3.5 text-xs font-medium text-white bg-primary-600 rounded-md hover:bg-primary-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all cursor-pointer">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
              <span x-text="editingJobId ? 'Update' : 'Create'"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Job list -->
      <template x-if="jobs.length === 0">
        <div class="rounded-xl border-2 border-dashed border-surface-3 py-16 text-center">
          <div class="w-10 h-10 rounded-full bg-surface-2 flex items-center justify-center mx-auto mb-3">
            <svg class="w-5 h-5 text-ink-3" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
          </div>
          <p class="text-sm text-ink-2">No scheduled jobs</p>
          <p class="text-xs text-ink-3 mt-0.5">Create one above to run tasks on a schedule</p>
        </div>
      </template>

      <div class="space-y-2">
        <template x-for="j in jobs" :key="j.id">
          <div class="rounded-xl border border-surface-3 bg-surface-0 shadow-card hover:shadow-card-hover transition-shadow px-4 py-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3 min-w-0">
                <button @click="toggleJob(j)" class="shrink-0 cursor-pointer" :title="j.enabled ? 'Disable' : 'Enable'">
                  <div class="w-8 h-5 rounded-full transition-colors duration-200 flex items-center"
                       :class="j.enabled ? 'bg-primary-500' : 'bg-surface-4'">
                    <div class="w-3.5 h-3.5 rounded-full bg-white shadow-sm transition-transform duration-200"
                         :class="j.enabled ? 'translate-x-[14px]' : 'translate-x-[3px]'"></div>
                  </div>
                </button>
                <div class="min-w-0">
                  <div class="text-sm font-medium text-ink-0 truncate" x-text="j.name"></div>
                  <div class="text-[11px] text-ink-2 font-mono mt-0.5"
                       x-text="j.cron ? ('cron: ' + j.cron) : ('every ' + j.every)"></div>
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0 ml-3">
                <button @click="editJob(j)" class="p-1.5 rounded-md text-ink-3 hover:text-primary-600 hover:bg-primary-50 transition-colors cursor-pointer" title="Edit">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"/></svg>
                </button>
                <button @click="deleteJob(j.id)" class="p-1.5 rounded-md text-ink-3 hover:text-danger-500 hover:bg-danger-50 transition-colors cursor-pointer" title="Delete">
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
                </button>
              </div>
            </div>
            <div class="mt-2 text-xs text-ink-2 line-clamp-2" x-text="j.message"></div>
            <div class="mt-1.5 flex items-center gap-2">
              <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium"
                    :class="j.session_mode === 'new' ? 'bg-primary-50 text-primary-700' : 'bg-surface-2 text-ink-2'"
                    x-text="j.session_mode === 'new' ? 'new session' : 'reuse session'"></span>
              <span x-show="j.agent_id" class="text-[10px] text-ink-2" x-text="'agent: ' + j.agent_id"></span>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- ==================== SETTINGS TAB ==================== -->
    <section x-show="tab === 'settings'" x-transition.opacity.duration.150ms>
      <h2 class="text-lg font-semibold mb-4">Settings</h2>
      <div class="space-y-4">
        <template x-for="key in settingsKeys" :key="key">
          <div class="bg-white rounded-lg shadow-card p-4">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-medium font-mono text-sm" x-text="key"></h3>
              <button @click="saveSetting(key)" class="inline-flex items-center gap-1.5 h-8 px-3.5 text-xs font-medium text-white bg-primary-600 rounded-md hover:bg-primary-700 transition-all cursor-pointer">Save</button>
            </div>
            <textarea
              x-model="settingsEditors[key]"
              rows="4"
              class="w-full px-3 py-2 border border-surface-4 rounded-md text-sm font-mono focus:outline-none focus:border-primary-400 focus:shadow-input-focus transition-all"></textarea>
          </div>
        </template>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-surface-3 bg-surface-0/60 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
      <span class="text-[11px] text-ink-3 font-mono">~/.anna/anna.db</span>
      <span class="text-[11px] text-ink-3">Press <kbd class="px-1 py-0.5 bg-surface-2 rounded text-ink-2 font-mono text-[10px]">Ctrl+C</kbd> in terminal to close</span>
    </div>
  </footer>
</div>

<script>
function adminApp() {
  const providerDefaults = {
    'anthropic':       { base_url: 'https://api.anthropic.com', name: 'Anthropic' },
    'openai':          { base_url: 'https://api.openai.com/v1', name: 'OpenAI' },
    'openai-response': { base_url: 'https://api.openai.com/v1', name: 'OpenAI Response' },
  };

  return {
    tab: 'providers',
    tabs: [
      { id: 'providers', label: 'Providers' },
      { id: 'agents', label: 'Agents' },
      { id: 'channels', label: 'Channels' },
      { id: 'users', label: 'Users' },
      { id: 'sessions', label: 'Sessions' },
      { id: 'scheduler', label: 'Scheduler' },
      { id: 'settings', label: 'Settings' },
    ],
    status: '',
    toast: '',
    toastType: 'success',
    providerDefaults,

    // Data
    providers: [],
    providerModels: {},
    newProviderType: '',
    agents: [],
    users: [],
    userMemories: {},
    sessions: [],
    sessionDetail: null,
    sessionMessages: [],
    sessionMessagesLoading: false,
    jobs: [],
    channelData: {
      telegram: { enabled: false, enable_notify: false, token: '', notify_chat: '', channel_id: '', group_mode: '', allowed_ids: [] },
      qq: { enabled: false, enable_notify: false, app_id: '', app_secret: '', group_mode: '', allowed_ids: [] },
      feishu: { enabled: false, enable_notify: false, app_id: '', app_secret: '', encrypt_key: '', verification_token: '', notify_chat: '', group_mode: '', allowed_ids: [] },
    },
    settingsKeys: ['runner', 'compaction', 'heartbeat', 'scheduler', 'plugins'],
    settingsEditors: {},

    // Agent form
    showAgentForm: false,
    editingAgentId: null,
    agentForm: { id: '', name: '', model: '', model_strong: '', model_fast: '', system_prompt: '', workspace: '', enabled: true },

    // Job form
    editingJobId: null,
    jobForm: { name: '', cron: '', every: '', message: '', session_mode: 'reuse', enabled: true, agent_id: '', schedule_type: 'cron' },

    get addableProviders() {
      const existing = new Set(this.providers.map(p => p.id));
      return Object.keys(providerDefaults).filter(p => !existing.has(p));
    },

    // Model helpers for agent form autocomplete
    allProviderModels() {
      const all = [];
      const seen = new Set();
      for (const p of this.providers) {
        const models = this.providerModels[p.id] || [];
        for (const m of models) {
          const ref = p.id + '/' + m;
          if (!seen.has(ref)) { seen.add(ref); all.push(ref); }
        }
      }
      return all;
    },

    filteredProviderModels(search) {
      const all = this.allProviderModels();
      if (!search) return all;
      const q = search.toLowerCase();
      return all.filter(m => m.toLowerCase().includes(q));
    },

    getModelValue(field) {
      return this.agentForm[field];
    },

    setModelValue(field, value) {
      this.agentForm[field] = value;
    },

    // Init
    async init() {
      await Promise.all([
        this.loadProviders(),
        this.loadAgents(),
        this.loadUsers(),
        this.loadSessions(),
        this.loadJobs(),
        this.loadChannels(),
        this.loadSettings(),
      ]);
      this.newProviderType = this.addableProviders[0] || '';
      this.status = 'Connected';
    },

    showToast(msg, type = 'success') {
      this.toast = msg;
      this.toastType = type;
      setTimeout(() => this.toast = '', 3000);
    },

    async api(method, path, body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      return json.data;
    },

    // --- Providers ---
    async loadProviders() {
      try {
        const list = await this.api('GET', '/api/providers') || [];
        // Add reactive helper properties for UI state.
        this.providers = list.map(p => ({ ...p, _fetching: false, _modelCount: 0, _showModels: false }));
      }
      catch(e) { console.error(e); }
    },

    async addProvider() {
      if (!this.newProviderType) return;
      const defaults = providerDefaults[this.newProviderType] || {};
      try {
        await this.api('POST', '/api/providers', {
          id: this.newProviderType,
          name: defaults.name || this.newProviderType,
          api_key: '',
          base_url: '',
        });
        await this.loadProviders();
        this.newProviderType = this.addableProviders[0] || '';
        this.showToast('Provider added');
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async saveProvider(p) {
      try {
        await this.api('PUT', '/api/providers/' + p.id, {
          id: p.id,
          name: p.name,
          api_key: p.api_key,
          base_url: p.base_url,
        });
        await this.loadProviders();
        this.showToast('Provider saved');
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async deleteProvider(id) {
      if (!confirm('Delete provider ' + id + '?')) return;
      try { await this.api('DELETE', '/api/providers/' + id); await this.loadProviders(); this.showToast('Provider deleted'); }
      catch(e) { this.showToast(e.message, 'error'); }
    },

    async fetchModels(p) {
      p._fetching = true;
      try {
        const models = await this.api('POST', '/api/providers/' + p.id + '/models', {
          api_key: p.api_key,
          base_url: p.base_url,
        });
        this.providerModels[p.id] = models || [];
        p._modelCount = this.providerModels[p.id].length;
        this.showToast('Fetched ' + p._modelCount + ' models from ' + p.id);
      } catch(e) { this.showToast(e.message, 'error'); }
      finally { p._fetching = false; }
    },

    // --- Agents ---
    async loadAgents() { try { this.agents = await this.api('GET', '/api/agents') || []; } catch(e) { console.error(e); } },
    resetAgentForm() { this.agentForm = { id: '', name: '', model: '', model_strong: '', model_fast: '', system_prompt: '', workspace: '', enabled: true }; this.editingAgentId = null; this.showAgentForm = false; },
    editAgent(a) {
      this.agentForm = { ...a };
      this.editingAgentId = a.id;
      this.showAgentForm = true;
    },
    async saveAgent() {
      try {
        if (this.editingAgentId) {
          await this.api('PUT', '/api/agents/' + this.editingAgentId, this.agentForm);
        } else {
          await this.api('POST', '/api/agents', this.agentForm);
        }
        this.resetAgentForm();
        await this.loadAgents();
        this.showToast('Agent saved');
      } catch(e) { this.showToast(e.message, 'error'); }
    },
    async deleteAgent(id) {
      if (!confirm('Delete agent ' + id + '?')) return;
      try { await this.api('DELETE', '/api/agents/' + id); await this.loadAgents(); this.showToast('Agent deleted'); }
      catch(e) { this.showToast(e.message, 'error'); }
    },

    // --- Channels ---
    async loadChannels() {
      try {
        const channels = await this.api('GET', '/api/channels') || [];
        for (const ch of channels) {
          let cfg = {};
          try { cfg = JSON.parse(ch.config || '{}'); } catch(_) {}
          if (ch.id === 'telegram') {
            this.channelData.telegram = {
              enabled: ch.enabled,
              enable_notify: cfg.enable_notify || false,
              token: cfg.token || '',
              notify_chat: cfg.notify_chat || '',
              channel_id: cfg.channel_id || '',
              group_mode: cfg.group_mode || '',
              allowed_ids: cfg.allowed_ids || [],
            };
          } else if (ch.id === 'qq') {
            this.channelData.qq = {
              enabled: ch.enabled,
              enable_notify: cfg.enable_notify || false,
              app_id: cfg.app_id || '',
              app_secret: cfg.app_secret || '',
              group_mode: cfg.group_mode || '',
              allowed_ids: cfg.allowed_ids || [],
            };
          } else if (ch.id === 'feishu') {
            this.channelData.feishu = {
              enabled: ch.enabled,
              enable_notify: cfg.enable_notify || false,
              app_id: cfg.app_id || '',
              app_secret: cfg.app_secret || '',
              encrypt_key: cfg.encrypt_key || '',
              verification_token: cfg.verification_token || '',
              notify_chat: cfg.notify_chat || '',
              group_mode: cfg.group_mode || '',
              allowed_ids: cfg.allowed_ids || [],
            };
          }
        }
      } catch(e) { console.error(e); }
    },

    async saveChannel(platform) {
      try {
        const data = this.channelData[platform];
        const { enabled, ...cfg } = data;
        await this.api('PUT', '/api/channels/' + platform, {
          enabled: enabled,
          config: JSON.stringify(cfg),
        });
        await this.loadChannels();
        this.showToast(platform + ' channel saved');
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    // --- Users ---
    async loadUsers() {
      try {
        const list = await this.api('GET', '/api/users') || [];
        this.users = list.map(u => ({
          ...u,
          _defaultAgent: u.default_agent_id || '',
          _showMemory: false,
          _memoryCount: 0,
          _showAddMemory: false,
          _newMemoryAgent: '',
          _newMemoryContent: '',
        }));
      } catch(e) { console.error('loadUsers error:', e); this.showToast('Failed to load users: ' + e.message, 'error'); }
    },

    async toggleUserMemory(u) {
      u._showMemory = !u._showMemory;
      if (u._showMemory) await this.loadUserMemories(u);
    },

    async loadUserMemories(u) {
      try {
        const mems = await this.api('GET', '/api/users/' + u.id + '/memories') || [];
        this.userMemories[u.id] = mems.map(m => ({ ...m, _content: m.content }));
        u._memoryCount = mems.length;
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async saveUserDefaultAgent(u) {
      try {
        await this.api('PUT', '/api/users/' + u.id, { default_agent_id: u._defaultAgent });
        u.default_agent_id = u._defaultAgent;
        this.showToast('Default agent updated');
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async saveUserMemory(userId, agentId, content) {
      try {
        await this.api('PUT', '/api/users/' + userId + '/memories/' + agentId, { content });
        const u = this.users.find(u => u.id === userId);
        if (u) await this.loadUserMemories(u);
        this.showToast('Memory saved');
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async deleteUserMemory(userId, agentId) {
      if (!confirm('Delete memory for agent ' + agentId + '?')) return;
      try {
        await this.api('DELETE', '/api/users/' + userId + '/memories/' + agentId);
        const u = this.users.find(u => u.id === userId);
        if (u) await this.loadUserMemories(u);
        this.showToast('Memory deleted');
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async addUserMemory(u) {
      if (!u._newMemoryAgent || !u._newMemoryContent) return;
      try {
        await this.api('PUT', '/api/users/' + u.id + '/memories/' + u._newMemoryAgent, { content: u._newMemoryContent });
        u._showAddMemory = false;
        u._newMemoryAgent = '';
        u._newMemoryContent = '';
        await this.loadUserMemories(u);
        this.showToast('Memory added');
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    // --- Sessions ---
    async loadSessions() { try { this.sessions = await this.api('GET', '/api/sessions') || []; } catch(e) { console.error(e); } },

    async openSession(sessionID) {
      this.sessionMessagesLoading = true;
      this.sessionMessages = [];
      try {
        this.sessionDetail = await this.api('GET', '/api/sessions/' + encodeURIComponent(sessionID));
        const msgs = await this.api('GET', '/api/sessions/' + encodeURIComponent(sessionID) + '/messages') || [];
        this.sessionMessages = msgs;
      } catch(e) { this.showToast(e.message, 'error'); }
      finally { this.sessionMessagesLoading = false; }
    },

    formatTime(ts) {
      if (!ts) return '';
      try {
        // Handle SQLite datetime format "YYYY-MM-DD HH:MM:SS" (no T, no Z)
        let d = new Date(ts);
        if (isNaN(d.getTime()) && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(ts)) {
          d = new Date(ts.replace(' ', 'T') + 'Z');
        }
        if (isNaN(d.getTime())) return ts;
        const now = new Date();
        const diffMs = now - d;
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return 'just now';
        if (diffMin < 60) return diffMin + 'm ago';
        const diffHr = Math.floor(diffMin / 60);
        if (diffHr < 24) return diffHr + 'h ago';
        const diffDay = Math.floor(diffHr / 24);
        if (diffDay < 7) return diffDay + 'd ago';
        return d.toLocaleDateString();
      } catch(_) { return ts; }
    },

    // --- Scheduler ---
    async loadJobs() { try { this.jobs = await this.api('GET', '/api/scheduler/jobs') || []; } catch(e) { console.error(e); } },
    resetJobForm() { this.jobForm = { name: '', cron: '', every: '', message: '', session_mode: 'reuse', enabled: true, agent_id: '', schedule_type: 'cron' }; this.editingJobId = null; },
    editJob(j) {
      this.editingJobId = j.id;
      this.jobForm = {
        name: j.name,
        message: j.message,
        schedule_type: j.cron ? 'cron' : 'every',
        cron: j.cron || '',
        every: j.every || '',
        session_mode: j.session_mode || 'reuse',
        enabled: j.enabled,
        agent_id: j.agent_id || '',
      };
    },
    async saveJob() {
      const payload = {
        name: this.jobForm.name,
        message: this.jobForm.message,
        cron: this.jobForm.schedule_type === 'cron' ? this.jobForm.cron : '',
        every: this.jobForm.schedule_type === 'every' ? this.jobForm.every : '',
        session_mode: this.jobForm.session_mode,
        enabled: this.jobForm.enabled,
        agent_id: this.jobForm.agent_id,
      };
      try {
        if (this.editingJobId) {
          await this.api('PUT', '/api/scheduler/jobs/' + this.editingJobId, payload);
        } else {
          await this.api('POST', '/api/scheduler/jobs', payload);
        }
        this.resetJobForm();
        await this.loadJobs();
        this.showToast(this.editingJobId ? 'Job updated' : 'Job created');
      } catch(e) { this.showToast(e.message, 'error'); }
    },
    async toggleJob(j) {
      try {
        await this.api('PUT', '/api/scheduler/jobs/' + j.id, {
          name: j.name,
          message: j.message,
          cron: j.cron || '',
          every: j.every || '',
          session_mode: j.session_mode,
          enabled: !j.enabled,
          agent_id: j.agent_id || '',
        });
        await this.loadJobs();
      } catch(e) { this.showToast(e.message, 'error'); }
    },
    async deleteJob(id) {
      if (!confirm('Delete job?')) return;
      try { await this.api('DELETE', '/api/scheduler/jobs/' + id); await this.loadJobs(); this.showToast('Job deleted'); }
      catch(e) { this.showToast(e.message, 'error'); }
    },

    // --- Settings ---
    async loadSettings() {
      for (const key of this.settingsKeys) {
        try {
          const result = await this.api('GET', '/api/settings/' + key);
          this.settingsEditors[key] = typeof result.value === 'object' ? JSON.stringify(result.value, null, 2) : (result.value || '');
        } catch(e) {
          this.settingsEditors[key] = '';
        }
      }
    },
    async saveSetting(key) {
      try {
        let val = this.settingsEditors[key];
        try { val = JSON.parse(val); } catch(_) {}
        await this.api('PUT', '/api/settings/' + key, { value: val });
        this.showToast('Setting ' + key + ' saved');
      } catch(e) { this.showToast(e.message, 'error'); }
    },
  };
}

// Model combo helper (used by x-data on model fields)
function modelCombo(field) {
  return { open: false, search: '' };
}
</script>
