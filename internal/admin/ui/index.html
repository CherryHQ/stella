<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Admin</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['DM Serif Text', 'Georgia', 'serif'],
            sans: ['DM Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            terra: {
              50: '#fdf5f2', 100: '#fbe8e0', 200: '#f6cfc0', 300: '#eead96', 400: '#e28a6a',
              500: '#b8593a', 600: '#a04d32', 700: '#873f29', 800: '#6e3422', 900: '#5a2c1e',
            },
            warm: {
              50: '#faf9f7', 100: '#f5f3ef', 200: '#e8e4dd', 300: '#d5d0c7', 400: '#b5afa4',
              500: '#908981', 600: '#6e685f', 700: '#54504a', 800: '#3a3733', 900: '#252320',
              950: '#171614',
            },
          },
        },
      },
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d5d0c7; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #54504a; }
    *:focus-visible { outline: 2px solid #b8593a; outline-offset: 2px; }
    .input-line { border: none; border-bottom: 1.5px solid #d5d0c7; border-radius: 0; background: transparent; }
    .input-line:focus { border-color: #b8593a; outline: none; box-shadow: none; }
    .dark .input-line { border-bottom-color: #54504a; }
    .dark .input-line:focus { border-color: #e28a6a; }
  </style>
</head>
<body class="bg-warm-50 dark:bg-warm-950 text-warm-900 dark:text-warm-100 font-sans antialiased min-h-screen">

<div x-data="adminApp()" x-init="init()" x-cloak>

  <!-- ─── TOP NAV ─── -->
  <header class="border-b border-warm-200 dark:border-warm-800">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <span class="font-serif italic text-terra-500 text-xl tracking-tight select-none">anna</span>
      <nav class="hidden sm:flex items-center gap-1 text-sm" role="navigation" aria-label="Main">
        <template x-for="(t, i) in tabs" :key="t.id">
          <span class="flex items-center">
            <span x-show="i > 0" class="text-warm-300 dark:text-warm-700 mx-2 select-none">/</span>
            <button @click="tab = t.id; if(t.id !== 'sessions') { sessionDetail = null; sessionMessages = []; }"
                    :class="tab === t.id ? 'text-terra-500 dark:text-terra-400' : 'text-warm-500 dark:text-warm-500 hover:text-warm-800 dark:hover:text-warm-300'"
                    class="py-1 transition-colors cursor-pointer font-medium" x-text="t.label"></button>
          </span>
        </template>
      </nav>
      <!-- Mobile nav -->
      <select x-model="tab" @change="if(tab !== 'sessions') { sessionDetail = null; sessionMessages = []; }"
              class="sm:hidden input-line text-sm py-1 pr-6 text-warm-700 dark:text-warm-300 bg-transparent cursor-pointer">
        <template x-for="t in tabs" :key="t.id"><option :value="t.id" x-text="t.label"></option></template>
      </select>
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1.5 text-xs font-mono text-warm-500">
          <span class="w-1.5 h-1.5 rounded-full" :class="status === 'Connected' ? 'bg-green-600 dark:bg-green-500' : 'bg-warm-400 animate-pulse'"></span>
          <span x-text="status || '...'"></span>
        </span>
        <button @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode)"
                class="text-warm-400 hover:text-warm-700 dark:hover:text-warm-300 transition-colors cursor-pointer" aria-label="Toggle dark mode">
          <svg x-show="!darkMode" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
          <svg x-show="darkMode" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ─── TOAST ─── -->
  <div class="fixed top-2 left-1/2 -translate-x-1/2 z-50" x-show="toast"
       x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 -translate-y-2">
    <div :class="toastType === 'error' ? 'text-red-700 dark:text-red-400 border-red-300 dark:border-red-800' : 'text-warm-800 dark:text-warm-200 border-warm-300 dark:border-warm-700'"
         class="text-sm font-mono px-4 py-2 border bg-warm-50 dark:bg-warm-900 rounded-sm" x-text="toast"></div>
  </div>

  <!-- ─── MAIN ─── -->
  <main class="max-w-6xl mx-auto px-6 py-12">

    {@include sections/providers.html}

    {@include sections/agents.html}

    {@include sections/channels.html}

    {@include sections/users.html}

    {@include sections/sessions.html}

    {@include sections/scheduler.html}

    {@include sections/settings.html}
  </main>

  <!-- ─── FOOTER ─── -->
  <footer class="border-t border-warm-200 dark:border-warm-800 mt-20">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between text-[10px] font-mono text-warm-400">
      <span>~/.anna/anna.db</span>
      <span>anna admin</span>
    </div>
  </footer>

  <!-- Inline confirm (replaces modal) -->
  <div x-show="confirmMsg" x-transition class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-warm-900 dark:bg-warm-100 text-warm-100 dark:text-warm-900 px-4 py-3 rounded-sm flex items-center gap-4 text-sm font-medium">
    <span x-text="confirmMsg"></span>
    <button @click="confirmAction(); confirmMsg = ''" class="text-red-400 dark:text-red-600 hover:text-red-300 cursor-pointer font-medium">Confirm</button>
    <button @click="confirmMsg = ''" class="text-warm-400 hover:text-warm-300 dark:hover:text-warm-600 cursor-pointer">Cancel</button>
  </div>
</div>

<script>
{@include js/app.js}
</script>
</body>
</html>
