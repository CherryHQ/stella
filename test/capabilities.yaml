# This file is the long-lived release capability inventory. Update it with the
# product change that adds, removes, or renames a public surface; release runs
# validate it but never regenerate or overwrite it.
schema_version: 2

baseline:
  commit: 8e454a0112d51e0cde7e81ffd3ba2df0fb69672d
  note: Initial phase-one inventory against upstream/main for issue 772.

surface_exemptions:
  openapi: []
  web_routes:
    - id: /docs/$
      reason: Documentation delivery route, not a Stella product capability.
    - id: /settings
      reason: Generated settings layout node; concrete child routes own the product capabilities.
    - id: /settings/
      reason: Generated settings index redirect; concrete child routes own the product capabilities.
  cli_commands: []
  plugins: []
  system_skills: []
  builtin_souls: []
  builtin_delegates: []
  builtin_templates: []
  core_tools: []

test_assets:
  - id: A01
    category: framework
    name: Go standard testing
    automation: automated
    entrypoints: [mise run test, go test]
    evidence_paths: [go.mod]
    summary: Primary framework for unit, integration, conformance, and package contract tests.
    limitations: Does not by itself prove a real stellad process, browser, or external service.

  - id: A02
    category: helper
    name: net/http/httptest
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      internal/server/auth_test.go,
      plugins/tools/webfetch/webfetch_test.go,
    ]
    summary: In-process HTTP recorders and fake servers for handlers and external protocols.
    limitations: Does not traverse the real stellad process and TCP listener.

  - id: A03
    category: harness
    name: internal/db/dbtest with embedded PostgreSQL
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      internal/db/dbtest/dbtest.go,
      internal/db/dbtest/dbtest_test.go,
    ]
    summary: Migrates a template database and clones an isolated real PostgreSQL database per test.
    limitations: Most consumers remain in-process and do not cover process startup or network transport.

  - id: A04
    category: harness
    name: internal/memory/memorytest
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      internal/memory/memorytest/fake.go,
      internal/memory/memorytest/conformance.go,
    ]
    summary: Reusable Memory fake and provider conformance suite.
    limitations: Covers the provider contract rather than complete user journeys.

  - id: A05
    category: helper
    name: Package-local fakes, stubs, recorders, and trace helpers
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      test/system/fake_anthropic_test.go,
      internal/observability/tracehook/tracehook_test.go,
    ]
    summary: Purpose-built protocol recording, fake providers, filesystem, subprocess, and trace assertions.
    limitations: There is no single cross-package mock or fixture framework.

  - id: A06
    category: harness
    name: Subprocess System Test Harness
    automation: automated
    entrypoints: [mise run system-test]
    evidence_paths: [test/system/system_test.go, test/system/harness_test.go]
    summary: Runs the real stellad binary over TCP with embedded PostgreSQL and a scripted fake Anthropic provider.
    limitations: The ordered journeys cover only selected process seams and no browser.

  - id: A07
    category: harness
    name: Docker Sandbox Contract Test
    automation: conditional
    entrypoints: [go test ./plugins/sandbox/docker/...]
    evidence_paths: [plugins/sandbox/docker/contract_test.go]
    summary: Exercises container lifecycle and execution through the project Docker client against a real daemon.
    limitations: Skips when Docker is unavailable and has no release platform result matrix.

  - id: A08
    category: orchestration
    name: mise task runner
    automation: automated
    entrypoints: [mise tasks]
    evidence_paths: [mise.toml]
    summary: Provides the repository test, system-test, build, and release command entrypoints.
    limitations: Task existence is orchestration evidence, not product behavior evidence.

  - id: A09
    category: quality-gate
    name: Go coverage and race detector
    automation: automated
    entrypoints: [mise run test:coverage, mise run test:coverage:race]
    evidence_paths: [mise.toml, .github/workflows/lint-and-test.yml]
    summary: Measures Go line coverage and detects data races in ordinary CI.
    limitations: Line coverage cannot substitute for Capability and Scenario coverage.

  - id: A10
    category: quality-gate
    name: Generate, format, migration, package, and chart checks
    automation: automated
    entrypoints: [
      mise run generate:check,
      mise run format,
      mise run release:check,
      mise run release:snapshot,
      mise run deploy:helm:check,
    ]
    evidence_paths: [mise.toml, .pre-commit-config.yaml, deploy/helm/check.sh]
    summary: Validates generated output, formatting, lint, migrations, archives, and Helm rendering.
    limitations: These gates generally do not prove runtime product behavior.

  - id: A11
    category: execution
    name: GitHub Actions
    automation: automated
    entrypoints: [lint-and-test workflow, release workflow]
    evidence_paths: [
      .github/workflows/lint-and-test.yml,
      .github/workflows/release.yml,
    ]
    summary: Runs ordinary generate, format, race, coverage, build, and publication jobs.
    limitations: Ordinary CI does not run System Test and the tag workflow does not enforce the full local release gate.

  - id: A12
    category: exploratory
    name: tap browser runbook
    automation: agent-driven
    entrypoints: [tap browser]
    evidence_paths: [web/content/docs/development/rules/web-ui-test.md]
    summary: Drives page text, interactions, URLs, network requests, and screenshots on a running server.
    limitations: Not a versioned browser suite or runner and has no repository-owned report or trace contract.

  - id: A13
    category: exploratory
    name: curl and database API runbook
    automation: manual
    entrypoints: [curl, psql]
    evidence_paths: [web/content/docs/development/rules/api-test.md]
    summary: Drives a running stellad through HTTP and inspects PostgreSQL invariants.
    limitations: No shared fixture, result format, cleanup runner, or release invocation.

  - id: A14
    category: harness
    name: Reflect tagged model evaluation tests
    automation: manual
    entrypoints: [go test -tags reflecteval]
    evidence_paths: [
      internal/reflect/candidate_eval_manual_test.go,
      internal/reflect/reconciliation_eval_manual_test.go,
    ]
    summary: Runs opt-in real-model evaluation cases and writes diagnostic reports under dist.
    limitations: Requires an explicit environment flag and provider access; it is not part of a unified release runner.

  - id: A15
    category: framework
    name: Vitest frontend unit tests
    automation: automated
    entrypoints: [mise run test:web, mise run test]
    evidence_paths: [
      web/package.json,
      web/src/components/chat/UserMessage.test.ts,
      web/src/features/providers/provider-helpers.test.ts,
      web/src/lib/chat-transport.test.ts,
    ]
    summary: Exercises frontend rendering helpers, provider form behavior, and chat transport contracts under Vitest.
    limitations: Unit tests do not traverse a browser, a real stellad process, or persisted backend state.

capabilities:
  - id: C01
    class: core
    name: runtime-storage
    title: Runtime and storage
    description: Start stellad, initialize or connect PostgreSQL, migrate, report readiness and version, and shut down safely.
    surfaces:
      openapi: [getStatus]
      web_routes: [/settings/about]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C01-S01
        name: boot-migrate-ready-drain
        layer: system
        status: covered
        release_policy: blocking
        summary: The release binary migrates its database, becomes ready, drains in-flight work, and exits cleanly.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: readiness
            direct: true
            proves: Real binary startup, migration, TCP readiness, and process ownership.
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: graceful_drain
            direct: true
            proves: Readiness transition, in-flight completion, and zero exit on SIGTERM.
        gap: ""
      - id: C01-S02
        name: restart-persistence
        layer: system
        status: partial
        release_policy: blocking
        summary: A stable data directory preserves migrated data and resumes cleanly after the stellad process restarts.
        evidence:
          - kind: go_test
            path: internal/db/embedded_smoke_test.go
            test: TestEmbeddedSmoke
            direct: false
            proves: Embedded database lifecycle behavior below the release process boundary.
        gap: No real-process journey writes domain data, restarts stellad on the same database, and verifies recovery.
      - id: C01-S03
        name: external-postgres-startup
        layer: system
        status: missing
        release_policy: blocking
        summary: The release binary migrates, becomes ready, serves data, and drains against a supported external PostgreSQL URL.
        evidence: []
        gap: No deployed external-PostgreSQL process journey exists.

  - id: C02
    class: core
    name: local-authentication
    title: Local authentication
    description: Register the first user, log in and out, inspect the current user and sessions, revoke sessions, and change password.
    surfaces:
      openapi: [
        logout,
        loginLocal,
        registerLocal,
        getMe,
        listAuthSessions,
        deleteAuthSession,
        listAuthProviders,
        changePassword,
      ]
      web_routes: [/login, /signup, /profile, /settings/account]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C02-S01
        name: registration-login-session-revocation
        layer: system
        status: partial
        release_policy: blocking
        summary: A user registers, authenticates over real HTTP, uses a session, and loses access after revocation or logout.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: startup_and_auth
            direct: true
            proves: Registration, cookie-authenticated access, and PAT revocation through the real process.
          - kind: go_test
            path: internal/server/auth_test.go
            test: TestLogout
            direct: true
            proves: Logout returns success and clears the session cookie response.
        gap: Existing tests do not reuse the old session after logout or session revocation against a protected endpoint to prove that access is denied.
      - id: C02-S02
        name: browser-login-and-logout
        layer: browser
        status: manual-only
        release_policy: blocking
        summary: The Web UI presents registration and login errors, establishes a session, and visibly logs out.
        evidence:
          - kind: runbook
            path: web/content/docs/development/rules/web-ui-test.md
            direct: false
            proves: Manual browser commands can drive login and registration.
        gap: No repository-owned Browser E2E scenario proves the UI lifecycle.

  - id: C03
    class: core
    name: users-and-authorization
    title: Users and authorization
    description: Administer users, roles, activation, agent access, default agents, identities, and notification routing with fail-closed authorization.
    surfaces:
      openapi:
        - updateUserDefaultAgent
        - updateUserNotifyIdentity
        - listAuthUsers
        - getAuthUser
        - updateAuthUserRole
        - listAuthUserAgents
        - updateAuthUserAgents
        - listAuthUserLoginIdentities
        - linkAuthUserLoginIdentity
        - listAuthUserChannelIdentities
        - deleteAuthUserIdentity
        - updateAuthUserActive
      web_routes: [/settings/users, /settings/users/$userId]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C03-S01
        name: admin-user-and-role-management
        layer: integration
        status: covered
        release_policy: blocking
        summary: Admin operations enforce role, activation, identity, and agent-assignment boundaries in PostgreSQL-backed handlers.
        evidence:
          - kind: go_test
            path: internal/server/auth_users_test.go
            direct: true
            proves: User administration endpoints, identity visibility, and error handling.
          - kind: go_test
            path: internal/authz/authority_test.go
            direct: true
            proves: Core authorization decisions fail closed across roles.
        gap: ""
      - id: C03-S02
        name: browser-user-administration
        layer: browser
        status: missing
        release_policy: nonblocking
        summary: An administrator manages a user while a normal user cannot see or invoke privileged controls.
        evidence: []
        gap: No automated browser journey covers the users and roles pages.

  - id: C04
    class: core
    name: tokens-and-oauth-clients
    title: Personal access tokens and OAuth clients
    description: Discover scopes, create and revoke personal tokens, manage OAuth clients and secrets, and revoke authorized applications.
    surfaces:
      openapi:
        - listPersonalAccessTokens
        - createPersonalAccessToken
        - getPersonalAccessToken
        - revokePersonalAccessToken
        - listTokenScopes
        - listOAuthClients
        - createOAuthClient
        - disableOAuthClient
        - rotateOAuthClientSecret
        - listOAuthClientScopes
        - listAuthorizedApps
        - revokeAuthorizedApp
      web_routes: []
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C04-S01
        name: pat-lifecycle-and-scope
        layer: system
        status: covered
        release_policy: blocking
        summary: A scoped PAT authenticates a permitted route and stops authenticating after revocation.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: startup_and_auth
            direct: true
            proves: PAT creation, bearer use, scope reachability, and revocation through real HTTP.
          - kind: go_test
            path: internal/server/pat_integration_test.go
            direct: true
            proves: PostgreSQL-backed PAT endpoint behavior and secret handling.
        gap: ""
      - id: C04-S02
        name: oauth-client-management
        layer: integration
        status: covered
        release_policy: blocking
        summary: OAuth clients can be created, disabled, rotated, scoped, listed, and revoked without exposing stored secrets.
        evidence:
          - kind: go_test
            path: internal/server/oauth_pat_e2e_test.go
            test: TestOAuthClientManagementSmoke_E2E
            direct: true
            proves: OAuth client management through the in-process HTTP stack and real database.
        gap: ""

  - id: C05
    class: core
    name: agent-management
    title: Agent management
    description: Create, update, delete, assign, and inspect agents, their user access, visible tools, and tool overrides.
    surfaces:
      openapi: [
        listAgents,
        createAgent,
        getAgent,
        updateAgent,
        deleteAgent,
        listAgentUsers,
        assignAgentUser,
        removeAgentUser,
        listAgentTools,
        updateAgentTool,
      ]
      web_routes: [
        /,
        /agents,
        /agents/,
        /agents/$agentId,
        /agents/$agentId/,
        /settings/agents,
        /settings/agents/$agentId,
        /settings/agents/$agentId/$tab,
      ]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C05-S01
        name: agent-crud-access-and-tools
        layer: integration
        status: covered
        release_policy: blocking
        summary: Agent CRUD, user grants, ownership, tool visibility, and overrides enforce authorization and persistence.
        evidence:
          - kind: go_test
            path: internal/server/agents_test.go
            direct: true
            proves: Agent HTTP CRUD and validation behavior.
          - kind: go_test
            path: internal/server/agent_access_test.go
            direct: true
            proves: Agent-user access boundaries and assignments.
          - kind: go_test
            path: internal/agent/tool_override_test.go
            direct: true
            proves: Tool override behavior in the agent runtime.
        gap: ""
      - id: C05-S02
        name: browser-agent-management
        layer: browser
        status: missing
        release_policy: blocking
        summary: Users manage an agent and see only tools and actions allowed by their role.
        evidence: []
        gap: No automated browser journey covers agent creation, editing, assignment, or tool overrides.

  - id: C06
    class: core
    name: provider-model-control-plane
    title: Provider, model, and vision control plane
    description: Manage provider configuration and types, discover models, fetch remote model catalogs, maintain the model cache, and select the deployment-wide vision model.
    surfaces:
      openapi: [
        listProviders,
        createProvider,
        getProvider,
        updateProvider,
        deleteProvider,
        listProviderModels,
        fetchProviderModels,
        listProviderTypes,
        listModels,
        getVisionSettings,
        updateVisionSettings,
      ]
      web_routes: [
        /settings/providers,
        /settings/providers/$providerId,
        /settings/vision,
      ]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C06-S01
        name: provider-configuration-and-redaction
        layer: integration
        status: partial
        release_policy: blocking
        summary: Provider configuration CRUD remains admin-scoped, validates provider types, and never returns stored secret values.
        evidence:
          - kind: go_test
            path: internal/controlplane/authorized_test.go
            direct: true
            proves: Provider control-plane access is restricted to valid admin authority.
        gap: No direct HTTP lifecycle test covers every provider CRUD endpoint and secret-redaction response together.
      - id: C06-S02
        name: browser-provider-management
        layer: browser
        status: missing
        release_policy: blocking
        summary: An administrator configures a provider and observes model discovery and validation errors in the Web UI.
        evidence: []
        gap: No automated browser provider-management journey exists.
      - id: C06-S03
        name: model-discovery-and-cache
        layer: integration
        status: covered
        release_policy: blocking
        summary: Model catalogs merge custom and fetched entries, exclude disabled providers, and replace cached entries only for the selected provider.
        evidence:
          - kind: go_test
            path: internal/server/models_test.go
            test: TestListCachedModelsMergesCustomAndFetchedAndFiltersDisabled
            direct: true
            proves: Model listing merges custom and fetched entries while filtering disabled providers.
          - kind: go_test
            path: internal/server/models_test.go
            test: TestReplaceCachedModelsIsPerProvider
            direct: true
            proves: Cache replacement is isolated to one provider.
        gap: ""
      - id: C06-S04
        name: vision-model-settings-and-image-history
        layer: system
        status: partial
        release_policy: blocking
        summary: Vision settings persist a normalized provider/model reference and the real process uses it for canonical image history.
        evidence:
          - kind: go_test
            path: internal/controlplane/vision_test.go
            test: TestSetVisionSettingsRoundTrip
            direct: true
            proves: The admin control plane persists and normalizes a deployment-wide provider/model vision reference.
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: image_history
            direct: true
            proves: The real binary accepts a vision-model update over HTTP and uses it to render image history.
        gap: Vision-settings read/write authorization and malformed-reference errors are not directly exercised through HTTP.

  - id: C07
    class: core
    name: sessions-and-chat
    title: Sessions and chat
    description: Manage sessions, message history and media, SSE chat and event streams, context, summaries, and system prompts.
    surfaces:
      openapi: [
        listSessions,
        createSession,
        getSession,
        updateSession,
        deleteSession,
        getSessionMessages,
        getSessionMedia,
        sendSessionMessage,
        streamSessionEvents,
        getSessionContextItems,
        getSessionSummary,
        getSessionSystemPrompt,
      ]
      web_routes: [/sessions, /sessions/$, /agents/$agentId/sessions/$sessionId]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C07-S01
        name: session-crud-and-visibility
        layer: integration
        status: partial
        release_policy: blocking
        summary: Session create, get, list, update, and archive operations preserve ownership, kind visibility, and persisted identity.
        evidence:
          - kind: go_test
            path: internal/server/sessions_api_test.go
            test: TestUpdateAndDeleteSession
            direct: true
            proves: Session update and delete behavior through HTTP handlers.
          - kind: go_test
            path: internal/server/sessions_api_test.go
            test: TestListSessionsHidesInternalKindsByDefault
            direct: true
            proves: Session listing visibility and kind filtering through HTTP handlers.
          - kind: go_test
            path: internal/agent/session/registry_test.go
            test: TestEnsure_GeneratedCreate
            direct: true
            proves: Session creation persists canonical identity and kind metadata.
          - kind: go_test
            path: internal/agent/session/registry_test.go
            test: TestGet_CrossUserDenied
            direct: true
            proves: Session retrieval rejects a foreign owner.
        gap: No direct HTTP test currently proves create and get together with cross-request persistence and cross-user denial.
      - id: C07-S02
        name: real-sse-chat-and-provider-error
        layer: system
        status: covered
        release_policy: blocking
        summary: A real client receives streamed chat content, terminal frames, and provider errors without hanging.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: chat_sse
            direct: true
            proves: Real HTTP and SSE chat completion through the release binary.
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: chat_provider_error
            direct: true
            proves: Provider failure is delivered in-band and the stream terminates.
        gap: ""
      - id: C07-S03
        name: browser-chat-journey
        layer: browser
        status: missing
        release_policy: blocking
        summary: A user creates a session, sends a message, sees streaming output, reloads, and sees persisted history.
        evidence: []
        gap: No repository-owned Browser E2E chat journey exists.
      - id: C07-S04
        name: message-history-and-media
        layer: integration
        status: covered
        release_policy: blocking
        summary: Typed message history preserves ordering and error metadata while media reads enforce session ownership, integrity, and safe response headers.
        evidence:
          - kind: go_test
            path: internal/server/context_items_test.go
            test: TestSessionContextItemsAndSummaryEndpoints
            direct: true
            proves: Message range reads return the persisted logical assistant history.
          - kind: go_test
            path: internal/server/sessions_media_test.go
            test: TestSessionMediaAuthorizationCachingAndTypedHistory
            direct: true
            proves: Typed history and media reads preserve content while rejecting foreign, mismatched, and missing resources.
        gap: ""
      - id: C07-S05
        name: context-summary-and-system-prompt
        layer: integration
        status: partial
        release_policy: blocking
        summary: Context items, summary detail, and system-prompt inspection return scoped projections for a persisted session.
        evidence:
          - kind: go_test
            path: internal/server/context_items_test.go
            test: TestSessionContextItemsAndSummaryEndpoints
            direct: true
            proves: Context item and summary HTTP responses preserve ordering and aggregate metadata.
          - kind: go_test
            path: internal/server/context_items_test.go
            test: TestSessionContextItemsTenantIsolation
            direct: true
            proves: Context and summary endpoints reject cross-user access.
          - kind: go_test
            path: internal/server/skills_scoped_test.go
            test: TestSessionSystemPromptAdvertisesSkillSearch
            direct: true
            proves: The system-prompt endpoint renders skill discovery instructions for a persisted session.
        gap: Context and summary tenant isolation is direct, but the system-prompt endpoint lacks an equivalent cross-user authorization assertion.

  - id: C08
    class: core
    name: session-workspace
    title: Session workspace
    description: List, read, create, update, upload, move, and delete files within an authorized session workspace.
    surfaces:
      openapi: [
        getSessionWorkspace,
        createWorkspaceFile,
        deleteWorkspaceFile,
        moveWorkspaceFile,
        getWorkspaceFileContent,
        updateWorkspaceFileContent,
        uploadWorkspaceFile,
