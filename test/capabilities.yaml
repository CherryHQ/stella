  - id: C10
    class: core
    name: goals-and-tasks
    title: Goals and tasks
    description: Create and control goals, attempts, dependencies, plans, acceptance evidence, verdicts, health, and autonomous task execution.
    surfaces:
      openapi:
        - listGoals
