# This file is the long-lived release capability inventory. Update it with the
# product change that adds, removes, or renames a public surface; release runs
# validate it but never regenerate or overwrite it.
schema_version: 1

baseline:
  commit: 76765b1d3171ce73084a31a85332ac52f5b7af34
  note: Re-audited against upstream/main after the user-managed Lark CLI change for issue 772.

surface_exemptions:
  openapi: []
  web_routes:
    - id: /docs/$
      reason: Documentation delivery route, not a Stella product capability.
    - id: /settings
      reason: Generated settings layout node; concrete child routes own the product capabilities.
    - id: /settings/
      reason: Generated settings index redirect; concrete child routes own the product capabilities.
  cli_commands: []
  plugins: []
  system_skills: []

test_assets:
  - id: A01
    category: framework
    name: Go standard testing
    automation: automated
    entrypoints: [mise run test, go test]
    evidence_paths: [go.mod]
    summary: Primary framework for unit, integration, conformance, and package contract tests.
    limitations: Does not by itself prove a real stellad process, browser, or external service.

  - id: A02
    category: helper
    name: net/http/httptest
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      internal/server/auth_test.go,
      plugins/tools/webfetch/webfetch_test.go,
    ]
    summary: In-process HTTP recorders and fake servers for handlers and external protocols.
    limitations: Does not traverse the real stellad process and TCP listener.

  - id: A03
    category: harness
    name: internal/db/dbtest with embedded PostgreSQL
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      internal/db/dbtest/dbtest.go,
      internal/db/dbtest/dbtest_test.go,
    ]
    summary: Migrates a template database and clones an isolated real PostgreSQL database per test.
    limitations: Most consumers remain in-process and do not cover process startup or network transport.

  - id: A04
    category: harness
    name: internal/memory/memorytest
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      internal/memory/memorytest/fake.go,
      internal/memory/memorytest/conformance.go,
    ]
    summary: Reusable Memory fake and provider conformance suite.
    limitations: Covers the provider contract rather than complete user journeys.

  - id: A05
    category: helper
    name: Package-local fakes, stubs, recorders, and trace helpers
    automation: automated
    entrypoints: [mise run test]
    evidence_paths: [
      test/system/fake_anthropic_test.go,
      internal/observability/tracehook/tracehook_test.go,
    ]
    summary: Purpose-built protocol recording, fake providers, filesystem, subprocess, and trace assertions.
    limitations: There is no single cross-package mock or fixture framework.

  - id: A06
    category: harness
    name: Subprocess System Test Harness
    automation: automated
    entrypoints: [mise run system-test]
    evidence_paths: [test/system/system_test.go, test/system/harness_test.go]
    summary: Runs the real built or extracted-candidate stellad binary over TCP while that process owns embedded PostgreSQL, with a scripted fake Anthropic provider.
    limitations: Seven ordered journeys cover selected process seams and restart persistence, but no browser.

  - id: A07
    category: harness
    name: Docker Sandbox Contract Test
    automation: conditional
    entrypoints: [go test ./plugins/sandbox/docker/...]
    evidence_paths: [plugins/sandbox/docker/contract_test.go]
    summary: Exercises container lifecycle and execution through the project Docker client against a real daemon.
    limitations: Skips when Docker is unavailable and has no release platform result matrix.

  - id: A08
    category: orchestration
    name: mise task runner
    automation: automated
    entrypoints: [mise tasks]
    evidence_paths: [mise.toml]
    summary: Provides the repository test, system-test, build, and release command entrypoints.
    limitations: Task existence is orchestration evidence, not product behavior evidence.

  - id: A09
    category: quality-gate
    name: Go coverage and race detector
    automation: automated
    entrypoints: [mise run test:coverage, mise run test:coverage:race]
    evidence_paths: [mise.toml, .github/workflows/lint-and-test.yml]
    summary: Measures Go line coverage and detects data races in ordinary CI.
    limitations: Line coverage cannot substitute for Capability and Scenario coverage.

  - id: A10
    category: quality-gate
    name: Generate, format, migration, package, and chart checks
    automation: automated
    entrypoints: [
      mise run generate:check,
      mise run format,
      mise run release:check,
      mise run release:snapshot,
      mise run deploy:helm:check,
    ]
    evidence_paths: [mise.toml, .pre-commit-config.yaml, deploy/helm/check.sh]
    summary: Validates generated output, formatting, lint, migrations, archives, and Helm rendering.
    limitations: These gates generally do not prove runtime product behavior.

  - id: A11
    category: execution
    name: GitHub Actions
    automation: automated
    entrypoints: [lint-and-test workflow, release workflow]
    evidence_paths: [
      .github/workflows/lint-and-test.yml,
      .github/workflows/release.yml,
    ]
    summary: Runs ordinary generate, format, race, and build jobs, while the Tag workflow owns the separate Release Full Test and Promotion boundary.
    limitations: Ordinary CI intentionally excludes the release-only System, Browser, Contract, Live, Manual, and Promotion gates.

  - id: A12
    category: harness
    name: Playwright Browser release suite
    automation: automated
    entrypoints: [mise run browser-test]
    evidence_paths: [
      web/playwright.config.ts,
      web/e2e/release.spec.ts,
      test/release/cmd/browser,
      .github/workflows/release.yml,
      web/content/docs/development/rules/web-ui-test.md,
    ]
    summary: Runs 17 deterministic Browser E2E journeys against the exact Linux amd64 candidate and emits 18 Scenario Results, traces, screenshots, logs, and redacted network summaries.
    limitations: Covers the release Browser journeys recorded below according to each Scenario's release policy; it does not replace finer-grained Integration or System evidence.

  - id: A13
    category: exploratory
    name: curl and database API runbook
    automation: manual
    entrypoints: [curl, psql]
    evidence_paths: [web/content/docs/development/rules/api-test.md]
    summary: Drives a running stellad through HTTP and inspects PostgreSQL invariants.
    limitations: No shared fixture, result format, cleanup runner, or release invocation.

  - id: A14
    category: harness
    name: Reflect tagged model evaluation tests
    automation: manual
    entrypoints: [go test -tags reflecteval]
    evidence_paths: [
      internal/reflect/candidate_eval_manual_test.go,
      internal/reflect/reconciliation_eval_manual_test.go,
    ]
    summary: Runs opt-in real-model evaluation cases and writes diagnostic reports under dist.
    limitations: Requires an explicit environment flag and provider access; it is not part of a unified release runner.

  - id: A15
    category: orchestration
    name: Release Full Test result and Promotion gate
    automation: automated
    entrypoints: [
      mise run release:aggregate,
      mise run release:candidate:create,
      mise run release:candidate:verify,
      mise run release:core,
      mise run release:live,
      mise run release:manual,
      release workflow,
    ]
    evidence_paths: [
      test/release,
      test/live,
      test/manual,
      test/capabilities/aggregate.go,
      .github/workflows/release.yml,
    ]
    summary: Binds every Scenario outcome, diagnostic artifact, candidate file hash, Docker digest, automatic result, Manual decision, and waiver to one release Run before Promotion.
    limitations: Pending Live adapters and company-owned external resources remain explicit Not Run results until they are implemented and configured.

capabilities:
  - id: C01
    class: core
    name: runtime-storage
    title: Runtime and storage
    description: Start stellad, initialize or connect PostgreSQL, migrate, report readiness and version, and shut down safely.
    surfaces:
      openapi: [getStatus]
      web_routes: [/settings/about]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C01-S01
        name: boot-migrate-ready-drain
        layer: system
        status: covered
        release_policy: blocking
        summary: The release binary migrates its database, becomes ready, drains in-flight work, and exits cleanly.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: readiness
            direct: true
            proves: Real binary startup, migration, TCP readiness, and process ownership.
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: graceful_drain
            direct: true
            proves: Readiness transition, in-flight completion, and zero exit on SIGTERM.
        gap: ""
      - id: C01-S02
        name: restart-and-external-postgres
        layer: system
        status: covered
        release_policy: blocking
        summary: Data and migrations remain correct across restart and when using supported external PostgreSQL.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: embedded_restart
            direct: true
            proves: The exact candidate restarts against the same embedded PostgreSQL data, preserves its authenticated session, and retains migrations.
          - kind: go_test
            path: test/release/cmd/platform/platform_release_test.go
            test: TestReleaseDockerCandidate
            direct: true
            proves: The exact candidate image digest starts against a fresh network-reachable Stella PostgreSQL Runtime and passes migration and readiness probes.
        gap: ""

  - id: C02
    class: core
    name: local-authentication
    title: Local authentication
    description: Register the first user, log in and out, inspect the current user and sessions, revoke sessions, and change password.
    surfaces:
      openapi: [
        logout,
        loginLocal,
        registerLocal,
        getMe,
        listAuthSessions,
        deleteAuthSession,
        listAuthProviders,
        changePassword,
      ]
      web_routes: [/login, /signup, /profile, /settings/account]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C02-S01
        name: registration-login-session-revocation
        layer: system
        status: covered
        release_policy: blocking
        summary: A user registers, authenticates over real HTTP, uses a session, and loses access after revocation or logout.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: startup_and_auth
            direct: true
            proves: Registration, cookie authentication, PAT revocation, logout denial with the old cookie, and successful re-login through the real process.
          - kind: go_test
            path: internal/server/auth_test.go
            test: TestLogout
            direct: true
            proves: Logout returns success and clears the session cookie response.
        gap: ""
      - id: C02-S02
        name: browser-login-and-logout
        layer: browser
        status: covered
        release_policy: blocking
        summary: The Web UI presents registration and login errors, establishes a session, and visibly logs out.
        evidence:
          - kind: browser_test
            path: web/e2e/release.spec.ts
            test: "[C02-S02] authenticate through the browser"
            direct: true
            proves: Playwright exercises registration validation, successful registration, failed and successful login, session establishment, and logout through the real candidate UI.
        gap: ""

  - id: C03
    class: core
    name: users-and-authorization
    title: Users and authorization
    description: Administer users, roles, activation, agent access, default agents, identities, and notification routing with fail-closed authorization.
    surfaces:
      openapi:
        - updateUserDefaultAgent
        - updateUserNotifyIdentity
        - listAuthUsers
        - getAuthUser
        - updateAuthUserRole
        - listAuthUserAgents
        - updateAuthUserAgents
        - listAuthUserLoginIdentities
        - linkAuthUserLoginIdentity
        - listAuthUserChannelIdentities
        - deleteAuthUserIdentity
        - updateAuthUserActive
      web_routes: [/settings/users, /settings/users/$userId]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C03-S01
        name: admin-user-and-role-management
        layer: integration
        status: covered
        release_policy: blocking
        summary: Admin operations enforce role, activation, identity, and agent-assignment boundaries in PostgreSQL-backed handlers.
        evidence:
          - kind: go_test
            path: internal/server/auth_users_test.go
            direct: true
            proves: User administration endpoints, identity visibility, and error handling.
          - kind: go_test
            path: internal/authz/authority_test.go
            direct: true
            proves: Core authorization decisions fail closed across roles.
        gap: ""
      - id: C03-S02
        name: browser-user-administration
        layer: browser
        status: covered
        release_policy: nonblocking
        summary: An administrator manages a user while a normal user cannot see or invoke privileged controls.
        evidence:
          - kind: browser_test
            path: web/e2e/release.spec.ts
            test: "[C03-S02] administer a user while privileged controls fail closed"
            direct: true
            proves: Playwright promotes, demotes, deactivates, and restores a user, then proves a normal user receives a fail-closed 403 and no privileged controls.
        gap: ""

  - id: C04
    class: core
    name: tokens-and-oauth-clients
    title: Personal access tokens and OAuth clients
    description: Discover scopes, create and revoke personal tokens, manage OAuth clients and secrets, and revoke authorized applications.
    surfaces:
      openapi:
        - listPersonalAccessTokens
        - createPersonalAccessToken
        - getPersonalAccessToken
        - revokePersonalAccessToken
        - listTokenScopes
        - listOAuthClients
        - createOAuthClient
        - disableOAuthClient
        - rotateOAuthClientSecret
        - listOAuthClientScopes
        - listAuthorizedApps
        - revokeAuthorizedApp
      web_routes: []
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C04-S01
        name: pat-lifecycle-and-scope
        layer: system
        status: covered
        release_policy: blocking
        summary: A scoped PAT authenticates a permitted route and stops authenticating after revocation.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: startup_and_auth
            direct: true
            proves: PAT creation, bearer use, scope reachability, and revocation through real HTTP.
          - kind: go_test
            path: internal/server/pat_integration_test.go
            direct: true
            proves: PostgreSQL-backed PAT endpoint behavior and secret handling.
        gap: ""
      - id: C04-S02
        name: oauth-client-management
        layer: integration
        status: covered
        release_policy: blocking
        summary: OAuth clients can be created, disabled, rotated, scoped, listed, and revoked without exposing stored secrets.
        evidence:
          - kind: go_test
            path: internal/server/oauth_pat_e2e_test.go
            test: TestOAuthClientManagementSmoke_E2E
            direct: true
            proves: OAuth client management through the in-process HTTP stack and real database.
        gap: ""

  - id: C05
    class: core
    name: agent-management
    title: Agent management
    description: Create, update, delete, assign, and inspect agents, their user access, visible tools, and tool overrides.
    surfaces:
      openapi: [
        listAgents,
        createAgent,
        getAgent,
        updateAgent,
        deleteAgent,
        listAgentUsers,
        assignAgentUser,
        removeAgentUser,
        listAgentTools,
        updateAgentTool,
      ]
      web_routes: [
        /,
        /agents,
        /agents/,
        /agents/$agentId,
        /agents/$agentId/,
        /settings/agents,
        /settings/agents/$agentId,
        /settings/agents/$agentId/$tab,
      ]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C05-S01
        name: agent-crud-access-and-tools
        layer: integration
        status: covered
        release_policy: blocking
        summary: Agent CRUD, user grants, ownership, tool visibility, and overrides enforce authorization and persistence.
        evidence:
          - kind: go_test
            path: internal/server/agents_test.go
            direct: true
            proves: Agent HTTP CRUD and validation behavior.
          - kind: go_test
            path: internal/server/agent_access_test.go
            direct: true
            proves: Agent-user access boundaries and assignments.
          - kind: go_test
            path: internal/agent/tool_override_test.go
            direct: true
            proves: Tool override behavior in the agent runtime.
        gap: ""
      - id: C05-S02
        name: browser-agent-management
        layer: browser
        status: covered
        release_policy: blocking
        summary: An administrator creates and edits a restricted agent, assigns a user, and the assigned user sees only role-allowed actions.
        evidence:
          - kind: browser_test
            path: web/e2e/release.spec.ts
            test: "[C05-S02] manage an agent and its user permissions"
            direct: true
            proves: Playwright creates and edits a restricted agent, assigns a regular user, and proves the assigned user cannot update it or open the administrator-only Users tab.
        gap: ""

  - id: C06
    class: core
    name: provider-model-control-plane
    title: Provider and model control plane
    description: Manage provider configuration and types, discover models, fetch remote model catalogs, and maintain the model cache.
    surfaces:
      openapi: [
        listProviders,
        createProvider,
        getProvider,
        updateProvider,
        deleteProvider,
        listProviderModels,
        fetchProviderModels,
        listProviderTypes,
        listModels,
      ]
      web_routes: [/settings/providers, /settings/providers/$providerId]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C06-S01
        name: provider-crud-and-model-cache
        layer: integration
        status: covered
        release_policy: blocking
        summary: Provider configuration and cached models remain admin-scoped and refreshable through their complete API lifecycle.
        evidence:
          - kind: go_test
            path: internal/server/server_test.go
            test: TestProviderAPILifecycleAndAdminScope
            direct: true
            proves: Provider create/get/update/model-list/delete endpoints preserve configuration, enforce admin scope, and remove the deleted provider.
          - kind: go_test
            path: internal/controlplane/authorized_test.go
            direct: true
            proves: Authorized provider and model control-plane service behavior.
          - kind: go_test
            path: internal/server/models_test.go
            direct: true
            proves: Model listing and per-provider cache replacement behavior.
        gap: ""
      - id: C06-S02
        name: browser-provider-management
        layer: browser
        status: covered
        release_policy: blocking
        summary: An administrator configures a provider, observes model discovery and validation errors, and sees its API key masked in the Web UI.
        evidence:
          - kind: browser_test
            path: web/e2e/release.spec.ts
            test: "[C06-S02] configure a provider and mask its secret"
            direct: true
            proves: Playwright covers provider creation, failed and successful model discovery, enable and save, password-field masking without visible secret text, and deletion.
        gap: ""

  - id: C07
    class: core
    name: sessions-and-chat
    title: Sessions and chat
    description: Manage sessions, multimodal message history, SSE chat and event streams, visible run failures, context, summaries, and system prompts.
    surfaces:
      openapi: [
        listSessions,
        createSession,
        getSession,
        updateSession,
        deleteSession,
        getSessionMessages,
        sendSessionMessage,
        streamSessionEvents,
        getSessionContextItems,
        getSessionSummary,
        getSessionSystemPrompt,
      ]
      web_routes: [/sessions, /sessions/$, /agents/$agentId/sessions/$sessionId]
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C07-S01
        name: session-crud-and-history
        layer: integration
        status: covered
        release_policy: blocking
        summary: Session CRUD, visibility, message history, context, summary, and prompt endpoints enforce scope and persistence.
        evidence:
          - kind: go_test
            path: internal/server/sessions_api_test.go
            test: TestSessionAPILifecycle
            direct: true
            proves: Session create/get/update/list/archive and archived-state persistence through separate HTTP requests.
          - kind: go_test
            path: internal/server/sessions_api_test.go
            test: TestListSessionsHidesInternalKindsByDefault
            direct: true
            proves: Session listing visibility and kind filtering through HTTP handlers.
          - kind: go_test
            path: internal/server/context_items_test.go
            test: TestSessionContextItemsAndSummaryEndpoints
            direct: true
            proves: Message history, context item, and summary HTTP responses.
          - kind: go_test
            path: internal/server/context_items_test.go
            test: TestSessionContextItemsTenantIsolation
            direct: true
            proves: Context and summary endpoints reject cross-user access.
          - kind: go_test
            path: internal/server/skills_scoped_test.go
            test: TestSessionSystemPromptAdvertisesSkillSearch
            direct: true
            proves: The system-prompt endpoint renders skill discovery instructions for a persisted session.
        gap: ""
      - id: C07-S02
        name: real-sse-chat-and-provider-error
        layer: system
        status: covered
        release_policy: blocking
        summary: A real client receives streamed chat content, terminal frames, and provider errors without hanging.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: chat_sse
            direct: true
            proves: Real HTTP and SSE chat completion through the release binary.
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            subtest: chat_provider_error
            direct: true
            proves: Provider failure is delivered in-band and the stream terminates.
        gap: ""
      - id: C07-S03
        name: browser-chat-journey
        layer: browser
        status: covered
        release_policy: blocking
        summary: A user creates a session, sees streaming output and persisted history, sees a provider failure in the transcript, and recovers on the next turn.
        evidence:
          - kind: browser_test
            path: web/e2e/release.spec.ts
            test: "[C07-S03] stream and restore a chat session"
            direct: true
            proves: Playwright creates a new thread, observes a deliberately gated partial SSE reply, reloads persisted messages, surfaces a controlled provider failure, and proves the next successful turn clears the error.
        gap: ""

  - id: C08
