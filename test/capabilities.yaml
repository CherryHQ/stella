        name: release-artifact-deployment-smoke
        layer: package
        status: covered
        release_policy: blocking
        summary: The exact Linux amd64 candidate completes binary, Docker, and Helm deployment checks; Linux arm64 completes the deterministic System suite and Docker Smoke; Docker and Helm use a temporary networked PostgreSQL started from the pinned Stella PG Runtime.
        evidence:
          - kind: system_test
            path: test/system/system_test.go
            test: TestSystem
            direct: true
            proves: The exact extracted native candidate owns embedded PostgreSQL, migrates, serves API journeys, preserves state across restart, and shuts down without a process-group leak.
          - kind: system_test
            path: test/release/cmd/platform/platform_release_test.go
            test: TestReleaseDockerCandidate
            direct: true
            proves: Each native Linux runner starts the exact candidate image digest against a fresh networked Stella PG Runtime, checks readiness, identity, migration, clean exit, and resource cleanup.
          - kind: system_test
            path: test/release/cmd/platform/platform_release_test.go
            test: TestReleaseHelmCandidate
            direct: true
