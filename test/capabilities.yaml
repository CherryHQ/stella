      system_skills: []
    scenarios:
      - id: C23-S01
        name: asset-authority-selection-and-configuration
        layer: integration
        status: covered
        release_policy: blocking
        summary: Absent S3 configuration selects local durability, complete configuration selects an injected shared authority, and partial configuration fails closed.
        evidence:
          - kind: go_test
            path: internal/blob/fs_test.go
            test: TestNewStoreFromConfig
            direct: true
            proves: Empty configuration selects no remote store, partial configuration fails, and complete configuration constructs the S3 adapter.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestNewStoreSelectsConfiguredAuthority
            direct: true
            proves: Asset storage reports local authority without an injected store and shared authority with one.
          - kind: go_test
            path: internal/blob/default_boundary_test.go
            test: TestNoBlobProcessGlobal
            direct: true
            proves: Only the asset boundary may own the injected object store; transports cannot use a process-global blob client.
        gap: ""
      - id: C23-S02
        name: durable-asset-mutation-and-rollback
        layer: integration
        status: covered
        release_policy: blocking
        summary: Asset create, write, move, and delete operations persist before destructive local changes and roll back safely when the shared authority fails.
        evidence:
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestCreateFileDurableAndRollsBack
            direct: true
            proves: Durable create either reaches the shared authority or removes the local orphan.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestMoveDirectoryPartialPutLeavesSourceIntact
            direct: true
            proves: Partial shared-authority failure cannot destroy the source directory.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestRemoveFileAuthorityFailureLeavesLocalIntact
            direct: true
            proves: Failed remote deletion leaves the readable local source intact.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestWriteFileCannotFollowSymlinkIntoAnotherPrincipal
            direct: true
            proves: Asset writes reject symlink traversal into another principal.
        gap: ""
      - id: C23-S03
        name: asset-restore-hydration-and-materialization
        layer: integration
        status: covered
        release_policy: blocking
        summary: A cold instance restores missing assets from shared authority while preserving valid concurrent local writes and rejecting traversal keys.
        evidence:
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestCrossInstanceMaterialization
            direct: true
            proves: A second instance restores missing local content from the shared authority.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestRestoreDoesNotReplaceConcurrentLocalWrite
            direct: true
            proves: Restore cannot overwrite a newer local write.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestHydrateUserLocalWinsAndSingleFlight
            direct: true
            proves: Per-user hydration is single-flight and valid local content wins.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestHydrateSkipsTraversalKey
            direct: true
            proves: Hydration ignores shared-authority keys that escape the user asset root.
        gap: ""
      - id: C23-S04
        name: immutable-session-media-integrity
        layer: integration
        status: covered
        release_policy: blocking
        summary: Session media uses immutable digest-addressed keys outside mutable workspaces and rejects byte or size mismatches.
        evidence:
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestSessionMediaRejectsIntegrityMismatch
            direct: true
            proves: Immutable session media rejects digest and size mismatches.
          - kind: go_test
            path: internal/asset/store_test.go
            test: TestSessionMediaKeyIsOutsideSandboxAndWorkspaceRoots
            direct: true
            proves: Session media keys cannot alias mutable workspace or user asset paths.
        gap: ""
      - id: C23-S05
        name: s3-object-store-contract
        layer: contract
        status: missing
