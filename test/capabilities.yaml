            test: TestBuildAndVerifyCandidateManifest
            direct: true
            proves: The candidate gate requires all six archives, four Linux packages, checksum, Homebrew formula, and both Linux image digests to retain their recorded identity before Promotion.
          - kind: system_test
            path: test/release/cmd/platform/platform_release_test.go
            test: TestReleaseArchiveMatrix
            direct: true
            proves: All six real candidate archives match the checksum file, contain the documented files, and carry an executable whose ELF, Mach-O, or PE header matches the advertised OS and architecture.
