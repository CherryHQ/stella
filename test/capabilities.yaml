      web_routes: []
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C08-S01
        name: workspace-file-lifecycle-and-isolation
        layer: integration
        status: partial
        release_policy: blocking
        summary: Workspace paths and file mutations stay within the authorized session and survive expected reads.
        evidence:
          - kind: go_test
            path: internal/agent/workspace_test.go
            direct: true
            proves: Workspace setup, shared-user layout, and isolation rules.
          - kind: go_test
            path: internal/server/sessions_blob_test.go
            direct: true
            proves: Session blob and upload behavior through server handlers.
        gap: No single API lifecycle test covers create, content update, move, upload, delete, traversal rejection, and quota reporting.

  - id: C09
    class: core
    name: projects
    title: Projects
    description: Manage projects and project-scoped sessions, tasks, skills, and memories with ownership and path isolation.
    surfaces:
      openapi: [
        listProjects,
        createProject,
        getProject,
        updateProject,
        deleteProject,
      ]
      web_routes:
        - /agents/$agentId/projects/$projectId/
        - /agents/$agentId/projects/$projectId/memories
        - /agents/$agentId/projects/$projectId/sessions/$sessionId
        - /agents/$agentId/projects/$projectId/skills/
        - /agents/$agentId/projects/$projectId/tasks
      cli_commands: []
      plugins: []
      system_skills: []
    scenarios:
      - id: C09-S01
        name: project-crud-scope-and-path-safety
        layer: integration
        status: partial
        release_policy: blocking
        summary: Projects enforce owner and agent access while resolving safe project directories and scoped resources.
        evidence:
          - kind: go_test
            path: internal/agent/project_store_test.go
            test: TestProjectStoreCRUDOwnershipAndTraversal
            direct: true
            proves: Project persistence, ownership, and traversal protection.
          - kind: go_test
            path: internal/agent/project_test.go
            direct: true
            proves: Project directory validation and symlink escape rejection.
        gap: Existing evidence does not cover the complete HTTP CRUD lifecycle and all project-scoped child resources together.

  - id: C10
    class: core
    name: goals-and-tasks
    title: Goals and tasks
    description: Create and control goals, attempts, dependencies, plans, acceptance evidence, verdicts, health, and autonomous task execution.
    surfaces:
      openapi:
        - listGoals
