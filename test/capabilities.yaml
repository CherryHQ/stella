  - id: C23
    class: core
    name: durable-assets
    title: Durable assets
    description: Persist user files and immutable session media through a local authority or injected object store with rollback, materialization, hydration, integrity, and path isolation.
    surfaces:
      openapi: []
      web_routes: []
      cli_commands: []
