[project]
name = "stella-harbor"
version = "0.0.1"
description = "Stella evaluation adapter for the Harbor framework (issue #1054 spike)."
requires-python = ">=3.12"
dependencies = ["harbor>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stella_harbor"]
