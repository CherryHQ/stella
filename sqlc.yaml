version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/*.sql"
    # Migrations are the single source of truth for the schema (Atlas/declarative
    # schemas were dropped). sqlc reads the goose migrations and applies only the
    # `-- +goose Up` sections to build its catalog.
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "pkg/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          # JSONB columns map to json.RawMessage (raw, ready to (un)marshal),
          # never a plain string that callers must cast at every boundary.
          # All JSONB columns are NOT NULL; genuinely-nullable JSON payloads stay
          # TEXT and surface as pgtype.Text.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # UUID id/FK columns are native PG uuid, but stay Go `string` end to end:
          # the app mints uuidv7 strings and compares them as strings, so callers
          # never juggle uuid.UUID/[16]byte. The pgx pool registers the uuid OID
          # with a text codec (see OpenDB) so `string` scans/encodes on the wire.
          - db_type: "uuid"
            go_type: "string"
          # Nullable uuid FKs ride the same text codec; pgtype.Text keeps the
          # {String, Valid} shape callers already use.
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"
          # NOT NULL timestamps stay time.Time (pgx scans timestamptz into it
          # natively). The pgx driver would otherwise default every created_at/
          # updated_at to pgtype.Timestamptz; only genuinely-nullable timestamps
          # surface as pgtype.Timestamptz (same {Time, Valid} shape as the old
          # sql.NullTime).
          - db_type: "timestamptz"
            go_type: "time.Time"
          # pgvector embedding columns (sidecar *_embedding tables). Maps to the
          # pgvector-go Vector type so the generated models carry real vectors;
          # the embedding/backfill follow-up registers the codec on the pool.
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              type: "Vector"
