name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: cherryhq/stella

jobs:
  candidate-binaries:
    name: Build candidate archives
    runs-on: ubuntu-24.04

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: candidate-goreleaser-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # GoReleaser creates archives, packages, checksums, and the formula once.
      # Publishing is deliberately deferred to the sole Promotion job.
      - name: Build GoReleaser candidates without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish

      - name: Upload immutable GoReleaser candidates
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: candidate-goreleaser-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
            dist/artifacts.json
            dist/metadata.json
            dist/homebrew/Formula/stella.rb
          if-no-files-found: error
          retention-days: 14

  candidate-docker:
    name: Build candidate image (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest stores an addressable candidate without creating a
      # release, latest, or SHA tag before the gate passes.
      - name: Build and push untagged candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export candidate digest
        run: |
          set -euo pipefail
          mkdir -p docker-digests
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'docker-digests/linux-${{ matrix.suffix }}.digest'

      - name: Upload candidate digest
        uses: actions/upload-artifact@v5
        with:
          name: candidate-digest-${{ matrix.suffix }}-${{ github.sha }}
          path: docker-digests/*.digest
          if-no-files-found: error
          retention-days: 14

  candidate-index:
    name: Verify candidate identity
    runs-on: ubuntu-24.04
    needs: [candidate-binaries, candidate-docker]

    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: candidate-index-${{ github.sha }}
      binaries-artifact-id: ${{ needs.candidate-binaries.outputs.artifact-id }}
      binaries-artifact-name: ${{ needs.candidate-binaries.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.candidate-binaries.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/candidate-goreleaser.zip
          unzip -q /tmp/candidate-goreleaser.zip -d dist

      - name: Download Docker candidate digests
        uses: actions/download-artifact@v5
        with:
          pattern: candidate-digest-*-${{ github.sha }}
          path: docker-digests
          merge-multiple: true

      - name: Create candidate manifest
        env:
          STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
          STELLA_RELEASE_VERSION: ${{ github.ref_name }}
          STELLA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mise exec -- go run ./test/release/cmd/candidate \
            --mode=create \
            --artifact-name='${{ needs.candidate-binaries.outputs.artifact-name }}' \
            --artifact-id='${{ needs.candidate-binaries.outputs.artifact-id }}'

      - name: Verify candidate file identity
        env:
          STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
          STELLA_RELEASE_VERSION: ${{ github.ref_name }}
          STELLA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mise exec -- go run ./test/release/cmd/candidate \
            --mode=verify \
            --artifact-name='${{ needs.candidate-binaries.outputs.artifact-name }}' \
            --artifact-id='${{ needs.candidate-binaries.outputs.artifact-id }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate image digests exist
        env:
          CANDIDATE_MANIFEST: dist/test-results/release/${{ github.run_id }}/candidate.json
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image"
          done < <(jq -r '.images[] | .name + "@" + .digest' "$CANDIDATE_MANIFEST")

      - name: Upload immutable candidate index
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: candidate-index-${{ github.sha }}
          path: dist/test-results/release/${{ github.run_id }}/candidate.json
          if-no-files-found: error
          retention-days: 14

  # Steps 4-9 add their blocking jobs before this job. Promotion remains the
  # only job allowed to create formal release assets or image tags.
  promotion:
    name: Promote tested candidate
    runs-on: ubuntu-24.04
    needs: [candidate-index]

    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested candidates by immutable Artifact IDs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARIES_ARTIFACT_ID: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          INDEX_ARTIFACT_ID: ${{ needs.candidate-index.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p dist "dist/test-results/release/$GITHUB_RUN_ID"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$BINARIES_ARTIFACT_ID/zip" \
            -o /tmp/candidate-goreleaser.zip
          unzip -q /tmp/candidate-goreleaser.zip -d dist
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$INDEX_ARTIFACT_ID/zip" \
            -o /tmp/candidate-index.zip
          unzip -q /tmp/candidate-index.zip -d "dist/test-results/release/$GITHUB_RUN_ID"

      - name: Re-verify candidate before Promotion
        env:
          STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
          STELLA_RELEASE_VERSION: ${{ github.ref_name }}
          STELLA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mise exec -- go run ./test/release/cmd/candidate \
            --mode=verify \
            --artifact-name='${{ needs.candidate-index.outputs.binaries-artifact-name }}' \
            --artifact-id='${{ needs.candidate-index.outputs.binaries-artifact-id }}'

      - name: Create or refresh draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_MANIFEST: dist/test-results/release/${{ github.run_id }}/candidate.json
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            jq -r '.files[] | select(.kind == "archive" or .kind == "linux_package" or .kind == "checksum") | .path' \
              "$CANDIDATE_MANIFEST"
          )
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/release-draft; then
            if [ "$(cat /tmp/release-draft)" != "true" ]; then
              echo "release $GITHUB_REF_NAME is already published; refusing to replace it" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            args=(--draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${args[@]}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract formal Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=long
            type=semver,pattern={{raw}}

      - name: Promote the tested Docker digests
        env:
          CANDIDATE_MANIFEST: dist/test-results/release/${{ github.run_id }}/candidate.json
        run: |
          set -euo pipefail
          mapfile -t images < <(jq -r '.images[] | .name + "@" + .digest' "$CANDIDATE_MANIFEST")
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
          docker buildx imagetools inspect '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}'

      - name: Checkout Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v5
        with:
          repository: CherryHQ/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Promote tested Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          cp dist/homebrew/Formula/stella.rb homebrew-tap/Formula/stella.rb
          cd homebrew-tap
          git config user.name goreleaserbot
          git config user.email bot@goreleaser.com
          git add Formula/stella.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already matches the candidate"
          else
            git commit -m "Brew formula update for stella version $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=true
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
          fi
