      STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON: ${{ secrets.STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON }}
      STELLA_LIVE_EMAIL_CONFIG_JSON: ${{ secrets.STELLA_LIVE_EMAIL_CONFIG_JSON }}
      STELLA_LIVE_EMBEDDING_TARGET_JSON: ${{ secrets.STELLA_LIVE_EMBEDDING_TARGET_JSON }}
      STELLA_LIVE_FEISHU_CONFIG_JSON: ${{ secrets.STELLA_LIVE_FEISHU_CONFIG_JSON }}
      STELLA_LIVE_MARKETPLACE_CONFIG_JSON: ${{ secrets.STELLA_LIVE_MARKETPLACE_CONFIG_JSON }}
      STELLA_LIVE_PROVIDER_TARGETS_JSON: ${{ secrets.STELLA_LIVE_PROVIDER_TARGETS_JSON }}
      STELLA_LIVE_QQ_CONFIG_JSON: ${{ secrets.STELLA_LIVE_QQ_CONFIG_JSON }}
      STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON: ${{ secrets.STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON }}
      STELLA_LIVE_TELEGRAM_CONFIG_JSON: ${{ secrets.STELLA_LIVE_TELEGRAM_CONFIG_JSON }}
      STELLA_LIVE_FEED_URL: ${{ vars.STELLA_LIVE_FEED_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pinned Stella PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: ~/.stella/pg-runtime
          key: stella-pg-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/pgruntime/runtime.go') }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          path: dist

      - name: Download candidate index by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Re-verify and extract exact Linux amd64 candidate
        run: |
          mise exec -- go run ./test/release/cmd/candidate --mode=verify
          mise exec -- go run ./test/release/cmd/platform \
            --mode=extract \
            --platform=linux/amd64 \
            --output=dist/candidate/stellad
          mise run pg:runtime:download

      - name: Run all registered Live targets
        env:
          STELLA_SYSTEM_BINARY: ${{ github.workspace }}/dist/candidate/stellad
        run: mise run release:live

      - name: Upload Live Results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-live-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            dist/test-results/release/${{ github.run_id }}/results
            dist/test-results/release/${{ github.run_id }}/artifacts/live
          if-no-files-found: warn
          retention-days: 14

  automatic-summary:
    name: Consolidate automatic Release Results
    if: ${{ always() && needs.candidate-index.result == 'success' }}
    runs-on: ubuntu-24.04
    needs:
      - candidate-index
      - platform-results
      - browser-e2e
      - contract-tests
      - core-results
      - live-results
    environment: release-test

    permissions:
      actions: read
      contents: read

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}
      STELLA_RELEASE_SECRET_ENVS: STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON,STELLA_LIVE_EMAIL_CONFIG_JSON,STELLA_LIVE_EMBEDDING_TARGET_JSON,STELLA_LIVE_FEISHU_CONFIG_JSON,STELLA_LIVE_MARKETPLACE_CONFIG_JSON,STELLA_LIVE_PROVIDER_TARGETS_JSON,STELLA_LIVE_QQ_CONFIG_JSON,STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON,STELLA_LIVE_TELEGRAM_CONFIG_JSON
      STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON: ${{ secrets.STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON }}
      STELLA_LIVE_EMAIL_CONFIG_JSON: ${{ secrets.STELLA_LIVE_EMAIL_CONFIG_JSON }}
      STELLA_LIVE_EMBEDDING_TARGET_JSON: ${{ secrets.STELLA_LIVE_EMBEDDING_TARGET_JSON }}
      STELLA_LIVE_FEISHU_CONFIG_JSON: ${{ secrets.STELLA_LIVE_FEISHU_CONFIG_JSON }}
      STELLA_LIVE_MARKETPLACE_CONFIG_JSON: ${{ secrets.STELLA_LIVE_MARKETPLACE_CONFIG_JSON }}
      STELLA_LIVE_PROVIDER_TARGETS_JSON: ${{ secrets.STELLA_LIVE_PROVIDER_TARGETS_JSON }}
      STELLA_LIVE_QQ_CONFIG_JSON: ${{ secrets.STELLA_LIVE_QQ_CONFIG_JSON }}
      STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON: ${{ secrets.STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON }}
      STELLA_LIVE_TELEGRAM_CONFIG_JSON: ${{ secrets.STELLA_LIVE_TELEGRAM_CONFIG_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download consolidated Platform Results
        uses: actions/download-artifact@v5
        with:
          pattern: release-platform-results-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}
          merge-multiple: true

      - name: Download Browser Results
        uses: actions/download-artifact@v5
        with:
          pattern: release-browser-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}
          merge-multiple: true

      - name: Download Contract Results
        uses: actions/download-artifact@v5
        with:
          pattern: release-contract-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}
          merge-multiple: true

      - name: Download Core Results
        uses: actions/download-artifact@v5
        with:
          pattern: release-core-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}
          merge-multiple: true

      - name: Download Live Results
        uses: actions/download-artifact@v5
        with:
          pattern: release-live-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}
          merge-multiple: true

      - name: Scan and summarize automatic results
        run: |
          mise exec -- go run -tags capability \
            ./test/capabilities/cmd/aggregate \
            --report-only

      - name: Stop before Manual Gate on non-waivable automatic failures
        run: |
          # Manual review may waive an external block or an intentional Not Run,
          # but it must never hide a Product Failure or a crashed result producer.
          jq --exit-status '
            [
              .scenarios[]
              | select(
                  .status == "product_failure"
                  or (
                    .status == "missing_result"
                    and .release_policy != "manual"
                  )
                )
            ]
            | length == 0
          ' "dist/test-results/release/${{ github.run_id }}/release.json"

      - name: Upload automatic summary for the Manual Gate
        if: ${{ always() }}
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: release-automatic-summary-${{ github.sha }}-a${{ github.run_attempt }}
          path: dist/test-results/release/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

  manual-gate:
    name: Concentrated Manual Release Gate
    if: ${{ always() && needs.automatic-summary.result == 'success' }}
    runs-on: ubuntu-24.04
    needs:
      - candidate-index
      - automatic-summary
    # Configure mentor as the required reviewer for this Environment. This is
    # the only human wait in the Release Full Test workflow.
    environment: release-approval

    permissions:
      actions: read
      contents: read

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}
      STELLA_MANUAL_COMMIT: ${{ vars.STELLA_MANUAL_COMMIT }}
      STELLA_MANUAL_APPROVER: ${{ vars.STELLA_MANUAL_APPROVER }}
      STELLA_MANUAL_X06_S02_STATUS: ${{ vars.STELLA_MANUAL_X06_S02_STATUS }}
      STELLA_MANUAL_X06_S02_ORIGINAL_STATUS: ${{ vars.STELLA_MANUAL_X06_S02_ORIGINAL_STATUS }}
      STELLA_MANUAL_X06_S02_REASON: ${{ vars.STELLA_MANUAL_X06_S02_REASON }}
      STELLA_MANUAL_X06_S02_EVIDENCE: ${{ vars.STELLA_MANUAL_X06_S02_EVIDENCE }}
      STELLA_MANUAL_X13_S02_STATUS: ${{ vars.STELLA_MANUAL_X13_S02_STATUS }}
      STELLA_MANUAL_X13_S02_ORIGINAL_STATUS: ${{ vars.STELLA_MANUAL_X13_S02_ORIGINAL_STATUS }}
      STELLA_MANUAL_X13_S02_REASON: ${{ vars.STELLA_MANUAL_X13_S02_REASON }}
      STELLA_MANUAL_X13_S02_EVIDENCE: ${{ vars.STELLA_MANUAL_X13_S02_EVIDENCE }}
      STELLA_RELEASE_WAIVERS_JSON: ${{ vars.STELLA_RELEASE_WAIVERS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download automatic result summary by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.automatic-summary.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Record Manual results and eligible waivers
        run: mise run release:manual

      - name: Upload complete Manual Gate state
        if: ${{ always() }}
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: release-manual-${{ github.sha }}-a${{ github.run_attempt }}
          path: dist/test-results/release/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Final Release Full Test Gate
    if: >-
      ${{
        always() &&
        needs.candidate-index.result == 'success' &&
        needs.manual-gate.outputs.artifact-id != ''
      }}
    runs-on: ubuntu-24.04
    needs:
      - candidate-index
      - manual-gate
    environment: release-test

    permissions:
      actions: read
      contents: read

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}
      STELLA_RELEASE_SECRET_ENVS: STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON,STELLA_LIVE_EMAIL_CONFIG_JSON,STELLA_LIVE_EMBEDDING_TARGET_JSON,STELLA_LIVE_FEISHU_CONFIG_JSON,STELLA_LIVE_MARKETPLACE_CONFIG_JSON,STELLA_LIVE_PROVIDER_TARGETS_JSON,STELLA_LIVE_QQ_CONFIG_JSON,STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON,STELLA_LIVE_TELEGRAM_CONFIG_JSON
      STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON: ${{ secrets.STELLA_LIVE_CLI_PLUGIN_CONFIG_JSON }}
      STELLA_LIVE_EMAIL_CONFIG_JSON: ${{ secrets.STELLA_LIVE_EMAIL_CONFIG_JSON }}
      STELLA_LIVE_EMBEDDING_TARGET_JSON: ${{ secrets.STELLA_LIVE_EMBEDDING_TARGET_JSON }}
      STELLA_LIVE_FEISHU_CONFIG_JSON: ${{ secrets.STELLA_LIVE_FEISHU_CONFIG_JSON }}
      STELLA_LIVE_MARKETPLACE_CONFIG_JSON: ${{ secrets.STELLA_LIVE_MARKETPLACE_CONFIG_JSON }}
      STELLA_LIVE_PROVIDER_TARGETS_JSON: ${{ secrets.STELLA_LIVE_PROVIDER_TARGETS_JSON }}
      STELLA_LIVE_QQ_CONFIG_JSON: ${{ secrets.STELLA_LIVE_QQ_CONFIG_JSON }}
      STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON: ${{ secrets.STELLA_LIVE_SYSTEM_SKILL_TARGETS_JSON }}
      STELLA_LIVE_TELEGRAM_CONFIG_JSON: ${{ secrets.STELLA_LIVE_TELEGRAM_CONFIG_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download complete Manual Gate state by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.manual-gate.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Scan every artifact and enforce every Scenario policy
        run: mise run release:aggregate

      - name: Upload final Release Full Test report
        if: ${{ always() }}
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: release-gate-${{ github.sha }}-a${{ github.run_attempt }}
          path: dist/test-results/release/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

  promotion:
    name: Promote tested candidate
    runs-on: ubuntu-24.04
    needs:
      - candidate-index
      - release-gate

    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download final Release Full Test report by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.release-gate.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Verify final gate belongs to this candidate
        run: |
          set -euo pipefail
          report='dist/test-results/release/${{ github.run_id }}/release.json'
          test -f "$report"
          grep -Fq '"release_allowed": true' "$report"
          grep -Fq '"commit": "${{ github.sha }}"' "$report"

      - name: Download tested GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          path: dist

      - name: Download tested candidate index by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Re-verify candidate before Promotion
        env:
          STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
          STELLA_RELEASE_VERSION: ${{ github.ref_name }}
          STELLA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mise exec -- go run ./test/release/cmd/candidate \
            --mode=verify \
            --artifact-name='${{ needs.candidate-index.outputs.binaries-artifact-name }}' \
            --artifact-id='${{ needs.candidate-index.outputs.binaries-artifact-id }}'

      - name: Create or refresh draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_MANIFEST: dist/test-results/release/${{ github.run_id }}/candidate.json
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            jq -r '.files[] | select(.kind == "archive" or .kind == "linux_package" or .kind == "checksum") | .path' \
              "$CANDIDATE_MANIFEST"
          )
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/release-draft; then
            if [ "$(cat /tmp/release-draft)" != "true" ]; then
              echo "release $GITHUB_REF_NAME is already published; refusing to replace it" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            args=(--draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${args[@]}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract formal Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=long
            type=semver,pattern={{raw}}

      - name: Promote the tested Docker digests
        env:
          CANDIDATE_MANIFEST: dist/test-results/release/${{ github.run_id }}/candidate.json
        run: |
          set -euo pipefail
          mapfile -t images < <(jq -r '.images[] | .name + "@" + .digest' "$CANDIDATE_MANIFEST")
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
          docker buildx imagetools inspect '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}'

      - name: Checkout Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v5
        with:
          repository: CherryHQ/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Promote tested Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          cp dist/homebrew/Formula/stella.rb homebrew-tap/Formula/stella.rb
          cd homebrew-tap
          git config user.name goreleaserbot
          git config user.email bot@goreleaser.com
          git add Formula/stella.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already matches the candidate"
          else
            git commit -m "Brew formula update for stella version $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=true
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
          fi
