name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cherryhq/stella
  # Optional mirror registry (e.g. Aliyun ACR). Configure the ACR_REGISTRY /
  # ACR_IMAGE_NAME repository variables and ACR_USERNAME / ACR_PASSWORD
  # secrets to enable; the copy steps are skipped when unset.
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_IMAGE_NAME: ${{ vars.ACR_IMAGE_NAME }}

jobs:
  source:
    name: Verify Release Source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify tag identity and release branch
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          event_commit="$(git rev-parse "${EVENT_SHA}^{commit}")"
          tag_commit="$(git rev-parse "${EVENT_REF}^{commit}")"
          test "$head_commit" = "$event_commit"
          test "$head_commit" = "$tag_commit"

          release_branch="$(.github/scripts/verify-release-source.sh "$GITHUB_REF_NAME" "$head_commit")"
          {
            echo "### Validated release source"
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Branch: \`${release_branch}\`"
            echo "- Commit: \`${head_commit}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality and Build
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore toolchain caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: plain

      - name: Generate code and check drift
        run: mise run generate:check

      - name: Test CI and release policy
        run: mise run test:ci-policy

      - name: Check formatting and lint
        run: |
          prek run --all-files
          git status --short
          test -z "$(git status --porcelain)"

      - name: Build
        run: mise run build

  tests:
    name: Go and Web Tests
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore toolchain caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: plain
          pg: "true"

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / -- true

      - name: Run package Go and Web tests
        run: mise run test:packages
        env:
          STELLA_TEST_REQUIRE_BWRAP: "1"
          STELLA_TEST_REQUIRE_PACKAGED_XBERG: "1"
          STELLA_TEST_REQUIRE_SPA: "1"

  system:
    name: System Test
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore toolchain caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: plain
          pg: "true"

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / -- true

      - name: Run subprocess system journeys
        run: mise run test:system
        env:
          STELLA_TEST_REQUIRE_BWRAP: "1"
          STELLA_TEST_REQUIRE_PACKAGED_XBERG: "1"
          STELLA_TEST_REQUIRE_SPA: "1"

      - name: Upload testbed diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testbed-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/logs/testbed/
          if-no-files-found: ignore
          retention-days: 7

  sandbox:
    name: Sandbox candidate
    needs: source
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/sandbox-docker.yml
    with:
      candidate: true
    secrets: inherit

  goreleaser:
    name: GoReleaser
    needs: [quality, tests, system, docker, sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # No setup-vp or setup-node action: mise owns global Vite+ and Node for
      # every build. Vite+ resolves pnpm from web/package.json.
      - name: Restore toolchain caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: plain

      - name: Check release configuration
        run: mise run release:check

      # Build all four targets once, after validation and image builds succeed.
      - name: Run GoReleaser
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  docker:
    name: Docker Release
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Docker Manifests
    runs-on: ubuntu-latest
    needs: [goreleaser, docker, sandbox]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout publishing scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=long
            type=semver,pattern={{raw}}

      - name: Create manifest list and push
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$IMAGE_METADATA") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Extract sandbox tags
        id: sandbox-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cherryhq/stella-sandbox
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish validated sandbox aliases
        env:
          SANDBOX_DIGEST: ${{ needs.sandbox.outputs.digest }}
          SANDBOX_METADATA: ${{ steps.sandbox-meta.outputs.json }}
        run: |
          tags=()
          while IFS= read -r tag; do tags+=("-t" "$tag"); done < <(jq -r '.tags[]' <<< "$SANDBOX_METADATA")
          docker buildx imagetools create "${tags[@]}" "ghcr.io/cherryhq/stella-sandbox@$SANDBOX_DIGEST"

      - name: Inspect stable image
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Log into mirror registry
        if: env.ACR_REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Copy manifest list to mirror registry
        if: env.ACR_REGISTRY != ''
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          tags=()
          while IFS= read -r tag; do tags+=("${tag##*:}"); done < <(jq -r '.tags[]' <<< "$IMAGE_METADATA")
          bash .github/scripts/copy-image-tags.sh "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" "${ACR_REGISTRY}/${ACR_IMAGE_NAME}" "${tags[@]}"
