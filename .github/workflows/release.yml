name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: cherryhq/stella

jobs:
  source:
    name: Verify Release Source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify tag identity and release branch
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          event_commit="$(git rev-parse "${EVENT_SHA}^{commit}")"
          tag_commit="$(git rev-parse "${EVENT_REF}^{commit}")"
          test "$head_commit" = "$event_commit"
          test "$head_commit" = "$tag_commit"

          release_branch="$(.github/scripts/verify-release-source.sh "$GITHUB_REF_NAME" "$head_commit")"
          {
            echo "### Validated release source"
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Branch: \`${release_branch}\`"
            echo "- Commit: \`${head_commit}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality and Build
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate code and check drift
        run: mise run generate:check

      - name: Test release source policy
        run: bash .github/scripts/verify-release-source_test.sh

      - name: Check formatting and lint
        run: |
          prek run --all-files
          git status --short
          test -z "$(git status --porcelain)"

      - name: Build
        run: mise run build

  tests:
    name: Go and Web Tests
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go build and PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.stella/pg-runtime
          key: ${{ runner.os }}-tests-${{ hashFiles('**/go.sum', 'internal/pgruntime/**') }}
          restore-keys: |
            ${{ runner.os }}-tests-
            ${{ runner.os }}-go-

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / -- true

      - name: Generate code and check drift
        run: mise run generate:check

      # go:embed snapshots web/static/dist at compile time. Build the SPA before
      # test binaries so the PWA contract cannot silently skip.
      - name: Build web assets
        run: mise run build:web

      - name: Run Go and Web tests
        run: mise run test
        env:
          STELLA_TEST_REQUIRE_BWRAP: "1"
          STELLA_TEST_REQUIRE_SPA: "1"

  system:
    name: System Test
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go build and PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.stella/pg-runtime
          key: ${{ runner.os }}-system-${{ hashFiles('**/go.sum', 'internal/pgruntime/**') }}
          restore-keys: |
            ${{ runner.os }}-system-
            ${{ runner.os }}-go-

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / -- true

      - name: Run System Test
        run: mise run system-test

      - name: Upload System Test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: system-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/logs/system-test/
          if-no-files-found: ignore
          retention-days: 7

  snapshot:
    name: Release Snapshot
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-snapshot-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-snapshot-
            ${{ runner.os }}-go-

      - name: Check GoReleaser configuration
        run: mise run release:check

      - name: Build release snapshot
        run: mise run release:snapshot

  goreleaser:
    name: GoReleaser
    needs: [quality, tests, system, snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # No setup-node action: mise owns the Node and pnpm versions used by every
      # build, including the SPA embedded by GoReleaser.
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  docker:
    name: Docker Release
    needs: [quality, tests, system, snapshot]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Docker Manifests
    runs-on: ubuntu-latest
    needs: [goreleaser, docker]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=long
            type=semver,pattern={{raw}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
