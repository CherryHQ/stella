name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: cherryhq/stella

jobs:
  candidate-binaries:
    name: Build candidate archives
    runs-on: ubuntu-24.04

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: candidate-goreleaser-${{ github.sha }}-a${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # GoReleaser creates archives, packages, checksums, and the formula once.
      # Publishing is deliberately deferred to the sole Promotion job.
      - name: Build GoReleaser candidates without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish

      - name: Upload immutable GoReleaser candidates
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: candidate-goreleaser-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
            dist/artifacts.json
            dist/metadata.json
            dist/homebrew/Formula/stella.rb
          if-no-files-found: error
          retention-days: 14

  candidate-docker:
    name: Build candidate image (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest stores an addressable candidate without creating a
      # release, latest, or SHA tag before the gate passes.
      - name: Build and push untagged candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.suffix }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export candidate digest
        run: |
          set -euo pipefail
          mkdir -p docker-digests
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'docker-digests/linux-${{ matrix.suffix }}.digest'

      - name: Upload candidate digest
        uses: actions/upload-artifact@v5
        with:
          name: candidate-digest-${{ matrix.suffix }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: docker-digests/*.digest
          if-no-files-found: error
          retention-days: 14

  candidate-index:
    name: Verify candidate identity
    runs-on: ubuntu-24.04
    needs: [candidate-binaries, candidate-docker]

    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: candidate-index-${{ github.sha }}-a${{ github.run_attempt }}
      binaries-artifact-id: ${{ needs.candidate-binaries.outputs.artifact-id }}
      binaries-artifact-name: ${{ needs.candidate-binaries.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-binaries.outputs.artifact-id }}
          path: dist

      # A failed-job rerun does not rebuild successful prerequisite jobs. Keep
      # every immutable attempt and select the newest available digest per
      # architecture instead of assuming both were produced in this attempt.
      - name: Download Docker candidate digest history
        uses: actions/download-artifact@v5
        with:
          pattern: candidate-digest-*-${{ github.sha }}-a*
          path: docker-digest-artifacts

      - name: Select latest available Docker candidate digests
        run: |
          set -euo pipefail
          mkdir -p docker-digests
          for suffix in amd64 arm64; do
            mapfile -t candidates < <(
              for artifact_dir in \
                docker-digest-artifacts/candidate-digest-"$suffix"-"$GITHUB_SHA"-a*
              do
                [[ -d "$artifact_dir" ]] || continue
                find "$artifact_dir" -type f -name "linux-$suffix.digest" -print
              done | sort -V
            )
            if [[ "${#candidates[@]}" -eq 0 ]]; then
              echo "no candidate digest found for linux/$suffix" >&2
              exit 1
            fi
            selected="${candidates[${#candidates[@]}-1]}"
            if ! grep -Eq '^sha256:[0-9a-f]{64}$' "$selected"; then
              echo "invalid candidate digest in $selected" >&2
              exit 1
            fi
            install -m 0644 "$selected" "docker-digests/linux-$suffix.digest"
            echo "selected $selected"
          done

      - name: Create candidate manifest
        env:
          STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
          STELLA_RELEASE_VERSION: ${{ github.ref_name }}
          STELLA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mise exec -- go run ./test/release/cmd/candidate \
            --mode=create \
            --artifact-name='${{ needs.candidate-binaries.outputs.artifact-name }}' \
            --artifact-id='${{ needs.candidate-binaries.outputs.artifact-id }}'

      - name: Verify candidate file identity
        env:
          STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
          STELLA_RELEASE_VERSION: ${{ github.ref_name }}
          STELLA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mise exec -- go run ./test/release/cmd/candidate \
            --mode=verify \
            --artifact-name='${{ needs.candidate-binaries.outputs.artifact-name }}' \
            --artifact-id='${{ needs.candidate-binaries.outputs.artifact-id }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate image digests exist
        env:
          CANDIDATE_MANIFEST: dist/test-results/release/${{ github.run_id }}/candidate.json
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image"
          done < <(jq -r '.images[] | .name + "@" + .digest' "$CANDIDATE_MANIFEST")

      - name: Upload immutable candidate index
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: candidate-index-${{ github.sha }}-a${{ github.run_attempt }}
          path: dist/test-results/release/${{ github.run_id }}/candidate.json
          if-no-files-found: error
          retention-days: 14

  platform-archives:
    name: Verify candidate archive matrix
    runs-on: ubuntu-24.04
    needs: [candidate-index]

    permissions:
      actions: read
      contents: read

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          path: dist

      - name: Download candidate index by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Verify checksums, archive contents, and executable architectures
        run: |
          mise exec -- go run ./test/release/cmd/platform --mode=archives

      - name: Upload archive result and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-platform-archives-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            dist/test-results/release/${{ github.run_id }}/results
            dist/test-results/release/${{ github.run_id }}/artifacts/platform/archive-matrix-*.json
          if-no-files-found: warn
          retention-days: 14

  platform-linux-amd64:
    name: Candidate deployment (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [candidate-index]

    permissions:
      actions: read
      contents: read
      packages: read

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pinned Stella PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: ~/.stella/pg-runtime
          key: stella-pg-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/pgruntime/runtime.go') }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          path: dist

      - name: Download candidate index by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Re-verify candidate identity
        continue-on-error: true
        run: |
          mise exec -- go run ./test/release/cmd/candidate --mode=verify

      - name: Extract exact Linux amd64 candidate
        continue-on-error: true
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=extract \
            --platform=linux/amd64 \
            --output=dist/candidate/stellad

      - name: Download pinned Stella PostgreSQL runtime
        continue-on-error: true
        run: mise run pg:runtime:download

      - name: Install local sandbox prerequisite
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap

      - name: Run candidate System suite with embedded PostgreSQL
        continue-on-error: true
        env:
          STELLA_SYSTEM_BINARY: ${{ github.workspace }}/dist/candidate/stellad
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=record \
            --platform=linux/amd64 \
            --stage=binary-system \
            -- mise run system-test

      - name: Run exact candidate through systemd lifecycle
        continue-on-error: true
        env:
          STELLA_SYSTEM_BINARY: ${{ github.workspace }}/dist/candidate/stellad
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=record \
            --platform=linux/amd64 \
            --stage=systemd \
            -- mise exec -- go test \
              -tags releaseplatform \
              -count=1 \
              -run '^TestReleaseSystemdCandidate$' \
              ./test/release/cmd/platform

      - name: Log into GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run exact candidate Docker digest
        continue-on-error: true
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=record \
            --platform=linux/amd64 \
            --stage=docker \
            -- mise exec -- go test \
              -tags releaseplatform \
              -count=1 \
              -run '^TestReleaseDockerCandidate$' \
              ./test/release/cmd/platform

      - name: Install pinned kind and kubectl
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64 \
            --output /tmp/kind
          echo "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  /tmp/kind" \
            | sha256sum --check
          sudo install -o root -g root -m 0755 /tmp/kind /usr/local/bin/kind
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.35.7/bin/linux/amd64/kubectl \
            --output /tmp/kubectl
          echo "12e97f9d23a9f6cbb87b89becd6bd291e1a858a3379a4e11e2c822c4c1530052  /tmp/kubectl" \
            | sha256sum --check
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Install exact candidate through Helm in kind
        continue-on-error: true
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=record \
            --platform=linux/amd64 \
            --stage=helm \
            -- mise exec -- go test \
              -tags releaseplatform \
              -count=1 \
              -run '^TestReleaseHelmCandidate$' \
              ./test/release/cmd/platform

      - name: Upload Linux amd64 stage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-platform-amd64-${{ github.sha }}-a${{ github.run_attempt }}
          path: dist/test-results/release/${{ github.run_id }}/artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Assert Linux amd64 stages
        if: ${{ always() }}
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=assert \
            --platform=linux/amd64 \
            --expected=binary-system,systemd,docker,helm

  platform-linux-arm64:
    name: Candidate deployment (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: [candidate-index]

    permissions:
      actions: read
      contents: read
      packages: read

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pinned Stella PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: ~/.stella/pg-runtime
          key: stella-pg-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/pgruntime/runtime.go') }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          path: dist

      - name: Download candidate index by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Re-verify candidate identity
        continue-on-error: true
        run: |
          mise exec -- go run ./test/release/cmd/candidate --mode=verify

      - name: Extract exact Linux arm64 candidate
        continue-on-error: true
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=extract \
            --platform=linux/arm64 \
            --output=dist/candidate/stellad

      - name: Download pinned Stella PostgreSQL runtime
        continue-on-error: true
        run: mise run pg:runtime:download

      - name: Install local sandbox prerequisite
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap

      - name: Run candidate System suite with embedded PostgreSQL
        continue-on-error: true
        env:
          STELLA_SYSTEM_BINARY: ${{ github.workspace }}/dist/candidate/stellad
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=record \
            --platform=linux/arm64 \
            --stage=binary-system \
            -- mise run system-test

      - name: Log into GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run exact candidate Docker digest
        continue-on-error: true
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=record \
            --platform=linux/arm64 \
            --stage=docker \
            -- mise exec -- go test \
              -tags releaseplatform \
              -count=1 \
              -run '^TestReleaseDockerCandidate$' \
              ./test/release/cmd/platform

      - name: Upload Linux arm64 stage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-platform-arm64-${{ github.sha }}-a${{ github.run_attempt }}
          path: dist/test-results/release/${{ github.run_id }}/artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Assert Linux arm64 stages
        if: ${{ always() }}
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=assert \
            --platform=linux/arm64 \
            --expected=binary-system,docker

  platform-results:
    name: Consolidate candidate platform results
    if: ${{ always() && needs.candidate-index.result == 'success' }}
    runs-on: ubuntu-24.04
    needs:
      - candidate-index
      - platform-archives
      - platform-linux-amd64
      - platform-linux-arm64

    permissions:
      actions: read
      contents: read

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download archive evidence
        uses: actions/download-artifact@v5
        with:
          pattern: release-platform-archives-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}
          merge-multiple: true

      # Linux artifacts are rooted at the uploaded artifacts/ directory, so
      # restore them below the Run's artifacts/ path before consolidation.
      - name: Download Linux amd64 evidence
        uses: actions/download-artifact@v5
        with:
          pattern: release-platform-amd64-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}/artifacts
          merge-multiple: true

      - name: Download Linux arm64 evidence
        uses: actions/download-artifact@v5
        with:
          pattern: release-platform-arm64-${{ github.sha }}-a*
          path: dist/test-results/release/${{ github.run_id }}/artifacts
          merge-multiple: true

      - name: Consolidate X01 and X18 platform results
        run: |
          mise exec -- go run ./test/release/cmd/platform --mode=finalize

      - name: Upload consolidated platform results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-platform-results-${{ github.sha }}-a${{ github.run_attempt }}
          path: dist/test-results/release/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: Browser E2E (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [candidate-index]

    permissions:
      actions: read
      contents: read

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache pinned Stella PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: ~/.stella/pg-runtime
          key: stella-pg-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/pgruntime/runtime.go') }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          path: dist

      - name: Download candidate index by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Re-verify candidate identity
        run: |
          mise exec -- go run ./test/release/cmd/candidate --mode=verify

      - name: Extract exact Linux amd64 candidate
        run: |
          mise exec -- go run ./test/release/cmd/platform \
            --mode=extract \
            --platform=linux/amd64 \
            --output=dist/candidate/stellad

      - name: Install browser and sandbox prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          cd web
          vp install --frozen-lockfile
          vp exec playwright install --with-deps chromium

      - name: Run six blocking Browser E2E journeys
        env:
          STELLA_SYSTEM_BINARY: ${{ github.workspace }}/dist/candidate/stellad
        run: mise run browser-test

      - name: Upload Browser Results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-browser-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            dist/test-results/release/${{ github.run_id }}/results
            dist/test-results/release/${{ github.run_id }}/artifacts/browser
          if-no-files-found: warn
          retention-days: 14

  contract-tests:
    name: Deterministic Contract Tests (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [candidate-index]

    permissions:
      contents: read

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pinned Stella PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: ~/.stella/pg-runtime
          key: stella-pg-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/pgruntime/runtime.go') }}

      - name: Install Local sandbox prerequisite
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap

      - name: Run blocking deterministic contracts
        run: mise run contract-test

      - name: Upload Contract Results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-contract-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            dist/test-results/release/${{ github.run_id }}/results
            dist/test-results/release/${{ github.run_id }}/artifacts/contracts
          if-no-files-found: warn
          retention-days: 14

  core-results:
    name: Core Go and System Results (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [candidate-index]

    permissions:
      actions: read
      contents: read

    env:
      STELLA_RELEASE_RUN_ID: ${{ github.run_id }}
      STELLA_RELEASE_VERSION: ${{ github.ref_name }}
      STELLA_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pinned Stella PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: ~/.stella/pg-runtime
          key: stella-pg-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/pgruntime/runtime.go') }}

      - name: Download GoReleaser candidates by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.binaries-artifact-id }}
          path: dist

      - name: Download candidate index by immutable Artifact ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.candidate-index.outputs.artifact-id }}
          path: dist/test-results/release/${{ github.run_id }}

      - name: Re-verify and extract exact Linux amd64 candidate
        run: |
          mise exec -- go run ./test/release/cmd/candidate --mode=verify
          mise exec -- go run ./test/release/cmd/platform \
            --mode=extract \
            --platform=linux/amd64 \
            --output=dist/candidate/stellad

      - name: Install core suite prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          mise run pg:runtime:download

      - name: Run existing Go and exact-candidate System suites
        env:
          STELLA_SYSTEM_BINARY: ${{ github.workspace }}/dist/candidate/stellad
        run: mise run release:core

      - name: Upload Core Results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-core-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            dist/test-results/release/${{ github.run_id }}/results
            dist/test-results/release/${{ github.run_id }}/artifacts/core
          if-no-files-found: warn
          retention-days: 14

  live-results:
    name: Real external Live Smoke (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [candidate-index]
    # release-test stores company-owned automatic test resources and must not
    # require a reviewer; the single human checkpoint is release-approval.
    environment: release-test

    permissions:
      actions: read
