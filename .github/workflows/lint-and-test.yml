name: Format and Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*.*.*"]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    env:
      STELLA_MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'origin/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code and check drift
        run: mise run generate:check

      - name: Run pre-commit hooks
        run: prek run --all-files

  migration-order:
    name: Migration order
    runs-on: ubuntu-latest
    env:
      STELLA_MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'origin/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check migration ordering
        run: mise run db:migrate:check-order

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      - name: Generate code and check drift
        run: mise run generate:check

      - name: Run tests with race detection and coverage
        run: mise run test:coverage:race

      - name: Prepare coverage report data
        run: |
          # Exclude generated files from coverage calculation
          grep -v '_templ\.go' coverage.out | grep -v '_gen\.go' | grep -v '/gen\.go' | grep -v 'pkg/db/sqlc' > coverage-filtered.out || true
          COVERAGE=$(go tool cover -func=coverage-filtered.out | grep '^total:' | awk '{print $NF}')
          echo "Total coverage: ${COVERAGE}"

      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        run: |
          TOTAL=$(go tool cover -func=coverage-filtered.out | grep '^total:' | awk '{print $NF}')
          {
            echo "## 📊 Coverage Report"
            echo ""
            echo "**Total coverage: ${TOTAL}** (generated files excluded)"
            echo ""
            echo "<details>"
            echo "<summary>Lowest-covered entries (first 200)</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage-filtered.out | grep -v '^total:' | awk '{printf "%-60s %s\n", $1, $NF}' | sort -k2 -n | head -n 200
            echo '```'
            echo ""
            echo "</details>"
          } > coverage-report.md

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: coverage-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
