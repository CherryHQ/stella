name: Format and Test

on:
  push:
    branches: [main, "release/v*"]
    tags-ignore: ["v*.*.*"]
  pull_request:
    branches: [main, "release/v*"]
  merge_group:
    branches: [main, "release/v*"]
    types: [checks_requested]

concurrency:
  group: format-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # mise-action caches the tools it installs, not Go's own caches, so
      # without this every run recompiles the whole module from cold.
      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(mise exec -- go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Keyed per job because race-instrumented objects are a separate build
      # graph: sharing one key would make the two jobs evict each other.
      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.mod }}
          key: go-format-${{ runner.os }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-format-${{ runner.os }}-${{ hashFiles('mise.toml') }}-
            go-format-${{ runner.os }}-

      - name: Generate code and check drift
        run: mise run generate:check

      - name: Test release source policy
        run: bash .github/scripts/verify-release-source_test.sh

      - name: Run pre-commit hooks
        run: prek run --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(mise exec -- go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.mod }}
          key: go-race-${{ runner.os }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('mise.toml') }}-
            go-race-${{ runner.os }}-

      # The runtime tarball is immutable per RuntimeVersion, so the version
      # constant is the whole cache key. A miss just re-downloads it.
      - name: Cache embedded PostgreSQL runtime
        uses: actions/cache@v4
        with:
          path: ~/.stella/pg-runtime
          key: pg-runtime-${{ runner.os }}-${{ hashFiles('internal/pgruntime/runtime.go') }}

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so
          # an installed bwrap still cannot create a sandbox. The local sandbox
          # backend probes exactly this, and the System Test runs real agent
          # turns through it — without the sysctl every turn fails at runtime.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Fail here, with the reason visible, rather than inside a test run.
          bwrap --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / -- true

      - name: Generate code and check drift
        run: mise run generate:check

      # go:embed snapshots web/static/dist at compile time, so this has to run
      # before the test binaries are built. Without it the PWA build contract
      # only gets checked at tag time, and a commit that breaks the Web UI's
      # installability merges green.
      - name: Build web assets
        run: mise run build:web

      # `test:coverage:race` is `go test` only, so until this step existed the
      # frontend suite was gated at tag time and nowhere else — a PR could merge
      # green with every vitest guard failing.
      - name: Run frontend tests
        run: mise run test:web

      - name: Run tests with race detection and coverage
        run: mise run test:coverage:race
        env:
          STELLA_TEST_REQUIRE_BWRAP: "1"
          STELLA_TEST_REQUIRE_SPA: "1"

      - name: Prepare coverage report data
        run: |
          # Exclude generated files from coverage calculation
          grep -v '_templ\.go' coverage.out | grep -v '_gen\.go' | grep -v '/gen\.go' | grep -v 'pkg/db/sqlc' > coverage-filtered.out || true
          COVERAGE=$(go tool cover -func=coverage-filtered.out | grep '^total:' | awk '{print $NF}')
          echo "Total coverage: ${COVERAGE}"

      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        run: |
          TOTAL=$(go tool cover -func=coverage-filtered.out | grep '^total:' | awk '{print $NF}')
          {
            echo "## 📊 Coverage Report"
            echo ""
            echo "**Total coverage: ${TOTAL}** (generated files excluded)"
            echo ""
            echo "<details>"
            echo "<summary>Lowest-covered entries (first 200)</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage-filtered.out | grep -v '^total:' | awk '{printf "%-60s %s\n", $1, $NF}' | sort -k2 -n | head -n 200
            echo '```'
            echo ""
            echo "</details>"
          } > coverage-report.md

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: coverage-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  windows-bundle:
    name: Windows compile-only portability
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          install_args: go
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Go cache paths
        id: go-cache-paths
        shell: bash
        run: |
          echo "build=$(mise exec -- go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.mod }}
          key: go-windows-${{ runner.os }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-windows-${{ runner.os }}-${{ hashFiles('mise.toml') }}-
            go-windows-${{ runner.os }}-

      - name: Test Windows resource bundle portability
        run: mise exec -- go test ./resources -run '^TestBuiltinBundleWindowsFilesystemModes$' -count=1

      - name: Compile portable Home and Skill packages without running tests
        run: mise exec -- go test ./internal/home/... ./internal/skills/... ./internal/reflect/... -run '^$'
