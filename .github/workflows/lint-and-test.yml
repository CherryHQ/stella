name: Format and Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Format
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run format
        run: mise run format

  test:
    name: Test
    runs-on: ubicloud-standard-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with race detection and coverage
        run: mise run test:coverage:race

      - name: Check coverage threshold
        run: |
          THRESHOLD=50
          # Exclude templ-generated files from coverage calculation
          grep -v '_templ\.go' coverage.out > coverage-filtered.out || true
          COVERAGE=$(go tool cover -func=coverage-filtered.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets the ${THRESHOLD}% threshold"

      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}')
          {
            echo "## 📊 Coverage Report"
            echo ""
            echo "**Total coverage: ${TOTAL}**"
            echo ""
            echo "<details>"
            echo "<summary>Per-package breakdown</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage.out | grep -v '^total:' | awk '{printf "%-60s %s\n", $1, $NF}' | sort -t'%' -k2 -n
            echo '```'
            echo ""
            echo "</details>"
          } > coverage-report.md

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: coverage-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
