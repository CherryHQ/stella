name: Format and Test

on:
  push:
    branches: [main, "release/v*"]
    tags-ignore: ["v*.*.*"]
  pull_request:
    branches: [main, "release/v*"]
  merge_group:
    branches: [main, "release/v*"]
    types: [checks_requested]

concurrency:
  group: format-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore toolchain caches
        id: caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: plain

      - name: Generate code and check drift
        run: mise run generate:check

      - name: Test release source policy
        run: |
          bash .github/scripts/verify-release-source_test.sh
          bash .github/scripts/verify-ci-policy_test.sh
          bash .github/scripts/copy-image-tags_test.sh

      - name: Run pre-commit hooks
        run: prek run --all-files

  packages:
    name: Package race and Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore toolchain caches
        id: caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: race
          pg: "true"

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so
          # an installed bwrap still cannot create a sandbox. The local sandbox
          # backend probes exactly this, and the System Test runs real agent
          # turns through it — without the sysctl every turn fails at runtime.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Fail here, with the reason visible, rather than inside a test run.
          bwrap --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / -- true

      - name: Run package race/coverage and frontend tests
        run: mise run test:coverage:race
        env:
          STELLA_TEST_REQUIRE_BWRAP: "1"
          STELLA_TEST_REQUIRE_PACKAGED_XBERG: "1"
          STELLA_TEST_REQUIRE_SPA: "1"

      - name: Prepare coverage report data
        run: |
          # Exclude generated files from coverage calculation
          grep -v '_templ\.go' coverage.out | grep -v '_gen\.go' | grep -v '/gen\.go' | grep -v 'pkg/db/sqlc' > coverage-filtered.out || true
          COVERAGE=$(go tool cover -func=coverage-filtered.out | grep '^total:' | awk '{print $NF}')
          echo "Total coverage: ${COVERAGE}"

      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        run: |
          TOTAL=$(go tool cover -func=coverage-filtered.out | grep '^total:' | awk '{print $NF}')
          {
            echo "## 📊 Coverage Report"
            echo ""
            echo "**Total coverage: ${TOTAL}** (generated files excluded)"
            echo ""
            echo "<details>"
            echo "<summary>Lowest-covered entries (first 200)</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage-filtered.out | grep -v '^total:' | awk '{printf "%-60s %s\n", $1, $NF}' | sort -k2 -n | head -n 200
            echo '```'
            echo ""
            echo "</details>"
          } > coverage-report.md

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage-report
          path: coverage-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

      - name: Save successful branch Go cache
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.caches.outputs.go-build-path }}
          key: ${{ steps.caches.outputs.go-build-key }}

  system:
    name: Linux subprocess system tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore toolchain caches
        id: caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: plain
          pg: "true"
      - name: Enable sandbox namespaces
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-pid --unshare-ipc --unshare-uts --dev-bind / / -- true
      - name: Run subprocess journeys
        run: mise run test:system
        env:
          STELLA_TEST_REQUIRE_BWRAP: "1"
          STELLA_TEST_REQUIRE_PACKAGED_XBERG: "1"
          STELLA_TEST_REQUIRE_SPA: "1"
      - name: Upload system diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/logs/testbed/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save successful branch Go cache
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.caches.outputs.go-build-path }}
          key: ${{ steps.caches.outputs.go-build-key }}

  test:
    name: Test
    if: always()
    needs: [packages, system]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test lane
        env:
          PACKAGE_RESULT: ${{ needs.packages.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
        run: test "$PACKAGE_RESULT" = success && test "$SYSTEM_RESULT" = success

  windows-bundle:
    name: Windows compile-only portability
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          install_args: go
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # No Node or lint work here: this job only compiles Go.
      - name: Restore toolchain caches
        id: caches
        uses: ./.github/actions/toolchain-caches
        with:
          scope: windows
          node: "false"

      # embed_windows_*.go names the mise archive exactly, so resources/binaries
      # does not compile until it exists. This is the property that stops a build
      # from silently shipping no embedded runtimes; it also means every job that
      # compiles the package must sync first.
      - name: Sync embedded runtimes
        run: mise exec -- go run ./internal/tools/syncembeddedbinaries

      - name: Test Windows resource bundle portability
        run: mise exec -- go test ./resources -run '^TestBuiltinBundleWindowsFilesystemModes$' -count=1

      - name: Compile portable Home and Skill packages without running tests
        run: mise exec -- go test ./internal/platform/home/... ./internal/skill/... ./internal/reflect/... -run '^$'

      - name: Save successful branch Go cache
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.caches.outputs.go-build-path }}
          key: ${{ steps.caches.outputs.go-build-key }}
