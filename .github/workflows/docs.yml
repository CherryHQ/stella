name: Deploy Docs

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

defaults:
  run:
    working-directory: docs

jobs:
  deploy:
    name: Deploy
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: |
            - cwd: ./docs
              args: ['--frozen-lockfile']

      - name: Build
        run: vp build

      - name: Deploy to Cloudflare Workers
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
