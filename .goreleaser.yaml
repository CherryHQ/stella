version: 2

before:
  hooks:
    - go mod download
    - bash scripts/download-tools.sh

builds:
  - id: anna
    main: ./cmd/anna
    binary: anna
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: anna

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: vaayne
    name: anna
  draft: false
  prerelease: auto
  footer: |
    ---
    **Full Changelog**: See [Changelog](https://github.com/vaayne/anna/blob/main/docs/content/docs/changelog.mdx) for categorized details.
