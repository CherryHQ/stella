version: 2

before:
  hooks:
    - go mod download

builds:
  - id: anna
    main: ./cmd/anna
    binary: anna
    ldflags:
      - -s -w -X github.com/vaayne/anna/internal/version.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    hooks:
      pre:
        - cmd: env -u GOOS -u GOARCH go run ./internal/resources/binaries/gen.go
          env:
            - TARGET_GOOS={{ .Os }}
            - TARGET_GOARCH={{ .Arch }}
archives:
  - id: anna
    ids:
      - anna

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: vaayne
    name: anna
  draft: false
  prerelease: auto
  footer: |
    ---
    **Full Changelog**: See [Changelog](https://github.com/vaayne/anna/blob/main/docs/content/docs/changelog.mdx) for categorized details.
