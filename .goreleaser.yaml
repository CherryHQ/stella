version: 2

before:
  hooks:
    - go mod download
    # Not a raw pnpm invocation: that ran against whatever pnpm and Node the job
    # happened to put on PATH, which is how release binaries ended up embedding
    # an SPA built on a Node version no pull request ever tests. mise.toml pins
    # the toolchain in one place; go through it.
    - mise run build:embedded:release

builds:
  - id: stellad
    main: ./cmd/stellad
    binary: stellad
    ldflags:
      - -s -w -X github.com/CherryHQ/stella/internal/platform/version.Version={{ .Version }} -X github.com/CherryHQ/stella/internal/platform/version.Commit={{ .ShortCommit }} -X github.com/CherryHQ/stella/internal/platform/version.BuildDate={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - id: stella
    ids:
      - stellad

brews:
  - name: stella
    ids:
      - stella
    repository:
      owner: CherryHQ
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    # RCs stay available as GitHub assets without changing the stable Homebrew
    # tap. GoReleaser's auto mode detects prerelease tags such as -rc.1.
    skip_upload: auto
    homepage: "https://stella.cherryin.com"
    description: "Self-hosted AI assistant"
    license: "AGPL-3.0-or-later"
    install: |
      bin.install "stellad"
    service: |
      run [opt_bin/"stellad", "server"]
      keep_alive crashed: true
      log_path var/"log/stella.log"
      error_log_path var/"log/stella.log"
    dependencies:
      - name: bubblewrap
        os: linux
    test: |
      system "#{bin}/stellad", "version"

nfpms:
  - id: stella
    package_name: stella
    ids:
      - stellad
    vendor: CherryHQ
    homepage: https://stella.cherryin.com
    description: Self-hosted AI assistant
    license: AGPL-3.0-or-later
    maintainer: CherryHQ <hello@cherryin.com>
    formats:
      - deb
      - rpm
    dependencies:
      - bubblewrap

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: CherryHQ
    name: stella
  draft: false
  prerelease: auto
  footer: |
    ---
    **Full Changelog**: See [Changelog](https://github.com/CherryHQ/stella/blob/main/docs/content/docs/changelog.mdx) for categorized details.
