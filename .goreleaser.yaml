version: 2

before:
  hooks:
    - go mod download
    - sh -c "cd web && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: stella
    main: ./cmd/stella
    binary: stella
    ldflags:
      - -s -w -X github.com/CherryHQ/stella/internal/version.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    hooks:
      pre:
        - cmd: env -u GOOS -u GOARCH go run ./internal/resources/binaries/gen.go
          env:
            - TARGET_GOOS={{ .Os }}
            - TARGET_GOARCH={{ .Arch }}
archives:
  - id: stella
    ids:
      - stella

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: CherryHQ
    name: stella
  draft: false
  prerelease: auto
  footer: |
    ---
    **Full Changelog**: See [Changelog](https://github.com/CherryHQ/stella/blob/main/docs/content/docs/changelog.mdx) for categorized details.
