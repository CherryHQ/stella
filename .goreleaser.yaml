version: 2

before:
  hooks:
    - go mod download
    - mise run generate
    - sh -c "cd web && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: stellad
    main: ./cmd/stellad
    binary: stellad
    ldflags:
      - -s -w -X github.com/CherryHQ/stella/internal/version.Version={{ .Version }} -X github.com/CherryHQ/stella/internal/version.Commit={{ .ShortCommit }} -X github.com/CherryHQ/stella/internal/version.BuildDate={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    hooks:
      pre:
        - cmd: env -u GOOS -u GOARCH go run gen.go
          dir: resources/binaries
          env:
            - TARGET_GOOS={{ .Os }}
            - TARGET_GOARCH={{ .Arch }}

archives:
  - id: stella
    ids:
      - stellad

brews:
  - name: stella
    ids:
      - stella
    repository:
      owner: CherryHQ
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://stella.cherryin.com"
    description: "Self-hosted AI assistant"
    license: "AGPL-3.0-or-later"
    install: |
      bin.install "stellad"
    service: |
      run [opt_bin/"stellad", "server"]
      keep_alive crashed: true
      log_path var/"log/stella.log"
      error_log_path var/"log/stella.log"
    dependencies:
      - name: bubblewrap
        os: linux
    test: |
      system "#{bin}/stellad", "version"

nfpms:
  - id: stella
    package_name: stella
    ids:
      - stellad
    vendor: CherryHQ
    homepage: https://stella.cherryin.com
    description: Self-hosted AI assistant
    license: AGPL-3.0-or-later
    maintainer: CherryHQ <hello@cherryin.com>
    formats:
      - deb
      - rpm
    dependencies:
      - bubblewrap

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: CherryHQ
    name: stella
  draft: false
  prerelease: auto
  footer: |
    ---
    **Full Changelog**: See [Changelog](https://github.com/CherryHQ/stella/blob/main/docs/content/docs/changelog.mdx) for categorized details.
