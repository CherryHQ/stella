[tools]
atlas = "0.36.0"
go = "1.25"
"github:a-h/templ" = "latest"
"github:golangci/golangci-lint" = "2.11.1"
"github:goreleaser/goreleaser" = "2.14.1"
"github:sqlc-dev/sqlc" = "1.29.0"

[env]
ANNA_HOME = ".agents/anna"
BINARY_NAME = "anna"
PLUGIN_BINARY_NAME = "anna-plugin"

# ============================================================================
# Build
# ============================================================================

[tasks.build]
description = "Build anna binary"
depends = ["generate"]
run = "VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)} && go build -ldflags=\"-X main.version=$VERSION\" -o bin/$BINARY_NAME ./cmd/anna && go build -o bin/$PLUGIN_BINARY_NAME ./cmd/anna-plugin"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks.generate]
description = "Generate templ components and sqlc queries"
run = "templ generate && sqlc generate"

# ============================================================================
# Run
# ============================================================================

[tasks.serve]
description = "Start anna server (admin panel + channels)"
depends = ["build"]
run = "./bin/$BINARY_NAME"

[tasks.chat]
description = "Run interactive CLI chat"
depends = ["build"]
run = "./bin/$BINARY_NAME chat"

# ============================================================================
# Code Quality
# ============================================================================

[tasks.test]
description = "Run all tests with race detection"
run = "go test -race ./..."

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = "go test -race -coverprofile=coverage.out ./..."

[tasks.lint]
description = "Lint Go code"
run = "golangci-lint run"

[tasks.format]
description = "Format Go code and tidy modules"
run = "gofmt -w . && go mod tidy"

# ============================================================================
# Dev
# ============================================================================

[tasks."templ:watch"]
description = "Watch templ files and regenerate on change"
run = "templ generate --watch --proxy=http://localhost:25678"

[tasks."tools:download"]
description = "Download fd, rg, rtk for current platform"
run = "bash scripts/download-tools.sh"

# ============================================================================
# Database
# ============================================================================

[tasks."db:diff"]
description = "Generate a new Atlas migration from schema changes"
run = "atlas migrate diff {{arg(name='name', default='migration')}} --env local"

[tasks."db:hash"]
description = "Recalculate Atlas migration hash"
run = "atlas migrate hash --env local"

[tasks."db:validate"]
description = "Validate Atlas migrations"
run = "atlas migrate validate --env local"

# ============================================================================
# Release
# ============================================================================

[tasks.release]
description = "Create production release with GoReleaser"
run = "goreleaser release --clean"

[tasks."release:check"]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Create snapshot release for testing"
run = "goreleaser release --snapshot --clean"
