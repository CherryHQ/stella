[tools]
# Common
prek = "0.3.8"
dprint = "0.54.0"
jq = "1.8.1"
yq = "4.49.2"
act = "0.2.88"
helm = "3.16.4"
# Go
"github:pressly/goose" = "3.27.1"
go = "1.25.9"
"github:golangci/golangci-lint" = "2.11.1"
"github:goreleaser/goreleaser" = "2.14.1"
"github:sqlc-dev/sqlc" = "1.29.0"
# Web
vp = "0.1.20"
pnpm = "10.33.0"
node = "24.14.1"

[env]
BINARY_D = "./dist/bin/stellad"
# Dev default; raise to "trace" for memory-detail fields, LOG_LEVEL_RIVER for queue internals.
LOG_LEVEL = "debug"
DEV_ADMIN_USER = "admin"
DEV_ADMIN_PASS = "i-am-admin"
DEV_USER = "user"
DEV_PASS = "i-am-user"

# ============================================================================
# Build
# ============================================================================

[tasks.build]
description = "Build stellad binary"
depends = ["generate"]
run = [
  "rm -rf ./dist/bin",
  "mkdir -p ./dist/bin",
  "export VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}",
  "export COMMIT=${COMMIT:-$(git rev-parse --short HEAD 2>/dev/null || echo '')}",
  "export BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}",
  "export LDFLAGS=\"-X github.com/CherryHQ/stella/internal/version.Version=$VERSION -X github.com/CherryHQ/stella/internal/version.Commit=$COMMIT -X github.com/CherryHQ/stella/internal/version.BuildDate=$BUILD_DATE\"",
  "go build -ldflags=\"$LDFLAGS\" -o $BINARY_D ./cmd/stellad",
]

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf ./dist"

# ============================================================================
# Code Generation
# ============================================================================

[tasks.generate]
description = "Generate sqlc queries, OpenAPI clients, and embedded resources"
depends = ["generate:api", "generate:ts-sdk"]
run = """
go generate ./resources/binaries/
sqlc generate
"""

[tasks."generate:ts-sdk"]
description = "Generate TypeScript client (types + fetch client + Tanstack Query hooks) from OpenAPI spec"
dir = "web"
run = "pnpm install && pnpm openapi-ts"

[tasks."generate:api"]
description = "Assemble api/spec/components.yaml from domain files then generate Go types and server"
run = """
yq eval-all '. as $item ireduce ({}; . *+ $item) | .info.title = "stella API Components" | .info.description = "Assembled from api/spec/components/common.yaml + api/spec/domain/*/schemas.yaml — DO NOT EDIT"' \
  api/spec/components/common.yaml api/spec/domain/*/schemas.yaml \
  > /tmp/stella-components.yaml && mv /tmp/stella-components.yaml api/spec/components.yaml
dprint fmt api/spec/components.yaml
go tool oapi-codegen --config api/codegen/types.yaml   api/spec/components.yaml
go tool oapi-codegen --config api/codegen/server.yaml  api/spec/openapi.yaml
go run ./internal/goal/cmd/gengoalcontrolschema
# Pin: redocly 2.40.0 tightened YAML parsing and rejects openapi.yaml's flow
# mappings (issue #769). Bump deliberately after verifying the spec still bundles.
pnpm --package=@redocly/cli@2.39.0 dlx redocly bundle api/spec/openapi.yaml -o internal/server/docs_spec.yaml
go run ./internal/cmd/toolgen
"""

[tasks."generate:check"]
description = "Generate code and fail if generated files drift"
depends = ["generate"]
run = "git diff --exit-code"

# ============================================================================
# Run
# ============================================================================

[tasks.dev]
description = "Start stella server (web + api); logs to dist/logs/dev.log"
depends = ["dev:ui", "dev:api"]

[tasks."dev:log:init"]
description = "Reset the dev log file"
run = 'mkdir -p dist/logs && : > dist/logs/dev.log && echo "dev logs: dist/logs/dev.log"'

[tasks."dev:ui"]
description = "Start stella webui"
depends = ["dev:log:init"]
run = 'set -o pipefail; cd web && vp dev 2>&1 | tee -a ../dist/logs/dev.log'

[tasks."dev:api"]
description = "Start stella API server"
depends = ["dev:log:init"]
run = 'set -o pipefail; { mise run build && STELLA_HOME="$HOME/.stella-dev" $BINARY_D server; } 2>&1 | tee -a dist/logs/dev.log'

[tasks."dev:docker"]
description = "Start the Docker dev stack: stellad + docker sandbox + otel-lgtm"
depends = ["docker:build", "sandbox:docker:build"]
run = """
  docker volume create stella-data >/dev/null
  docker volume create stella-otel-data >/dev/null
  docker volume create stella-pg-data >/dev/null

  ENV_FILE="${STELLA_HOME:-$HOME/.stella-dev}/.env"
  mkdir -p "$(dirname "$ENV_FILE")"
  if ! grep -q '^STELLA_VAULT_KEY=' "$ENV_FILE" 2>/dev/null; then
    docker run --rm stella:latest stellad vault keygen | sed 's/^/STELLA_VAULT_KEY=/' >> "$ENV_FILE"
  fi

  export GITHUB_TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
  if [ -z "$GITHUB_TOKEN" ] && command -v gh >/dev/null 2>&1; then
    export GITHUB_TOKEN="$(gh auth token 2>/dev/null || true)"
  fi

  if [ "$(uname -s)" = "Darwin" ]; then
    DOCKER_SOCKET_GID=0
  else
    DOCKER_SOCKET_GID="$(python3 - <<'PY'
import os
try:
    print(os.stat('/var/run/docker.sock').st_gid)
except OSError:
    print(0)
PY
    )"
  fi
  export DOCKER_SOCKET_GID

  STELLA_IMAGE=stella:latest docker compose up -d otel
  STELLA_IMAGE=stella:latest docker compose up -d --force-recreate stella-volume-init stella
  echo "stella up — UI http://localhost:25688 · Grafana http://localhost:13413"
  echo "logs: docker compose logs -f stella   ·   stop: docker compose down"
"""

# ============================================================================
# Code Quality
# ============================================================================

[tasks."pg:runtime:download"]
description = "Download the embedded PostgreSQL runtime used by tests and local server runs"
run = "go run ./cmd/stellad postgres download-runtime"

[tasks.test]
description = "Run all tests"
depends = ["pg:runtime:download"]
run = "go test ./..."

[tasks."test:coverage"]
description = "Run tests with coverage report"
depends = ["pg:runtime:download"]
run = "go test -coverprofile=coverage.out ./..."

[tasks."test:race"]
description = "Run all tests with race detection (CI)"
depends = ["pg:runtime:download"]
run = "go test -race ./..."

[tasks."test:coverage:race"]
description = "Run tests with race detection and coverage report (CI)"
depends = ["pg:runtime:download"]
run = "go test -race -coverprofile=coverage.out ./..."

[tasks."test:capabilities"]
description = "Validate the release capability inventory and generate coverage and gap reports"
run = """
go test -tags capability -count=1 ./test/capabilities/...
go test -tags capability -count=1 ./cmd/stellad -run '^TestCapabilityCommandSurface$'
go run -tags capability ./test/capabilities/cmd/report
"""

[tasks."release:aggregate"]
description = "Aggregate release-only Scenario results and decide whether Promotion is allowed"
# STELLA_RELEASE_SECRET_ENVS contains comma-separated environment variable
# names, never secret values. The command scans the entire Run artifact tree.
run = """
set -eu
: "${STELLA_RELEASE_RUN_ID:?set STELLA_RELEASE_RUN_ID}"
: "${STELLA_RELEASE_VERSION:?set STELLA_RELEASE_VERSION}"
: "${STELLA_RELEASE_COMMIT:?set STELLA_RELEASE_COMMIT}"
go run -tags capability ./test/capabilities/cmd/aggregate
"""

[tasks.system-test]
description = "Run the subprocess system test suite: real stellad over TCP against embedded PostgreSQL"
depends = ["pg:runtime:download", "build"]
run = "go test -tags system -count=1 -timeout 15m ./test/system/..."

[tasks.format]
description = "Fix and format files"
run = [
  "dprint fmt",
  "go mod tidy",
  "golangci-lint run --fix ./...",
  "cd web && vp install && vp check --fix",
]

# ============================================================================
# Dev
# ============================================================================

[tasks.setup]
description = "Set up the development environment"
depends = ["hooks:install"]

[tasks."hooks:install"]
description = "Install Git hooks"
run = "git config --unset core.hooksPath || true && prek install --overwrite --prepare-hooks"

# ============================================================================
# Database
# ============================================================================

# Migrations are the single source of truth for the schema (goose; Atlas and the
# declarative schemas were dropped). stellad applies pending migrations
# automatically on startup; these tasks are for authoring and inspecting them.
# db:migrate:up/status target STELLA_DATABASE_URL (an external PostgreSQL).

[tasks."db:migrate:new"]
description = "Scaffold a new goose SQL migration in internal/db/migrations"
run = "goose -dir internal/db/migrations create {{arg(name='name', default='migration')}} sql"

[tasks."db:validate"]
description = "Validate goose migrations parse and are well-formed"
run = "goose -dir internal/db/migrations validate"

[tasks."db:migrate:up"]
description = "Apply pending migrations to STELLA_DATABASE_URL"
run = 'goose -dir internal/db/migrations postgres "$STELLA_DATABASE_URL" up'

[tasks."db:migrate:status"]
description = "Show migration status for STELLA_DATABASE_URL"
run = 'goose -dir internal/db/migrations postgres "$STELLA_DATABASE_URL" status'

# ============================================================================
# Release
# ============================================================================

[tasks.release]
description = "Create production release with GoReleaser"
run = "goreleaser release --clean"

[tasks."release:check"]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks."release:validate"]
description = "Full local pre-release gate: format, build, capability inventory, unit tests, system suite, then release checks"
# Explicit sequential mise-run chain (set -e aborts on first failure) rather than
# `depends`, whose members may run in parallel. Each sub-task resolves its own
# depends (system-test rebuilds via its build dep); correctness over avoiding the
# duplicate build.
run = """
set -e
mise run format
mise run build
mise run test:capabilities
mise run test
mise run system-test
mise run release:check
mise run release:snapshot
"""

[tasks."release:snapshot"]
description = "Create host-only snapshot build and verify single-binary archive"
run = """
goreleaser release --snapshot --clean --skip=publish
echo "Verifying archive contains stellad..."
archive=$(ls dist/stella_*_$(go env GOOS)_$(go env GOARCH).tar.gz 2>/dev/null || ls dist/stella_*_$(go env GOOS)_$(go env GOARCH).zip 2>/dev/null)
if [ -z "$archive" ]; then echo "ERROR: no archive found for host platform" >&2; exit 1; fi
suffix=""; [ "$(go env GOOS)" = "windows" ] && suffix=".exe"
bin="stellad${suffix}"
if ! tar tzf "$archive" 2>/dev/null | grep -Eq "(^|/)${bin}$" && ! unzip -l "$archive" 2>/dev/null | grep -Eq " ${bin}$"; then
  echo "ERROR: $bin missing from $archive" >&2; exit 1
fi
echo "OK: archive $archive contains stellad"
"""

# ============================================================================
# Deploy
# ============================================================================

[tasks."deploy:helm:check"]
description = "Lint and render-assert the Kubernetes Helm chart"
run = "bash deploy/helm/check.sh"

# ============================================================================
# Docker
# ============================================================================

[tasks."docker:build"]
description = "Build Docker image"
run = "VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}; export GITHUB_TOKEN=\"${GITHUB_TOKEN:-${GH_TOKEN:-}}\"; if [ -z \"$GITHUB_TOKEN\" ] && command -v gh >/dev/null 2>&1; then export GITHUB_TOKEN=\"$(gh auth token 2>/dev/null || true)\"; fi; if [ -n \"$GITHUB_TOKEN\" ]; then DOCKER_BUILDKIT=1 docker build --secret id=github_token,env=GITHUB_TOKEN --build-arg VERSION=$VERSION -t stella:latest .; else DOCKER_BUILDKIT=1 docker build --build-arg VERSION=$VERSION -t stella:latest .; fi"

[tasks."sandbox:docker:build"]
description = "Build local stella-sandbox:dev image (used by the docker sandbox backend in dev builds)"
run = """
  DIR=plugins/sandbox/docker
  VERSION_ARG=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}
  export GITHUB_TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
  if [ -z "$GITHUB_TOKEN" ] && command -v gh >/dev/null 2>&1; then
    export GITHUB_TOKEN="$(gh auth token 2>/dev/null || true)"
  fi
  if [ -n "${GITHUB_TOKEN:-}" ]; then
    DOCKER_BUILDKIT=1 docker build \
      --secret id=github_token,env=GITHUB_TOKEN \
      --build-arg VERSION=$VERSION_ARG \
      -f "$DIR/Dockerfile" \
      -t stella-sandbox:dev .
  else
    DOCKER_BUILDKIT=1 docker build \
      --build-arg VERSION=$VERSION_ARG \
      -f "$DIR/Dockerfile" \
      -t stella-sandbox:dev .
  fi
"""
