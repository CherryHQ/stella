[tools]
atlas = "0.36.0"
go = "1.25"
"github:a-h/templ" = "latest"
"github:golangci/golangci-lint" = "2.11.1"
"github:goreleaser/goreleaser" = "2.14.1"
"github:sqlc-dev/sqlc" = "1.29.0"

[env]
BINARY_NAME = "anna"
LOG_LEVEL = "trace"

# ============================================================================
# Build
# ============================================================================

[tasks.build]
description = "Build anna binary"
depends = ["generate", "deps:sync"]
run = "mkdir -p bin && VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)} && go build -ldflags=\"-X github.com/vaayne/anna/internal/version.Version=$VERSION\" -o bin/$BINARY_NAME ./cmd/anna"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks.generate]
description = "Generate templ components and sqlc queries"
run = "templ generate && sqlc generate"

# ============================================================================
# Run
# ============================================================================

[tasks.dev]
description = "Start anna server (admin panel + channels)"
depends = ["build"]
run = 'ANNA_HOME="$HOME/.anna-dev" ./bin/$BINARY_NAME'

[tasks.chat]
description = "Run interactive CLI chat"
depends = ["build"]
run = 'ANNA_HOME="$HOME/.anna-dev" ./bin/$BINARY_NAME chat'

# ============================================================================
# Code Quality
# ============================================================================

[tasks.test]
description = "Run all tests"
run = "bash scripts/check-workspace-root.sh && go test ./..."

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = "go test -coverprofile=coverage.out ./..."

[tasks."test:race"]
description = "Run all tests with race detection (CI)"
run = "go test -race ./..."

[tasks."test:coverage:race"]
description = "Run tests with race detection and coverage report (CI)"
run = "go test -race -coverprofile=coverage.out ./..."

[tasks.format]
description = "Fix and format Go code"
run = "golangci-lint run --fix ./..."

# ============================================================================
# Dev
# ============================================================================

[tasks."templ:watch"]
description = "Watch templ files and regenerate on change"
run = "templ generate --watch --proxy=http://localhost:25678"

[tasks."deps:sync"]
description = "Sync third-party embedded tools and system skills for the host platform"
run = "go run ./cmd/builddeps sync --skills --tools"

[tasks."deps:sync:skills"]
description = "Sync generated system skills"
run = "go run ./cmd/builddeps sync --skills"

[tasks."deps:sync:tools"]
description = "Sync embedded third-party tools for a target platform"
run = '''
  args=""
  if [ -n "${GOOS:-}" ]; then args="$args --goos $GOOS"; fi
  if [ -n "${GOARCH:-}" ]; then args="$args --goarch $GOARCH"; fi
  go run ./cmd/builddeps sync --tools $args
'''

[tasks."tools:download"]
description = "Download embedded third-party tools for the current platform"
run = "go run ./cmd/builddeps sync --tools"

# ============================================================================
# Database
# ============================================================================

[tasks."db:diff"]
description = "Generate a new Atlas migration from schema changes"
run = "atlas migrate diff {{arg(name='name', default='migration')}} --env local"

[tasks."db:hash"]
description = "Recalculate Atlas migration hash"
run = "atlas migrate hash --env local"

[tasks."db:validate"]
description = "Validate Atlas migrations"
run = "atlas migrate validate --env local"

# ============================================================================
# Release
# ============================================================================

[tasks.release]
description = "Create production release with GoReleaser"
run = "goreleaser release --clean"

[tasks."release:check"]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Create host-only snapshot build for testing"
run = "goreleaser build --snapshot --single-target --clean"

# ============================================================================
# Docker
# ============================================================================

[tasks."docker:build"]
description = "Build Docker image"
run = "VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}; if [ -n \"${GITHUB_TOKEN:-}\" ]; then docker build --secret id=github_token,env=GITHUB_TOKEN --build-arg VERSION=$VERSION -t anna:latest .; else docker build --build-arg VERSION=$VERSION -t anna:latest .; fi"

[tasks."sandbox:docker:build"]
description = "Build local anna-sandbox:dev image (used by the docker sandbox backend in dev builds)"
run = """
  DIR=plugins/sandbox/docker
  UID_ARG=$(id -u)
  GID_ARG=$(id -g)
  if [ -n "${GITHUB_TOKEN:-}" ]; then
    DOCKER_BUILDKIT=1 docker build \
      --secret id=github_token,env=GITHUB_TOKEN \
      --build-arg USER_UID=$UID_ARG \
      --build-arg USER_GID=$GID_ARG \
      -t anna-sandbox:dev "$DIR"
  else
    DOCKER_BUILDKIT=1 docker build \
      --build-arg USER_UID=$UID_ARG \
      --build-arg USER_GID=$GID_ARG \
      -t anna-sandbox:dev "$DIR"
  fi
"""

[tasks."docker:dev"]
description = "Run local Docker image with ANNA_HOME in ~/.anna-dev"
run = """
    docker image inspect anna:latest >/dev/null 2>&1 || { echo 'anna:latest not found; run mise run docker:build first' >&2; exit 1; }
    mkdir -p \"$HOME/.anna-dev\"
    docker rm -f anna-dev >/dev/null 2>&1 || true
    docker run -d --name anna-dev -p 25678:25678 \
        --user 0:0 \
        --security-opt seccomp=unconfined \
        -v "$HOME/.anna-dev:/workspace" \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e "ANNA_HOME=/workspace" \
        -e "ANNA_HOME_HOST=$HOME/.anna-dev" \
        -e "HOST=0.0.0.0" \
        anna:latest
    echo 'anna-dev started'
    echo 'logs: docker logs -f anna-dev'
    echo 'stop: docker stop anna-dev'
    docker logs -f anna-dev
"""
