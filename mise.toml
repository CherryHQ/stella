[tools]
# Common
prek = "0.3.8"
dprint = "0.54.0"
jq = "1.8.1"
yq = "4.49.2"
act = "0.2.88"
shellcheck = "0.11.0"
helm = "3.16.4"
# Go
"github:pressly/goose" = "3.27.1"
go = "1.25.9"
"github:golangci/golangci-lint" = "2.11.1"
"github:goreleaser/goreleaser" = "2.14.1"
"github:sqlc-dev/sqlc" = "1.29.0"
# Web
vp = "0.2.8"
node = "24.14.1"

[env]
BINARY_D = "./dist/bin/stellad"
# Dev default; raise to "trace" for memory-detail fields, LOG_LEVEL_RIVER for queue internals.
LOG_LEVEL = "debug"

# ============================================================================
# Build
# ============================================================================
#
# Tasks whose body is a script rather than a command live in .mise/tasks/ (path
# = task name, so .mise/tasks/sandbox/docker/build is `sandbox:docker:build`).
# They run under `set -euo pipefail` and are covered by shellcheck; a TOML `run`
# string is neither. Keep one-liners here.

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf ./dist"

# ============================================================================
# Code Generation
# ============================================================================

[tasks.generate]
description = "Generate sqlc queries, OpenAPI clients, and embedded resources"
depends = ["generate:api", "generate:ts-sdk"]
run = """
# Must run first: every other generator here transitively imports
# resources/binaries, which does not compile until its archives exist.
go run ./internal/cmd/syncembeddedbinaries
go run ./internal/cmd/generatebuiltinmanifest
sqlc generate
"""

[tasks."generate:ts-sdk"]
description = "Generate TypeScript client (types + fetch client + Tanstack Query hooks) from OpenAPI spec"
dir = "web"
run = "vp install && vp exec openapi-ts"

[tasks."generate:api:check"]
description = "Regenerate from api/spec and fail if any generated file drifts"
depends = ["generate:api"]
# The narrow, agent-tool-facing half of generate:check: it skips the embedded
# runtimes and the builtin manifest, so it is the command rules/agent-tools.md
# tells you to run after touching an x-agent-tool annotation. It is not
# node-free — generate:api runs the Redocly bundler through `vp dlx`.
# CI runs the superset (generate:check) in both the format and test jobs.
# internal/server/docs_spec.yaml is deliberately absent: it is gitignored, so no
# status can see it.
# --untracked-files=all is the point: the first tool_gen.go a new family
# generates is untracked, and `git diff` would call that a clean tree.
run = """
managed="api/spec/components.yaml api/types/gen.go api/server/gen.go
internal/goal/goal_control_schema_gen.go :(glob)internal/**/tool_gen.go"
# shellcheck disable=SC2086 # the pathspecs are a deliberate word list
status=$(git status --porcelain --untracked-files=all -- $managed)
if [ -n "$status" ]; then
  echo "generated files drift from api/spec; run 'mise run generate:api' and commit:" >&2
  echo "$status" >&2
  git --no-pager diff -- api internal >&2
  exit 1
fi
"""

[tasks."generate:check"]
description = "Generate code and fail if generated files drift"
depends = ["generate"]
# --untracked-files=all catches a generated file that is new rather than
# changed; ignored paths (dist/, docs_spec.yaml) are still invisible to it.
run = """
status=$(git status --porcelain --untracked-files=all)
if [ -n "$status" ]; then
  echo "generated files drift; run 'mise run generate' and commit:" >&2
  echo "$status" >&2
  git --no-pager diff >&2
  exit 1
fi
"""

# ============================================================================
# Run
# ============================================================================

[tasks.dev]
description = "Start stella server (web + api); logs to dist/logs/dev.log"
depends = ["dev:ui", "dev:api"]

[tasks."dev:log:init"]
description = "Reset the dev log file"
run = 'mkdir -p dist/logs && : > dist/logs/dev.log && echo "dev logs: dist/logs/dev.log"'

[tasks."dev:ui"]
description = "Start stella webui"
depends = ["dev:log:init"]
run = 'set -o pipefail; cd web && vp dev 2>&1 | tee -a ../dist/logs/dev.log'

[tasks."dev:api"]
description = "Start stella API server"
depends = ["dev:log:init"]
run = 'set -o pipefail; { mise run build && STELLA_HOME="$HOME/.stella-dev" $BINARY_D server; } 2>&1 | tee -a dist/logs/dev.log'

[tasks."testbed:start"]
description = "Start an isolated, disposable Stella testbed"
depends = ["pg:runtime:download", "build:embedded"]
run = """
mise run build
go build -o ./dist/bin/testbed ./test/testbed
exec ./dist/bin/testbed start
"""

[tasks."testbed:stop"]
description = "Stop and clean up this checkout's Stella testbed"
run = 'go run ./test/testbed stop'

# ============================================================================
# Code Quality
# ============================================================================

[tasks."pg:runtime:download"]
description = "Download the embedded PostgreSQL runtime used by tests and local server runs"
# This command compiles stellad, which imports generated API packages. Resolve
# generation before sibling dependencies can race it on a clean checkout.
depends = ["generate"]
run = "go run ./cmd/stellad postgres download"

[tasks."build:web"]
description = "Build the SPA into web/static/dist, which the Go binary embeds"
# tsc imports web/src/lib/api-client, which is generated and gitignored, so the
# build needs the SDK before it can typecheck anything.
depends = ["generate:ts-sdk"]
dir = "web"
run = "vp install --frozen-lockfile && vp run build"

[tasks."build:embedded"]
description = "Generate code and build the SPA, i.e. everything the Go binary embeds"
# One entry point for GoReleaser and the Dockerfile, so neither reimplements the
# SPA build with its own toolchain. Both tasks want generate:ts-sdk; naming them
# together lets mise resolve that dependency once instead of twice.
depends = ["generate", "build:web"]

# test depends on generate for the same reason build does: the embedded runtimes
# must exist for the package to compile, and their absence used to turn the
# embedded-tool tests into silent skips.
[tasks.test]
description = "Run all tests"
depends = ["pg:runtime:download", "generate"]
run = """
go test ./...
mise run test:web
"""

[tasks."test:web"]
description = "Run frontend unit tests (vitest via vp)"
dir = "web"
run = "vp test run"

[tasks."test:coverage"]
description = "Run tests with coverage report"
depends = ["pg:runtime:download"]
run = "go test -coverprofile=coverage.out ./..."

[tasks."test:race"]
description = "Run all tests with race detection (CI)"
depends = ["pg:runtime:download"]
run = "go test -race ./..."

[tasks."test:coverage:race"]
description = "Run tests with race detection and coverage report (CI)"
depends = ["pg:runtime:download"]
run = "go test -race -coverprofile=coverage.out ./..."

[tasks.system-test]
description = "Run the subprocess system test suite: real stellad over TCP against embedded PostgreSQL"
depends = ["pg:runtime:download", "build"]
run = "go test -tags system -count=1 -timeout 15m ./test/system/..."

[tasks."eval:loop"]
description = "Run the quick/full fix-iteration eval loop (default full; quick enables OTel)"
run = "./test/evals/harbor/loop.sh"

[tasks."eval:build"]
description = "Build eval binaries only when the checked-in sources are newer"
run = "./test/evals/harbor/eval_build.sh"

[tasks.format]
description = "Fix and format files"
run = [
  "dprint fmt",
  "go mod tidy",
  "golangci-lint run --fix ./...",
  "mise run lint:shell",
  "cd web && vp install && vp check --fix",
]

# ============================================================================
# Dev
# ============================================================================

[tasks.setup]
description = "Set up the development environment"
# generate downloads the embedded runtimes. Since embed_*.go names each archive
# exactly, a fresh clone cannot even compile without them, so setup must fetch
# them rather than leaving the first `go build` to fail.
depends = ["hooks:install", "generate"]

[tasks."hooks:install"]
description = "Install Git hooks"
run = "git config --unset core.hooksPath || true && prek install --overwrite --prepare-hooks"

# ============================================================================
# Database
# ============================================================================

# Migrations are the single source of truth for the schema (goose; Atlas and the
# declarative schemas were dropped). stellad applies pending migrations
# automatically on startup; these tasks are for authoring and inspecting them.
# db:migrate:up/status target STELLA_DATABASE_URL (an external PostgreSQL).

[tasks."db:migrate:new"]
description = "Scaffold the next sequential Goose SQL migration in internal/db/migrations"
run = "goose -dir internal/db/migrations -s create {{arg(name='name', default='migration')}} sql"

[tasks."db:validate"]
description = "Validate goose migrations parse and are well-formed"
run = "goose -dir internal/db/migrations validate"

[tasks."db:migrate:up"]
description = "Apply pending migrations to STELLA_DATABASE_URL"
run = 'goose -dir internal/db/migrations postgres "$STELLA_DATABASE_URL" up'

[tasks."db:migrate:status"]
description = "Show migration status for STELLA_DATABASE_URL"
run = 'goose -dir internal/db/migrations postgres "$STELLA_DATABASE_URL" status'

# ============================================================================
# Release
# ============================================================================

[tasks.release]
description = "Create production release with GoReleaser"
run = "goreleaser release --clean"

[tasks."release:check"]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks."release:validate"]
description = "Full local pre-release gate, run strictly in order: format, build, unit tests, system suite, then release checks"
# Explicit sequential mise-run chain (set -e aborts on first failure) rather than
# `depends`, whose members may run in parallel. Each sub-task resolves its own
# depends (system-test rebuilds via its build dep); correctness over avoiding the
# duplicate build.
run = """
set -e
mise run format
mise run build
# The SPA must exist before `test` compiles the test binaries: go:embed
# snapshots web/static/dist at compile time, and STELLA_TEST_REQUIRE_SPA makes
# the PWA build contract a failure instead of a skip. A stale dist here is what
# caught the missing service worker during the v0.61.0 release.
mise run build:web
STELLA_TEST_REQUIRE_SPA=1 mise run test
mise run system-test
mise run release:check
mise run release:snapshot
"""

# ============================================================================
# Deploy
# ============================================================================

[tasks."deploy:helm:check"]
description = "Lint and render-assert the Kubernetes Helm chart"
run = "bash deploy/helm/check.sh"
