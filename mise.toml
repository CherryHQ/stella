[tools]
atlas = "0.36.0"
go = "1.25"
"github:a-h/templ" = "latest"
"github:golangci/golangci-lint" = "2.11.1"
"github:goreleaser/goreleaser" = "2.14.1"
"github:sqlc-dev/sqlc" = "1.29.0"
"npm:portless" = "latest"
prek = "latest"
dprint = "latest"

[env]
BINARY_NAME = "stella"
LOG_LEVEL = "trace"

# ============================================================================
# Build
# ============================================================================

[tasks.build]
description = "Build stella binary"
depends = ["generate", "deps:sync"]
run = "mkdir -p bin && VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)} && go build -ldflags=\"-X github.com/CherryHQ/stella/internal/version.Version=$VERSION\" -o bin/$BINARY_NAME ./cmd/stella"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks.generate]
description = "Generate templ components, sqlc queries, and OpenAPI clients"
depends = ["generate:api", "generate:ts-sdk"]
run = "templ generate && sqlc generate"

[tasks."generate:ts-sdk"]
description = "Generate TypeScript client (types + fetch client + Tanstack Query hooks) from OpenAPI spec"
dir = "web"
run = "pnpm install && pnpm openapi-ts"

[tasks."generate:api"]
description = "Assemble api/spec/components.yaml from domain files then generate Go types, server, and client"
run = """
yq eval-all '. as $item ireduce ({}; . *+ $item) | .info.title = "stella API Components" | .info.description = "Assembled from api/spec/components/common.yaml + api/spec/domain/*/schemas.yaml — DO NOT EDIT"' \
  api/spec/components/common.yaml api/spec/domain/*/schemas.yaml \
  > /tmp/stella-components.yaml && mv /tmp/stella-components.yaml api/spec/components.yaml
go tool oapi-codegen --config api/codegen/types.yaml   api/spec/components.yaml
go tool oapi-codegen --config api/codegen/server.yaml  api/spec/openapi.yaml
go tool oapi-codegen --config api/codegen/client.yaml  api/spec/openapi.yaml
"""

# ============================================================================
# Run
# ============================================================================

[tasks.dev]
description = "Start stella server (web + api)"
depends = ["dev:ui", "dev:api"]

[tasks."dev:ui"]
description = "Start stella webui"
dir = "web"
run = 'portless stella vp dev'

[tasks."dev:api"]
description = "Start stella API server"
depends = ["build"]
run = 'STELLA_HOME="$HOME/.stella-dev" ./bin/$BINARY_NAME'

# ============================================================================
# Code Quality
# ============================================================================

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = "go test -coverprofile=coverage.out ./..."

[tasks."test:race"]
description = "Run all tests with race detection (CI)"
run = "go test -race ./..."

[tasks."test:coverage:race"]
description = "Run tests with race detection and coverage report (CI)"
run = "go test -race -coverprofile=coverage.out ./..."

[tasks.format]
description = "Fix and format files"
run = [
  "dprint fmt",
  "golangci-lint run --fix ./...",
  "cd web && vp check --fix",
]

# ============================================================================
# Dev
# ============================================================================

[tasks."templ:watch"]
description = "Watch templ files and regenerate on change"
run = "templ generate --watch --proxy=http://localhost:25678"

[tasks."deps:sync"]
description = "Download mise binary for the host platform (embedded at build time)"
run = "go generate ./internal/resources/binaries/"

[tasks."deps:sync:tools"]
description = "Download mise binary for a target platform (set GOOS/GOARCH env vars)"
run = "go generate ./internal/resources/binaries/"

# ============================================================================
# Database
# ============================================================================

[tasks."db:diff"]
description = "Generate a new Atlas migration from schema changes"
run = "atlas migrate diff {{arg(name='name', default='migration')}} --env local"

[tasks."db:hash"]
description = "Recalculate Atlas migration hash"
run = "atlas migrate hash --env local"

[tasks."db:validate"]
description = "Validate Atlas migrations"
run = "atlas migrate validate --env local"

# ============================================================================
# Release
# ============================================================================

[tasks.release]
description = "Create production release with GoReleaser"
run = "goreleaser release --clean"

[tasks."release:check"]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Create host-only snapshot build for testing"
run = "goreleaser build --snapshot --single-target --clean"

# ============================================================================
# Docker
# ============================================================================

[tasks."docker:build"]
description = "Build Docker image"
run = "VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}; if [ -n \"${GITHUB_TOKEN:-}\" ]; then docker build --secret id=github_token,env=GITHUB_TOKEN --build-arg VERSION=$VERSION -t stella:latest .; else docker build --build-arg VERSION=$VERSION -t stella:latest .; fi"

[tasks."sandbox:docker:build"]
description = "Build local stella-sandbox:dev image (used by the docker sandbox backend in dev builds)"
run = """
  DIR=plugins/sandbox/docker
  UID_ARG=$(id -u)
  GID_ARG=$(id -g)
  VERSION_ARG=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}
  if [ -n "${GITHUB_TOKEN:-}" ]; then
    DOCKER_BUILDKIT=1 docker build \
      --secret id=github_token,env=GITHUB_TOKEN \
      --build-arg USER_UID=$UID_ARG \
      --build-arg USER_GID=$GID_ARG \
      --build-arg VERSION=$VERSION_ARG \
      -f "$DIR/Dockerfile" \
      -t stella-sandbox:dev .
  else
    DOCKER_BUILDKIT=1 docker build \
      --build-arg USER_UID=$UID_ARG \
      --build-arg USER_GID=$GID_ARG \
      --build-arg VERSION=$VERSION_ARG \
      -f "$DIR/Dockerfile" \
      -t stella-sandbox:dev .
  fi
"""

[tasks."docker:dev"]
description = "Run local Docker image with STELLA_HOME in ~/.stella-dev"
run = """
    docker image inspect stella:latest >/dev/null 2>&1 || { echo 'stella:latest not found; run mise run docker:build first' >&2; exit 1; }
    mkdir -p \"$HOME/.stella-dev\"
    docker rm -f stella-dev >/dev/null 2>&1 || true
    docker run -d --name stella-dev -p 25678:25678 \
        --user 0:0 \
        --security-opt seccomp=unconfined \
        -v "$HOME/.stella-dev:/workspace" \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e "STELLA_HOME=/workspace" \
        -e "STELLA_HOME_HOST=$HOME/.stella-dev" \
        -e "HOST=0.0.0.0" \
        stella:latest
    echo 'stella-dev started'
    echo 'logs: docker logs -f stella-dev'
    echo 'stop: docker stop stella-dev'
    docker logs -f stella-dev
"""
