repos:
  - repo: local
    hooks:
      - id: mise-format
        name: mise run format
        entry: mise run format
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: post-checkout-build
        name: mise trust and build after branch switch
        entry: ./scripts/post-checkout.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-checkout]
